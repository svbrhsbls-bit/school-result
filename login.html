<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - School Result Management System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,"Noto Sans Kannada",sans-serif;
    background:linear-gradient(135deg,#173f6b,#2d78b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:460px;
    background:#ffffff;
    border-radius:22px;
    padding:38px 34px 30px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.logo{
    width:80px;
    height:80px;
    margin:0 auto 18px;
    border-radius:50%;
    background:#173f6b;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    font-weight:bold;
}

.school-name{
    text-align:center;
    color:#173f6b;
    font-size:28px;
    font-weight:bold;
    line-height:1.35;
    margin-bottom:5px;
}

.school-place{
    text-align:center;
    color:#777;
    font-size:17px;
    margin-bottom:25px;
}

.system-title{
    text-align:center;
    color:#173f6b;
    font-size:22px;
    font-weight:bold;
    margin-bottom:28px;
}

label{
    display:block;
    font-weight:bold;
    color:#333;
    margin-bottom:8px;
    font-size:16px;
}

.input-group{
    margin-bottom:20px;
}

input{
    width:100%;
    height:54px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    padding:0 15px;
    font-size:17px;
    outline:none;
    background:#f8fafc;
}

input:focus{
    border-color:#2877b8;
    background:#fff;
    box-shadow:0 0 0 3px rgba(40,119,184,.12);
}

.password-wrap{
    position:relative;
}

.password-wrap input{
    padding-right:52px;
}

.show-password{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:20px;
    color:#666;
    user-select:none;
}

.login-btn{
    width:100%;
    height:55px;
    border:0;
    border-radius:10px;
    background:#173f6b;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.login-btn:hover{
    background:#0e3155;
}

.login-btn:disabled{
    background:#8ca1b6;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:18px;
    padding:12px 14px;
    border-radius:9px;
    text-align:center;
    font-size:15px;
    line-height:1.5;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.success{
    display:block;
    background:#dcfce7;
    color:#166534;
    border:1px solid #bbf7d0;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#888;
    font-size:14px;
}

.loading{
    display:inline-block;
    width:18px;
    height:18px;
    border:3px solid rgba(255,255,255,.4);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .8s linear infinite;
    vertical-align:middle;
    margin-right:8px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:500px){
    .login-box{
        padding:30px 22px 25px;
    }

    .school-name{
        font-size:23px;
    }

    .school-place{
        font-size:15px;
    }

    .system-title{
        font-size:19px;
    }
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">SR</div>

    <div class="school-name">
        ಶ್ರೀ ವೀರಬಲ್ಲಾಳ ಗ್ರಾಮಾಂತರ ಪ್ರೌಢಶಾಲೆ
    </div>

    <div class="school-place">
        ಬಲ್ಲಾಳಸಮುದ್ರ, ಹೊಸದುರ್ಗ ತಾಲ್ಲೂಕು
    </div>

    <div class="system-title">
        School Result Management System
    </div>

    <!-- DISE CODE -->
    <div class="input-group">
        <label for="diseCode">DISE Code</label>

        <input
            type="text"
            id="diseCode"
            inputmode="numeric"
            maxlength="11"
            placeholder="DISE Code ನಮೂದಿಸಿ"
            autocomplete="username"
        >
    </div>

    <!-- PASSWORD -->
    <div class="input-group">
        <label for="password">Password</label>

        <div class="password-wrap">

            <input
                type="password"
                id="password"
                placeholder="Password ನಮೂದಿಸಿ"
                autocomplete="current-password"
            >

            <span
                class="show-password"
                id="showPassword"
                title="Password ತೋರಿಸಿ"
            >👁</span>

        </div>
    </div>

    <button
        type="button"
        class="login-btn"
        id="loginBtn"
    >
        Login
    </button>

    <div
        id="message"
        class="message"
    ></div>

    <div class="footer">
        © School Result Management System
    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
    "https://sozlvjvgrpaabnvjvxe.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   SCHOOL LOGIN SETTINGS
   ========================================================= */

/*
   ನಿಮ್ಮ ಶಾಲೆಯ DISE Code
*/
const SCHOOL_DISE_CODE = "29130501906";

/*
   Supabase Authentication ನಲ್ಲಿ ಈಗಾಗಲೇ ಇರುವ
   Auth User Email.

   Login screen ನಲ್ಲಿ ಈ Email ಎಂದಿಗೂ ತೋರಿಸುವುದಿಲ್ಲ.
*/
const AUTH_EMAIL = "svbrhsbls@gmail.com";


/* =========================================================
   ELEMENTS
   ========================================================= */

const diseCodeInput =
    document.getElementById("diseCode");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const messageBox =
    document.getElementById("message");

const showPassword =
    document.getElementById("showPassword");


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text, type){

    messageBox.textContent = text;

    messageBox.className =
        "message " + type;
}


/* =========================================================
   HIDE MESSAGE
   ========================================================= */

function hideMessage(){

    messageBox.textContent = "";

    messageBox.className = "message";
}


/* =========================================================
   PASSWORD SHOW / HIDE
   ========================================================= */

showPassword.addEventListener("click", function(){

    if(passwordInput.type === "password"){

        passwordInput.type = "text";

        showPassword.textContent = "🙈";

    }else{

        passwordInput.type = "password";

        showPassword.textContent = "👁";
    }

});


/* =========================================================
   DISE CODE VALIDATION
   ========================================================= */

function validateDiseCode(){

    const dise =
        diseCodeInput.value.trim();

    if(dise === ""){

        showMessage(
            "ದಯವಿಟ್ಟು DISE Code ನಮೂದಿಸಿ.",
            "error"
        );

        diseCodeInput.focus();

        return false;
    }

    if(!/^\d{11}$/.test(dise)){

        showMessage(
            "DISE Code 11 ಅಂಕಿಗಳಾಗಿರಬೇಕು.",
            "error"
        );

        diseCodeInput.focus();

        return false;
    }

    if(dise !== SCHOOL_DISE_CODE){

        showMessage(
            "ತಪ್ಪಾದ DISE Code.",
            "error"
        );

        diseCodeInput.focus();

        return false;
    }

    return true;
}


/* =========================================================
   LOGIN
   ========================================================= */

async function login(){

    hideMessage();

    const dise =
        diseCodeInput.value.trim();

    const password =
        passwordInput.value;


    /* Check DISE Code */

    if(!validateDiseCode()){
        return;
    }


    /* Check Password */

    if(password === ""){

        showMessage(
            "ದಯವಿಟ್ಟು Password ನಮೂದಿಸಿ.",
            "error"
        );

        passwordInput.focus();

        return;
    }


    /* Disable button */

    loginBtn.disabled = true;

    loginBtn.innerHTML =
        '<span class="loading"></span>Login ಆಗುತ್ತಿದೆ...';


    try{

        /*
          Supabase Auth login

          User screen ನಲ್ಲಿ Email ಕಾಣುವುದಿಲ್ಲ.
        */

        const {
            data,
            error
        } =
        await supabaseClient.auth.signInWithPassword({

            email: AUTH_EMAIL,

            password: password

        });


        if(error){

            console.error(
                "Login Error:",
                error
            );

            showMessage(
                "Password ತಪ್ಪಾಗಿದೆ ಅಥವಾ Login ವಿಫಲವಾಗಿದೆ.",
                "error"
            );

            loginBtn.disabled = false;

            loginBtn.textContent = "Login";

            return;
        }


        if(!data.session){

            showMessage(
                "Login session ಸಿಗಲಿಲ್ಲ. ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.",
                "error"
            );

            loginBtn.disabled = false;

            loginBtn.textContent = "Login";

            return;
        }


        /* Login Success */

        showMessage(
            "Login ಯಶಸ್ವಿಯಾಗಿದೆ. Dashboard ತೆರೆಯುತ್ತಿದೆ...",
            "success"
        );


        /*
          Dashboardಗೆ ಹೋಗುವ ಮೊದಲು
          session ಅನ್ನು confirm ಮಾಡುತ್ತೇವೆ.
        */

        const {
            data: sessionData
        } =
        await supabaseClient.auth.getSession();


        if(sessionData.session){

            setTimeout(function(){

                window.location.replace(
                    "dashboard.html"
                );

            }, 500);

        }else{

            showMessage(
                "Login session ಉಳಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.",
                "error"
            );

            loginBtn.disabled = false;

            loginBtn.textContent = "Login";
        }


    }catch(error){

        console.error(
            "Unexpected Login Error:",
            error
        );

        showMessage(
            "Login ಮಾಡುವಾಗ ತಾಂತ್ರಿಕ ಸಮಸ್ಯೆ ಉಂಟಾಗಿದೆ.",
            "error"
        );

        loginBtn.disabled = false;

        loginBtn.textContent = "Login";
    }

}


/* =========================================================
   LOGIN BUTTON
   ========================================================= */

loginBtn.addEventListener(
    "click",
    login
);


/* =========================================================
   ENTER KEY LOGIN
   ========================================================= */

diseCodeInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            passwordInput.focus();

        }

    }
);


passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);


/* =========================================================
   ONLY NUMBERS FOR DISE CODE
   ========================================================= */

diseCodeInput.addEventListener(
    "input",
    function(){

        this.value =
            this.value.replace(
                /[^0-9]/g,
                ""
            );

    }
);


/* =========================================================
   CHECK EXISTING SESSION
   ========================================================= */

/*
   ಈಗಾಗಲೇ Login ಆಗಿದ್ದರೆ ಮತ್ತೆ Login screen
   ತೋರಿಸದೆ Dashboardಗೆ ಕಳುಹಿಸುತ್ತದೆ.
*/

(async function(){

    try{

        const {
            data
        } =
        await supabaseClient.auth.getSession();


        if(data.session){

            window.location.replace(
                "dashboard.html"
            );

        }

    }catch(error){

        console.error(
            "Session check error:",
            error
        );

    }

})();

</script>

</body>
</html>
