<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ಶಾಲಾ ಫಲಿತಾಂಶ ವ್ಯವಸ್ಥೆ - Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Noto Sans Kannada",sans-serif;background:linear-gradient(135deg,#e8f0ff,#f8fbff);display:flex;align-items:center;justify-content:center;padding:18px}.card{width:100%;max-width:430px;background:#fff;border-radius:20px;padding:28px 24px;box-shadow:0 10px 35px rgba(0,0,0,.12)}.icon{width:70px;height:70px;margin:0 auto 12px;border-radius:50%;background:#1769e0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px}h1{text-align:center;font-size:22px;margin:5px 0 4px;color:#16325c}.sub{text-align:center;color:#666;font-size:14px;margin-bottom:24px;line-height:1.5}label{display:block;font-weight:700;color:#333;margin:14px 0 7px}input{width:100%;height:50px;border:1px solid #ccd4df;border-radius:10px;padding:0 14px;font-size:17px;outline:none}input:focus{border-color:#1769e0;box-shadow:0 0 0 3px rgba(23,105,224,.1)}.pw{position:relative}.pw input{padding-right:55px}.show{position:absolute;right:8px;top:7px;height:36px;min-width:42px;border:0;border-radius:8px;background:#eef3fb;font-size:17px}.login{width:100%;height:52px;margin-top:22px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-size:18px;font-weight:700}.login:disabled{opacity:.65}.msg{display:none;margin-top:16px;padding:12px;border-radius:9px;line-height:1.5;font-size:14px;white-space:pre-wrap;word-break:break-word}.error{display:block;background:#fff0f0;color:#a40000;border:1px solid #ffcaca}.success{display:block;background:#effcf2;color:#116b2e;border:1px solid #bfe9ca}.note{margin-top:18px;padding-top:14px;border-top:1px solid #eee;font-size:12px;color:#777;text-align:center}
</style>
</head>
<body>
<div class="card">
<div class="icon">🏫</div>
<h1>ಶಾಲಾ ಫಲಿತಾಂಶ ವ್ಯವಸ್ಥೆ</h1>
<div class="sub">ಶ್ರೀ ವೀರಬಲ್ಲಾಳ ಗ್ರಾಮಾಂತರ ಪ್ರೌಢಶಾಲೆ<br>ಬಲ್ಲಾಳಸಮುದ್ರ, ಹೊಸದುರ್ಗ ತಾಲ್ಲೂಕು</div>
<form id="loginForm">
<label for="dise">ಶಾಲೆಯ DISE Code</label>
<input id="dise" type="text" inputmode="numeric" autocomplete="username" placeholder="DISE Code ನಮೂದಿಸಿ" required>
<label for="password">Password</label>
<div class="pw"><input id="password" type="password" autocomplete="current-password" placeholder="Password ನಮೂದಿಸಿ" required><button class="show" type="button" id="show">👁</button></div>
<button class="login" id="loginBtn" type="submit">Login</button>
 <button type="button" id="forgotBtn" style="width:100%;margin-top:12px;border:0;background:none;color:#1769e0;font-size:14px;font-weight:700;cursor:pointer;">Forgot Password?</button>
<div id="msg" class="msg"></div>
</form>
<div class="note">Forgot Password ಮೂಲಕ Password reset ಮಾಡಬಹುದು. Password ಅನ್ನು Supabase Authentication ನಲ್ಲಿ ನಿರ್ವಹಿಸಲಾಗುತ್ತದೆ.</div>
</div>

<script>
const SUPABASE_URL="https://sozlvjvqrgpaabnvjvxe.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const form=document.getElementById("loginForm");
const dise=document.getElementById("dise");
const password=document.getElementById("password");
const btn=document.getElementById("loginBtn");
const msg=document.getElementById("msg");

function showMsg(text,type="error"){msg.className="msg "+type;msg.textContent=text}
document.getElementById("show").onclick=()=>{password.type=password.type==="password"?"text":"password"};


document.getElementById("forgotBtn").addEventListener("click",async()=>{
  const code=dise.value.trim();
  if(!code){
    showMsg("ಮೊದಲು ಶಾಲೆಯ DISE Code ನಮೂದಿಸಿ.");
    dise.focus();
    return;
  }

  const forgotBtn=document.getElementById("forgotBtn");
  forgotBtn.disabled=true;
  forgotBtn.textContent="Email ಕಳುಹಿಸಲಾಗುತ್ತಿದೆ...";

  try{
    const {data:email,error:rpcError}=await supabaseClient.rpc(
      "get_login_email",
      {p_dise_code:code}
    );

    if(rpcError){
      throw new Error(
        "school_users ಓದುವಾಗ error ಬಂದಿದೆ.\n\n"+
        rpcError.message+
        "\n\nಮೊದಲು get_login_email SQL function ಪರಿಶೀಲಿಸಿ."
      );
    }

    if(!email){
      throw new Error(
        "ಈ DISE Code school_users table ನಲ್ಲಿ ಕಂಡುಬಂದಿಲ್ಲ.\nDISE Code: "+code
      );
    }

    const redirectTo="https://svbrhsbls-bit.github.io/school-result/reset-password.html";

    const {error}=await supabaseClient.auth.resetPasswordForEmail(
      String(email).trim(),
      {redirectTo}
    );

    if(error){
      throw new Error("Password reset email ಕಳುಹಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.\n\n"+error.message);
    }

    showMsg(
      "Password reset link ನಿಮ್ಮ registered emailಗೆ ಕಳುಹಿಸಲಾಗಿದೆ.\n\n"+
      "Email ತೆರೆಯಿರಿ → Reset password ಒತ್ತಿರಿ → ಹೊಸ password ಹಾಕಿ.",
      "success"
    );
  }catch(err){
    console.error("FORGOT PASSWORD ERROR:",err);
    showMsg(err?.message||"Password reset error ಬಂದಿದೆ.");
  }finally{
    forgotBtn.disabled=false;
    forgotBtn.textContent="Forgot Password?";
  }
});

form.addEventListener("submit",async(e)=>{
 e.preventDefault();
 msg.className="msg";msg.textContent="";
 const code=dise.value.trim(), pass=password.value;
 if(!code){showMsg("DISE Code ನಮೂದಿಸಿ.");return}
 if(!pass){showMsg("Password ನಮೂದಿಸಿ.");return}
 btn.disabled=true;btn.textContent="Login ಆಗುತ್ತಿದೆ...";
 try{
   const {data:email,error:rpcError}=await supabaseClient.rpc("get_login_email",{p_dise_code:code});
   if(rpcError) throw new Error("school_users ಓದುವಾಗ error ಬಂದಿದೆ.\n\n"+rpcError.message+"\n\nಮೊದಲು get_login_email SQL function ರಚಿಸಿರುವುದನ್ನು ಪರಿಶೀಲಿಸಿ.");
   if(!email) throw new Error("ಈ DISE Code school_users table ನಲ್ಲಿ ಕಂಡುಬಂದಿಲ್ಲ.\nDISE Code: "+code);
   const {data,error}=await supabaseClient.auth.signInWithPassword({email:String(email).trim(),password:pass});
   if(error) throw new Error("Login ವಿಫಲವಾಗಿದೆ.\n\nSupabase Auth Error: "+error.message);
   if(!data?.user) throw new Error("Login ಯಶಸ್ವಿಯಾಗಿಲ್ಲ. User data ಸಿಗಲಿಲ್ಲ.");
   showMsg("Login ಯಶಸ್ವಿಯಾಗಿದೆ. Dashboard ತೆರೆಯಲಾಗುತ್ತಿದೆ...","success");
   setTimeout(()=>location.href="dashboard.html",500);
 }catch(err){
   console.error("LOGIN ERROR:",err);
   showMsg(err?.message||"ತಿಳಿಯದ Login error ಬಂದಿದೆ.");
 }finally{
   btn.disabled=false;btn.textContent="Login";
 }
});
</script>
</body>
</html>
