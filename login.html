<!DOCTYPE html>
<html lang="kn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School Result Management System - Login</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:
        Arial,
        "Noto Sans Kannada",
        "Nirmala UI",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #173b68,
            #2d78b7
        );

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}


/* LOGIN BOX */

.login-box{

    width:100%;
    max-width:460px;

    background:white;

    border-radius:20px;

    padding:38px 34px;

    box-shadow:
        0 15px 45px
        rgba(0,0,0,0.25);
}


/* LOGO */

.logo{

    width:80px;
    height:80px;

    border-radius:50%;

    background:#173b68;

    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    margin:0 auto 20px;

    font-size:30px;
    font-weight:bold;
}


/* SCHOOL NAME */

.school-name{

    text-align:center;

    color:#173b68;

    font-size:25px;

    font-weight:bold;

    line-height:1.5;
}


.location{

    text-align:center;

    color:#777;

    font-size:16px;

    margin-top:5px;
}


/* TITLE */

.title{

    text-align:center;

    color:#173b68;

    font-size:21px;

    font-weight:bold;

    margin:25px 0;
}


/* LABEL */

label{

    display:block;

    font-weight:bold;

    color:#333;

    margin-bottom:8px;
}


/* INPUT */

input{

    width:100%;

    padding:14px;

    border:1px solid #cbd5e1;

    border-radius:10px;

    font-size:17px;

    outline:none;

    background:#f8fafc;

    margin-bottom:20px;
}


input:focus{

    border-color:#2474b5;

    box-shadow:
        0 0 0 3px
        rgba(36,116,181,.12);
}


/* PASSWORD */

.password-box{

    position:relative;
}


.password-box input{

    padding-right:55px;
}


.show-password{

    position:absolute;

    right:16px;

    top:13px;

    cursor:pointer;

    font-size:21px;

    color:#666;
}


/* LOGIN BUTTON */

.login-btn{

    width:100%;

    border:none;

    border-radius:10px;

    padding:15px;

    background:#173b68;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;
}


.login-btn:hover{

    background:#0f2d52;
}


.login-btn:disabled{

    background:#8ca1b8;

    cursor:not-allowed;
}


/* MESSAGE */

.message{

    display:none;

    padding:12px;

    border-radius:8px;

    margin-bottom:18px;

    text-align:center;

    font-size:15px;
}


.error{

    background:#fee2e2;

    color:#b91c1c;
}


.success{

    background:#dcfce7;

    color:#166534;
}


/* LOADING */

.loading{

    display:none;

    text-align:center;

    color:#555;

    margin-top:12px;
}


/* FOOTER */

.footer{

    text-align:center;

    color:#888;

    margin-top:25px;

    font-size:14px;
}


/* MOBILE */

@media(max-width:500px){

    .login-box{

        padding:30px 22px;
    }

    .school-name{

        font-size:21px;
    }

    .title{

        font-size:18px;
    }

}

</style>

</head>


<body>


<div class="login-box">


    <!-- LOGO -->

    <div class="logo">
        SR
    </div>


    <!-- SCHOOL NAME -->

    <div class="school-name">

        ಶ್ರೀ ವೀರಬಲ್ಲಾಳ ಗ್ರಾಮಾಂತರ ಪ್ರೌಢಶಾಲೆ

    </div>


    <div class="location">

        ಬಲ್ಲಾಳಸಮುದ್ರ, ಹೊಸದುರ್ಗ ತಾಲ್ಲೂಕು

    </div>


    <!-- TITLE -->

    <div class="title">

        School Result Management System

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message">
    </div>


    <!-- DISE CODE -->

    <label for="diseCode">

        DISE CODE

    </label>


    <input
        type="text"
        id="diseCode"
        placeholder="DISE Code ನಮೂದಿಸಿ"
        inputmode="numeric"
        autocomplete="username"
        maxlength="20"
    >


    <!-- PASSWORD -->

    <label for="password">

        PASSWORD

    </label>


    <div class="password-box">


        <input
            type="password"
            id="password"
            placeholder="Password ನಮೂದಿಸಿ"
            autocomplete="current-password"
        >


        <span
            class="show-password"
            id="showPassword"
            title="Password ತೋರಿಸಿ">

            👁

        </span>


    </div>


    <!-- LOGIN -->

    <button
        class="login-btn"
        id="loginBtn"
        onclick="login()">

        LOGIN

    </button>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading">

        Login ಪರಿಶೀಲಿಸಲಾಗುತ್ತಿದೆ...

    </div>


    <!-- FOOTER -->

    <div class="footer">

        © School Result Management System

    </div>


</div>



<script>


/* =====================================================
   SUPABASE CONFIGURATION
   ===================================================== */


/*
   ನಿಮ್ಮ Supabase Project URL
*/

const SUPABASE_URL =
"https://sozlvjvqrgpaabnvjvxe.supabase.co";


/*
   ನಿಮ್ಮ Supabase Publishable Key
*/

const SUPABASE_ANON_KEY =
"sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";


/*
   Supabase Client
*/

const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_ANON_KEY

);



/* =====================================================
   PASSWORD SHOW / HIDE
   ===================================================== */


document
.getElementById("showPassword")
.addEventListener(
    "click",
    function(){

        const password =
        document.getElementById("password");


        if(password.type === "password"){

            password.type = "text";

            this.textContent = "🙈";

        }

        else{

            password.type = "password";

            this.textContent = "👁";

        }

    }
);



/* =====================================================
   ENTER KEY LOGIN
   ===================================================== */


document
.getElementById("password")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);



/* =====================================================
   MESSAGE
   ===================================================== */


function showMessage(
    text,
    type
){

    const box =
    document.getElementById("message");


    box.textContent = text;


    box.className =
    "message " + type;


    box.style.display =
    "block";

}



function hideMessage(){

    document
    .getElementById("message")
    .style.display =
    "none";

}



/* =====================================================
   LOGIN FUNCTION
   ===================================================== */


async function login(){


    hideMessage();


    const diseCode =
    document
    .getElementById("diseCode")
    .value
    .trim();


    const password =
    document
    .getElementById("password")
    .value;


    const loginBtn =
    document
    .getElementById("loginBtn");


    const loading =
    document
    .getElementById("loading");



    /* -----------------------------------------------
       VALIDATION
       ----------------------------------------------- */


    if(!diseCode){

        showMessage(
            "ದಯವಿಟ್ಟು DISE Code ನಮೂದಿಸಿ.",
            "error"
        );

        return;

    }



    if(!password){

        showMessage(
            "ದಯವಿಟ್ಟು Password ನಮೂದಿಸಿ.",
            "error"
        );

        return;

    }



    loginBtn.disabled =
    true;


    loading.style.display =
    "block";



    try{


        /* -------------------------------------------
           STEP 1
           DISE CODE ಪರಿಶೀಲನೆ
           ------------------------------------------- */


        const {
            data: schoolUser,
            error: userError
        } = await supabaseClient

        .from("school_users")

        .select(
            "id,dise_code,user_name,login_email,is_active"
        )

        .eq(
            "dise_code",
            diseCode
        )

        .maybeSingle();



        if(userError){

            console.error(
                "school_users error:",
                userError
            );

            throw new Error(
                "School User ಪರಿಶೀಲಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ."
            );

        }



        /* -------------------------------------------
           DISE CODE FOUND?
           ------------------------------------------- */


        if(!schoolUser){

            throw new Error(
                "DISE Code ತಪ್ಪಾಗಿದೆ."
            );

        }



        /* -------------------------------------------
           ACTIVE USER?
           ------------------------------------------- */


        if(
            schoolUser.is_active === false
        ){

            throw new Error(
                "ಈ School User ಅನ್ನು ನಿಷ್ಕ್ರಿಯಗೊಳಿಸಲಾಗಿದೆ."
            );

        }



        /* -------------------------------------------
           LOGIN EMAIL EXISTS?
           ------------------------------------------- */


        if(
            !schoolUser.login_email
        ){

            throw new Error(
                "ಈ DISE Code ಗೆ Login Email link ಆಗಿಲ್ಲ."
            );

        }



        /* -------------------------------------------
           SUPABASE AUTH LOGIN
           ------------------------------------------- */


        const {
            data,
            error: loginError
        } = await supabaseClient.auth
        .signInWithPassword({

            email:
            schoolUser.login_email,

            password:
            password

        });



        /* -------------------------------------------
           PASSWORD ERROR
           ------------------------------------------- */


        if(loginError){

            console.error(
                "Authentication error:",
                loginError
            );


            throw new Error(
                "Password ತಪ್ಪಾಗಿದೆ."
            );

        }



        /* -------------------------------------------
           SESSION CHECK
           ------------------------------------------- */


        const {
            data: sessionData
        } =
        await supabaseClient
        .auth
        .getSession();



        if(
            !sessionData ||
            !sessionData.session
        ){

            throw new Error(
                "Login session ಸೃಷ್ಟಿಯಾಗಲಿಲ್ಲ."
            );

        }



        /* -------------------------------------------
           LOGIN SUCCESS
           ------------------------------------------- */


        showMessage(
            "Login ಯಶಸ್ವಿಯಾಗಿದೆ. Dashboard ತೆರೆಯಲಾಗುತ್ತಿದೆ...",
            "success"
        );


        loading.style.display =
        "none";



        /* -------------------------------------------
           SAVE USER INFORMATION
           ------------------------------------------- */


        sessionStorage.setItem(
            "school_dise_code",
            schoolUser.dise_code
        );


        sessionStorage.setItem(
            "school_user_name",
            schoolUser.user_name || ""
        );



        /* -------------------------------------------
           GO TO DASHBOARD
           ------------------------------------------- */


        setTimeout(
            function(){

                window.location.href =
                "dashboard.html";

            },
            700
        );


    }


    catch(error){


        console.error(
            "LOGIN ERROR:",
            error
        );


        showMessage(
            error.message ||
            "Login ವಿಫಲವಾಗಿದೆ.",
            "error"
        );


        loginBtn.disabled =
        false;


        loading.style.display =
        "none";

    }

}



</script>


</body>

</html>
