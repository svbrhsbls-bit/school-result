<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - School Result Management System</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                "Noto Sans Kannada",
                "Nirmala UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #17365d,
                    #2e75b6
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: #ffffff;

            border-radius: 18px;

            padding: 35px 30px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.25);

            text-align: center;
        }

        .school-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #17365d;
            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;
            font-weight: bold;
        }

        h1 {
            margin: 0;

            color: #17365d;

            font-size: 24px;
            line-height: 1.5;
        }

        .system-title {
            margin-top: 8px;

            color: #555;

            font-size: 16px;
        }

        .login-title {
            margin-top: 28px;
            margin-bottom: 20px;

            color: #17365d;

            font-size: 21px;

            font-weight: 700;
        }

        .form-group {
            text-align: left;

            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #333;

            font-weight: 600;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border:
                1px solid #cbd5e1;

            border-radius: 9px;

            font-size: 16px;

            outline: none;

            transition: 0.2s;

            background: #ffffff;
        }

        input:focus {
            border-color: #2e75b6;

            box-shadow:
                0 0 0 3px
                rgba(46,117,182,0.12);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 48px;
        }

        .show-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 18px;

            color: #555;
        }

        .login-button {
            width: 100%;

            margin-top: 8px;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #17365d;

            color: white;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover {
            background: #0f2947;
        }

        .login-button:disabled {
            background: #8a9aaa;

            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

            line-height: 1.5;
        }

        .error {
            display: block;

            background: #fee2e2;

            color: #991b1b;

            border:
                1px solid #fecaca;
        }

        .success {
            display: block;

            background: #dcfce7;

            color: #166534;

            border:
                1px solid #bbf7d0;
        }

        .footer {
            margin-top: 22px;

            color: #777;

            font-size: 12px;

            line-height: 1.6;
        }

        @media (max-width: 480px) {

            .login-card {
                padding: 28px 20px;
            }

            h1 {
                font-size: 20px;
            }

            .system-title {
                font-size: 14px;
            }
        }
    </style>
</head>


<body>

<div class="login-container">

    <div class="login-card">

        <!-- School Icon -->
        <div class="school-icon">
            SR
        </div>


        <!-- School Name -->
        <h1>
            ಶ್ರೀ ವೀರಬಲ್ಲಾಳ ಗ್ರಾಮಾಂತರ ಪ್ರೌಢಶಾಲೆ
        </h1>


        <div class="system-title">
            ಬಲ್ಲಾಳಸಮುದ್ರ, ಹೊಸದುರ್ಗ ತಾಲ್ಲೂಕು
        </div>


        <!-- System Title -->
        <div class="login-title">
            School Result Management System
        </div>


        <!-- LOGIN FORM -->
        <form
            id="loginForm"
            autocomplete="off"
            novalidate
        >


            <!-- EMAIL -->
            <div class="form-group">

                <label for="email">
                    Login Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="login_email_unique"
                    placeholder="ನಿಮ್ಮ Email ನಮೂದಿಸಿ"

                    autocomplete="off"

                    autocapitalize="none"
                    autocorrect="off"
                    spellcheck="false"

                    required
                >

            </div>


            <!-- PASSWORD -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="login_password_unique"
                        placeholder="Password ನಮೂದಿಸಿ"

                        autocomplete="new-password"

                        autocapitalize="none"
                        autocorrect="off"
                        spellcheck="false"

                        required
                    >


                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                        title="Password ತೋರಿಸಿ"
                        aria-label="Password ತೋರಿಸಿ"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- LOGIN BUTTON -->
            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Login
            </button>

        </form>


        <!-- MESSAGE -->
        <div
            id="message"
            class="message"
        ></div>


        <!-- FOOTER -->
        <div class="footer">
            © School Result Management System
        </div>

    </div>

</div>



<script>

/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
    "https://sozlvjvqrgpaabnvjvxe.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";


/* =========================================================
   CREATE SUPABASE CLIENT
   ========================================================= */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   GET ELEMENTS
   ========================================================= */

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");

const showPassword =
    document.getElementById("showPassword");


/* =========================================================
   IMPORTANT:
   CLEAR INPUTS WHEN PAGE LOADS
   ========================================================= */

window.addEventListener(
    "load",
    function () {

        emailInput.value = "";
        passwordInput.value = "";

        emailInput.setAttribute(
            "autocomplete",
            "off"
        );

        passwordInput.setAttribute(
            "autocomplete",
            "new-password"
        );

    }
);


/* =========================================================
   SHOW / HIDE PASSWORD
   ========================================================= */

showPassword.addEventListener(
    "click",
    function () {

        if (
            passwordInput.type === "password"
        ) {

            passwordInput.type = "text";

            showPassword.textContent = "🙈";

            showPassword.title =
                "Password ಮರೆಮಾಡಿ";

        } else {

            passwordInput.type = "password";

            showPassword.textContent = "👁";

            showPassword.title =
                "Password ತೋರಿಸಿ";
        }

    }
);


/* =========================================================
   MESSAGE FUNCTION
   ========================================================= */

function showMessage(
    text,
    type
) {

    message.textContent = text;

    message.className =
        "message " + type;

}


/* =========================================================
   LOGIN
   ========================================================= */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        /* -----------------------------------------
           VALIDATE EMAIL
           ----------------------------------------- */

        if (!email) {

            showMessage(
                "ದಯವಿಟ್ಟು Email ನಮೂದಿಸಿ.",
                "error"
            );

            emailInput.focus();

            return;
        }


        /* -----------------------------------------
           VALIDATE PASSWORD
           ----------------------------------------- */

        if (!password) {

            showMessage(
                "ದಯವಿಟ್ಟು Password ನಮೂದಿಸಿ.",
                "error"
            );

            passwordInput.focus();

            return;
        }


        /* -----------------------------------------
           DISABLE BUTTON
           ----------------------------------------- */

        loginButton.disabled = true;

        loginButton.textContent =
            "Login ಆಗುತ್ತಿದೆ...";


        showMessage(
            "ದಯವಿಟ್ಟು ಕಾಯಿರಿ...",
            "success"
        );


        try {

            /* -------------------------------------
               SUPABASE LOGIN
               ------------------------------------- */

            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email: email,

                        password: password

                    });


            /* -------------------------------------
               LOGIN ERROR
               ------------------------------------- */

            if (error) {

                console.error(
                    "Login Error:",
                    error
                );


                showMessage(
                    "Login ವಿಫಲವಾಗಿದೆ. Email ಅಥವಾ Password ಪರಿಶೀಲಿಸಿ.",
                    "error"
                );


                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";


                /*
                 * Password ಅನ್ನು ಖಾಲಿ ಮಾಡುತ್ತೇವೆ.
                 */
                passwordInput.value = "";

                return;
            }


            /* -------------------------------------
               LOGIN SUCCESS
               ------------------------------------- */

            if (
                data &&
                data.session
            ) {

                showMessage(
                    "Login ಯಶಸ್ವಿಯಾಗಿದೆ. Dashboard ತೆರೆಯುತ್ತಿದೆ...",
                    "success"
                );


                /*
                 * Login credentials
                 * screenನಲ್ಲಿ ಉಳಿಯದಂತೆ
                 * inputಗಳನ್ನು clear ಮಾಡುತ್ತೇವೆ.
                 */

                emailInput.value = "";
                passwordInput.value = "";


                setTimeout(
                    function () {

                        window.location.replace(
                            "dashboard.html"
                        );

                    },
                    500
                );


            } else {

                showMessage(
                    "Login session ಸಿಗಲಿಲ್ಲ. ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.",
                    "error"
                );


                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

            }


        } catch (error) {

            console.error(
                "Unexpected Login Error:",
                error
            );


            showMessage(
                "Login ಮಾಡುವಾಗ ದೋಷ ಸಂಭವಿಸಿದೆ. Internet connection ಪರಿಶೀಲಿಸಿ.",
                "error"
            );


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";


            passwordInput.value = "";

        }

    }
);


/* =========================================================
   CHECK EXISTING LOGIN SESSION
   ========================================================= */

async function checkExistingSession() {

    try {

        const {
            data
        } =
            await supabaseClient.auth
                .getSession();


        if (
            data &&
            data.session
        ) {

            /*
             * Already logged in
             * Dashboardಗೆ ಹೋಗುತ್ತದೆ.
             */

            window.location.replace(
                "dashboard.html"
            );

        }

    } catch (error) {

        console.error(
            "Session check error:",
            error
        );

    }

}


/* =========================================================
   START SESSION CHECK
   ========================================================= */

checkExistingSession();


/* =========================================================
   PREVENT BROWSER BACK CACHE
   ========================================================= */

window.addEventListener(
    "pageshow",
    function (event) {

        if (event.persisted) {

            checkExistingSession();

        }

    }
);

</script>

</body>
</html>
