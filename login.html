<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - School Result Management System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,"Noto Sans Kannada",sans-serif;
    background:linear-gradient(135deg,#e0f2fe,#eef2ff,#f8fafc);
}

.login-container{
    width:100%;
    max-width:430px;
    padding:20px;
}

.login-card{
    background:#ffffff;
    border-radius:20px;
    padding:35px 30px;
    box-shadow:0 15px 45px rgba(0,0,0,0.12);
    text-align:center;
}

.school-icon{
    width:80px;
    height:80px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#1d4ed8;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
}

h1{
    margin:5px 0;
    color:#1e293b;
    font-size:24px;
}

.subtitle{
    color:#64748b;
    font-size:14px;
    margin-bottom:28px;
}

.form-group{
    text-align:left;
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:700;
    color:#334155;
    font-size:14px;
}

input{
    width:100%;
    padding:13px 14px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font-size:16px;
    outline:none;
    transition:0.2s;
}

input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,0.12);
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:50px;
}

.show-password{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    cursor:pointer;
    font-size:18px;
}

.login-btn{
    width:100%;
    border:none;
    border-radius:10px;
    padding:14px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    margin-top:8px;
}

.login-btn:hover{
    background:#1d4ed8;
}

.login-btn:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:11px;
    border-radius:8px;
    margin-bottom:18px;
    font-size:14px;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.footer{
    margin-top:22px;
    color:#64748b;
    font-size:12px;
}

.loading{
    display:none;
    margin-top:12px;
    color:#475569;
    font-size:13px;
}

@media(max-width:480px){

    .login-container{
        padding:12px;
    }

    .login-card{
        padding:28px 20px;
    }

    h1{
        font-size:21px;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="school-icon">
            🏫
        </div>

        <h1>ಶ್ರೀ ವೀರಬಲ್ಲಾಳ ಗ್ರಾಮಾಂತರ ಪ್ರೌಢಶಾಲೆ</h1>

        <div class="subtitle">
            School Result Management System
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email / ಇಮೇಲ್
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="ನಿಮ್ಮ Email ನಮೂದಿಸಿ"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password / ಪಾಸ್‌ವರ್ಡ್
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Password ನಮೂದಿಸಿ"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                        title="Show Password"
                    >
                        👁
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                LOGIN / ಲಾಗಿನ್
            </button>

            <div id="loading" class="loading">
                Login ಮಾಡಲಾಗುತ್ತಿದೆ...
            </div>

        </form>

        <div class="footer">
            © 2026 ಶ್ರೀ ವೀರಬಲ್ಲಾಳ ಗ್ರಾಮಾಂತರ ಪ್ರೌಢಶಾಲೆ
        </div>

    </div>

</div>

<script>

/* =====================================================
   SUPABASE CONNECTION
   ===================================================== */

const SUPABASE_URL =
"https://sozlvjvqrgpaabnvjvxe.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================================
   ELEMENTS
   ===================================================== */

const loginForm =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");

const loading =
document.getElementById("loading");

const showPassword =
document.getElementById("showPassword");


/* =====================================================
   SHOW / HIDE PASSWORD
   ===================================================== */

showPassword.addEventListener("click", function(){

    if(passwordInput.type === "password"){

        passwordInput.type = "text";

        showPassword.textContent = "🙈";

    }else{

        passwordInput.type = "password";

        showPassword.textContent = "👁";

    }

});


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

}


/* =====================================================
   CHECK EXISTING LOGIN
   ===================================================== */

async function checkExistingSession(){

    try{

        const {
            data
        } = await supabaseClient.auth.getSession();

        if(
            data &&
            data.session
        ){

            window.location.replace(
                "dashboard.html"
            );

        }

    }catch(error){

        console.error(
            "Session check error:",
            error
        );

    }

}


/* =====================================================
   LOGIN
   ===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        if(!email){

            showMessage(
                "ದಯವಿಟ್ಟು Email ನಮೂದಿಸಿ.",
                "error"
            );

            return;
        }

        if(!password){

            showMessage(
                "ದಯವಿಟ್ಟು Password ನಮೂದಿಸಿ.",
                "error"
            );

            return;
        }


        /* Disable button */

        loginBtn.disabled = true;

        loginBtn.textContent =
            "LOGIN ಮಾಡಲಾಗುತ್ತಿದೆ...";

        loading.style.display =
            "block";

        message.className =
            "message";


        try{

            const {
                data,
                error
            } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


            if(error){

                console.error(
                    "Login error:",
                    error
                );

                showMessage(
                    "Email ಅಥವಾ Password ತಪ್ಪಾಗಿದೆ. ದಯವಿಟ್ಟು ಪರಿಶೀಲಿಸಿ.",
                    "error"
                );

                return;
            }


            if(
                data &&
                data.session
            ){

                showMessage(
                    "Login ಯಶಸ್ವಿಯಾಗಿದೆ. Dashboard ತೆರೆಯಲಾಗುತ್ತಿದೆ...",
                    "success"
                );

                setTimeout(function(){

                    window.location.replace(
                        "dashboard.html"
                    );

                },700);

            }else{

                showMessage(
                    "Login ಆಗಲಿಲ್ಲ. ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.",
                    "error"
                );

            }

        }catch(error){

            console.error(
                "Unexpected login error:",
                error
            );

            showMessage(
                "System error. ದಯವಿಟ್ಟು ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.",
                "error"
            );

        }finally{

            loginBtn.disabled = false;

            loginBtn.textContent =
                "LOGIN / ಲಾಗಿನ್";

            loading.style.display =
                "none";

        }

    }
);


/* =====================================================
   START
   ===================================================== */

checkExistingSession();

</script>

</body>
</html>
