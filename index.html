<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        window.location.replace("student-result.html");
    </script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            text-align: center;
        }

        .box {
            padding: 30px;
        }

        .loader {
            width: 40px;
            height: 40px;
            margin: 0 auto 15px;
            border: 4px solid #ddd;
            border-top: 4px solid #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        a {
            color: #0066cc;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="loader"></div>

        <h3>Student Result</h3>

        <p>Opening result page...</p>

        <p>
            If the page does not open automatically,
            <a href="student-result.html">Click here</a>
        </p>

    </div>

</body>
