<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reports & Print</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#eef6fb;color:#17324d;font-family:"Noto Sans Kannada","Nirmala UI",Arial,sans-serif}
header{background:#087db5;color:#fff;text-align:center;padding:20px}
header h1{margin:0;font-size:28px}
.container{width:96%;max-width:1450px;margin:22px auto}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 3px 16px rgba(0,0,0,.09)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
label{font-weight:700;display:block;margin-bottom:6px}
select{width:100%;padding:11px;border:1px solid #b9c9d3;border-radius:8px;font-size:15px;background:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button{border:0;border-radius:8px;padding:11px 18px;font-size:15px;font-weight:700;cursor:pointer}
.blue{background:#087db5;color:#fff}.green{background:#168a52;color:#fff}
.orange{background:#e38b00;color:#fff}.purple{background:#7545b5;color:#fff}
.gray{background:#687582;color:#fff}
.message{margin-top:14px;padding:11px;border-radius:8px;display:none}
.message.show{display:block}.success{background:#dcf5e2;color:#126b38}
.error{background:#ffe0e0;color:#9b1c1c}.info{background:#dceeff;color:#15547a}
.report{overflow:auto}
.school{text-align:center;margin-bottom:15px}
.school h2,.school h3,.school p{margin:4px}
.student-head{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.info-box{border:1px solid #d8e4eb;background:#f8fbfd;border-radius:7px;padding:9px}
table{width:100%;border-collapse:collapse}.announcement-stats{max-width:850px;margin:0 auto}
th,td{border:1px solid #bbc8d2;padding:7px;text-align:center}
th{background:#087db5;color:#fff}
.left{text-align:left}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.sum{padding:10px 15px;background:#f2f7fa;border:1px solid #d7e2e9;border-radius:8px}
.sum b{margin-left:5px}
.annual-note{background:#fff4d7;padding:10px;border-radius:8px;margin-top:12px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}.student-head{grid-template-columns:1fr 1fr}}
@media print{
 body{background:#fff}
 .no-print{display:none!important}
 .container{width:100%;margin:0}
 .card{box-shadow:none;border:0;padding:0}
 .report{overflow:visible}
 .student-page{
   page-break-after:always;
   break-after:page;
   height:281mm;
   min-height:281mm;
   max-height:281mm;
   display:flex;
   flex-direction:column;
   break-inside:avoid;
   page-break-inside:avoid;
 }
 .student-page:last-child{page-break-after:auto;break-after:auto}
 .student-signatures{
   margin-top:auto;
   display:flex;
   justify-content:space-between;
   padding-top:8mm;
   font-weight:700;
   flex-shrink:0;
 }
 @page{size:A4 portrait;margin:10mm}
}

.caste-summary-table{
  width:100%;
  border-collapse:collapse;
  table-layout:auto;
  font-size:11px;
}
.caste-summary-table th,
.caste-summary-table td{
  border:1px solid #333;
  text-align:center;
  padding:4px 3px;
  vertical-align:middle;
  white-space:nowrap;
}
.caste-summary-table th:first-child,
.caste-summary-table td:first-child{
  width:1%;
  min-width:34px;
  padding-left:4px;
  padding-right:4px;
}
.caste-summary-table th:nth-child(2),
.caste-summary-table td:nth-child(2){
  width:1%;
  min-width:58px;
  padding-left:5px;
  padding-right:5px;
}
.caste-summary-table th:nth-child(n+3),
.caste-summary-table td:nth-child(n+3){
  width:auto;
  min-width:0;
}
.caste-summary-table th{
  font-weight:700;
  font-size:10px;
}
.caste-summary-table td{
  font-size:10px;
}
.caste-summary-table .left{
  text-align:center;
}
.caste-summary-table .gender-head{
  min-width:38px;
  width:38px;
  white-space:nowrap;
  overflow:visible;
}
@media print{
  .caste-summary-table{
    width:100%;
    table-layout:auto;
    font-size:8px;
  }
  .caste-summary-table th,
  .caste-summary-table td{
    padding:3px 2px;
  }
  .caste-summary-table th{
    font-size:8px;
  }
  .caste-summary-table td{
    font-size:8px;
  }
}


@media print{
  body.caste-print-landscape{
    width:100%;
  }

  body.caste-print-landscape .caste-summary-table{
    width:100% !important;
    table-layout:auto !important;
    font-size:9px !important;
  }

  body.caste-print-landscape .caste-summary-table th,
  body.caste-print-landscape .caste-summary-table td{
    padding:3px 3px !important;
    white-space:nowrap !important;
    overflow:visible !important;
  }

  body.caste-print-landscape .caste-summary-table th:first-child,
  body.caste-print-landscape .caste-summary-table td:first-child{
    width:1% !important;
    min-width:30px !important;
  }

  body.caste-print-landscape .caste-summary-table th:nth-child(2),
  body.caste-print-landscape .caste-summary-table td:nth-child(2){
    width:1% !important;
    min-width:55px !important;
  }

  body.caste-print-landscape .caste-summary-table .gender-head{
    min-width:34px !important;
    width:auto !important;
  }
}

</style>
</head>
<body>
<header class="no-print">
<h1>📊 Reports & Print</h1>
<div>School Result Management System</div>
</header>

<div class="container">
<div class="card no-print">
<div class="grid">
<div>
<label>Report</label>
<select id="reportType">
<option value="progress">📄 Progress Report Card</option>

<div class="card report" id="reportArea">
<p style="text-align:center;color:#687582">ತರಗತಿ, ವಿಭಾಗ, ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ <b>Load Report</b> ಒತ್ತಿ.</p>
</div>
</div>

<script>
const SUPABASE_URL="https://sozlvjvqrgpaabnvjvxe.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let appSettings={};
let allStudents=[];
let currentStudents=[];
let currentSubjects=[];
let currentRows=[];
let currentExam="ANNUAL";
let currentClass="8";
let currentDivision="A";
let reportType="progress";
let currentCasteStudents=[];
let currentCombinedSchool={8:[],9:[],10:[]};

const $=id=>document.getElementById(id);

function msg(text,type="info"){
 const e=$("message"); e.textContent=text; e.className="message show "+type;
}
function esc(v){
 return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function classNumber(v){
 const m=String(v||"").match(/10|9|8/); return m?m[0]:"";
}
function studentName(s){return s.student_name||s.name||s.studentName||"Student"}
function roll(s,i){return s.roll_no||s.roll_number||s.reg_no||s.registration_no||(i+1)}
function division(s){return String(s.division||s.section||s.division_name||s.section_name||"").trim().toUpperCase()}
function subjectName(s){return s.subject_name||s.name||s.subject||s.subjectName||s.title||"Subject"}
function subjectCode(s){return s.subject_code||s.code||s.subjectCode||""}
function normalizeSubjectKey(name){
 const n=String(name||"").trim().toLowerCase().replace(/\s+/g," ");
 const map={
  "ಕನ್ನಡ":"kannada","kannada":"kannada",
  "ಇಂಗ್ಲಿಷ್":"english","ಇಂಗ್ಲೀಷ್":"english","english":"english",
  "ಹಿಂದಿ":"hindi","hindi":"hindi",
  "ಗಣಿತ":"mathematics","maths":"mathematics","math":"mathematics","mathematics":"mathematics",
  "ವಿಜ್ಞಾನ":"science","science":"science",
  "ಸಮಾಜ ವಿಜ್ಞಾನ":"social science","ಸಾಮಾಜಿಕ ವಿಜ್ಞಾನ":"social science",
  "social science":"social science","socialscience":"social science"
 };
 return map[n]||n;
}
function uniqueSubjects(rows){
 const groups=new Map();
 (rows||[]).filter(r=>r.is_active!==false).forEach(r=>{
  const key=normalizeSubjectKey(subjectName(r)); if(!key)return;
  if(!groups.has(key))groups.set(key,[]); groups.get(key).push(r);
 });
 return Array.from(groups.values()).map(g=>[...g].sort((a,b)=>{
  const ai=Number(a.id),bi=Number(b.id);
  if(Number.isFinite(ai)&&Number.isFinite(bi)&&ai!==bi)return bi-ai;
  const at=new Date(a.updated_at||a.created_at||0).getTime();
  const bt=new Date(b.updated_at||b.created_at||0).getTime();
  if(Number.isFinite(at)&&Number.isFinite(bt)&&at!==bt)return bt-at;
  return Number(a.display_order||999)-Number(b.display_order||999);
 })[0]).sort((a,b)=>Number(a.display_order||999)-Number(b.display_order||999));
}
function isKannada(s){
 const n=String(subjectName(s)).toLowerCase(),c=String(subjectCode(s)).toLowerCase();
 return n.includes("kannada")||n.includes("ಕನ್ನಡ")||c==="1"||c==="01";
}
function maxMarks(s){
 if(currentClass==="8") return currentExam==="HALF_YEARLY"?50:100;
 if(currentClass==="9"||currentClass==="10"){
  if(currentExam==="HALF_YEARLY")return isKannada(s)?100:80;
  return isKannada(s)?125:100;
 }
 return 100;
}
function grade8(m,max){
 m=Number(m); if(!Number.isFinite(m))return "";
 if(currentExam==="HALF_YEARLY"&&max===50){
  if(m>=45)return"A+";if(m>=35)return"A";if(m>=25)return"B+";if(m>=15)return"B";return"C";
 }
 if(currentExam==="ANNUAL"&&max===100){
  if(m>=90)return"A+";if(m>=70)return"A";if(m>=50)return"B+";if(m>=30)return"B";return"C";
 }
 return"";
}
function grade910(m,s){
 m=Number(m);if(!Number.isFinite(m))return"";
 const k=isKannada(s);
 if(currentExam==="HALF_YEARLY"){
  if(k){if(m>=90)return"A+";if(m>=80)return"A";if(m>=70)return"B+";if(m>=60)return"B";if(m>=50)return"C+";if(m>=35)return"C";return"NC"}
  if(m>=72)return"A+";if(m>=64)return"A";if(m>=56)return"B+";if(m>=48)return"B";if(m>=40)return"C+";if(m>=28)return"C";return"NC";
 }
 if(k){if(m>=112)return"A+";if(m>=100)return"A";if(m>=87)return"B+";if(m>=75)return"B";if(m>=63)return"C+";if(m>=44)return"C";return"NC"}
 if(m>=90)return"A+";if(m>=80)return"A";if(m>=70)return"B+";if(m>=60)return"B";if(m>=50)return"C+";if(m>=35)return"C";return"NC";
}
function subjectGrade(m,max,s){
 return currentClass==="8"?grade8(m,max):grade910(m,s);
}
function overallGrade(p){
 p=Number(p);
 if(currentClass==="8"){if(p>=90)return"A+";if(p>=70)return"A";if(p>=50)return"B+";if(p>=30)return"B";return"C"}
 if(p>=90)return"A+";if(p>=80)return"A";if(p>=70)return"B+";if(p>=60)return"B";if(p>=50)return"C+";if(p>=35)return"C";return"NC";
}
function passResult(p){
 return Number(p)>=(currentClass==="8"?30:35)?"PASS":"FAIL";
}

async function loadSettings(){
 const r=await db.from("settings").select("*").eq("id",1).maybeSingle();
 if(!r.error&&r.data)appSettings=r.data;
}
async function loadBase(){
 currentClass=classNumber($("classSelect").value);
 currentDivision=$("divisionSelect").value.trim().toUpperCase();
 currentExam=$("examSelect").value;
 reportType=$("reportType").value;

 await loadSettings();

 const sr=await db.from("students").select("*");
 if(sr.error)throw sr.error;
 allStudents=(sr.data||[]).filter(s=>s.is_active!==false);

 currentStudents=allStudents.filter(s=>
  classNumber(s.class_name||s.class||s.standard||"")===currentClass &&
  division(s)===currentDivision
 ).sort((a,b)=>Number(a.roll_no||999999)-Number(b.roll_no||999999));

 const sub=await db.from("subjects").select("*").eq("is_active",true);
 if(sub.error)throw sub.error;
 currentSubjects=uniqueSubjects((sub.data||[]).filter(s=>
  classNumber(s.class_name||s.class||s.standard||"")===currentClass
 ));

 const sel=$("studentSelect");
 sel.innerHTML='<option value="">ಎಲ್ಲಾ ವಿದ್ಯಾರ್ಥಿಗಳು</option>';
 currentStudents.forEach(s=>{
  const o=document.createElement("option");o.value=s.id;o.textContent=roll(s,0)+" - "+studentName(s);sel.appendChild(o);
 });
}

async function loadResults(){
 const ids=currentStudents.map(s=>s.id);
 if(!ids.length)return [];

 const rr=await db.from("exam_results")
  .select("id,student_id,exam_type,published")
  .in("student_id",ids).eq("exam_type",currentExam);
 if(rr.error)throw rr.error;

 const results=rr.data||[];
 const resultIds=results.map(r=>r.id);
 let marks=[];
 if(resultIds.length){
  const mr=await db.from("result_marks")
   .select("exam_result_id,subject_id,marks")
   .in("exam_result_id",resultIds);
  if(mr.error)throw mr.error;
  marks=mr.data||[];
 }
 const map={};
 marks.forEach(m=>map[`${m.exam_result_id}_${m.subject_id}`]=m.marks);

 return currentStudents.map((s,i)=>{
  const r=results.find(x=>String(x.student_id)===String(s.id));
  let total=0,max=0,entered=0;
  const items=currentSubjects.map(sub=>{
   const value=r?map[`${r.id}_${sub.id}`]:"";
   const mm=maxMarks(sub);max+=mm;
   if(value!==""&&value!==null&&value!==undefined){total+=Number(value);entered++}
   return {subject:subjectName(sub),code:subjectCode(sub),mark:value??"",max:mm,grade:value===""||value===null?"":subjectGrade(value,mm,sub),subjectId:sub.id};
  });
  const pct=max?total/max*100:0;
  return {student:s,result:r,items,total,max,percentage:pct,grade:entered===currentSubjects.length?overallGrade(pct):"-",resultText:entered===currentSubjects.length?passResult(pct):"PENDING"};
 });
}

function header(title){
 return `<div class="school">
  <h2>${esc(appSettings.school_name||"ಶಾಲೆಯ ಹೆಸರು")}</h2>
  <p>ಶೈಕ್ಷಣಿಕ ವರ್ಷ - ${esc(appSettings.academic_year||"2026-27")}</p>
  <h3>${title}</h3>
 </div>`;
}
function studentInfo(d){
 const s=d.student;
 return `<div class="student-head">
  <div class="info-box"><b>Roll No</b><br>${esc(roll(s,0))}</div>
  <div class="info-box"><b>ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು</b><br>${esc(studentName(s))}</div>
  <div class="info-box"><b>ತರಗತಿ</b><br>${esc(s.class_name||currentClass)}</div>
  <div class="info-box"><b>ವಿಭಾಗ</b><br>${esc(division(s)||currentDivision)}</div>
 </div>`;
}
function progressHTML(d){
 return `<div class="student-page">`+
 header("📄 ಪ್ರಗತಿ ವರದಿ")+
 studentInfo(d)+
 `<table><thead><tr><th>ವಿಷಯ</th><th>Subject Code</th><th>ಅಂಕ</th><th>ಗರಿಷ್ಠ ಅಂಕ</th><th>Grade</th></tr></thead><tbody>`+
 d.items.map(x=>`<tr><td class="left">${esc(x.subject)}</td><td>${esc(x.code)}</td><td>${x.mark===""?"-":x.mark}</td><td>${x.max}</td><td>${x.grade||"-"}</td></tr>`).join("")+
 `</tbody></table>
 <div class="summary">
  <div class="sum">ಒಟ್ಟು <b>${d.total.toFixed(2)} / ${d.max.toFixed(2)}</b></div>
  <div class="sum">Percentage <b>${d.percentage.toFixed(2)}%</b></div>
  <div class="sum">Grade <b>${d.grade}</b></div>
  <div class="sum">Result <b>${d.resultText}</b></div>
 </div>
 <div class="student-signatures">
   <div>ತರಗತಿ ಶಿಕ್ಷಕರು</div>
   <div>ಮುಖ್ಯ ಶಿಕ್ಷಕರು</div>
 </div>
 </div>`;
}
function countStats(rows){
 const stats={registered:{m:0,f:0,t:0},appeared:{m:0,f:0,t:0},passed:{m:0,f:0,t:0},failed:{m:0,f:0,t:0}};
 rows.forEach(d=>{
  const g=String(d.student.gender||d.student.sex||"").trim().toLowerCase();
  const male=["male","m","ಗಂಡು","ಪುರುಷ"].includes(g);
  const female=["female","f","ಹೆಣ್ಣು","ಮಹಿಳೆ"].includes(g);
  if(male){stats.registered.m++;stats.registered.t++}
  else if(female){stats.registered.f++;stats.registered.t++}
  const appeared=d.items.some(x=>x.mark!==""&&x.mark!==null&&x.mark!==undefined);
  if(appeared){
   if(male){stats.appeared.m++;stats.appeared.t++}
   else if(female){stats.appeared.f++;stats.appeared.t++}
  }
  if(d.resultText==="PASS"){
   if(male){stats.passed.m++;stats.passed.t++}
   else if(female){stats.passed.f++;stats.passed.t++}
  }else if(d.resultText==="FAIL"){
   if(male){stats.failed.m++;stats.failed.t++}
   else if(female){stats.failed.f++;stats.failed.t++}
  }
 });
 return stats;
}
function statTable(title, rows){
 const s=countStats(rows);
 return `<h3 style="text-align:center">${title}</h3>
 <table class="announcement-stats">
 <thead><tr>
 <th>ವಿವರ</th><th class="gender-head">ಗಂಡು</th><th class="gender-head">ಹೆಣ್ಣು</th><th class="gender-head">ಒಟ್ಟು</th>
 </tr></thead><tbody>
 <tr><td class="left">ದಾಖಲಾತಿ</td><td>${s.registered.m}</td><td>${s.registered.f}</td><td>${s.registered.t}</td></tr>
 <tr><td class="left">ಪರೀಕ್ಷೆಗೆ ಕುಳಿತವರು</td><td>${s.appeared.m}</td><td>${s.appeared.f}</td><td>${s.appeared.t}</td></tr>
 <tr><td class="left">ಪರೀಕ್ಷೆಯಲ್ಲಿ ಉತ್ತೀರ್ಣರಾದವರು</td><td>${s.passed.m}</td><td>${s.passed.f}</td><td>${s.passed.t}</td></tr>
 <tr><td class="left">ಪರೀಕ್ಷೆಯಲ್ಲಿ ಅನುತ್ತೀರ್ಣರಾದವರು</td><td>${s.failed.m}</td><td>${s.failed.f}</td><td>${s.failed.t}</td></tr>
 </tbody></table>`;
}
function schoolHTML(rows){

function subjectStats(rows, sub){
 const out={registered:{m:0,f:0,t:0},appeared:{m:0,f:0,t:0},passed:{m:0,f:0,t:0},failed:{m:0,f:0,t:0}};
 rows.forEach(d=>{
  const g=String(d.student.gender||d.student.sex||"").trim().toLowerCase();
  const male=["male","m","ಗಂಡು","ಪುರುಷ"].includes(g);
  const female=["female","f","ಹೆಣ್ಣು","ಮಹಿಳೆ"].includes(g);
  if(male){out.registered.m++;out.registered.t++}
  else if(female){out.registered.f++;out.registered.t++}
  const x=d.items.find(i=>String(i.subjectId)===String(sub.id));
  const appeared=x && x.mark!=="" && x.mark!==null && x.mark!==undefined;
  if(appeared){
   if(male){out.appeared.m++;out.appeared.t++}
   else if(female){out.appeared.f++;out.appeared.t++}
   const passed=(d.resultText==="PASS" && Number(x.mark)>=0) ? true : false;
   // Subject pass is based on the subject grade, not the overall result.
   const sg=String(x.grade||"");
   const isPass=sg && sg!=="NC" && sg!=="C";
   if(isPass){
    if(male){out.passed.m++;out.passed.t++}
    else if(female){out.passed.f++;out.passed.t++}
   }else{
    if(male){out.failed.m++;out.failed.t++}
    else if(female){out.failed.f++;out.failed.t++}
   }
  }
 });
 return out;
}

async function generate(){
 try{
  msg("Report loading...","info");
  reportType=$("reportType").value;

  // School Announcement and Caste Report combine 8, 9 and 10.
  if(reportType==="school" || reportType==="caste"){
    currentExam="ANNUAL";
    currentCasteStudents=[];
    currentCombinedSchool={8:[],9:[],10:[]};
    const combined={8:[],9:[],10:[]};
    const savedClass=currentClass;
    for(const c of ["8","9","10"]){
      currentClass=c;
      const sr=await db.from("students").select("*");
      if(sr.error)throw sr.error;
      if(!allStudents.length) allStudents=(sr.data||[]).filter(s=>s.is_active!==false);
      const clsStudents=(sr.data||[]).filter(s=>{
        const sc=classNumber(s.class_name||s.class||s.standard||"");
        return sc===c && s.is_active!==false;
      });
      const subs=await db.from("subjects").select("*").eq("is_active",true);
      if(subs.error)throw subs.error;
      currentSubjects=uniqueSubjects((subs.data||[]).filter(s=>classNumber(s.class_name||s.class||s.standard||"")===c));
      const ids=clsStudents.map(s=>s.id);
      let results=[];
      if(ids.length){
        const rr=await db.from("exam_results").select("id,student_id,exam_type,published").in("student_id",ids).eq("exam_type","ANNUAL");
        if(rr.error)throw rr.error;
        const rids=(rr.data||[]).map(r=>r.id);
        let marks=[];
        if(rids.length){
          const mr=await db.from("result_marks").select("exam_result_id,subject_id,marks").in("exam_result_id",rids);
          if(mr.error)throw mr.error;
          marks=mr.data||[];
        }
        const map={}; marks.forEach(m=>map[`${m.exam_result_id}_${m.subject_id}`]=m.marks);
        results=clsStudents.map(s=>{
          const r=(rr.data||[]).find(x=>String(x.student_id)===String(s.id));
          let total=0,max=0,entered=0;
          const items=currentSubjects.map(sub=>{
            const value=r?map[`${r.id}_${sub.id}`]:"";
            const mm=maxMarks(sub); max+=mm;
            if(value!==""&&value!==null&&value!==undefined){total+=Number(value);entered++}
            return {subject:subjectName(sub),code:subjectCode(sub),mark:value??"",max:mm,grade:value===""||value===null?"":subjectGrade(value,mm,sub),subjectId:sub.id};
          });
          const pct=max?total/max*100:0;
          return {student:s,result:r,items,total,max,percentage:pct,grade:entered===currentSubjects.length?overallGrade(pct):"-",resultText:entered===currentSubjects.length?passResult(pct):"PENDING"};
        });
      }
      combined[c]=results;
    }
    currentCombinedSchool=combined;
    currentClass=savedClass;
    currentRows=[].concat(...Object.values(combined));
    if(reportType==="school"){
      $("reportArea").innerHTML=combinedSchoolHTML(combined);
    }else{
      // Caste report uses ONLY the students table and ONLY its `caste` column.
      const cr=await db.from("students")
        .select("id,class_name,gender,caste,is_active");
      if(cr.error) throw cr.error;
      currentCasteStudents=cr.data||[];

      $("reportArea").innerHTML=casteHTML(currentCasteStudents);
    }

    msg("✅ Report ಸಿದ್ಧವಾಗಿದೆ.","success");
    return;
  }

  await loadBase();

  // Progress and Subject-wise Announcement are annual-only.
  if((reportType==="progress"||reportType==="subject") && currentExam!=="ANNUAL"){
   msg("ಈ reportಗೆ ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ ಮಾತ್ರ ಪರಿಗಣಿಸಲಾಗುತ್ತದೆ. Excel/PDF/Printಗೆ ಅರ್ಧವಾರ್ಷಿಕ ಆಯ್ಕೆ ಮಾಡಬಹುದು.","error");
   return;
  }

  let rows=await loadResults();
  const studentId=$("studentSelect").value;
  if(studentId)rows=rows.filter(x=>String(x.student.id)===String(studentId));
  currentRows=rows;

  if(!rows.length){$("reportArea").innerHTML="<p style='text-align:center;color:red'>ವಿದ್ಯಾರ್ಥಿಗಳ ದಾಖಲೆ ಸಿಗಲಿಲ್ಲ.</p>";msg("ವಿದ್ಯಾರ್ಥಿಗಳ ದಾಖಲೆ ಸಿಗಲಿಲ್ಲ.","error");return}

  if(reportType==="progress"){
   $("reportArea").innerHTML=rows.map(progressHTML).join('<hr style="border:0;border-top:2px dashed #aaa;margin:25px 0">');
  }else if(reportType==="school"){
   $("reportArea").innerHTML=schoolHTML(rows);
  }else{
   $("reportArea").innerHTML=subjectHTML(rows);
  }
  msg("✅ Report ಸಿದ್ಧವಾಗಿದೆ.","success");
 }catch(e){
  console.error(e);msg("Report Error: "+(e.message||e),"error");
 }
}

function addSheet(wb, data, sheetName){
  const ws=XLSX.utils.aoa_to_sheet(data);

  if(sheetName==="ಜಾತಿವಾರು"){
    const lastCol=data[0].length-1;

    ws["!merges"]=[
      {s:{r:0,c:0},e:{r:0,c:lastCol}},
      {s:{r:1,c:0},e:{r:1,c:lastCol}},
      {s:{r:2,c:0},e:{r:3,c:0}},
      {s:{r:2,c:1},e:{r:3,c:1}},
      {s:{r:2,c:2},e:{r:2,c:4}},
      {s:{r:2,c:5},e:{r:2,c:7}},
      {s:{r:2,c:8},e:{r:2,c:10}},
      {s:{r:2,c:11},e:{r:2,c:13}},
      {s:{r:2,c:14},e:{r:2,c:16}},
      {s:{r:2,c:17},e:{r:2,c:19}},
      {s:{r:2,c:20},e:{r:2,c:22}},
      {s:{r:2,c:23},e:{r:2,c:25}}
    ];

    ws["!cols"]=[
      {wch:8},{wch:18},
      ...Array.from({length:24},()=>({wch:9}))
    ];

    const border={
      top:{style:"thin"},bottom:{style:"thin"},
      left:{style:"thin"},right:{style:"thin"}
    };

    for(let r=0;r<data.length;r++){
      for(let c=0;c<data[0].length;c++){
        const addr=XLSX.utils.encode_cell({r,c});
        if(!ws[addr]) ws[addr]={v:"",t:"s"};
        ws[addr].s={
          border,
          alignment:{horizontal:"center",vertical:"center",wrapText:true},
          font:{name:"Calibri",sz:12}
        };
      }
    }

    for(let r=0;r<=3;r++){
      for(let c=0;c<data[0].length;c++){
        const addr=XLSX.utils.encode_cell({r,c});
        ws[addr].s.font={name:"Calibri",sz:r<2?14:12,bold:true};
      }
    }

    ws["!rows"]=[
      {hpt:25},{hpt:25},{hpt:24},{hpt:24},
      {hpt:22},{hpt:22},{hpt:22},{hpt:22}
    ];

    ws["!pageSetup"]={
      orientation:"landscape",
      fitToWidth:1,
      fitToHeight:1
    };
    ws["!printArea"]="A1:Z8";
  }else{
    ws["!cols"]=data.length
      ? Array.from({length:data[0].length},()=>({wch:16}))
      : [];
  }

  XLSX.utils.book_append_sheet(wb,ws,sheetName);
 }

   "10":Object.fromEntries(CASTES.map(c=>[c,{m:0,f:0,t:0}]))
  };

  (studentList||[]).forEach(s=>{
   const cls=classNumber(s.class_name||"");
   const caste=normCaste(s.caste);
   if(!rows[cls] || !CASTES.includes(caste)) return;
   const g=genderLabel(s.gender);
   if(g==="ಗಂಡು") rows[cls][caste].m++;
   if(g==="ಹೆಣ್ಣು") rows[cls][caste].f++;
   rows[cls][caste].t=rows[cls][caste].m+rows[cls][caste].f;
  });

  const total=Object.fromEntries(CASTES.map(c=>[c,{m:0,f:0,t:0}]));
  ["8","9","10"].forEach(cls=>CASTES.forEach(c=>{
   total[c].m+=rows[cls][c].m;
   total[c].f+=rows[cls][c].f;
   total[c].t+=rows[cls][c].t;
  }));

  const data=[];
  data.push(["ಜಾತಿವಾರು ವಿದ್ಯಾರ್ಥಿಗಳ ವಿವರ"]);
  data.push(["8ನೇ, 9ನೇ ಮತ್ತು 10ನೇ ತರಗತಿಗಳ ಜಾತಿವಾರು ವಿದ್ಯಾರ್ಥಿಗಳ ವಿವರ"]);
  data.push(["ಕ್ರ.ಸಂ","ತರಗತಿ",...CASTES.flatMap(c=>[c,"",""]),"ಒಟ್ಟು","",""]);
  data.push(["","",...CASTES.flatMap(()=>["ಗಂಡು","ಹೆಣ್ಣು","ಒಟ್ಟು"]),"ಗಂಡು","ಹೆಣ್ಣು","ಒಟ್ಟು"]);

  [["01","8","8ನೇ ತರಗತಿ"],["02","9","9ನೇ ತರಗತಿ"],["03","10","10ನೇ ತರಗತಿ"]].forEach(([no,cls,label])=>{
   let gm=0,gf=0,gt=0;
   const row=[no,label];
   CASTES.forEach(c=>{
    const x=rows[cls][c];
    gm+=x.m; gf+=x.f; gt+=x.t;
    row.push(x.m,x.f,x.t);
   });
   row.push(gm,gf,gt);
   data.push(row);
  });

  const totalRow=["","ಒಟ್ಟು"];
  let gm=0,gf=0,gt=0;
  CASTES.forEach(c=>{
   const x=total[c];
   gm+=x.m; gf+=x.f; gt+=x.t;
   totalRow.push(x.m,x.f,x.t);
  });
  totalRow.push(gm,gf,gt);
  data.push(totalRow);
  return data;
 }

function printReport(){
  const isCaste = reportType === "caste";
  document.body.classList.toggle("caste-print-landscape", isCaste);

  // Progress/other reports: A4 portrait. Caste report: A4 landscape.
  // The orientation is injected dynamically because @page cannot be scoped
  // reliably with a body class. This prevents the student signature block
  // from being pushed onto a second page.
  let printOrientationStyle = document.getElementById("printOrientationStyle");
  if(!printOrientationStyle){
    printOrientationStyle = document.createElement("style");
    printOrientationStyle.id = "printOrientationStyle";
    document.head.appendChild(printOrientationStyle);
  }
  printOrientationStyle.textContent = isCaste
    ? "@media print { @page { size: A4 landscape; margin: 8mm; } }"
    : "@media print { @page { size: A4 portrait; margin: 8mm; } }";

  setTimeout(()=>{
    window.print();
    setTimeout(()=>{
      document.body.classList.remove("caste-print-landscape");
      printOrientationStyle.textContent = "";
    }, 700);
  }, 80);
}
