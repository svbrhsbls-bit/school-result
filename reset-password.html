<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Password Reset - ಶಾಲಾ ಫಲಿತಾಂಶ ವ್ಯವಸ್ಥೆ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Noto Sans Kannada",sans-serif;background:linear-gradient(135deg,#e8f0ff,#f8fbff);display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:100%;max-width:430px;background:#fff;border-radius:20px;padding:28px 24px;box-shadow:0 10px 35px rgba(0,0,0,.12)}
.icon{width:70px;height:70px;margin:0 auto 12px;border-radius:50%;background:#1769e0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px}
h1{text-align:center;font-size:22px;margin:5px 0 4px;color:#16325c}.sub{text-align:center;color:#666;font-size:14px;margin-bottom:24px;line-height:1.5}
label{display:block;font-weight:700;color:#333;margin:14px 0 7px}.pw{position:relative}
input{width:100%;height:50px;border:1px solid #ccd4df;border-radius:10px;padding:0 55px 0 14px;font-size:17px;outline:none}
input:focus{border-color:#1769e0;box-shadow:0 0 0 3px rgba(23,105,224,.1)}
.show{position:absolute;right:8px;top:7px;height:36px;min-width:42px;border:0;border-radius:8px;background:#eef3fb;font-size:17px}
.update{width:100%;height:52px;margin-top:22px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-size:18px;font-weight:700}.update:disabled{opacity:.65}
.back{display:block;text-align:center;margin-top:14px;color:#1769e0;text-decoration:none;font-size:14px;font-weight:700}
.msg{display:none;margin-top:16px;padding:12px;border-radius:9px;line-height:1.5;font-size:14px;white-space:pre-wrap;word-break:break-word}
.error{display:block;background:#fff0f0;color:#a40000;border:1px solid #ffcaca}.success{display:block;background:#effcf2;color:#116b2e;border:1px solid #bfe9ca}
.note{margin-top:18px;padding-top:14px;border-top:1px solid #eee;font-size:12px;color:#777;text-align:center}
</style>
</head>
<body>
<div class="card">
<div class="icon">🔐</div>
<h1>Password ಬದಲಾಯಿಸಿ</h1>
<div class="sub">ಶ್ರೀ ವೀರಬಲ್ಲಾಳ ಗ್ರಾಮಾಂತರ ಪ್ರೌಢಶಾಲೆ<br>ಬಲ್ಲಾಳಸಮುದ್ರ, ಹೊಸದುರ್ಗ ತಾಲ್ಲೂಕು</div>
<form id="resetForm">
<label for="newPassword">ಹೊಸ Password</label>
<div class="pw"><input id="newPassword" type="password" autocomplete="new-password" placeholder="ಹೊಸ Password ನಮೂದಿಸಿ" required><button class="show" type="button" id="show1">👁</button></div>
<label for="confirmPassword">ಹೊಸ Password ಮತ್ತೆ ನಮೂದಿಸಿ</label>
<div class="pw"><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Password ಮತ್ತೆ ನಮೂದಿಸಿ" required><button class="show" type="button" id="show2">👁</button></div>
<button class="update" id="updateBtn" type="submit">Password Update ಮಾಡಿ</button>
<div id="msg" class="msg"></div>
</form>
<a class="back" href="login.html">← Login pageಗೆ ಹಿಂತಿರುಗಿ</a>
<div class="note">Password update ಆದ ನಂತರ ಹೊಸ Password ಬಳಸಿ Login ಮಾಡಿ.</div>
</div>
<script>
const SUPABASE_URL="https://sozlvjvqrgpaabnvjvxe.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const form=document.getElementById("resetForm"),newPassword=document.getElementById("newPassword"),confirmPassword=document.getElementById("confirmPassword"),updateBtn=document.getElementById("updateBtn"),msg=document.getElementById("msg");
function showMsg(text,type="error"){msg.className="msg "+type;msg.textContent=text}
document.getElementById("show1").onclick=()=>{newPassword.type=newPassword.type==="password"?"text":"password"};
document.getElementById("show2").onclick=()=>{confirmPassword.type=confirmPassword.type==="password"?"text":"password"};

supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(event==="PASSWORD_RECOVERY" && session) console.log("Password recovery session ready.");
});

(async()=>{
  try{
    const {data,error}=await supabaseClient.auth.getSession();
    if(error) throw error;
    if(!data?.session) showMsg("Password reset session ಸಿಗಲಿಲ್ಲ.\n\nEmailನಲ್ಲಿ ಬಂದ Reset password link ಅನ್ನು ಮತ್ತೆ ತೆರೆಯಿರಿ.");
  }catch(err){
    console.error("SESSION CHECK ERROR:",err);
    showMsg("Password reset session ಪರಿಶೀಲಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.\n\n"+err.message);
  }
})();

form.addEventListener("submit",async(e)=>{
  e.preventDefault();msg.className="msg";msg.textContent="";
  const p1=newPassword.value,p2=confirmPassword.value;
  if(!p1){showMsg("ಹೊಸ Password ನಮೂದಿಸಿ.");return}
  if(p1.length<6){showMsg("Password ಕನಿಷ್ಠ 6 characters ಇರಬೇಕು.");return}
  if(p1!==p2){showMsg("ಎರಡೂ Password ಒಂದೇ ಆಗಿರಬೇಕು.");return}
  updateBtn.disabled=true;updateBtn.textContent="Password Update ಆಗುತ್ತಿದೆ...";
  try{
    const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();
    if(sessionError) throw sessionError;
    if(!sessionData?.session) throw new Error("Password reset session ಸಿಗಲಿಲ್ಲ.\n\nEmailನಲ್ಲಿ ಬಂದ Reset password link ಅನ್ನು ಮತ್ತೆ ತೆರೆಯಿರಿ.");
    const {data,error}=await supabaseClient.auth.updateUser({password:p1});
    if(error) throw new Error("Password update ವಿಫಲವಾಗಿದೆ.\n\n"+error.message);
    if(!data?.user) throw new Error("Password update ಆಯಿತು ಎಂದು ದೃಢೀಕರಿಸಲಾಗಲಿಲ್ಲ.");
    showMsg("Password ಯಶಸ್ವಿಯಾಗಿ ಬದಲಾಯಿಸಲಾಗಿದೆ.\n\nಈಗ Login pageಗೆ ಹೋಗಿ ಹೊಸ Password ಬಳಸಿ Login ಮಾಡಿ.","success");
    setTimeout(()=>{window.location.href="login.html"},1800);
  }catch(err){
    console.error("PASSWORD UPDATE ERROR:",err);
    showMsg(err?.message||"Password update error ಬಂದಿದೆ.");
  }finally{
    updateBtn.disabled=false;updateBtn.textContent="Password Update ಮಾಡಿ";
  }
});
</script>
</body>
</html>
