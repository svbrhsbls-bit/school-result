<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Student Result</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:"Noto Sans Kannada","Nirmala UI",Arial,sans-serif;
    background:#eef6fb;
    color:#17324d;
}
.header{
    background:#0b82b8;
    color:#fff;
    text-align:center;
    padding:22px 12px;
}
.header h1{margin:0;font-size:28px}
.header p{margin:7px 0 0;font-size:16px}
.container{max-width:1200px;margin:22px auto;padding:0 14px}
.card{
    background:#fff;
    border-radius:14px;
    box-shadow:0 3px 15px rgba(0,0,0,.10);
    padding:20px;
    margin-bottom:20px;
}
.search-card h2{margin-top:0}
.search-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}
label{display:block;font-weight:700;margin-bottom:7px}
input{
    width:100%;
    padding:12px;
    border:1px solid #b9c8d4;
    border-radius:8px;
    font-size:16px;
}
.button-row{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
button{
    border:0;
    border-radius:8px;
    padding:12px 20px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}
.btn-blue{background:#087fba;color:white}
.btn-gray{background:#5d6870;color:white}
.btn-print{background:#168a55;color:white}
.message{
    margin-top:15px;
    padding:11px 14px;
    border-radius:8px;
    display:none;
    background:#fff3cd;
    color:#765600;
}
.message.show{display:block}
.message.error{background:#fde2e2;color:#9b1c1c}
.message.success{background:#dff5e7;color:#126b38}

.result-head{
    text-align:center;
    border-bottom:2px solid #0b82b8;
    padding-bottom:12px;
    margin-bottom:15px;
}
.result-head h2{margin:0 0 6px}
.student-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    background:#f4f9fc;
    border-radius:10px;
    padding:13px;
    margin-bottom:18px;
}
.info-item{font-size:15px}
.info-item b{color:#075f89}

.exam-title{
    background:#0b82b8;
    color:#fff;
    padding:11px 14px;
    border-radius:8px 8px 0 0;
    font-size:19px;
    font-weight:800;
    margin-top:22px;
}
.exam-status{
    padding:10px 14px;
    background:#fff8e1;
    color:#795b00;
    border:1px solid #f0df9b;
    border-top:0;
}
.table-wrap{overflow-x:auto}
table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}
th,td{
    border:1px solid #ccd8df;
    padding:9px 8px;
    text-align:center;
}
th{
    background:#087fb5;
    color:#fff;
}
td.subject{text-align:left;font-weight:700}
.summary{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-top:14px;
}
.summary-box{
    background:#f3f8fb;
    border:1px solid #d5e3ea;
    border-radius:8px;
    padding:10px;
    text-align:center;
}
.summary-box b{display:block;font-size:18px}
.pass{color:#118044;font-weight:800}
.fail{color:#c02020;font-weight:800}
.pending{color:#a16a00;font-weight:800}

.no-result{
    text-align:center;
    padding:30px;
    color:#666;
}
.loading{text-align:center;padding:25px}

.result-settings-head{
    text-align:center;
}
.result-settings-head .school-name{
    margin:0 0 5px;
    font-size:26px;
    font-weight:800;
}
.result-settings-head .exam-name{
    margin:0 0 4px;
    font-size:21px;
    font-weight:800;
}
.result-settings-head .academic-year{
    margin:0;
    font-size:16px;
    font-weight:700;
}
.teacher-footer{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:42px;
    padding-top:25px;
    page-break-inside:avoid;
}
.teacher-block{
    text-align:center;
    min-height:70px;
    font-weight:700;
}
.teacher-block .role{
    display:block;
    margin-bottom:10px;
    font-size:16px;
}
.teacher-block .name{
    display:block;
    font-size:16px;
    font-weight:800;
}
@media print{
    body{
        background:#fff;
    }

    /* ಮೇಲಿನ website header Print ಆಗಬಾರದು */
    .header{
        display:none !important;
    }

    .no-print{
        display:none !important;
    }

    .container{
        max-width:none;
        margin:0;
        padding:0;
    }

    .card{
        box-shadow:none;
        padding:0;
    }

        break-after:avoid;
    }

    .table-wrap{
        overflow:visible;
    }

    table{
        min-width:0;
        font-size:11px;
    }

    th,td{
        padding:5px;
    }
}
    .teacher-footer{margin-top:35px}
}


.dob-wrap{position:relative;width:100%}
#dob{width:100%;padding-right:48px;letter-spacing:.5px}
.dob-calendar{
    position:absolute;right:5px;top:50%;transform:translateY(-50%);
    width:38px;height:36px;border:0;background:transparent;
    cursor:pointer;font-size:20px;line-height:1
}
.dob-picker{
    position:absolute!important;width:1px!important;height:1px!important;
    opacity:0!important;pointer-events:none!important
}
.dob-help{display:block;margin-top:4px;font-size:11px;color:#777}

    .search-grid,.student-info{grid-template-columns:1fr}

}

    body{background:#fff}
    .no-print{display:none!important}
    .container{max-width:none;margin:0;padding:0}
    .card{box-shadow:none;padding:0}
    .exam-title{break-after:avoid}
    .table-wrap{overflow:visible}
    table{min-width:0;font-size:11px}
    th,td{padding:5px}

</style>
</head>

<body>

<div class="header">
    <h1 id="schoolNameHeader">ಶ್ರೀ ವೀರಬಲ್ಲಾಳ ಗ್ರಾಮಾಂತರ ಪ್ರೌಢಶಾಲೆ</h1>
    <p id="schoolAddressHeader">ಬಲ್ಲಾಳಸಮುದ್ರ, ಹೊಸದುರ್ಗ ತಾಲ್ಲೂಕು, ಚಿತ್ರದುರ್ಗ ಜಿಲ್ಲೆ</p>
</div>

<div class="container">

    <div class="card search-card no-print">
        <h2>📘 ವಿದ್ಯಾರ್ಥಿ ಫಲಿತಾಂಶ</h2>
        <p>Roll Number ಮತ್ತು Date of Birth ನಮೂದಿಸಿ ಫಲಿತಾಂಶ ವೀಕ್ಷಿಸಿ.</p>

        <div class="search-grid">
            <div>
                <label for="rollNumber">Roll Number</label>
                <input id="rollNumber" type="text"
                       autocomplete="off"
                       placeholder="Roll Number ನಮೂದಿಸಿ">
            </div>

            <div>
                <label for="dob">Date of Birth</label>
                <div class="dob-wrap">
                    <input id="dob"
                           type="text"
                           inputmode="numeric"
                           autocomplete="off"
                           maxlength="10"
                           placeholder="DD MM YYYY"
                           aria-label="Date of Birth">
                    <button type="button"
                            class="dob-calendar"
                            onclick="openDobCalendar()"
                            aria-label="Calendar">📅</button>
                    <input id="dobPicker"
                           type="date"
                           class="dob-picker"
                           tabindex="-1"
                           aria-hidden="true">
                </div>
                <small class="dob-help">ಉದಾ: 28 08 2026</small>
            </div>
        </div>

        <div class="button-row">
            <button class="btn-blue" onclick="viewResult()">🔍 View Result</button>
            <button class="btn-gray" onclick="clearResult()">Clear</button>
        </div>

        <div id="message" class="message"></div>
    </div>

    <div id="resultArea"></div>
</div>

<script>
/* =========================================================
   SUPABASE CONNECTION
   Same working connection as Students Database / Marks Entry
========================================================= */
const SUPABASE_URL =
    "https://sozlvjvqrgpaabnvjvxe.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

/* =========================================================
   HELPERS
========================================================= */
function $(id){
    return document.getElementById(id);
}

function esc(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function normalizeDate(value){
    if(!value) return "";

    const s=String(value).trim();

    if(/^\d{4}-\d{2}-\d{2}$/.test(s))
        return s;

    const d=new Date(s);

    if(isNaN(d.getTime()))
        return s.substring(0,10);

    return [
        d.getFullYear(),
        String(d.getMonth()+1).padStart(2,"0"),
        String(d.getDate()).padStart(2,"0")
    ].join("-");
}

function formatDate(value){
    const s=normalizeDate(value);
    if(!s) return "-";

    const p=s.split("-");
    if(p.length===3)
        return `${p[2]}-${p[1]}-${p[0]}`;

    return s;
}

function normalizeClass(value){
    let v=String(value ?? "")
        .trim()
        .toLowerCase();

    v=v.replace(/೧೦/g,"10")
        .replace(/೯/g,"9")
        .replace(/೮/g,"8");

    if(v.includes("10")) return "10";
    if(v.includes("9")) return "9";
    if(v.includes("8")) return "8";

    return v;
}

function getClass(student){
    return normalizeClass(
        student.class_name ??
        student.class ??
        ""
    );
}

function getStudentName(student){
    return student.student_name ??
           student.name ??
           "";
}

function getDivision(student){
    return String(
        student.division ??
        student.section_name ??
        student.section ??
        ""
    ).trim().toUpperCase();
}

/* Current Marks Entry rules */
function isKannadaSubject(subject){
    const name = String(
        subject?.subject_name ??
        subject?.name ??
        ""
    ).trim().toLowerCase();

    /* Kannada is identified by subject name, NOT by subject_code.
       Therefore changing the code in Subject Master will never
       break the Kannada maximum-mark rule. */
    return name === "ಕನ್ನಡ" ||
           name.includes("kannada");
}

function getMaxMarks(student, examType, subject){
    const cls=getClass(student);
    const kannada=isKannadaSubject(subject);

    if(examType==="ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ"){
        if(cls==="8") return 50;

        if(cls==="9" || cls==="10")
            return kannada ? 100 : 80;
    }

    if(examType==="ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ"){
        if(cls==="8") return 100;

        if(cls==="9" || cls==="10")
            return kannada ? 125 : 100;
    }

    return Number(subject.max_marks || 100);
}

function grade(mark,max){
    if(mark===null || mark===undefined || mark==="")
        return "-";

    const n=Number(mark);

    if(!Number.isFinite(n) || !max)
        return "-";

    const p=n/max*100;

    if(p>=90) return "A+";
    if(p>=70) return "A";
    if(p>=50) return "B+";
    if(p>=30) return "B";
    return "C";
}

function overallGrade(percent){
    if(percent>=90) return "A+";
    if(percent>=70) return "A";
    if(percent>=50) return "B+";
    if(percent>=30) return "B";
    return "C";
}

function passMark(student,percent){
    return getClass(student)==="8"
        ? percent>=30
        : percent>=35;
}

function showMessage(text,type="info"){
    const box=$("message");
    box.textContent=text;
    box.className="message show "+type;
}

function hideMessage(){
    $("message").className="message";
    $("message").textContent="";
}

function clearResult(){
    $("rollNumber").value="";
    $("dob").value="";
    $("resultArea").innerHTML="";
    hideMessage();
}

/* =========================================================
   SETTINGS
   Only presentation/header/footer values are loaded here.
   Existing result/marks logic is unchanged.
========================================================= */
let appSettings = {
    school_name: "",
    school_address: "",
    exam_name: "",
    head_teacher_name: "",
    class_teacher_8: "",
    class_teacher_9: "",
    class_teacher_10: "",
    academic_year: "2026-27"
};

async function loadAppSettings(){
    try{
        /*
         * Settings page saves ONE record with id = 1.
         * We intentionally select the complete row and use the first
         * available record, so the Result page does not fail silently
         * if the id value was changed/recreated.
         */
        const {data,error} = await db
            .from("settings")
            .select("*")
            .order("id",{ascending:true})
            .limit(1)
            .maybeSingle();

        if(error) throw error;

        if(data){
            appSettings = {
                school_name: String(data.school_name ?? "").trim(),
                school_address: String(data.school_address ?? "").trim(),
                exam_name: String(data.exam_name ?? "").trim(),
                head_teacher_name: String(data.head_teacher_name ?? "").trim(),
                class_teacher_8: String(data.class_teacher_8 ?? "").trim(),
                class_teacher_9: String(data.class_teacher_9 ?? "").trim(),
                class_teacher_10: String(data.class_teacher_10 ?? "").trim(),
                academic_year: String(
                    data.academic_year ??
                    data.school_year ??
                    data.academicYear ??
                    "2026-27"
                ).trim()
            };

            const school = $("schoolNameHeader");
            const address = $("schoolAddressHeader");

            if(school)
                school.textContent =
                    appSettings.school_name || "ಶಾಲೆಯ ಹೆಸರು";

            if(address && appSettings.school_address)
                address.textContent = appSettings.school_address;

            console.log("Settings loaded:", appSettings);
        }else{
            console.warn("Settings record not found.");
        }

    }catch(error){
        console.error("Settings Load Error:",error);
    }
}

function getClassTeacherForStudent(student){
    /*
     * The Students table may store class as 8, 8th, 8ನೇ ತರಗತಿ,
     * etc. getClass() already normalizes the value.
     */
    const cls = String(getClass(student) || "")
        .trim()
        .toLowerCase();

    if(cls.includes("8"))
        return appSettings.class_teacher_8;

    if(cls.includes("9"))
        return appSettings.class_teacher_9;

    if(cls.includes("10"))
        return appSettings.class_teacher_10;

    return "";
}

function getHeadTeacherName(){
    return String(appSettings.head_teacher_name || "").trim();
}

function examDisplayName(examType){
    if(examType === "HALF_YEARLY") return "ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ";
    if(examType === "ANNUAL") return "ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ";
    return examType || "";
}

/* Settingsನಲ್ಲಿ ಪರೀಕ್ಷೆಯ ಹೆಸರು ಇದ್ದರೆ headerನಲ್ಲಿ ಅದನ್ನೇ ತೋರಿಸಿ.
   Settings tableನಲ್ಲಿ exam_name column ಇಲ್ಲದಿದ್ದರೂ Result page error ಆಗಬಾರದು. */
function getExamHeaderName(results){
    const configured = String(appSettings.exam_name || "").trim();
    if(configured) return configured;

    return (results || [])
        .map(r => examDisplayName(r.exam_type))
        .filter(Boolean)
        .join(" / ");
}

/* =========================================================
   VIEW RESULT
========================================================= */

function formatDobInput(value){
    const digits=String(value||"").replace(/\D/g,"").slice(0,8);
    if(digits.length>4) return digits.slice(0,2)+" "+digits.slice(2,4)+" "+digits.slice(4);
    if(digits.length>2) return digits.slice(0,2)+" "+digits.slice(2);
    return digits;
}
$("dob").addEventListener("input",function(){
    this.value=formatDobInput(this.value);
});
function openDobCalendar(){
    const picker=$("dobPicker");
    const text=$("dob").value.trim();
    const m=text.match(/^(\d{2})\s(\d{2})\s(\d{4})$/);
    if(m) picker.value=`${m[3]}-${m[2]}-${m[1]}`;
    if(typeof picker.showPicker==="function") picker.showPicker();
    else picker.click();
}
$("dobPicker").addEventListener("change",function(){
    if(!this.value) return;
    const p=this.value.split("-");
    if(p.length===3) $("dob").value=`${p[2]} ${p[1]} ${p[0]}`;
});

async function viewResult(){

    hideMessage();

    await loadAppSettings();

    const roll=$("rollNumber").value.trim();
    const dobText=$("dob").value.trim();
    const dobMatch=dobText.match(/^(\d{2})\s(\d{2})\s(\d{4})$/);
    const dob=dobMatch ? `${dobMatch[3]}-${dobMatch[2]}-${dobMatch[1]}` : dobText;

    if(!roll){
        showMessage("Roll Number ನಮೂದಿಸಿ.","error");
        $("rollNumber").focus();
        return;
    }

    if(!dob){
        showMessage("Date of Birth ಆಯ್ಕೆ ಮಾಡಿ.","error");
        $("dob").focus();
        return;
    }

    $("resultArea").innerHTML =
        `<div class="card loading">⏳ ಫಲಿತಾಂಶ ಹುಡುಕಲಾಗುತ್ತಿದೆ...</div>`;

    try{

        /* ---------------------------------------------
           1. Find student
           Mobile field is NOT selected/displayed.
        --------------------------------------------- */
        const {data:students,error:studentError}=await db
            .from("students")
            .select("*")
            .eq("roll_no",roll);

        if(studentError)
            throw studentError;

        const wantedDob=normalizeDate(dob);

        const matches=(students || []).filter(s =>
            normalizeDate(s.dob)===wantedDob
        );

        if(!matches.length){
            $("resultArea").innerHTML="";
            showMessage(
                "ಈ Roll Number ಮತ್ತು Date of Birthಗೆ ವಿದ್ಯಾರ್ಥಿ ದಾಖಲೆ ಸಿಗಲಿಲ್ಲ.",
                "error"
            );
            return;
        }

        if(matches.length>1){
            $("resultArea").innerHTML="";
            showMessage(
                "ಈ Roll Number + DOBಗೆ ಒಂದಕ್ಕಿಂತ ಹೆಚ್ಚು ದಾಖಲೆಗಳಿವೆ. Students Database ಪರಿಶೀಲಿಸಿ.",
                "error"
            );
            return;
        }

        const student=matches[0];

        /* ---------------------------------------------
           2. Load subjects for student's class
        --------------------------------------------- */
        const className=student.class_name;
        const normalizedStudentClass=normalizeClass(className);

        /* Load active Subject Master rows and match class after
           normalizing 8 / 9 / 10. This prevents Kannada/English/
           other codes from being lost because of different class
           text such as 8, 8th, 8ನೇ ತರಗತಿ, etc. */
        const {data:allSubjectRows,error:subjectError}=await db
            .from("subjects")
            .select("*")
            .eq("is_active",true)
            .order("display_order",{ascending:true});

        if(subjectError)
            throw subjectError;

        const subjects=(allSubjectRows || []).filter(s =>
            normalizeClass(s.class_name) === normalizedStudentClass
        );

        if(subjectError)
            throw subjectError;

        if(!subjects || !subjects.length)
            throw new Error(
                `${className}ನೇ ತರಗತಿಗೆ subjects ಸಿಗಲಿಲ್ಲ.`
            );

        /* ---------------------------------------------
           SUBJECT MASTER → STUDENT RESULT — LIVE CODE

           IMPORTANT:
           1. Subject Code is NEVER hard-coded here.
           2. The value displayed in Student Result is always
              subjects.subject_code from the CURRENT Subject Master row.
           3. If old duplicate rows exist for the same subject,
              the row with the highest numeric id is treated as
              the latest/current Subject Master row.
           4. Old subject IDs are retained only for finding marks
              that were already entered earlier.
        --------------------------------------------- */
        const normalizeSubjectName = (name) =>
            String(name || "")
                .trim()
                .replace(/\s+/g, " ")
                .toLowerCase();

        /*
           SUBJECT MASTER CURRENT ROWS ONLY

           Your Subject Master table stores one row per subject and
           uses display_order (1,2,3...) to define the subject list.
           Older rows with old codes/names may still exist in Supabase.

           Therefore we select ONLY the latest row for each
           display_order. This is important because grouping by
           subject_name is not safe: the old record may say "ಇಂಗ್ಲಿಷ್"
           while the current Subject Master record says "English".

           Example:
             old  -> 02E / ಇಂಗ್ಲಿಷ್
             current -> 31E / English
           Result must show ONLY 31E / English.
        */
        const subjectGroups = new Map();

        (subjects || []).forEach(subject => {
            const order = Number(subject.display_order);

            /*
              display_order is the identity of the Subject Master
              position. If it is missing, use subject name only as
              a fallback so the record is not lost.
            */
            const key = Number.isFinite(order) && order > 0
                ? `ORDER_${order}`
                : `NAME_${normalizeSubjectName(subject.subject_name)}`;

            if(!subjectGroups.has(key))
                subjectGroups.set(key, []);

            subjectGroups.get(key).push(subject);
        });

        const uniqueSubjects = [];

        subjectGroups.forEach(group => {
            /*
              Latest Subject Master row = highest numeric id.
              This ensures an old 02E row does not appear together
              with the current 31E row.
            */
            group.sort((a,b) => {
                const aid = Number(a.id);
                const bid = Number(b.id);

                if(Number.isFinite(aid) && Number.isFinite(bid) && aid !== bid)
                    return bid - aid;

                const au = new Date(
                    a.updated_at || a.created_at || 0
                ).getTime();

                const bu = new Date(
                    b.updated_at || b.created_at || 0
                ).getTime();

                if(Number.isFinite(au) && Number.isFinite(bu) && au !== bu)
                    return bu - au;

                return 0;
            });

            const current = {...group[0]};

            /*
              Keep old IDs only for retrieving previously saved marks.
              They are NEVER rendered as subjects/codes.
            */
            current._allSubjectIds = group
                .map(x => x.id)
                .filter(id => id !== null && id !== undefined);

            uniqueSubjects.push(current);
        });

        uniqueSubjects.sort((a,b) => {
            const ao = Number(a.display_order);
            const bo = Number(b.display_order);

            if(Number.isFinite(ao) && Number.isFinite(bo) && ao !== bo)
                return ao - bo;

            return Number(a.id || 0) - Number(b.id || 0);
        });

        /*
          FINAL RESULT LIST:
          Only the current Subject Master row for each display_order.
          Old subject codes are not displayed.
        */
        const subjectsForResult = uniqueSubjects;

        /* ---------------------------------------------
           3. Load only published results
           Existing database uses exam_results.exam_type
           and exam_results.published.
        --------------------------------------------- */
        const examTypes=[
            "HALF_YEARLY",
            "ANNUAL"
        ];

        const {data:results,error:resultError}=await db
            .from("exam_results")
            .select("id,student_id,exam_type,published")
            .eq("student_id",student.id)
            .in("exam_type",examTypes)
            .eq("published",true)
            .order("id",{ascending:true});

        if(resultError)
            throw resultError;

        /* ---------------------------------------------
           4. Load marks for published results
        --------------------------------------------- */
        const resultIds=(results || []).map(r=>r.id);

        let marks=[];

        if(resultIds.length){

            const {data:markRows,error:markError}=await db
                .from("result_marks")
                .select("exam_result_id,subject_id,marks")
                .in("exam_result_id",resultIds);

            if(markError)
                throw markError;

            marks=markRows || [];
        }

        const marksMap={};

        marks.forEach(m=>{
            marksMap[
                `${m.exam_result_id}_${m.subject_id}`
            ]=m.marks;
        });

        /* ---------------------------------------------
           5. Render
        --------------------------------------------- */
        renderResult(
            student,
            subjectsForResult,
            results || [],
            marksMap
        );

    }catch(error){

        console.error("Student Result Error:",error);

        $("resultArea").innerHTML="";

        showMessage(
            "Result Load Error: " +
            (error.message || String(error)),
            "error"
        );
    }
}

/* =========================================================
   RENDER RESULT
========================================================= */
function renderResult(student,subjects,results,marksMap){

    let html=`
    <div class="card">

        <div class="result-head result-settings-head">
            <h2 class="school-name">
                ${esc(appSettings.school_name || "ಶಾಲೆಯ ಹೆಸರು")}
            </h2>
            <div class="exam-name">
                ${esc(getExamHeaderName(results))}
            </div>
            <div class="academic-year">
                ಶೈಕ್ಷಣಿಕ ವರ್ಷ - ${esc(appSettings.academic_year || "2026-27")}
            </div>
        </div>

        <div class="student-info">

            <div class="info-item">
                <b>Roll No:</b>
                ${esc(student.roll_no)}
            </div>

            <div class="info-item">
                <b>ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು:</b>
                ${esc(getStudentName(student))}
            </div>

            <div class="info-item">
                <b>ತರಗತಿ:</b>
                ${esc(student.class_name)}
            </div>

            <div class="info-item">
                <b>ವಿಭಾಗ:</b>
                ${esc(getDivision(student))}
            </div>

            <div class="info-item">
                <b>DOB:</b>
                ${esc(formatDate(student.dob))}
            </div>

            <div class="info-item">
                <b>SATS No:</b>
                ${esc(student.sats_no)}
            </div>

        </div>
    `;

    if(!results.length){

        html+=`
        <div class="no-result">
            <h3>📢 ಫಲಿತಾಂಶ ಇನ್ನೂ ಪ್ರಕಟಿಸಲಾಗಿಲ್ಲ</h3>
            <p>ಶಾಲೆಯಿಂದ ಫಲಿತಾಂಶ ಪ್ರಕಟಿಸಿದ ನಂತರ ಇಲ್ಲಿ ಕಾಣಿಸುತ್ತದೆ.</p>
        </div>
        `;

    }else{

        results.forEach(result=>{
            html+=renderExam(
                student,
                subjects,
                result,
                marksMap
            );
        });

    }

    html+=`
        <div class="teacher-footer">
            <div class="teacher-block">
                <span class="role">Class Teacher</span>
                <span class="name">${esc(getClassTeacherForStudent(student) || " ")}</span>
            </div>
            <div class="teacher-block">
                <span class="role">Head Teacher</span>
                <span class="name">${esc(getHeadTeacherName() || " ")}</span>
            </div>
        </div>

        <div class="button-row no-print">
            <button class="btn-print"
                    onclick="window.print()">
                🖨️ Print Result
            </button>
        </div>
    </div>
    `;

    $("resultArea").innerHTML=html;
}

/* =========================================================
   RENDER ONE EXAM
========================================================= */
function renderExam(student,subjects,result,marksMap){

    let total=0;
    let maximum=0;
    let entered=0;

    let rows="";

    subjects.forEach(subject=>{

        /*
           Find marks using the selected subject ID first, then
           fall back to any duplicate/legacy subject IDs belonging
           to the same subject name. This keeps the display at one
           subject while preserving marks already entered earlier.
        */
        const subjectIds =
            Array.isArray(subject._allSubjectIds) && subject._allSubjectIds.length
                ? subject._allSubjectIds
                : [subject.id];

        let value;
        for(const subjectId of subjectIds){
            const candidate = marksMap[`${result.id}_${subjectId}`];
            if(candidate !== null && candidate !== undefined && candidate !== ""){
                value = candidate;
                break;
            }
        }

        const max=
            getMaxMarks(
                student,
                result.exam_type,
                subject
            );

        maximum+=max;

        const hasMark=
            value!==null &&
            value!==undefined &&
            value!=="";

        if(hasMark){
            total+=Number(value);
            entered++;
        }

        const subjectNameKey = String(
            subject.subject_name ?? ""
        ).trim().toLowerCase();

        const subjectNameMap = {
            "ಕನ್ನಡ": "ಕನ್ನಡ / KANNADA",
            "kannada": "ಕನ್ನಡ / KANNADA",
            "ಇಂಗ್ಲಿಷ್": "ಇಂಗ್ಲಿಷ್ / ENGLISH",
            "english": "ಇಂಗ್ಲಿಷ್ / ENGLISH",
            "ಹಿಂದಿ": "ಹಿಂದಿ / HINDI",
            "hindi": "ಹಿಂದಿ / HINDI",
            "ಗಣಿತ": "ಗಣಿತ / MATHEMATICS",
            "mathematics": "ಗಣಿತ / MATHEMATICS",
            "math": "ಗಣಿತ / MATHEMATICS",
            "maths": "ಗಣಿತ / MATHEMATICS",
            "ವಿಜ್ಞಾನ": "ವಿಜ್ಞಾನ / SCIENCE",
            "science": "ವಿಜ್ಞಾನ / SCIENCE",
            "ಸಮಾಜ ವಿಜ್ಞಾನ": "ಸಮಾಜ ವಿಜ್ಞಾನ / SOCIAL SCIENCE",
            "social science": "ಸಮಾಜ ವಿಜ್ಞಾನ / SOCIAL SCIENCE",
            "social studies": "ಸಮಾಜ ವಿಜ್ಞಾನ / SOCIAL SCIENCE"
        };

        const displaySubjectName =
            subjectNameMap[subjectNameKey] ||
            subject.subject_name ||
            "-";

        rows+=`
        <tr>
            <td class="subject">
                ${esc(displaySubjectName)}
            </td>

            <td>
                ${esc(
                    String(
                        subject.subject_code ??
                        subject.code ??
                        ""
                    ).trim() || "-"
                )}
            </td>

            <td>
                ${hasMark ? esc(value) : "-"}
            </td>

            <td>${max}</td>

            <td>
                ${hasMark ? grade(value,max) : "-"}
            </td>
        </tr>
        `;
    });

    const percentage=
        maximum ? total/maximum*100 : 0;

    const finalGrade=
        entered
        ? overallGrade(percentage)
        : "-";

    const resultText=
        entered===0
        ? "PENDING"
        : passMark(student,percentage)
            ? "PASS"
            : "FAIL";

    const resultClass=
        resultText==="PASS"
        ? "pass"
        : resultText==="FAIL"
            ? "fail"
            : "pending";

    return `
        <div class="exam-title">
            📝 ${esc(examDisplayName(result.exam_type))}
        </div>

        <div class="exam-status">
            ಫಲಿತಾಂಶ: <b class="${resultClass}">
                ${resultText}
            </b>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ವಿಷಯ</th>
                        <th>ವಿಷಯ ಕೋಡ್</th>
                        <th>ಅಂಕ</th>
                        <th>ಗರಿಷ್ಠ</th>
                        <th>Grade</th>
                    </tr>
                </thead>

                <tbody>
                    ${rows}
                </tbody>
            </table>
        </div>

        <div class="summary">

            <div class="summary-box">
                ಒಟ್ಟು ಅಂಕ
                <b>${total.toFixed(0)}</b>
            </div>

            <div class="summary-box">
                ಗರಿಷ್ಠ ಅಂಕ
                <b>${maximum.toFixed(0)}</b>
            </div>

            <div class="summary-box">
                ಶೇಕಡಾವಾರು
                <b>${percentage.toFixed(2)}%</b>
            </div>

            <div class="summary-box">
                ಒಟ್ಟು ಶ್ರೇಣಿ
                <b>${finalGrade}</b>
            </div>

            <div class="summary-box">
                ಫಲಿತಾಂಶ
                <b class="${resultClass}">
                    ${resultText}
                </b>
            </div>

        </div>
    `;
}

    if(e.key==="Enter") viewResult();
});

$("dob").addEventListener("keydown",function(e){
    if(e.key==="Enter") viewResult();
});
