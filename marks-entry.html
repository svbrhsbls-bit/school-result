<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marks Entry</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Kannada",sans-serif;
    background:#eef5fb;
    color:#173b63;
}

.header{
    background:linear-gradient(135deg,#1268a8,#1598cc);
    color:white;
    text-align:center;
    padding:25px 15px;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    margin:7px 0 0;
}

.container{
    width:96%;
    max-width:1600px;
    margin:25px auto;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.filters{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

select{
    width:100%;
    padding:12px;
    border:1px solid #cbd8e5;
    border-radius:8px;
    font-size:16px;
    background:white;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 18px;
    margin:5px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.load{
    background:#1479b9;
    color:white;
}

.save{
    background:#168b49;
    color:white;
}

.excel{
    background:#198754;
    color:white;
}

.template{
    background:#7044b8;
    color:white;
}

.print{
    background:#343a40;
    color:white;
}

.clear{
    background:#6c757d;
    color:white;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    font-weight:bold;
}

.success{
    display:block;
    background:#dff5e6;
    color:#146c37;
}

.error{
    display:block;
    background:#ffe1e1;
    color:#a30000;
}

.info{
    display:block;
    background:#e3f1ff;
    color:#07558c;
}

.info-bar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:15px;
}

.info-item{
    background:#eaf5fc;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1300px;
}

th{
    background:#126da9;
    color:white;
    border:1px solid #0d5c8d;
    padding:10px 7px;
    text-align:center;
    white-space:nowrap;
}

td{
    border:1px solid #d5e0e8;
    padding:7px;
    text-align:center;
}

.student-name{
    text-align:left;
    font-weight:bold;
    min-width:200px;
}

.roll{
    font-weight:bold;
    min-width:70px;
}

.subject-head{
    min-width:145px;
}

.subject-code{
    display:block;
    font-size:12px;
    margin-top:3px;
}

.max{
    display:block;
    font-size:11px;
    margin-top:3px;
}

.mark{
    width:70px;
    padding:7px;
    text-align:center;
    border:1px solid #bccbd7;
    border-radius:6px;
    font-size:15px;
}

.mark:focus{
    outline:none;
    border:2px solid #1484c4;
}

.grade{
    display:block;
    margin-top:5px;
    font-weight:bold;
    font-size:15px;
}

.grade-a-plus{
    color:#00813f;
}

.grade-a{
    color:#1471ac;
}

.grade-b-plus{
    color:#9b7100;
}

.grade-b{
    color:#d05d00;
}

.grade-c,
.grade-f{
    color:#c52222;
}

@media(max-width:800px){

    .filters{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:24px;
    }
}

@media print{

    body{
        background:white;
    }

    .header{
        background:white !important;
        color:black !important;
        padding:10px;
    }

    .no-print{
        display:none !important;
    }

    .card{
        box-shadow:none;
        padding:5px;
    }

    .container{
        width:100%;
        margin:0;
    }

    table{
        min-width:0;
        font-size:9px;
    }

    th,td{
        padding:4px;
    }

    .mark{
        border:0;
        width:45px;
        padding:2px;
    }

    .grade{
        margin-top:2px;
    }
}

</style>
</head>

<body>


<div class="header">

    <h1>📝 Marks Entry</h1>

    <p>
        ಶಾಲಾ ಫಲಿತಾಂಶ ನಿರ್ವಹಣಾ ವ್ಯವಸ್ಥೆ
    </p>

</div>


<div class="container">


<!-- =====================================================
     FILTER
===================================================== -->

<div class="card">

    <div class="filters">


        <div>

            <label>
                ತರಗತಿ
            </label>

            <select id="classSelect">

                <option value="">
                    -- ತರಗತಿ ಆಯ್ಕೆ ಮಾಡಿ --
                </option>

                <option value="8">
                    8ನೇ ತರಗತಿ
                </option>

                <option value="9">
                    9ನೇ ತರಗತಿ
                </option>

                <option value="10">
                    10ನೇ ತರಗತಿ
                </option>

            </select>

        </div>



        <div>

            <label>
                ವಿಭಾಗ
            </label>

            <select id="divisionSelect">

                <option value="">
                    -- ವಿಭಾಗ ಆಯ್ಕೆ ಮಾಡಿ --
                </option>

                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>

            </select>

        </div>



        <div>

            <label>
                ಪರೀಕ್ಷೆ
            </label>

            <select id="examSelect">

                <option value="">
                    -- ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ --
                </option>

                <option value="half_yearly">
                    ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ
                </option>

                <option value="annual">
                    ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ
                </option>

            </select>

        </div>

    </div>



    <div class="no-print">

        <button
            class="load"
            onclick="loadData()">

            🔄 Students Load

        </button>


        <button
            class="excel"
            onclick="document.getElementById('excelFile').click()">

            📥 Excel Upload

        </button>


        <input
            type="file"
            id="excelFile"
            accept=".xlsx,.xls,.csv"
            style="display:none"
            onchange="uploadExcel(event)"
        >


        <button
            class="template"
            onclick="downloadTemplate()">

            📄 Excel Template

        </button>


        <button
            class="print"
            onclick="window.print()">

            🖨️ Print

        </button>


        <button
            class="clear"
            onclick="clearPage()">

            ✖ Clear

        </button>

    </div>


    <div
        id="message"
        class="message">

    </div>

</div>



<!-- =====================================================
     MARKS
===================================================== -->

<div class="card">

    <div
        id="infoBar"
        class="info-bar">
    </div>


    <div
        id="tableArea">

        <div
            style="text-align:center;padding:35px;color:#777">

            ತರಗತಿ, ವಿಭಾಗ ಮತ್ತು ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ
            ನಂತರ <b>Students Load</b> ಒತ್ತಿರಿ.

        </div>

    </div>


    <div class="no-print">

        <button
            class="save"
            onclick="saveMarks()">

            💾 Save All Marks

        </button>


        <button
            class="excel"
            onclick="downloadExcel()">

            📊 Excel Download

        </button>


        <button
            class="print"
            onclick="window.print()">

            🖨️ Print Marks Sheet

        </button>

    </div>

</div>

</div>



<script>

/* =========================================================
   SUPABASE
   ಇಲ್ಲಿ supabaseClient ಎಂಬ variable ಬಳಸಲಾಗಿಲ್ಲ.
========================================================= */

const SB_URL =
"https://sozljvqrpaabnvjvxe.supabase.co";

const SB_KEY =
"sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";


/*
   ಒಂದೇ Supabase connection.
   ಹೆಸರು: sb
*/

const sb =
window.supabase.createClient(
    SB_URL,
    SB_KEY
);


/* =========================================================
   SUBJECTS
========================================================= */

const SUBJECTS = [

    {
        code:"01K",
        name:"ಕನ್ನಡ"
    },

    {
        code:"31E",
        name:"ಇಂಗ್ಲಿಷ್"
    },

    {
        code:"61H",
        name:"ಹಿಂದಿ"
    },

    {
        code:"81K",
        name:"ಗಣಿತ"
    },

    {
        code:"83K",
        name:"ವಿಜ್ಞಾನ"
    },

    {
        code:"85K",
        name:"ಸಮಾಜ ವಿಜ್ಞಾನ"
    }

];


let students = [];

let subjects = [];

let marks = {};

let currentExam = "";


/* =========================================================
   MESSAGE
========================================================= */

function message(text,type){

    const box =
        document.getElementById("message");

    box.className =
        "message " + type;

    box.textContent =
        text;
}


/* =========================================================
   MAX MARKS
========================================================= */

function maxMarks(classNo,exam,code){

    classNo =
        String(classNo);


    /* 8TH */

    if(classNo === "8"){

        if(exam === "half_yearly")
            return 50;

        if(exam === "annual")
            return 100;

    }


    /* 9TH / 10TH */

    if(
        classNo === "9" ||
        classNo === "10"
    ){

        if(exam === "half_yearly"){

            if(code === "01K")
                return 100;

            return 80;

        }


        if(exam === "annual"){

            if(code === "01K")
                return 125;

            return 100;

        }

    }


    return 100;
}


/* =========================================================
   GRADE
========================================================= */

function getGrade(mark,max){

    if(
        mark === "" ||
        mark === null ||
        mark === undefined
    ){

        return "";

    }


    const m =
        Number(mark);


    if(isNaN(m))
        return "";


    if(m < 0 || m > max)
        return "";


    const p =
        (m / max) * 100;


    if(p >= 90)
        return "A+";

    if(p >= 75)
        return "A";

    if(p >= 60)
        return "B+";

    if(p >= 50)
        return "B";

    if(p >= 35)
        return "C";

    return "F";
}


/* =========================================================
   LOAD STUDENTS
========================================================= */

async function loadData(){

    const classNo =
        document.getElementById(
            "classSelect"
        ).value;


    const division =
        document.getElementById(
            "divisionSelect"
        ).value;


    const exam =
        document.getElementById(
            "examSelect"
        ).value;


    if(
        !classNo ||
        !division ||
        !exam
    ){

        message(
            "ದಯವಿಟ್ಟು ತರಗತಿ, ವಿಭಾಗ ಮತ್ತು ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ.",
            "error"
        );

        return;
    }


    currentExam =
        exam;


    message(
        "ವಿದ್ಯಾರ್ಥಿಗಳ ಮಾಹಿತಿ Load ಆಗುತ್ತಿದೆ...",
        "info"
    );


    try{

        /*
           Students table
        */

        const result =
            await sb
            .from("students")
            .select("*")
            .eq(
                "class_name",
                classNo
            )
            .eq(
                "division",
                division
            )
            .order(
                "roll_no",
                {
                    ascending:true
                }
            );


        if(result.error){

            throw result.error;

        }


        students =
            result.data || [];


        if(
            students.length === 0
        ){

            document.getElementById(
                "tableArea"
            ).innerHTML = `

                <div
                    style="
                    text-align:center;
                    padding:35px;
                    color:#c00;
                    font-weight:bold;
                    "
                >

                    ಈ ತರಗತಿ ಮತ್ತು ವಿಭಾಗದಲ್ಲಿ
                    ವಿದ್ಯಾರ್ಥಿಗಳು ಕಂಡುಬಂದಿಲ್ಲ.

                </div>

            `;

            message(
                "ವಿದ್ಯಾರ್ಥಿಗಳು ಕಂಡುಬಂದಿಲ್ಲ.",
                "error"
            );

            return;

        }


        /*
           Subjects ಅನ್ನು Subject Master table
           ನಿಂದ Load ಮಾಡಲು ಪ್ರಯತ್ನಿಸುತ್ತದೆ.
        */

        const subjectResult =
            await sb
            .from("subjects")
            .select("*")
            .eq(
                "class_name",
                classNo
            )
            .order(
                "display_order",
                {
                    ascending:true
                }
            );


        if(
            subjectResult.error ||
            !subjectResult.data ||
            subjectResult.data.length === 0
        ){

            /*
               Subject Master ಸಿಗದಿದ್ದರೆ
               ನಮ್ಮ fixed subjects ಬಳಸುತ್ತದೆ.
            */

            subjects =
                SUBJECTS.map(s => ({

                    code:s.code,

                    name:s.name,

                    max:maxMarks(
                        classNo,
                        exam,
                        s.code
                    )

                }));

        }
        else{

            /*
               Subject Master data ಇದ್ದರೆ
               codes ಸರಿಯಾಗಿದ್ದರೆ ಅದನ್ನು ಬಳಸುತ್ತದೆ.
            */

            const master =
                subjectResult.data;


            subjects =
                SUBJECTS.map(fixed => {

                    const found =
                        master.find(
                            x =>
                                String(
                                    x.subject_code || ""
                                ).toUpperCase()
                                ===
                                fixed.code
                        );


                    return {

                        code:fixed.code,

                        name:
                            found
                            ?
                            (
                                found.subject_name ||
                                fixed.name
                            )
                            :
                            fixed.name,

                        max:
                            maxMarks(
                                classNo,
                                exam,
                                fixed.code
                            )

                    };

                });

        }


        marks = {};


        render();


        message(
            `${students.length} ವಿದ್ಯಾರ್ಥಿಗಳು Load ಆಗಿದ್ದಾರೆ.`,
            "success"
        );

    }
    catch(error){

        console.error(
            "STUDENTS LOAD ERROR:",
            error
        );


        message(
            "Students Load ಸಮಸ್ಯೆ: " +
            (
                error.message ||
                error
            ),
            "error"
        );

    }

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const classNo =
        document.getElementById(
            "classSelect"
        ).value;


    const division =
        document.getElementById(
            "divisionSelect"
        ).value;


    const exam =
        document.getElementById(
            "examSelect"
        ).value;


    let info = "";

    info += `
        <div class="info-item">
            ತರಗತಿ: ${classNo}
        </div>
    `;

    info += `
        <div class="info-item">
            ವಿಭಾಗ: ${division}
        </div>
    `;

    info += `
        <div class="info-item">
            ಪರೀಕ್ಷೆ: ${examText(exam)}
        </div>
    `;

    info += `
        <div class="info-item">
            ವಿದ್ಯಾರ್ಥಿಗಳು: ${students.length}
        </div>
    `;


    document.getElementById(
        "infoBar"
    ).innerHTML =
        info;


    let html = `

    <div class="table-wrap">

    <table id="marksTable">

    <thead>

    <tr>

        <th>
            ಕ್ರಮ
        </th>

        <th>
            Roll No
        </th>

        <th>
            ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು
        </th>

    `;


    subjects.forEach(
        subject => {

            html += `

            <th class="subject-head">

                ${escapeHtml(
                    subject.name
                )}

                <span class="subject-code">
                    ${subject.code}
                </span>

                <span class="max">
                    Max: ${subject.max}
                </span>

            </th>

            `;

        }
    );


    html += `

    </tr>

    </thead>

    <tbody>

    `;


    students.forEach(
        (student,index) => {

            html += `

            <tr>

                <td>
                    ${index + 1}
                </td>

                <td class="roll">
                    ${escapeHtml(
                        student.roll_no || ""
                    )}
                </td>

                <td class="student-name">
                    ${escapeHtml(
                        student.student_name || ""
                    )}
                </td>

            `;


            subjects.forEach(
                subject => {

                    const saved =
                        marks[
                            student.id
                        ] &&
                        marks[
                            student.id
                        ][
                            subject.code
                        ] !== undefined
                        ?
                        marks[
                            student.id
                        ][
                            subject.code
                        ]
                        :
                        "";


                    const grade =
                        getGrade(
                            saved,
                            subject.max
                        );


                    html += `

                    <td>

                        <input

                            class="mark"

                            type="number"

                            min="0"

                            max="${subject.max}"

                            value="${saved}"

                            data-student="${student.id}"

                            data-subject="${subject.code}"

                            data-max="${subject.max}"

                            oninput="changeMark(this)"

                        >

                        <span

                            class="grade"

                            id="grade_${student.id}_${subject.code}"

                        >
                            ${grade}

                        </span>

                    </td>

                    `;

                }
            );


            html += `

            </tr>

            `;

        }
    );


    html += `

    </tbody>

    </table>

    </div>

    `;


    document.getElementById(
        "tableArea"
    ).innerHTML =
        html;

}


/* =========================================================
   AUTO GRADE
========================================================= */

function changeMark(input){

    const studentId =
        input.dataset.student;


    const subjectCode =
        input.dataset.subject;


    const max =
        Number(
            input.dataset.max
        );


    let value =
        input.value;


    if(value !== ""){

        let n =
            Number(value);


        if(n < 0){

            n = 0;

            input.value = 0;

        }


        if(n > max){

            n = max;

            input.value = max;

            message(
                `ಗರಿಷ್ಠ ${max} ಅಂಕಗಳು ಮಾತ್ರ.`,
                "error"
            );

        }

    }


    const grade =
        getGrade(
            input.value,
            max
        );


    const gradeBox =
        document.getElementById(
            `grade_${studentId}_${subjectCode}`
        );


    if(gradeBox){

        gradeBox.textContent =
            grade;

    }


    if(!marks[studentId]){

        marks[studentId] = {};

    }


    marks[studentId][subjectCode] =
        input.value;

}


/* =========================================================
   SAVE
========================================================= */

async function saveMarks(){

    if(
        students.length === 0
    ){

        message(
            "ಮೊದಲು Students Load ಮಾಡಿ.",
            "error"
        );

        return;

    }


    message(
        "Marks Save ಆಗುತ್ತಿದೆ...",
        "info"
    );


    try{

        const inputs =
            document.querySelectorAll(
                ".mark"
            );


        let saveCount = 0;


        for(
            const input
            of inputs
        ){

            const studentId =
                input.dataset.student;


            const subjectCode =
                input.dataset.subject;


            const value =
                input.value.trim();


            if(value === ""){
                continue;
            }


            const mark =
                Number(value);


            const max =
                Number(
                    input.dataset.max
                );


            if(
                isNaN(mark) ||
                mark < 0 ||
                mark > max
            ){

                throw new Error(
                    `${subjectCode}: ಗರಿಷ್ಠ ${max} ಅಂಕಗಳು ಮಾತ್ರ.`
                );

            }


            /*
               ಮೊದಲು existing row ಹುಡುಕು
            */

            const existing =
                await sb
                .from("result_marks")
                .select("id")
                .eq(
                    "student_id",
                    studentId
                )
                .eq(
                    "subject_code",
                    subjectCode
                )
                .eq(
                    "exam_name",
                    currentExam
                )
                .maybeSingle();


            if(existing.error){

                throw existing.error;

            }


            if(existing.data){

                const update =
                    await sb
                    .from("result_marks")
                    .update({

                        marks:mark

                    })
                    .eq(
                        "id",
                        existing.data.id
                    );


                if(update.error){

                    throw update.error;

                }

            }
            else{

                const insert =
                    await sb
                    .from("result_marks")
                    .insert({

                        student_id:
                            studentId,

                        subject_code:
                            subjectCode,

                        exam_name:
                            currentExam,

                        marks:
                            mark

                    });


                if(insert.error){

                    throw insert.error;

                }

            }


            saveCount++;

        }


        message(
            `✅ ${saveCount} marks ಯಶಸ್ವಿಯಾಗಿ Save ಆಗಿವೆ.`,
            "success"
        );

    }
    catch(error){

        console.error(

/* =========================================================
   EXCEL UPLOAD
========================================================= */

function uploadExcel(event){

    const file =
        event.target.files[0];


    if(!file){
        return;
    }


    if(
        students.length === 0
    ){

        message(
            "ಮೊದಲು Students Load ಮಾಡಿ. ನಂತರ Excel Upload ಮಾಡಿ.",
            "error"
        );

        event.target.value = "";

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            try{

                const workbook =
                    XLSX.read(
                        e.target.result,
                        {
                            type:"array"
                        }
                    );


                const sheet =
                    workbook.Sheets[
                        workbook.SheetNames[0]
                    ];


                const rows =
                    XLSX.utils.sheet_to_json(
                        sheet,
                        {
                            defval:""
                        }
                    );


                let count = 0;


                rows.forEach(
                    row => {

                        const roll =
                            String(
                                row["Roll No"] || ""
                            ).trim();


                        if(!roll){
                            return;
                        }


                        const student =
                            students.find(
                                s =>
                                    String(
                                        s.roll_no || ""
                                    ).trim()
                                    ===
                                    roll
                            );


                        if(!student){
                            return;
                        }


                        if(
                            !marks[student.id]
                        ){

                            marks[student.id] =
                                {};

                        }


                        subjects.forEach(
                            subject => {

                                let value =
                                    row[
                                        subject.code
                                    ];


                                if(
                                    value ===
                                    undefined
                                ){

                                    value =
                                        row[
                                            subject.name
                                        ];

                                }


                                if(
                                    value ===
                                    undefined ||
                                    value === ""
                                ){

                                    return;

                                }


                                /*
                                   Excel cell:
                                   45
                                   ಅಥವಾ
                                   45 (A)
                                */

                                value =
                                    String(
                                        value
                                    )
                                    .split("(")[0]
                                    .trim();


                                const number =
                                    Number(value);


                                if(
                                    !isNaN(number) &&
                                    number >= 0 &&
                                    number <= subject.max
                                ){

                                    marks[
                                        student.id
                                    ][
                                        subject.code
                                    ] =
                                        number;

                                    count++;

                                }

                            }
                        );

                    }
                );


                render();


                message(
                    `Excel‌ನಿಂದ ${count} marks Load ಆಗಿವೆ. ಈಗ Save All Marks ಒತ್ತಿರಿ.`,
                    "success"
                );

            }
            catch(error){

                console.error(error);

                message(
                    "Excel Upload ಸಮಸ್ಯೆ: " +
                    error.message,
                    "error"
                );

            }

        };


    reader.readAsArrayBuffer(file);

    event.target.value = "";

}

/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHtml(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
