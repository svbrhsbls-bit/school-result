<script>

/* =====================================================
   SUPABASE CONFIGURATION
   ===================================================== */

const SUPABASE_URL =
"https://sozlvjvqrpaabnvjvxe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";


/* IMPORTANT:
   Client ಅನ್ನು ಒಂದೇ ಬಾರಿ create ಮಾಡಲಾಗಿದೆ.
*/

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GLOBAL VARIABLES
   ===================================================== */

let students = [];
let subjects = [];
let existingMarks = [];


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text,type="info"){

    const box=document.getElementById("message");

    box.className="message "+type;

    box.innerText=text;

}


/* =====================================================
   GET SELECTED VALUES
   ===================================================== */

function getValues(){

    const className =
        document.getElementById("classSelect").value;

    const division =
        document.getElementById("divisionSelect").value;

    const exam =
        document.getElementById("examSelect").value;

    return {
        className,
        division,
        exam
    };
}


/* =====================================================
   LOAD STUDENTS
   ===================================================== */

async function loadStudents(){

    try{

        const {className,division,exam}=getValues();

        if(!className || !division || !exam){

            showMessage(
                "ದಯವಿಟ್ಟು ತರಗತಿ, ವಿಭಾಗ ಮತ್ತು ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ.",
                "error"
            );

            return;
        }


        showMessage(
            "ವಿದ್ಯಾರ್ಥಿಗಳ ಮಾಹಿತಿಯನ್ನು Load ಮಾಡಲಾಗುತ್ತಿದೆ...",
            "info"
        );


        /* ------------------------------
           Students
           ------------------------------ */

        const {data,error}=await supabaseClient
            .from("students")
            .select("*")
            .eq("class_name",className)
            .eq("division",division)
            .eq("is_active",true)
            .order("roll_no",{ascending:true});


        if(error){

            console.error(error);

            throw new Error(
                "Students Load: "+error.message
            );
        }


        students=data || [];


        /* ------------------------------
           Subjects
           ------------------------------ */

        const {data:subjectData,error:subjectError} =
            await supabaseClient
            .from("subjects")
            .select("*")
            .eq("class_name",className)
            .eq("is_active",true)
            .order("display_order",{ascending:true});


        if(subjectError){

            console.error(subjectError);

            throw new Error(
                "Subjects Load: "+subjectError.message
            );
        }


        subjects=subjectData || [];


        if(students.length===0){

            showMessage(
                "ಈ ತರಗತಿ ಮತ್ತು ವಿಭಾಗಕ್ಕೆ ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ.",
                "error"
            );

            document.getElementById("studentArea").style.display="none";

            return;
        }


        if(subjects.length===0){

            showMessage(
                "ಈ ತರಗತಿಗೆ Subject Master ನಲ್ಲಿ ವಿಷಯಗಳು ಸಿಗಲಿಲ್ಲ.",
                "error"
            );

            return;
        }


        renderStudents();


        document.getElementById("studentArea").style.display="block";


        document.getElementById("showClass").innerText=className;
        document.getElementById("showDivision").innerText=division;
        document.getElementById("showExam").innerText=exam;
        document.getElementById("studentCount").innerText=students.length;


        showMessage(
            students.length+" ವಿದ್ಯಾರ್ಥಿಗಳು Load ಆಗಿದ್ದಾರೆ.",
            "success"
        );

    }

    catch(error){

        console.error(error);

        showMessage(
            "Students Load ಸಮಸ್ಯೆ: "+error.message,
            "error"
        );

    }

}


/* =====================================================
   GET MAX MARKS
   ===================================================== */

function getMaxMarks(subject){

    const className =
        document.getElementById("classSelect").value;

    const exam =
        document.getElementById("examSelect").value;

    const code =
        (subject.subject_code || "").toUpperCase();


    /* 8ನೇ ತರಗತಿ */

    if(className==="8ನೇ ತರಗತಿ"){

        if(
            exam==="ಅರ್ಧವಾರ್ಷಿಕ"
        ){
            return 50;
        }

        if(
            exam==="ವಾರ್ಷಿಕ"
        ){
            return 100;
        }

        if(exam==="FA-1" || exam==="FA-2"){
            return 10;
        }

        if(exam==="SA-1" || exam==="SA-2"){
            return 30;
        }

    }


    /* 9 ಮತ್ತು 10 */

    if(
        className==="9ನೇ ತರಗತಿ" ||
        className==="10ನೇ ತರಗತಿ"
    ){

        if(exam==="ಅರ್ಧವಾರ್ಷಿಕ"){

            if(code==="01K"){
                return 100;
            }

            return 80;
        }


        if(exam==="ವಾರ್ಷಿಕ"){

            if(code==="01K"){
                return 125;
            }

            return 100;
        }


        /* FA */

        if(
            exam==="FA-1" ||
            exam==="FA-2" ||
            exam==="FA-3" ||
            exam==="FA-4"
        ){
            return 10;
        }

        if(
            exam==="SA-1" ||
            exam==="SA-2"
        ){
            return 30;
        }

    }


    return subject.max_marks || 100;
}


/* =====================================================
   GRADE
   ===================================================== */

function getGrade(mark,max){

    if(
        mark===null ||
        mark===undefined ||
        mark===""
    ){
        return "";
    }

    mark=Number(mark);
    max=Number(max);


    if(max<=0) return "";


    const percentage=(mark/max)*100;


    if(percentage>=90){
        return "A+";
    }

    if(percentage>=75){
        return "A";
    }

    if(percentage>=60){
        return "B+";
    }

    if(percentage>=50){
        return "B";
    }

    return "C";
}


/* =====================================================
   RENDER STUDENTS
   ===================================================== */

function renderStudents(){

    const body =
        document.getElementById("marksBody");

    body.innerHTML="";


    students.forEach((student,index)=>{

        const tr=document.createElement("tr");

        tr.innerHTML=`

        <td>${index+1}</td>

        <td>${student.roll_no || ""}</td>

        <td class="name">
            ${student.student_name || ""}
        </td>

        <td>
            <span id="max_${student.id}">
            </span>
        </td>

        <td>

            <input
                type="number"
                class="mark-input"
                id="mark_${student.id}"
                min="0"
                step="0.5"
                placeholder="Marks"
                oninput="updateGrade('${student.id}')"
            >

        </td>

        <td>

            <span
                class="grade"
                id="grade_${student.id}">
            </span>

        </td>

        `;


        body.appendChild(tr);


        /* Max marks */

        let max=0;

        /*
           ಒಂದೇ rowನಲ್ಲಿ ಒಂದು subject ಅಲ್ಲ,
           ಆಯ್ಕೆ ಮಾಡಿದ Subject Master ವಿಷಯದ ಆಧಾರದ ಮೇಲೆ
           marks entry.
        */

        const subject=subjects[0];

        if(subject){

            max=getMaxMarks(subject);

        }


        document.getElementById(
            "max_"+student.id
        ).innerText=max;

    });

}


/* =====================================================
   UPDATE GRADE
   ===================================================== */

function updateGrade(studentId){

    const input =
        document.getElementById(
            "mark_"+studentId
        );

    const grade =
        document.getElementById(
            "grade_"+studentId
        );

    const max =
        Number(
            document.getElementById(
                "max_"+studentId
            ).innerText
        );


    let value=input.value;


    if(value===""){

        grade.innerText="";

        grade.className="grade";

        return;
    }


    value=Number(value);


    if(value>max){

        input.value=max;

        value=max;
    }


    if(value<0){

        input.value=0;

        value=0;
    }


    const g=getGrade(value,max);

    grade.innerText=g;


    grade.className="grade";


    if(g==="A+"){
        grade.classList.add("grade-Aplus");
    }

    else if(g==="A"){
        grade.classList.add("grade-A");
    }

    else if(g==="B+"){
        grade.classList.add("grade-Bplus");
    }

    else if(g==="B"){
        grade.classList.add("grade-B");
    }

    else if(g==="C"){
        grade.classList.add("grade-C");
    }

}


/* =====================================================
   SAVE ALL MARKS
   ===================================================== */

async function saveAllMarks(){

    try{

        const {className,division,exam}=getValues();


        if(
            !className ||
            !division ||
            !exam
        ){

            showMessage(
                "ಮೊದಲು ತರಗತಿ, ವಿಭಾಗ ಮತ್ತು ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ.",
                "error"
            );

            return;
        }


        if(students.length===0){

            showMessage(
                "ಮೊದಲು Students Load ಮಾಡಿ.",
                "error"
            );

            return;
        }


        if(subjects.length===0){

            showMessage(
                "Subject ಸಿಗುತ್ತಿಲ್ಲ.",
                "error"
            );

            return;
        }


        const subject=subjects[0];


        showMessage(
            "Marks save ಮಾಡಲಾಗುತ್ತಿದೆ...",
            "info"
        );


        for(const student of students){

            const input =
                document.getElementById(
                    "mark_"+student.id
                );


            if(!input || input.value===""){
                continue;
            }


            const marks=Number(input.value);


            /* ------------------------------
               exam_results
               ------------------------------ */

            let {
                data:examResult,
                error:examError
            } =
                await supabaseClient
                .from("exam_results")
                .select("id")
                .eq("student_id",student.id)
                .eq("exam_type",exam)
                .maybeSingle();


            if(examError){

                throw examError;

            }


            if(!examResult){

                const result =
                    await supabaseClient
                    .from("exam_results")
                    .insert({

                        student_id:student.id,

                        exam_type:exam,

                        published:false

                    })
                    .select()
                    .single();


                if(result.error){

                    throw result.error;

                }


                examResult=result.data;

            }


            /* ------------------------------
               result_marks
               ------------------------------ */

            const {data:oldMark,error:oldError} =
                await supabaseClient
                .from("result_marks")
                .select("id")
                .eq(
                    "exam_result_id",
                    examResult.id
                )
                .eq(
                    "subject_id",
                    subject.id
                )
                .maybeSingle();


            if(oldError){

                throw oldError;

            }


            if(oldMark){

                const {error:updateError} =
                    await supabaseClient
                    .from("result_marks")
                    .update({
                        marks:marks
                    })
                    .eq("id",oldMark.id);


                if(updateError){

                    throw updateError;

                }

            }

            else{

                const {error:insertError} =
                    await supabaseClient
                    .from("result_marks")
                    .insert({

                        exam_result_id:examResult.id,

                        subject_id:subject.id,

                        marks:marks

                    });


                if(insertError){

                    throw insertError;

                }

            }

        }


        showMessage(
            "✅ ಎಲ್ಲಾ Marks ಯಶಸ್ವಿಯಾಗಿ Save ಆಗಿವೆ.",
            "success"
        );

    }

    catch(error){

        console.error(error);

        showMessage(
            "Save ಮಾಡುವಾಗ ಸಮಸ್ಯೆ: "+error.message,
            "error"
        );

    }

}


/* =====================================================
   EXCEL DOWNLOAD
   ===================================================== */

function downloadExcel(){

    const {className,division,exam}=getValues();


    if(!className || !division || !exam){

        showMessage(
            "Excel Form Download ಮಾಡಲು ತರಗತಿ, ವಿಭಾಗ ಮತ್ತು ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ.",
            "error"
        );

        return;
    }


    if(students.length===0){

        showMessage(
            "ಮೊದಲು Students Load ಮಾಡಿ.",
            "error"
        );

        return;
    }


    const subject=subjects[0];

    const max=getMaxMarks(subject);


    const rows=[];


    students.forEach((student,index)=>{

        rows.push({

            "Sl No":index+1,

            "Student ID":student.id,

            "Roll No":student.roll_no,

            "Student Name":student.student_name,

            "Class":student.class_name,

            "Division":student.division,

            "Exam":exam,

            "Subject Code":subject.subject_code,

            "Subject Name":subject.subject_name,

            "Max Marks":max,

            "Marks":"",

            "Grade":""

        });

    });


    const ws =
        XLSX.utils.json_to_sheet(rows);


    const wb =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        wb,
        ws,
        "Marks Entry"
    );


    XLSX.writeFile(
        wb,
        `Marks_${className}_${division}_${exam}.xlsx`
    );


    showMessage(
        "✅ Excel Form Download ಆಗಿದೆ.",
        "success"
    );

}


/* =====================================================
   EXCEL UPLOAD BUTTON
   ===================================================== */

function uploadExcel(){

    document
        .getElementById("excelFile")
        .click();

}


/* =====================================================
   HANDLE EXCEL UPLOAD
   ===================================================== */

function handleExcelUpload(event){

    const file=event.target.files[0];


    if(!file){
        return;
    }


    const reader=new FileReader();


    reader.onload=function(e){

        try{

            const data =
                new Uint8Array(e.target.result);


            const workbook =
                XLSX.read(data,{
                    type:"array"
                });


            const sheet =
                workbook.Sheets[
                    workbook.SheetNames[0]
                ];


            const rows =
                XLSX.utils.sheet_to_json(
                    sheet,
                    {defval:""}
                );


            let count=0;


            rows.forEach(row=>{

                const studentId =
                    row["Student ID"];


                const marks =
                    row["Marks"];


                if(!studentId || marks===""){
                    return;
                }


                const input =
                    document.getElementById(
                        "mark_"+studentId
                    );


                if(input){

                    input.value=marks;

                    updateGrade(studentId);

                    count++;

                }

            });


            showMessage(
                "✅ Excel ನಿಂದ "+count+" ವಿದ್ಯಾರ್ಥಿಗಳ Marks Load ಆಗಿವೆ. ಈಗ Save All Marks ಒತ್ತಿ.",
                "success"
            );

        }

        catch(error){

            console.error(error);

            showMessage(
                "Excel Upload ಸಮಸ್ಯೆ: "+error.message,
                "error"
            );

        }

    };


    reader.readAsArrayBuffer(file);

}


/* =====================================================
   PRINT
   ===================================================== */

function printMarks(){

    if(students.length===0){

        showMessage(
            "ಮೊದಲು ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು Load ಮಾಡಿ.",
            "error"
        );

        return;
    }


    window.print();

}

function clearAll(){

    students=[];

    subjects=[];

    document.getElementById(
        "marksBody"
    ).innerHTML="";


    document.getElementById(
        "studentArea"
    ).style.display="none";


    document.getElementById(
        "message"
    ).className="message";


    document.getElementById(
        "classSelect"
    ).value="";


    document.getElementById(
        "divisionSelect"
    ).value="";


    document.getElementById(
        "examSelect"
    ).value="";

}
