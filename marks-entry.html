<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marks Entry - School Result System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Kannada",sans-serif;
    background:#eef6fc;
    color:#173b63;
}

.header{
    background:linear-gradient(135deg,#1268a8,#1598cc);
    color:white;
    text-align:center;
    padding:28px 15px;
}

.header h1{
    margin:0;
    font-size:32px;
}

.header p{
    margin:8px 0 0;
    font-size:18px;
}

.container{
    width:96%;
    max-width:1500px;
    margin:25px auto;
}

.card{
    background:white;
    border-radius:16px;
    padding:22px;
    margin-bottom:22px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.filters{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    font-size:16px;
}

select{
    width:100%;
    padding:12px;
    border:1px solid #ccd8e5;
    border-radius:9px;
    font-size:16px;
    background:white;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 20px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-load{
    background:#1479b9;
    color:white;
    margin-top:20px;
}

.btn-clear{
    background:#68727c;
    color:white;
    margin-left:8px;
}

.btn-save{
    background:#168c4a;
    color:white;
    margin-top:20px;
}

.message{
    padding:13px;
    margin-top:18px;
    border-radius:8px;
    display:none;
    font-weight:bold;
}

.success{
    display:block;
    background:#dff5e7;
    color:#13733a;
}

.error{
    display:block;
    background:#ffe1e1;
    color:#b42323;
}

.info{
    display:block;
    background:#e2f1ff;
    color:#155c91;
}

.summary{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.badge{
    background:#edf5fb;
    border-radius:10px;
    padding:12px 18px;
    font-weight:bold;
}

.table-wrap{
    width:100%;
    overflow:auto;
    border:1px solid #d9e3ed;
    border-radius:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
}

thead th{
    background:#126da9;
    color:white;
    padding:12px 8px;
    text-align:center;
    white-space:nowrap;
}

tbody td{
    border-bottom:1px solid #e2e8ef;
    padding:9px 7px;
    text-align:center;
}

tbody tr:hover{
    background:#f5faff;
}

.student-name{
    text-align:left !important;
    font-weight:bold;
    min-width:180px;
}

.roll{
    font-weight:bold;
}

.mark-input{
    width:75px;
    padding:8px 5px;
    text-align:center;
    border:1px solid #c8d5e2;
    border-radius:7px;
    font-size:15px;
}

.mark-input:focus{
    outline:none;
    border:2px solid #1684c4;
}

.grade{
    min-width:55px;
    font-weight:bold;
    font-size:15px;
}

.grade-a-plus{
    color:#087f3e;
}

.grade-a{
    color:#1472ad;
}

.grade-b-plus{
    color:#9a6b00;
}

.grade-b{
    color:#c75c00;
}

.grade-c{
    color:#c52222;
}

.subject-head{
    min-width:125px;
}

.subject-head small{
    display:block;
    font-weight:normal;
    margin-top:4px;
    opacity:.9;
}

@media(max-width:900px){
    .filters{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:600px){
    .filters{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>📝 Marks Entry</h1>
    <p>ಶಾಲಾ ಫಲಿತಾಂಶ ನಿರ್ವಹಣಾ ವ್ಯವಸ್ಥೆ</p>
</div>

<div class="container">

    <div class="card">

        <div class="filters">

            <div>
                <label>ತರಗತಿ / Class</label>

                <select id="classSelect">
                    <option value="">-- ತರಗತಿ ಆಯ್ಕೆ ಮಾಡಿ --</option>
                    <option value="8ನೇ ತರಗತಿ">8ನೇ ತರಗತಿ</option>
                    <option value="9ನೇ ತರಗತಿ">9ನೇ ತರಗತಿ</option>
                    <option value="10ನೇ ತರಗತಿ">10ನೇ ತರಗತಿ</option>
                </select>
            </div>

            <div>
                <label>ವಿಭಾಗ / Division</label>

                <select id="divisionSelect">
                    <option value="">-- ವಿಭಾಗ ಆಯ್ಕೆ ಮಾಡಿ --</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>

            <div>
                <label>ಪರೀಕ್ಷೆ / Exam</label>

                <select id="examSelect">
                    <option value="">-- ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ --</option>
                    <option value="ಅರ್ಧವಾರ್ಷಿಕ">ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ</option>
                    <option value="ವಾರ್ಷಿಕ">ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ</option>
                </select>
            </div>

            <div>
                <label>ವಿಷಯ / Subject</label>

                <select id="subjectSelect">
                    <option value="">ಎಲ್ಲಾ ವಿಷಯಗಳು</option>
                </select>
            </div>

        </div>

        <button class="btn-load" onclick="loadStudentsAndSubjects()">
            🔄 ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು Load ಮಾಡಿ
        </button>

        <button class="btn-clear" onclick="clearAll()">
            ✖ Clear
        </button>

        <div id="message" class="message"></div>

    </div>


    <div class="card">

        <div class="summary">

            <div class="badge">
                ತರಗತಿ:
                <span id="summaryClass">-</span>
            </div>

            <div class="badge">
                ಪರೀಕ್ಷೆ:
                <span id="summaryExam">-</span>
            </div>

            <div class="badge">
                ವಿದ್ಯಾರ್ಥಿಗಳು:
                <span id="studentCount">0</span>
            </div>

            <div class="badge">
                ವಿಷಯಗಳು:
                <span id="subjectCount">0</span>
            </div>

        </div>


        <div class="table-wrap">

            <table id="marksTable">

                <thead id="tableHead">
                <tr>
                    <th>ಕ್ರಮ</th>
                    <th>Reg No</th>
                    <th>ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು</th>
                </tr>
                </thead>

                <tbody id="tableBody"></tbody>

            </table>

        </div>


        <button class="btn-save" onclick="saveAllMarks()">
            💾 Save All Marks
        </button>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE SETTINGS
   ========================================================= */

const SUPABASE_URL =
    "https://sozljvqrpaabnvjvxe.supabase.co";

/*
   ಇಲ್ಲಿ ನಿಮ್ಮ Supabase API Keys page ನಲ್ಲಿ ಇರುವ
   Publishable key ಅನ್ನು ಹಾಕಿ.

   sb_publishable_..... ಆಗಿರುವ key ಬಳಸಬಹುದು.
*/

const SUPABASE_KEY =
    "ನಿಮ್ಮ_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   GLOBAL DATA
   ========================================================= */

let students = [];
let subjects = [];

let loadedClass = "";
let loadedDivision = "";
let loadedExam = "";


/* =========================================================
   ELEMENTS
   ========================================================= */

const classSelect =
    document.getElementById("classSelect");

const divisionSelect =
    document.getElementById("divisionSelect");

const examSelect =
    document.getElementById("examSelect");

const subjectSelect =
    document.getElementById("subjectSelect");

const tableHead =
    document.getElementById("tableHead");

const tableBody =
    document.getElementById("tableBody");

const messageBox =
    document.getElementById("message");


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text,type="info"){

    messageBox.textContent = text;

    messageBox.className =
        "message " + type;
}


/* =========================================================
   GET MAX MARKS
   ========================================================= */

function getMaxMarks(className,exam,subjectCode){

    const cls = String(className || "").trim();
    const ex = String(exam || "").trim();
    const code = String(subjectCode || "").trim().toUpperCase();


    /* -------------------------
       8TH CLASS
       ------------------------- */

    if(
        cls === "8ನೇ ತರಗತಿ" ||
        cls === "8" ||
        cls.includes("8")
    ){

        if(ex.includes("ಅರ್ಧ"))
            return 50;

        if(ex.includes("ವಾರ್ಷಿಕ"))
            return 100;

        return 100;
    }


    /* -------------------------
       9TH / 10TH CLASS
       ------------------------- */

    const isKannada =
        code === "01K";


    if(
        cls.includes("9") ||
        cls.includes("10")
    ){

        if(ex.includes("ಅರ್ಧ")){

            if(isKannada)
                return 100;

            return 80;
        }


        if(ex.includes("ವಾರ್ಷಿಕ")){

            if(isKannada)
                return 125;

            return 100;
        }

    }


    return 100;
}


/* =========================================================
   GRADE CALCULATION
   ========================================================= */

function calculateGrade(mark,maxMark){

    if(
        mark === "" ||
        mark === null ||
        mark === undefined
    ){
        return "";
    }

    const m = Number(mark);
    const max = Number(maxMark);

    if(
        isNaN(m) ||
        isNaN(max) ||
        max <= 0
    ){
        return "";
    }

    if(m < 0)
        return "";

    if(m > max)
        return "";


    const percentage =
        (m / max) * 100;


    /*
       Grade:
       90 - 100 = A+
       70 - 89  = A
       50 - 69  = B+
       30 - 49  = B
       0  - 29  = C
    */

    if(percentage >= 90)
        return "A+";

    if(percentage >= 70)
        return "A";

    if(percentage >= 50)
        return "B+";

    if(percentage >= 30)
        return "B";

    return "C";
}


/* =========================================================
   GRADE CLASS
   ========================================================= */

function gradeClass(grade){

    if(grade === "A+")
        return "grade-a-plus";

    if(grade === "A")
        return "grade-a";

    if(grade === "B+")
        return "grade-b-plus";

    if(grade === "B")
        return "grade-b";

    if(grade === "C")
        return "grade-c";

    return "";
}


/* =========================================================
   LOAD STUDENTS + SUBJECTS
   ========================================================= */

async function loadStudentsAndSubjects(){

    const className =
        classSelect.value;

    const division =
        divisionSelect.value;

    const exam =
        examSelect.value;


    if(!className){

        showMessage(
            "ದಯವಿಟ್ಟು ತರಗತಿ ಆಯ್ಕೆ ಮಾಡಿ.",
            "error"
        );

        return;
    }


    if(!division){

        showMessage(
            "ದಯವಿಟ್ಟು ವಿಭಾಗ ಆಯ್ಕೆ ಮಾಡಿ.",
            "error"
        );

        return;
    }


    if(!exam){

        showMessage(
            "ದಯವಿಟ್ಟು ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ.",
            "error"
        );

        return;
    }


    showMessage(
        "ವಿದ್ಯಾರ್ಥಿಗಳು ಮತ್ತು ವಿಷಯಗಳನ್ನು Load ಮಾಡಲಾಗುತ್ತಿದೆ...",
        "info"
    );


    try{

        /* -------------------------
           STUDENTS
           ------------------------- */

        const studentResult =
            await supabaseClient
                .from("students")
                .select(
                    "id,roll_no,student_name,class_name,division"
                )
                .eq("class_name",className)
                .eq("division",division)
                .eq("is_active",true)
                .order("roll_no",{ascending:true});


        if(studentResult.error)
            throw studentResult.error;


        students =
            studentResult.data || [];


        /* -------------------------
           SUBJECTS
           ------------------------- */

        const subjectResult =
            await supabaseClient
                .from("subjects")
                .select(
                    "id,class_name,subject_code,subject_name,max_marks,display_order,is_active"
                )
                .eq("class_name",className)
                .eq("is_active",true)
                .order(
                    "display_order",
                    {ascending:true}
                );


        if(subjectResult.error)
            throw subjectResult.error;


        subjects =
            subjectResult.data || [];


        if(subjects.length === 0){

            showMessage(
                "ಈ ತರಗತಿಗೆ Subject Master ನಲ್ಲಿ ವಿಷಯಗಳು ಕಂಡುಬಂದಿಲ್ಲ.",
                "error"
            );

            renderEmpty();

            return;
        }


        loadedClass =
            className;

        loadedDivision =
            division;

        loadedExam =
            exam;


        document.getElementById(
            "summaryClass"
        ).textContent = className;

        document.getElementById(
            "summaryExam"
        ).textContent = exam;

        document.getElementById(
            "studentCount"
        ).textContent = students.length;

        document.getElementById(
            "subjectCount"
        ).textContent = subjects.length;


        fillSubjectFilter();

        renderTable();


        showMessage(
            students.length +
            " ವಿದ್ಯಾರ್ಥಿಗಳು ಮತ್ತು " +
            subjects.length +
            " ವಿಷಯಗಳು Load ಆಗಿವೆ.",
            "success"
        );

    }
    catch(error){

        console.error(error);

        showMessage(
            "Students Load ಸಮಸ್ಯೆ: " +
            (error.message || error),
            "error"
        );

    }

}


/* =========================================================
   SUBJECT FILTER
   ========================================================= */

function fillSubjectFilter(){

    subjectSelect.innerHTML =
        `<option value="">ಎಲ್ಲಾ ವಿಷಯಗಳು</option>`;


    subjects.forEach(subject => {

        const option =
            document.createElement("option");

        option.value =
            subject.id;

        option.textContent =
            `${subject.subject_name} (${subject.subject_code})`;

        subjectSelect.appendChild(option);

    });

}


/* =========================================================
   RENDER TABLE
   ========================================================= */

async function renderTable(){

    tableHead.innerHTML = "";
    tableBody.innerHTML = "";


    /* -------------------------
       HEADER
       ------------------------- */

    let headHTML = `
        <tr>
            <th>ಕ್ರಮ</th>
            <th>Reg No</th>
            <th>ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು</th>
    `;


    subjects.forEach(subject => {

        const max =
            getMaxMarks(
                loadedClass,
                loadedExam,
                subject.subject_code
            );


        headHTML += `
            <th class="subject-head">
                ${subject.subject_name}
                <small>
                    ${subject.subject_code}
                    / ${max}
                </small>
            </th>

            <th>Grade</th>
        `;

    });


    headHTML += "</tr>";

    tableHead.innerHTML =
        headHTML;


    /* -------------------------
       NO STUDENTS
       ------------------------- */

    if(students.length === 0){

        tableBody.innerHTML = `
            <tr>
                <td colspan="${3 + subjects.length * 2}"
                    style="padding:30px;font-weight:bold;">
                    ಈ ತರಗತಿ / ವಿಭಾಗದಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಗಳು ಇಲ್ಲ.
                </td>
            </tr>
        `;

        return;
    }


    /* -------------------------
       LOAD EXISTING MARKS
       ------------------------- */

    const studentIds =
        students.map(s => s.id);


    let existingMarks = [];


    if(studentIds.length > 0){

        const result =
            await supabaseClient
                .from("result_marks")
                .select(
                    "id,student_id,subject_id,exam_name,marks"
                )
                .in(
                    "student_id",
                    studentIds
                )
                .eq(
                    "exam_name",
                    loadedExam
                );


        if(!result.error){

            existingMarks =
                result.data || [];

        }
        else{

            console.warn(
                "Existing marks load failed:",
                result.error
            );

        }

    }


    /* -------------------------
       CREATE MAP
       ------------------------- */

    const marksMap = new Map();


    existingMarks.forEach(row => {

        const key =
            row.student_id +
            "_" +
            row.subject_id;

        marksMap.set(
            key,
            row.marks
        );

    });


    /* -------------------------
       STUDENT ROWS
       ------------------------- */

    students.forEach(
        (student,index) => {

            let rowHTML = `
                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td class="roll">
                        ${student.roll_no || ""}
                    </td>

                    <td class="student-name">
                        ${student.student_name || ""}
                    </td>
            `;


            subjects.forEach(subject => {

                const max =
                    getMaxMarks(
                        loadedClass,
                        loadedExam,
                        subject.subject_code
                    );


                const key =
                    student.id +
                    "_" +
                    subject.id;


                const savedMark =
                    marksMap.has(key)
                        ? marksMap.get(key)
                        : "";


                const grade =
                    calculateGrade(
                        savedMark,
                        max
                    );


                rowHTML += `

                    <td>

                        <input
                            type="number"
                            class="mark-input"
                            min="0"
                            max="${max}"
                            step="1"

                            data-student="${student.id}"
                            data-subject="${subject.id}"
                            data-max="${max}"

                            value="${savedMark ?? ""}"

                            oninput="
                                updateGrade(
                                    this
                                )
                            "
                        >

                    </td>

                    <td>

                        <span
                            id="grade-${student.id}-${subject.id}"
                            class="grade ${gradeClass(grade)}"
                        >
                            ${grade}
                        </span>

                    </td>
                `;

            });


            rowHTML += "</tr>";


            tableBody.insertAdjacentHTML(
                "beforeend",
                rowHTML
            );

        }
    );

}


/* =========================================================
   UPDATE GRADE IMMEDIATELY
   ========================================================= */

function updateGrade(input){

    const studentId =
        input.dataset.student;

    const subjectId =
        input.dataset.subject;

    const max =
        Number(input.dataset.max);


    let value =
        input.value;


    /* -------------------------
       EMPTY
       ------------------------- */

    if(value === ""){

        const gradeElement =
            document.getElementById(
                `grade-${studentId}-${subjectId}`
            );

        gradeElement.textContent =
            "";

        gradeElement.className =
            "grade";

        return;
    }


    let mark =
        Number(value);


    /* -------------------------
       VALIDATION
       ------------------------- */

    if(mark < 0){

        input.value = 0;

        mark = 0;
    }


    if(mark > max){

        input.value = max;

        mark = max;

        showMessage(
            `ಗರಿಷ್ಠ ಅಂಕ ${max} ಮಾತ್ರ.`,
            "error"
        );

    }


    /* -------------------------
       GRADE
       ------------------------- */

    const grade =
        calculateGrade(
            mark,
            max
        );


    const gradeElement =
        document.getElementById(
            `grade-${studentId}-${subjectId}`
        );


    gradeElement.textContent =
        grade;


    gradeElement.className =
        "grade " +
        gradeClass(grade);

}


/* =========================================================
   SAVE ALL MARKS
   ========================================================= */

async function saveAllMarks(){

    if(students.length === 0){

        showMessage(
            "ಮೊದಲು ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು Load ಮಾಡಿ.",
            "error"
        );

        return;
    }


    if(!loadedExam){

        showMessage(
            "ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿಲ್ಲ.",
            "error"
        );

        return;
    }


    showMessage(
        "Marks save ಮಾಡಲಾಗುತ್ತಿದೆ...",
        "info"
    );


    try{

        const inputs =
            document.querySelectorAll(
                ".mark-input"
            );


        const rows = [];


        inputs.forEach(input => {

            const value =
                input.value.trim();


            /* Empty marks are not saved */

            if(value === "")
                return;


            const mark =
                Number(value);


            const max =
                Number(input.dataset.max);


            if(
                isNaN(mark) ||
                mark < 0 ||
                mark > max
            ){

                throw new Error(
                    `ಒಂದು ಅಥವಾ ಹೆಚ್ಚು ಅಂಕಗಳು ತಪ್ಪಾಗಿವೆ. ಗರಿಷ್ಠ ಅಂಕ ${max}.`
                );

            }


            rows.push({

                student_id:
                    input.dataset.student,

                subject_id:
                    input.dataset.subject,

                exam_name:
                    loadedExam,

                marks:
                    mark

            });

        });


        if(rows.length === 0){

            showMessage(
                "ಯಾವುದೇ Marks ಹಾಕಿಲ್ಲ.",
                "error"
            );

            return;
        }


        /* =================================================
           IMPORTANT

           Existing marks for this exam are removed first,
           then current marks are inserted.

           This avoids requiring a UNIQUE constraint.
           ================================================= */


        const studentIds =
            students.map(
                s => s.id
            );


        const deleteResult =
            await supabaseClient
                .from("result_marks")
                .delete()
                .in(
                    "student_id",
                    studentIds
                )
                .eq(
                    "exam_name",
                    loadedExam
                );


        if(deleteResult.error)
            throw deleteResult.error;


        const insertResult =
            await supabaseClient
                .from("result_marks")
                .insert(rows);


        if(insertResult.error)
            throw insertResult.error;


        showMessage(
            rows.length +
            " Marks ಯಶಸ್ವಿಯಾಗಿ Save ಆಗಿವೆ. Grade ಸ್ವಯಂಚಾಲಿತವಾಗಿ ತೋರಿಸಲಾಗಿದೆ.",
            "success"
        );


        await renderTable();

    }
    catch(error){

        console.error(error);

        showMessage(
            "Save ಮಾಡುವಾಗ ಸಮಸ್ಯೆ: " +
            (error.message || error),
            "error"
        );

    }

}


/* =========================================================
   CLEAR
   ========================================================= */

function clearAll(){

    classSelect.value = "";
    divisionSelect.value = "";
    examSelect.value = "";

    subjectSelect.innerHTML =
        `<option value="">ಎಲ್ಲಾ ವಿಷಯಗಳು</option>`;

    students = [];
    subjects = [];

    loadedClass = "";
    loadedDivision = "";
    loadedExam = "";

    tableBody.innerHTML = "";

    tableHead.innerHTML = `
        <tr>
            <th>ಕ್ರಮ</th>
            <th>Reg No</th>
            <th>ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು</th>
        </tr>
    `;

    document.getElementById(
        "summaryClass"
    ).textContent = "-";

    document.getElementById(
        "summaryExam"
    ).textContent = "-";

    document.getElementById(
        "studentCount"
    ).textContent = "0";

    document.getElementById(
        "subjectCount"
    ).textContent = "0";

        "none";

}


/* =========================================================
   EMPTY TABLE
   ========================================================= */

function renderEmpty(){

    tableHead.innerHTML = `
        <tr>
            <th>ಕ್ರಮ</th>
            <th>Reg No</th>
            <th>ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು</th>
        </tr>
    `;

    tableBody.innerHTML = "";

}


/* =========================================================
   AUTO LOAD SUBJECTS WHEN CLASS CHANGES
   ========================================================= */

classSelect.addEventListener(
    "change",
    () => {

        subjectSelect.innerHTML =
            `<option value="">ಎಲ್ಲಾ ವಿಷಯಗಳು</option>`;

    }
);


/* =========================================================
   SUBJECT FILTER
   ========================================================= */

subjectSelect.addEventListener(
    "change",
    () => {

        const selected =
            subjectSelect.value;


        if(!selected){

            document
                .querySelectorAll(
                    ".subject-head"
                )
                .forEach(el => {
                    el.style.display = "";
                });

            return;
        }

        /*
           Filter is optional.
           Main table still keeps all subjects.
        */

    }
);
