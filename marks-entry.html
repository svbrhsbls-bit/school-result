<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Marks Entry</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:"Noto Sans Kannada","Nirmala UI",Arial,sans-serif;
    background:#eef5fb;
    color:#173b63;
}

.header{
    background:linear-gradient(135deg,#1268a5,#168bc2);
    color:#fff;
    text-align:center;
    padding:24px 15px;
}

.header h1{margin:0;font-size:30px}
.header p{margin:7px 0 0}

.container{
    max-width:1400px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:#fff;
    padding:22px;
    border-radius:16px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
    margin-bottom:22px;
}

.form{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

select,input{
    width:100%;
    padding:12px;
    border:1px solid #ccd8e2;
    border-radius:8px;
    font-size:16px;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 20px;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.load{
    background:#1268a5;
    margin-top:18px;
}

.save{
    background:#148b48;
}

.clear{
    background:#69737b;
}

.status{
    margin-top:18px;
    padding:13px;
    border-radius:8px;
    display:none;
    font-weight:bold;
}

.success{
    display:block;
    background:#d1e7dd;
    color:#0f5132;
}

.error{
    display:block;
    background:#f8d7da;
    color:#842029;
}

.info{
    display:block;
    background:#cff4fc;
    color:#055160;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
}

th{
    background:#1268a5;
    color:white;
    padding:11px 8px;
    border:1px solid #ddd;
}

td{
    padding:9px 7px;
    border:1px solid #ddd;
    text-align:center;
}

td.name{
    text-align:left;
    font-weight:bold;
    min-width:200px;
}

.mark{
    width:80px;
    text-align:center;
}

.grade{
    font-weight:bold;
    min-width:60px;
}

.invalid{
    background:#ffd9d9;
}

.summary{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.box{
    background:#f2f7fb;
    border-radius:10px;
    padding:12px 18px;
}

@media(max-width:850px){
    .form{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:550px){
    .form{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>📝 Marks Entry</h1>
    <p>ಶಾಲಾ ಫಲಿತಾಂಶ ನಿರ್ವಹಣಾ ವ್ಯವಸ್ಥೆ</p>
</div>

<div class="container">

<div class="card">

    <div class="form">

        <div>
            <label>ತರಗತಿ</label>
            <select id="classSelect">
                <option value="8">8ನೇ ತರಗತಿ</option>
                <option value="9">9ನೇ ತರಗತಿ</option>
                <option value="10">10ನೇ ತರಗತಿ</option>
            </select>
        </div>

        <div>
            <label>ವಿಭಾಗ</label>
            <select id="division">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
            </select>
        </div>

        <div>
            <label>ಪರೀಕ್ಷೆ</label>
            <select id="exam">
                <option value="half_yearly">ಅರ್ಧವಾರ್ಷಿಕ</option>
                <option value="annual">ವಾರ್ಷಿಕ</option>
            </select>
        </div>

        <div>
            <label>ವಿಷಯ</label>
            <select id="subjectFilter">
                <option value="">ಎಲ್ಲಾ ವಿಷಯಗಳು</option>
            </select>
        </div>

    </div>

    <button class="load" onclick="loadStudents()">
        🔄 Load Students
    </button>

    <button class="clear" onclick="clearPage()">
        ✖ Clear
    </button>

    <div id="status" class="status"></div>

</div>


<div class="card">

    <div class="summary">

        <div class="box">
            <b>ತರಗತಿ:</b>
            <span id="showClass">-</span>
        </div>

        <div class="box">
            <b>ಪರೀಕ್ಷೆ:</b>
            <span id="showExam">-</span>
        </div>

        <div class="box">
            <b>ವಿದ್ಯಾರ್ಥಿಗಳು:</b>
            <span id="studentCount">0</span>
        </div>

    </div>

    <div class="table-wrap">

        <table>

            <thead id="tableHead">
            </thead>

            <tbody id="marksBody">
            </tbody>

        </table>

    </div>

    <br>

    <button class="save" onclick="saveAllMarks()">
        💾 Save All Marks
    </button>

</div>

</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
"https://sozlvjvqrpaabnvjvxe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";

const sb =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   SUBJECTS
   ========================================================= */

const SUBJECTS = [

    {
        code:"01K",
        name:"ಕನ್ನಡ"
    },

    {
        code:"31E",
        name:"ಇಂಗ್ಲಿಷ್"
    },

    {
        code:"61H",
        name:"ಹಿಂದಿ"
    },

    {
        code:"81K",
        name:"ಗಣಿತ"
    },

    {
        code:"83K",
        name:"ವಿಜ್ಞಾನ"
    },

    {
        code:"85K",
        name:"ಸಮಾಜ ವಿಜ್ಞಾನ"
    }

];


/* =========================================================
   GLOBAL
   ========================================================= */

let students = [];
let subjects = [];
let existingMarks = [];


/* =========================================================
   MAX MARKS
   ========================================================= */

function getMaxMarks(className,exam,subjectCode){

    className = String(className);

    /* 8th Half Yearly */

    if(className === "8" && exam === "half_yearly"){
        return 50;
    }

    /* 9th / 10th Half Yearly */

    if(
        (className === "9" || className === "10") &&
        exam === "half_yearly"
    ){

        if(subjectCode === "01K"){
            return 100;
        }

        return 80;
    }

    /* 8th Annual */

    if(className === "8" && exam === "annual"){
        return 100;
    }

    /* 9th / 10th Annual */

    if(
        (className === "9" || className === "10") &&
        exam === "annual"
    ){

        if(subjectCode === "01K"){
            return 125;
        }

        return 100;
    }

    return 100;
}


/* =========================================================
   GRADE
   ========================================================= */

function getGrade(mark,max){

    if(
        mark === null ||
        mark === "" ||
        isNaN(mark)
    ){
        return "";
    }

    mark = Number(mark);
    max = Number(max);

    if(max <= 0) return "";

    const percentage =
        (mark / max) * 100;

    if(percentage >= 90) return "A+";
    if(percentage >= 70) return "A";
    if(percentage >= 50) return "B+";
    if(percentage >= 30) return "B";

    return "C";
}


/* =========================================================
   STATUS
   ========================================================= */

function message(text,type){

    const box =
    document.getElementById("status");

    box.className =
    "status " + type;

    box.innerHTML = text;
}


/* =========================================================
   SUBJECT FILTER
   ========================================================= */

function updateSubjectFilter(){

    const select =
    document.getElementById("subjectFilter");

    select.innerHTML =
    '<option value="">ಎಲ್ಲಾ ವಿಷಯಗಳು</option>';

    SUBJECTS.forEach(s=>{

        const option =
        document.createElement("option");

        option.value = s.code;
        option.textContent =
        s.name + " (" + s.code + ")";

        select.appendChild(option);

    });
}


/* =========================================================
   LOAD STUDENTS
   ========================================================= */

async function loadStudents(){

    const className =
    document.getElementById("classSelect").value;

    const division =
    document.getElementById("division").value;

    const exam =
    document.getElementById("exam").value;


    document.getElementById("showClass")
    .textContent =
    className + "ನೇ ತರಗತಿ - " + division;

    document.getElementById("showExam")
    .textContent =
    exam === "half_yearly"
    ? "ಅರ್ಧವಾರ್ಷಿಕ"
    : "ವಾರ್ಷಿಕ";


    message(
        "⏳ ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು Load ಮಾಡಲಾಗುತ್ತಿದೆ...",
        "info"
    );


    try{

        /*
        Students tableನಲ್ಲಿ class_name ಮತ್ತು division
        columns ಬಳಸಲಾಗುತ್ತದೆ.
        */

        let query =
        sb
        .from("students")
        .select("*")
        .eq("class_name",className)
        .eq("division",division);


        const result =
        await query;


        if(result.error){

            throw result.error;
        }


        students =
        result.data || [];


        document.getElementById("studentCount")
        .textContent =
        students.length;


        if(students.length === 0){

            document.getElementById("marksBody")
            .innerHTML =
            `<tr>
                <td colspan="10">
                    ❌ ಈ ತರಗತಿ / ವಿಭಾಗದಲ್ಲಿ
                    ವಿದ್ಯಾರ್ಥಿಗಳು ಇಲ್ಲ.
                </td>
            </tr>`;

            message(
                "ಈ ತರಗತಿ ಮತ್ತು ವಿಭಾಗಕ್ಕೆ Students Databaseನಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಗಳು ಇಲ್ಲ.",
                "error"
            );

            return;
        }


        /*
        Subject masterದಿಂದ subjects load
        */

        await loadSubjects();


        /*
        Existing marks load
        */

        await loadExistingMarks();


        renderTable();


        message(
            "✅ " +
            students.length +
            " ವಿದ್ಯಾರ್ಥಿಗಳು Load ಆಗಿದ್ದಾರೆ.",
            "success"
        );

    }
    catch(error){

        console.error(error);

        message(
            "❌ Students Load ಸಮಸ್ಯೆ: " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   LOAD SUBJECTS FROM DATABASE
   ========================================================= */

async function loadSubjects(){

    try{

        const result =
        await sb
        .from("subjects")
        .select("*")
        .eq(
            "class_name",
            document.getElementById("classSelect").value
        )
        .eq("is_active",true)
        .order("display_order");

        if(result.error){

            throw result.error;
        }

        subjects =
        result.data || [];


        /*
        Databaseನಲ್ಲಿ subjects ಇಲ್ಲದಿದ್ದರೆ
        default subject codes ಬಳಕೆ.
        */

        if(subjects.length === 0){

            subjects =
            SUBJECTS.map(s=>({

                subject_code:s.code,
                subject_name:s.name

            }));

        }

    }
    catch(error){

        console.error(error);

        /*
        fallback
        */

        subjects =
        SUBJECTS.map(s=>({

            subject_code:s.code,
            subject_name:s.name

        }));

    }

}


/* =========================================================
   LOAD EXISTING MARKS
   ========================================================= */

async function loadExistingMarks(){

    existingMarks = [];

    /*
    Marks table ಇಲ್ಲದಿದ್ದರೆ render ಮುಂದುವರಿಯುತ್ತದೆ.
    */

    try{

        const studentIds =
        students.map(s=>s.id);

        if(!studentIds.length){
            return;
        }


        const result =
        await sb
        .from("marks")
        .select("*")
        .in("student_id",studentIds)
        .eq(
            "exam_name",
            document.getElementById("exam").value
        );


        if(result.error){

            console.warn(
                "Existing marks load:",
                result.error.message
            );

            return;
        }


        existingMarks =
        result.data || [];

    }
    catch(error){

        console.warn(error);

    }

}


/* =========================================================
   RENDER TABLE
   ========================================================= */

function renderTable(){

    const selectedSubject =
    document.getElementById("subjectFilter").value;


    let displaySubjects =
    subjects;


    if(selectedSubject){

        displaySubjects =
        subjects.filter(
            s =>
            String(
                s.subject_code
                ||
                s.code
            ) === selectedSubject
        );

    }


    let head =
    `<tr>
        <th>ಕ್ರಮ</th>
        <th>Reg No</th>
        <th>ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು</th>`;


    displaySubjects.forEach(subject=>{

        const code =
        subject.subject_code ||
        subject.code;

        const name =
        subject.subject_name ||
        subject.name;

        const max =
        getMaxMarks(
            document.getElementById("classSelect").value,
            document.getElementById("exam").value,
            code
        );


        head += `
        <th>
            ${name}<br>
            <small>${code}</small><br>
            <small>/${max}</small>
        </th>`;

    });


    head += "</tr>";


    document.getElementById("tableHead")
    .innerHTML = head;


    let body = "";


    students.forEach((student,index)=>{

        body += `
        <tr>

            <td>${index+1}</td>

            <td>
                ${escapeHtml(
                    student.reg_no ||
                    student.registration_no ||
                    student.roll_no ||
                    ""
                )}
            </td>

            <td class="name">
                ${escapeHtml(
                    student.student_name ||
                    student.name ||
                    ""
                )}
            </td>
        `;


        displaySubjects.forEach(subject=>{

            const code =
            subject.subject_code ||
            subject.code;


            const max =
            getMaxMarks(
                document.getElementById("classSelect").value,
                document.getElementById("exam").value,
                code
            );


            const old =
            findOldMark(
                student.id,
                code
            );


            body += `

            <td>

                <input
                    class="mark"
                    type="number"
                    min="0"
                    max="${max}"
                    step="1"
                    value="${old}"
                    data-student="${student.id}"
                    data-subject="${code}"
                    data-max="${max}"
                    oninput="checkMark(this);updateGrade(this)"
                >

                <div
                    class="grade"
                    id="grade_${student.id}_${code}">
                    ${getGrade(old,max)}
                </div>

            </td>

            `;

        });


        body += "</tr>";

    });


    document.getElementById("marksBody")
    .innerHTML = body;

}


/* =========================================================
   OLD MARK
   ========================================================= */

function findOldMark(studentId,subjectCode){

    const found =
    existingMarks.find(m=>{

        return String(m.student_id) === String(studentId)
        &&
        String(
            m.subject_code ||
            m.subject_id
        ) === String(subjectCode);

    });


    if(!found){
        return "";
    }


    return found.marks ?? "";

}


/* =========================================================
   CHECK MARK
   ========================================================= */

function checkMark(input){

    const max =
    Number(input.dataset.max);

    const value =
    Number(input.value);


    if(input.value === ""){

        input.classList.remove("invalid");
        return;
    }


    if(value < 0 || value > max){

        input.classList.add("invalid");

    }else{

        input.classList.remove("invalid");

    }

}


/* =========================================================
   UPDATE GRADE
   ========================================================= */

function updateGrade(input){

    const student =
    input.dataset.student;

    const subject =
    input.dataset.subject;

    const max =
    Number(input.dataset.max);


    const grade =
    getGrade(
        input.value,
        max
    );


    const box =
    document.getElementById(
        "grade_" +
        student +
        "_" +
        subject
    );


    if(box){
        box.textContent = grade;
    }

}


/* =========================================================
   SAVE ALL
   ========================================================= */

async function saveAllMarks(){

    if(!students.length){

        message(
            "ಮೊದಲು Students Load ಮಾಡಿ.",
            "error"
        );

        return;
    }


    const inputs =
    document.querySelectorAll(
        "input[data-student]"
    );


    if(!inputs.length){

        message(
            "Marks entry fields ಕಂಡುಬಂದಿಲ್ಲ.",
            "error"
        );

        return;
    }


    message(
        "⏳ Marks save ಮಾಡಲಾಗುತ್ತಿದೆ...",
        "info"
    );


    try{

        const exam =
        document.getElementById("exam").value;


        const rows = [];


        for(const input of inputs){

            if(input.value === ""){
                continue;
            }


            const value =
            Number(input.value);

            const max =
            Number(input.dataset.max);


            if(
                isNaN(value)
                ||
                value < 0
                ||
                value > max
            ){

                message(
                    "❌ ಒಂದು ಅಥವಾ ಹೆಚ್ಚು marks ಸರಿಯಾಗಿಲ್ಲ.",
                    "error"
                );

                input.focus();

                return;
            }


            rows.push({

                student_id:
                input.dataset.student,

                subject_code:
                input.dataset.subject,

                exam_name:
                exam,

                marks:
                value

            });

        }


        if(rows.length === 0){

            message(
                "Save ಮಾಡಲು ಯಾವುದೇ marks ನಮೂದಿಸಿಲ್ಲ.",
                "error"
            );

            return;
        }


        /*
        Upsert
        */

        const result =
        await sb
        .from("marks")
        .upsert(
            rows,
            {
                onConflict:
                "student_id,subject_code,exam_name"
            }
        );


        if(result.error){

            throw result.error;
        }


        message(
            "✅ " +
            rows.length +
            " marks ಯಶಸ್ವಿಯಾಗಿ Save ಆಗಿವೆ.",
            "success"
        );


        await loadExistingMarks();

    }
    catch(error){

        console.error(
            "SAVE ERROR:",
            error
        );


        message(
            "❌ Save ಮಾಡುವಾಗ ಸಮಸ್ಯೆ:<br><br>" +
            "<b>" +
            escapeHtml(error.message) +
            "</b><br><br>" +
            "Supabase marks table / RLS ಪರಿಶೀಲಿಸಿ.",
            "error"
        );

    }

}


/* =========================================================
   CLEAR
   ========================================================= */

function clearPage(){

    students = [];
    subjects = [];
    existingMarks = [];


    document.getElementById("marksBody")
    .innerHTML = "";


    document.getElementById("tableHead")
    .innerHTML = "";


    document.getElementById("studentCount")
    .textContent = "0";


    document.getElementById("showClass")
    .textContent = "-";


    document.getElementById("showExam")
    .textContent = "-";


    document.getElementById("status")
    .className = "status";


    document.getElementById("status")
    .textContent = "";

}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHtml(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   FILTER CHANGE
   ========================================================= */

document.getElementById("subjectFilter")
.addEventListener(
    "change",
    renderTable
);


/* =========================================================
   START
   ========================================================= */

updateSubjectFilter();

</script>

</body>
</html>
