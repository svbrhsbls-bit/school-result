<style>

/* =====================================================
   BASIC
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
}

body{
    font-family:Arial,

/* =====================================================
   HEADER
===================================================== */

.header{

        #145da0

    text-align:center;

   CONTAINER

   CARD

.btn-green{

.btn-orange{

/* =====================================================

===================================================== */

table{

<script>


/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://sozlvjvqrgpaabnvjvxe.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   SUBJECT MASTER
===================================================== */

const SUBJECTS = [

    {
        code:"01K",
        name:"ಕನ್ನಡ"
    },

    {
        code:"31E",
        name:"English"
    },

    {
        code:"61H",
        name:"Hindi"
    },

    {
        code:"81K",
        name:"ಗಣಿತ"
    },

    {
        code:"83K",
        name:"ವಿಜ್ಞಾನ"
    },

    {
        code:"85K",
        name:"ಸಮಾಜ ವಿಜ್ಞಾನ"
    }

];


/* =====================================================
   GLOBAL
===================================================== */

let students = [];


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

    const box =
        document.getElementById(
            "message"
        );

    box.className =
        "message " + type;

    box.innerText =
        text;

    box.style.display =
        "block";
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   NORMALIZE CLASS
===================================================== */

function normalizeClass(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";
    }

    let v =
        String(value)
        .trim()
        .toLowerCase();


    v = v
        .replace(/೧೦/g,"10")
        .replace(/೮/g,"8")
        .replace(/೯/g,"9");


    v = v
        .replace(/ನೇ/g,"")
        .replace(/ತರಗತಿ/g,"")
        .replace(/th/g,"")
        .replace(/class/g,"")
        .replace(/\s/g,"");


    if(
        v.includes("10")
    ){

        return "10";
    }

    if(
        v.includes("9")
    ){

        return "9";
    }

    if(
        v.includes("8")
    ){

        return "8";
    }

    return v;
}


/* =====================================================
   NORMALIZE DIVISION
===================================================== */

function normalizeDivision(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";
    }

    return String(value)
        .trim()
        .toUpperCase();
}


/* =====================================================
   MAX MARKS
===================================================== */

function getMaxMarks(subject){

    const cls =
        document
        .getElementById(
            "classSelect"
        )
        .value;


    const exam =
        document
        .getElementById(
            "examSelect"
        )
        .value;


    /* =========================
       8TH CLASS
    ========================= */

    if(cls === "8"){

        if(
            exam ===
            "ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ"
        ){

            return 50;
        }


        if(
            exam ===
            "ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ"
        ){

            return 100;
        }

    }


    /* =========================
       9TH / 10TH
    ========================= */

    if(
        cls === "9" ||
        cls === "10"
    ){

        if(
            exam ===
            "ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ"
        ){

            if(
                subject.code ===
                "01K"
            ){

                return 100;
            }

            return 80;
        }


        if(
            exam ===
            "ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ"
        ){

            if(
                subject.code ===
                "01K"
            ){

                return 125;
            }

            return 100;
        }

    }


    return 100;
}


/* =====================================================
   GRADE
===================================================== */

function calculateGrade(
    mark,
    max
){

    if(
        mark === "" ||
        mark === null ||
        mark === undefined
    ){

        return "";
    }


    const n =
        Number(mark);


    if(
        isNaN(n)
    ){

        return "";
    }


    const percentage =
        (n / max) * 100;


    if(
        percentage >= 90
    ){

        return "A+";
    }


    if(
        percentage >= 70
    ){

        return "A";
    }


    if(
        percentage >= 50
    ){

        return "B+";
    }


    if(
        percentage >= 30
    ){

        return "B";
    }


    return "C";
}


/* =====================================================
   OVERALL GRADE
===================================================== */

function calculateOverallGrade(
    percentage
){

    if(
        percentage >= 90
    ){

        return "A+";
    }

    if(
        percentage >= 70
    ){

        return "A";
    }

    if(
        percentage >= 50
    ){

        return "B+";
    }

    if(
        percentage >= 30
    ){

        return "B";
    }

    return "C";
}


/* =====================================================
   LOAD STUDENTS
===================================================== */

async function loadStudents(){

    const selectedClass =
        document
        .getElementById(
            "classSelect"
        )
        .value;


    const division =
        document
        .getElementById(
            "divisionSelect"
        )
        .value;


    const exam =
        document
        .getElementById(
            "examSelect"
        )
        .value;


    if(!selectedClass){

        showMessage(
            "ದಯವಿಟ್ಟು ತರಗತಿ ಆಯ್ಕೆಮಾಡಿ.",
            "error"
        );

        return;
    }


    if(!exam){

        showMessage(
            "ದಯವಿಟ್ಟು ಪರೀಕ್ಷೆ ಆಯ್ಕೆಮಾಡಿ.",
            "error"
        );

        return;
    }


    showMessage(
        "Students Load ಆಗುತ್ತಿದೆ...",
        "info"
    );


    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .from("students")
        .select("*")
        .order(
            "roll_no",
            {
                ascending:true
            }
        );


        if(error){

            throw error;
        }


        if(
            !data ||
            data.length === 0
        ){

            showMessage(
                "students tableನಲ್ಲಿ data ಇಲ್ಲ.",
                "error"
            );

            return;
        }


        console.log(
            "ALL STUDENTS:",
            data
        );


        console.log(
            "CLASS VALUES:",
            [
                ...new Set(
                    data.map(
                        s =>
                        s.class_name
                    )
                )
            ]
        );


        console.log(
            "DIVISION VALUES:",
            [
                ...new Set(
                    data.map(
                        s =>
                        s.division
                    )
                )
            ]
        );


        students =
            data.filter(
                student => {

                    const dbClass =
                        normalizeClass(
                            student.class_name
                        );


                    const dbDivision =
                        normalizeDivision(
                            student.division
                        );


                    return (
                        dbClass ===
                        selectedClass
                        &&
                        dbDivision ===
                        "A"
                    );
                }
            );


        console.log(
            "FILTERED STUDENTS:",
            students
        );


        if(
            students.length === 0
        ){

            const classValues =
                [
                    ...new Set(
                        data.map(
                            s =>
                            s.class_name
                        )
                    )
                ];


            const divisionValues =
                [
                    ...new Set(
                        data.map(
                            s =>
                            s.division
                        )
                    )
                ];


            document.getElementById(
                "marksArea"
            ).innerHTML = `

                <div class="db-info">

                    <h3>
                        ⚠️ ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ
                    </h3>

                    <b>
                        Database Class Values:
                    </b>

                    <br>

                    ${
                        classValues
                        .map(
                            value =>
                            `
                            <span class="value-box">
                                ${escapeHtml(value)}
                            </span>
                            `
                        )
                        .join("")
                    }

                    <br><br>

                    <b>
                        Database Division Values:
                    </b>

                    <br>

                    ${
                        divisionValues
                        .map(
                            value =>
                            `
                            <span class="value-box">
                                ${escapeHtml(value)}
                            </span>
                            `
                        )
                        .join("")
                    }

                    <br><br>

                    ಆಯ್ಕೆ:
                    <b>
                        ${selectedClass} - A
                    </b>

                </div>
            `;


            showMessage(
                `${selectedClass}ನೇ ತರಗತಿ - A ವಿಭಾಗದಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ.`,
                "error"
            );

            return;
        }


        createMarksTable();


        document.getElementById(
            "studentCount"
        ).innerText =
            `ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: ${students.length}`;


        showMessage(
            `✅ ${students.length} ವಿದ್ಯಾರ್ಥಿಗಳು Load ಆಗಿದ್ದಾರೆ.`,
            "success"
        );

    }
    catch(error){

        console.error(
            error
        );


        showMessage(
            "Students Load Error: " +
            error.message,
            "error"
        );
    }

}


/* =====================================================
   CREATE MARKS TABLE
===================================================== */

function createMarksTable(){

    let html = `

        <div class="table-wrap">

        <table>

        <thead>

        <tr>

            <th rowspan="2">
                Roll No
            </th>

            <th rowspan="2">
                ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು
            </th>

            <th rowspan="2">
                SATS No
            </th>

    `;


    SUBJECTS.forEach(
        subject => {

            const max =
                getMaxMarks(
                    subject
                );


            html += `

                <th colspan="2">

                    ${escapeHtml(
                        subject.name
                    )}

                    <div class="subject-code">

                        ${subject.code}

                    </div>

/* =====================================================
   UPDATE SUBJECT GRADE
===================================================== */

function updateGrade(
    studentIndex,
    subjectIndex
){

    const input =
        document.getElementById(
            `mark_${studentIndex}_${subjectIndex}`
        );


    const grade =
        document.getElementById(
            `grade_${studentIndex}_${subjectIndex}`
        );


    const subject =
        SUBJECTS[
            subjectIndex
        ];


    const max =
        getMaxMarks(
            subject
        );


    let value =
        input.value;


    if(
        value !== "" &&
        Number(value) > max
    ){

        input.value =
            max;

        value =
            max;
    }


    if(
        value !== "" &&
        Number(value) < 0
    ){

        input.value =
            0;

        value =
            0;
    }


    grade.innerText =
        calculateGrade(
            value,
            max
        );


    updateStudentSummary(
        studentIndex
    );
}


/* =====================================================
   UPDATE TOTAL / % / RESULT
===================================================== */

function updateStudentSummary(
    studentIndex
){

    if(
        students.length === 0
    ){

        return;
    }


    let total = 0;

    let maxTotal = 0;

    let entered = 0;

    let failedSubject = false;


    SUBJECTS.forEach(
        (subject,sIndex) => {

            const input =
                document.getElementById(
                    `mark_${studentIndex}_${sIndex}`
                );


            if(!input){

                return;
            }


            const max =
                getMaxMarks(
                    subject
                );


            maxTotal +=
                max;


            if(
                input.value !== ""
            ){

                const mark =
                    Number(
                        input.value
                    );


                if(
                    !isNaN(mark)
                ){

                    total +=
                        mark;

                    entered++;


                    if(
                        (mark / max) * 100
                        < 30
                    ){

                        failedSubject =
                            true;
                    }

                }

            }

        }
    );


    const percentage =
        maxTotal > 0
        ? (total / maxTotal) * 100
        : 0;


    const grade =
        entered === SUBJECTS.length
        ? calculateOverallGrade(
            percentage
          )
        : "";


    let result =
        "PENDING";


    if(
        entered ===
        SUBJECTS.length
    ){

        if(
            failedSubject
        ){

            result =
                "FAIL";

        }else{

            result =
                "PASS";
        }
    }


    document.getElementById(
        `total_${studentIndex}`
    ).innerText =
        total.toFixed(2);


    document.getElementById(
        `maxTotal_${studentIndex}`
    ).innerText =
        maxTotal;


    document.getElementById(
        `percentage_${studentIndex}`
    ).innerText =
        percentage.toFixed(2) +
        "%";


    document.getElementById(
        `overallGrade_${studentIndex}`
    ).innerText =
        grade;


    const resultCell =
        document.getElementById(
            `result_${studentIndex}`
        );


    resultCell.innerText =
        result;


    resultCell.className =
        result === "PASS"
        ? "pass"
        : result === "FAIL"
        ? "fail"
        : "pending";


    document.getElementById(
        `sum_total_${studentIndex}`
    ).innerText =
        total.toFixed(2);


    document.getElementById(
        `sum_max_${studentIndex}`
    ).innerText =
        maxTotal;


    document.getElementById(
        `sum_percentage_${studentIndex}`
    ).innerText =
        percentage.toFixed(2) +
        "%";


    document.getElementById(
        `sum_grade_${studentIndex}`
    ).innerText =
        grade;


    const summaryResult =
        document.getElementById(
            `sum_result_${studentIndex}`
        );


    summaryResult.innerText =
        result;


    summaryResult.className =
        result === "PASS"
        ? "pass"
        : result === "FAIL"
        ? "fail"
        : "pending";

}

/* =====================================================

===================================================== */

function downloadExcel(){

    if(
        students.length === 0
    ){

        showMessage(
            "ಮೊದಲು Students Load ಮಾಡಿ.",
            "error"
        );

        return;
    }


    const cls =
        document
        .getElementById(
            "classSelect"
        )
        .value;


    const exam =
        document
        .getElementById(
            "examSelect"
        )
        .value;


    const headers = [

        "Roll No",

        "Student Name",

        "Father Name",

        "Mother Name",

        "SATS No",

        "Class",

        "Division",

        "Exam"

    ];


    SUBJECTS.forEach(
        subject => {

            headers.push(
                subject.name
            );

        }
    );


    headers.push(
        "Total Marks"
    );

    headers.push(
        "Maximum Marks"
    );

    headers.push(
        "Percentage"
    );

    headers.push(
        "Grade"
    );

    headers.push(
        "Result"
    );


    const rows = [];


    students.forEach(
        (student,index) => {

            const row = [

                student.roll_no || "",

                student.student_name || "",

                student.father_name || "",

                student.mother_name || "",

                student.sats_no || "",

                cls,

                "A",

                exam

            ];


            let total = 0;

            let maxTotal = 0;


            SUBJECTS.forEach(
                (subject,sIndex) => {

                    const input =
                        document.getElementById(
                            `mark_${index}_${sIndex}`
                        );


                    const max =
                        getMaxMarks(
                            subject
                        );


                    maxTotal +=
                        max;


                    if(
                        input &&
                        input.value !== ""
                    ){

                        total +=
                            Number(
                                input.value
                            );

                        row.push(
                            Number(
                                input.value
                            )
                        );

                    }else{

                        row.push("");
                    }

                }
            );


            const percentage =
                maxTotal > 0
                ? (
                    total /
                    maxTotal
                  ) * 100
                : 0;


            let failed = false;

            SUBJECTS.forEach(
                (subject,sIndex) => {

                    const input =
                        document.getElementById(
                            `mark_${index}_${sIndex}`
                        );


                    if(
                        input &&
                        input.value !== ""
                    ){

                        const mark =
                            Number(
                                input.value
                            );


                        const max =
                            getMaxMarks(
                                subject
                            );


                        if(
                            (mark / max) *
                            100 < 30
                        ){

                            failed =
                                true;
                        }
                    }

                }
            );


            let result =
                "PENDING";


            if(
                SUBJECTS.every(
                    (_,sIndex) => {

                        const input =
                            document.getElementById(
                                `mark_${index}_${sIndex}`
                            );

                        return (
                            input &&
                            input.value !== ""
                        );

                    }
                )
            ){

                result =
                    failed
                    ? "FAIL"
                    : "PASS";
            }


            row.push(
                Number(
                    total.toFixed(2)
                )
            );


            row.push(
                maxTotal
            );


            row.push(
                Number(
                    percentage.toFixed(2)
                )
            );


            row.push(
                calculateOverallGrade(
                    percentage
                )
            );


            row.push(
                result
            );


            rows.push(row);

        }
    );


    const worksheet =
        XLSX.utils.aoa_to_sheet(
            [
                headers,
                ...rows
            ]
        );


    worksheet["!cols"] =
        headers.map(
            () => ({
                wch:18
            })
        );


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Marks Entry"
    );


    XLSX.writeFile(
        workbook,
        `Marks_${cls}_A.xlsx`
    );


    showMessage(
        "✅ Excel Download ಆಗಿದೆ.",
        "success"
    );

}


/* =====================================================
   EXCEL UPLOAD
===================================================== */

async function uploadExcel(event){

    const file =
        event.target.files[0];


    if(!file){

        return;
    }


    if(
        students.length === 0
    ){

        showMessage(
            "ಮೊದಲು Students Load ಮಾಡಿ.",
            "error"
        );

        event.target.value =
            "";

        return;
    }


    try{

        const buffer =
            await file.arrayBuffer();


        const workbook =
            XLSX.read(
                buffer,
                {
                    type:"array"
                }
            );


        const sheet =
            workbook.Sheets[
                workbook.SheetNames[0]
            ];


        const rows =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    defval:""
                }
            );


        let count = 0;


        rows.forEach(
            row => {

                const roll =
                    String(
                        row["Roll No"] || ""
                    ).trim();


                if(!roll){

                    return;
                }


                const student =
                    students.find(
                        s =>
                        String(
                            s.roll_no || ""
                        ).trim()
                        === roll
                    );


                if(!student){

                    return;
                }


                const index =
                    students.indexOf(
                        student
                    );


                SUBJECTS.forEach(
                    (subject,sIndex) => {

                        const value =
                            row[
                                subject.name
                            ];


                        if(
                            value === "" ||
                            value === undefined
                        ){

                            return;
                        }


                        const number =
                            Number(value);


                        const max =
                            getMaxMarks(
                                subject
                            );


                        if(
                            isNaN(number) ||
                            number < 0 ||
                            number > max
                        ){

                            return;
                        }


                        const input =
                            document.getElementById(
                                `mark_${index}_${sIndex}`
                            );


                        if(input){

                            input.value =
                                number;


                            updateGrade(
                                index,
                                sIndex
                            );

                        }

                    }
                );


                updateStudentSummary(
                    index
                );


                count++;

            }
        );


        showMessage(
            `✅ ${count} ವಿದ್ಯಾರ್ಥಿಗಳ marks Excelನಿಂದ ಬಂದಿದೆ.`,
            "success"
        );

    }
    catch(error){

        console.error(
            error
        );


        showMessage(
            "Excel Upload Error: " +
            error.message,
            "error"
        );

    }


    event.target.value =
        "";

}


/* =====================================================
   SAVE MARKS
===================================================== */

async function saveMarks(){

    /*
       ಈಗ marks screenನಲ್ಲಿ validation
       ಮಾಡಲಾಗುತ್ತದೆ.

       ನಿಮ್ಮ Supabase marks table structure
       ಬದಲಾಗಿರುವ ಸಾಧ್ಯತೆ ಇರುವುದರಿಂದ
       ತಪ್ಪು columnsಗೆ data save ಆಗದಂತೆ
       ಈ versionನಲ್ಲಿ validation ಮಾತ್ರ.
    */


    if(
        students.length === 0
    ){

        showMessage(
            "ಮೊದಲು Students Load ಮಾಡಿ.",
            "error"
        );

        return;
    }


    let totalEntries = 0;

    let invalid = false;


    students.forEach(
        (student,index) => {

            SUBJECTS.forEach(
                (subject,sIndex) => {

                    const input =
                        document.getElementById(
                            `mark_${index}_${sIndex}`
                        );


                    if(!input){

                        return;
                    }


                    if(
                        input.value === ""
                    ){

                        return;
                    }


                    const mark =
                        Number(
                            input.value
                        );


                    const max =
                        getMaxMarks(
                            subject
                        );


                    if(
                        isNaN(mark) ||
                        mark < 0 ||
                        mark > max
                    ){

                        invalid =
                            true;

                        return;
                    }


                    totalEntries++;

                }
            );

        }
    );


    if(invalid){

        showMessage(
            "❌ ಕೆಲವು marks ಗರಿಷ್ಠ ಮಿತಿಯನ್ನು ಮೀರಿವೆ.",
            "error"
        );

        return;
    }


    students.forEach(
        (_,index) => {

            updateStudentSummary(
                index
            );

        }
    );


    showMessage(
        `✅ ${totalEntries} marks validation ಪೂರ್ಣಗೊಂಡಿದೆ.`,
        "success"
    );

}
