.info{

.roll{

}

.total{

}

}

.max{

}

.summary{

}

.empty{
    text-align:center;

}

.loading{
    text-align:center;

}

@media(max-width:800px){

    .controls{
        grid-template-columns:1fr;
    }

        font-size:22px;

}

</style>
</head>

<div class="header">

    <h2>

    </h2>

    <p style="margin-top:8px;">

</div>


<div class="container">

<div class="card">

        <h2>ಅಂಕಗಳ ನಮೂದು</h2>

    <div class="controls">

            <label>

            <select id="divisionSelect">

        <div class="form-group">

            </label>

            <select id="examSelect">

<div class="card" id="marksCard" style="display:none;">

    <div

        display:flex;

        "
    >

        <h3 id="tableTitle">
            Marks Entry
        </h3>


        <div style="display:flex;gap:8px;">

            <button
                class="save-btn"
                onclick="saveAllMarks()"
                id="saveBtn"
            >
                💾 Save All Marks
            </button>

            <button

            >
                Clear
            </button>

        </div>

    <div class="table-wrapper">

            <thead id="tableHead"></thead>

            <tbody id="tableBody"></tbody>

</div>


</div>


<script>

/* =========================================================
   SUPABASE CONNECTION
   ========================================================= */

const SUPABASE_URL =
"https://ezmudfrpcvjsngjibvoq.supabase.co";

const SUPABASE_KEY =
"sb_publishable__FYyH6NQaqgARaq2dvuovQ_rKmus0js";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let students = [];
let subjects = [];
let exams = [];
let existingMarks = {};

let selectedClass = "";
let selectedExam = "";
let selectedExamId = "";


/* =========================================================
   GET MAX MARKS
   ========================================================= */

function getMaxMarks(className, subjectCode, examCode){

    className = String(className);
    subjectCode = String(subjectCode);

    /* 8ನೇ ತರಗತಿ */

    if(className === "8"){

        if(examCode === "TERM-1"){
            return 50;
        }

        if(examCode === "ANNUAL"){
            return 100;
        }

    }


    /* 9 ಮತ್ತು 10 */

    if(className === "9" || className === "10"){

        if(examCode === "TERM-1"){

            if(subjectCode === "KAN"){
                return 100;
            }

            return 80;
        }


        if(examCode === "ANNUAL"){

            if(subjectCode === "KAN"){
                return 125;
            }

            return 100;
        }

    }


    return 100;
}


/* =========================================================
   8ನೇ ತರಗತಿ GRADE
   ========================================================= */

function getGrade(className, marks, maxMarks){

    if(
        className !== "8" ||
        marks === "" ||
        marks === null ||
        marks === undefined
    ){
        return "";
    }

    marks = Number(marks);
    maxMarks = Number(maxMarks);


    /* 50ಕ್ಕೆ */

    if(maxMarks === 50){

        if(marks >= 45) return "A+";
        if(marks >= 35) return "A";
        if(marks >= 25) return "B+";
        if(marks >= 15) return "B";

        return "C";
    }


    /* 100ಕ್ಕೆ */

    if(maxMarks === 100){

        if(marks >= 90) return "A+";
        if(marks >= 70) return "A";
        if(marks >= 50) return "B+";
        if(marks >= 30) return "B";

        return "C";
    }


    return "";
}


/* =========================================================
   LOAD MARKS ENTRY
   ========================================================= */

async function loadMarksEntry(){

    const className =
        document.getElementById("classSelect").value;

    const division =
        document.getElementById("divisionSelect").value;

    const examCode =
        document.getElementById("examSelect").value;


    if(!className){

        showMessage(
            "ದಯವಿಟ್ಟು ತರಗತಿ ಆಯ್ಕೆಮಾಡಿ.",
            "error"
        );

        return;
    }


    if(!examCode){

        showMessage(
            "ದಯವಿಟ್ಟು ಪರೀಕ್ಷೆ ಆಯ್ಕೆಮಾಡಿ.",
            "error"
        );

        return;
    }


    selectedClass = className;
    selectedExam = examCode;


    const loadBtn =
        document.getElementById("loadBtn");

    loadBtn.disabled = true;
    loadBtn.textContent =
        "Loading...";


    document.getElementById("marksCard")
        .style.display = "block";

    document.getElementById("tableBody")
        .innerHTML =
        `<tr>
            <td colspan="20" class="loading">
                ವಿದ್ಯಾರ್ಥಿಗಳ ಮಾಹಿತಿ Loading...
            </td>
        </tr>`;


    try{

        /* -----------------------------------------
           EXAM
        ----------------------------------------- */

        const {
            data: examData,
            error: examError
        } = await supabaseClient
            .from("exams")
            .select("*")
            .eq("exam_code", examCode)
            .eq("active", true)
            .maybeSingle();


        if(examError)
            throw examError;


        if(!examData){

            throw new Error(
                "Selected exam databaseನಲ್ಲಿ ಕಂಡುಬಂದಿಲ್ಲ."
            );

        }


        selectedExamId = examData.id;


        /* -----------------------------------------
           STUDENTS
        ----------------------------------------- */

        const {
            data: studentData,
            error: studentError
        } = await supabaseClient
            .from("students")
            .select("*")
            .eq("class_name", className)
            .eq("division", division)
            .eq("is_active", true)
            .order("roll_no", {
                ascending:true
            });


        if(studentError)
            throw studentError;


        students = studentData || [];


        /* -----------------------------------------
           SUBJECTS
        ----------------------------------------- */

        const {
            data: subjectData,
            error: subjectError
        } = await supabaseClient
            .from("subjects")
            .select("*")
            .eq("class_name", className)
            .eq("is_active", true)
            .order("display_order", {
                ascending:true
            });


        if(subjectError)
            throw subjectError;


        subjects = subjectData || [];


        if(students.length === 0){

            document.getElementById("tableBody")
                .innerHTML =
                `<tr>
                    <td
                        colspan="20"
                        class="empty"
                    >
                        ${className}ನೇ ತರಗತಿ - A ವಿಭಾಗದಲ್ಲಿ
                        ವಿದ್ಯಾರ್ಥಿಗಳು ಕಂಡುಬಂದಿಲ್ಲ.
                    </td>
                </tr>`;

            updateInfo();

            return;
        }


        if(subjects.length === 0){

            throw new Error(
                "ಈ ತರಗತಿಗೆ Subjects ಕಂಡುಬಂದಿಲ್ಲ."
            );

        }


        /* -----------------------------------------
           EXISTING MARKS
        ----------------------------------------- */

        const studentIds =
            students.map(s => s.id);


        const {
            data: marksData,
            error: marksError
        } = await supabaseClient
            .from("marks")
            .select("*")
            .eq("exam_id", selectedExamId)
            .in("student_id", studentIds);


        if(marksError)
            throw marksError;


        existingMarks = {};


        (marksData || []).forEach(mark => {

            const key =
                mark.student_id +
                "_" +
                mark.subject_id;

            existingMarks[key] = mark;

        });


        buildTable();

        updateInfo();

        showMessage(
            "ವಿದ್ಯಾರ್ಥಿಗಳು ಮತ್ತು Subjects ಯಶಸ್ವಿಯಾಗಿ Load ಆಗಿವೆ.",
            "success"
        );

    }
    catch(error){

        console.error(error);

        document.getElementById("tableBody")
            .innerHTML = "";

        showMessage(
            "Data load ಮಾಡುವಾಗ ಸಮಸ್ಯೆ: " +
            (error.message || error),
            "error"
        );

    }
    finally{

        loadBtn.disabled = false;

        loadBtn.textContent =
            "🔍 Load Students";

    }

}


/* =========================================================
   BUILD TABLE
   ========================================================= */

function buildTable(){

    const thead =
        document.getElementById("tableHead");

    const tbody =
        document.getElementById("tableBody");


    /* HEADER */

    let headerHTML = `

        <tr>

            <th rowspan="2">
                Sl.No
            </th>

            <th rowspan="2">
                Roll No
            </th>

            <th rowspan="2">
                ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು
            </th>
    `;


    subjects.forEach(subject => {

        const max =
            getMaxMarks(
                selectedClass,
                subject.subject_code,
                selectedExam
            );


        headerHTML += `

            <th>
                ${escapeHtml(subject.subject_name)}
            </th>

        `;

    });


    headerHTML += `

            <th rowspan="2">
                ಒಟ್ಟು
            </th>

            <th rowspan="2">
                Grade
            </th>

        </tr>

        <tr>
    `;


    subjects.forEach(subject => {

        const max =
            getMaxMarks(
                selectedClass,
                subject.subject_code,
                selectedExam
            );


        headerHTML += `

            <th class="max">
                / ${max}
            </th>

        `;

    });


    headerHTML += `

        </tr>
    `;


    thead.innerHTML =
        headerHTML;


    /* BODY */

    let bodyHTML = "";


    students.forEach((student,index) => {

        bodyHTML += `

        <tr data-student-id="${student.id}">

            <td>
                ${index + 1}
            </td>

            <td class="roll">
                ${escapeHtml(student.roll_no || "")}
            </td>

            <td class="student-name">
                ${escapeHtml(student.student_name || "")}
            </td>

        `;


        subjects.forEach(subject => {

            const max =
                getMaxMarks(
                    selectedClass,
                    subject.subject_code,
                    selectedExam
                );


            const key =
                student.id +
                "_" +
                subject.id;


            const oldMark =
                existingMarks[key];


            const oldValue =
                oldMark &&
                oldMark.marks_obtained !== null
                    ? oldMark.marks_obtained
                    : "";


            const oldGrade =
                oldMark &&
                oldMark.grade
                    ? oldMark.grade
                    : "";


            const grade =
                oldValue !== ""
                    ? getGrade(
                        selectedClass,
                        oldValue,
                        max
                      )
                    : oldGrade;


            bodyHTML += `

                <td>

                    <input
                        type="number"
                        class="mark-input"
                        min="0"
                        max="${max}"
                        step="1"
                        value="${oldValue}"
                        data-student="${student.id}"
                        data-subject="${subject.id}"
                        data-code="${subject.subject_code}"
                        data-max="${max}"
                        data-old-grade="${grade}"
                        oninput="handleMarkInput(this)"
                    >

                    <div
                        class="grade"
                        id="grade-${student.id}-${subject.id}"
                    >
                        ${grade}
                    </div>

                </td>

            `;

        });


        bodyHTML += `

            <td
                class="total"
                id="total-${student.id}"
            >
                0
            </td>

            <td
                class="total-grade"
                id="total-grade-${student.id}"
            >
                ${selectedClass === "8" ? "C" : ""}
            </td>

        </tr>

        `;

    });


    tbody.innerHTML =
        bodyHTML;


    students.forEach(student => {

        calculateStudentTotal(
            student.id
        );

    });

}


/* =========================================================
   MARK INPUT
   ========================================================= */

function handleMarkInput(input){

    const max =
        Number(input.dataset.max);

    let value =
        input.value;


    if(value !== ""){

        value = Number(value);


        if(value < 0){

            input.value = 0;

        }


        if(value > max){

            input.value = max;

            showMessage(
                `ಗರಿಷ್ಠ ಅಂಕ ${max} ಮಾತ್ರ.`,
                "error"
            );

        }

    }


    const studentId =
        input.dataset.student;

    const subjectId =
        input.dataset.subject;


    const grade =
        getGrade(
            selectedClass,
            input.value,
            max
        );


    const gradeElement =
        document.getElementById(
            `grade-${studentId}-${subjectId}`
        );


    if(gradeElement){

        gradeElement.textContent =
            grade;

    }


    calculateStudentTotal(
        studentId
    );

}


/* =========================================================
   TOTAL
   ========================================================= */

function calculateStudentTotal(studentId){

    const inputs =
        document.querySelectorAll(
            `.mark-input[data-student="${studentId}"]`
        );


    let total = 0;
    let maximum = 0;


    inputs.forEach(input => {

        const value =
            Number(input.value || 0);

        const max =
            Number(input.dataset.max || 0);

        total += value;
        maximum += max;

    });


    const totalElement =
        document.getElementById(
            `total-${studentId}`
        );


    if(totalElement){

        totalElement.textContent =
            total;

    }


    const totalGradeElement =
        document.getElementById(
            `total-grade-${studentId}`
        );


    if(
        totalGradeElement &&
        selectedClass === "8"
    ){

        totalGradeElement.textContent =
            getGrade(
                "8",
                total,
                maximum
            );

    }


    updateSummary();

}


/* =========================================================
   TOTAL SUMMARY
   ========================================================= */

function updateSummary(){

    let totalStudents =
        students.length;

    let entered =
        0;

    let totalMarks =
        0;


    document.querySelectorAll(
        ".mark-input"
    ).forEach(input => {

        if(input.value !== ""){
            entered++;
            totalMarks +=
                Number(input.value);
        }

    });


    document.getElementById("summary")
        .innerHTML = `

        <b>ತರಗತಿ:</b>
        ${selectedClass}

        &nbsp;&nbsp; | &nbsp;&nbsp;

        <b>ವಿಭಾಗ:</b>
        A

        &nbsp;&nbsp; | &nbsp;&nbsp;

        <b>ಪರೀಕ್ಷೆ:</b>
        ${selectedExam === "TERM-1"
            ? "ಅರ್ಧವಾರ್ಷಿಕ"
            : "ವಾರ್ಷಿಕ"}

        &nbsp;&nbsp; | &nbsp;&nbsp;

        <b>ವಿದ್ಯಾರ್ಥಿಗಳು:</b>
        ${totalStudents}

        &nbsp;&nbsp; | &nbsp;&nbsp;

        <b>ನಮೂದಿಸಿದ ಅಂಕಗಳು:</b>
        ${entered}

        &nbsp;&nbsp; | &nbsp;&nbsp;

        <b>ಒಟ್ಟು ನಮೂದಿಸಿದ ಅಂಕ:</b>
        ${totalMarks}

    `;

}


/* =========================================================
   SAVE ALL MARKS
   ========================================================= */

async function saveAllMarks(){

    if(
        !selectedClass ||
        !selectedExamId ||
        students.length === 0
    ){

        showMessage(
            "ಮೊದಲು Class ಮತ್ತು Exam Load ಮಾಡಿ.",
            "error"
        );

        return;
    }


    const saveBtn =
        document.getElementById("saveBtn");


    saveBtn.disabled = true;

    saveBtn.textContent =
        "Saving...";


    try{

        const inputs =
            Array.from(
                document.querySelectorAll(
                    ".mark-input"
                )
            );


        let savedCount = 0;


        for(const input of inputs){

            const studentId =
                input.dataset.student;

            const subjectId =
                input.dataset.subject;

            const max =
                Number(input.dataset.max);


            const value =
                input.value.trim();


            /* Empty mark */

            if(value === ""){

                continue;

            }


            const marks =
                Number(value);


            if(
                Number.isNaN(marks) ||
                marks < 0 ||
                marks > max
            ){

                throw new Error(
                    "Invalid marks for one or more students."
                );

            }


            const grade =
                getGrade(
                    selectedClass,
                    marks,
                    max
                );


            /* Check existing row */

            const {
                data: existing,
                error: findError
            } = await supabaseClient
                .from("marks")
                .select("id")
                .eq("student_id", studentId)
                .eq("subject_id", subjectId)
                .eq("exam_id", selectedExamId)
                .maybeSingle();


            if(findError)
                throw findError;


            if(existing){

                /* UPDATE */

                const {
                    error: updateError
                } = await supabaseClient
                    .from("marks")
                    .update({

                        marks_obtained: marks,

                        grade:
                            grade || null

                    })
                    .eq("id", existing.id);


                if(updateError)
                    throw updateError;

            }
            else{

                /* INSERT */

                const {
                    error: insertError
                } = await supabaseClient
                    .from("marks")
                    .insert({

                        student_id:
                            studentId,

                        subject_id:
                            subjectId,

                        exam_id:
                            selectedExamId,

                        marks_obtained:
                            marks,

                        grade:
                            grade || null

                    });


                if(insertError)
                    throw insertError;

            }


            savedCount++;

        }


        showMessage(
            `ಯಶಸ್ವಿಯಾಗಿ Save ಆಗಿದೆ. ${savedCount} ಅಂಕಗಳು ಉಳಿಸಲಾಗಿದೆ.`,
            "success"
        );


        /* Reload */

        await loadMarksEntry();


    }
    catch(error){

        console.error(error);

        showMessage(
            "Marks save ಮಾಡುವಾಗ ಸಮಸ್ಯೆ: " +
            (error.message || error),
            "error"
        );

    }
    finally{

        saveBtn.disabled = false;

        saveBtn.textContent =
            "💾 Save All Marks";

    }

}

/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";


    setTimeout(() => {

        message.style.display =
            "none";

    },5000);

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
