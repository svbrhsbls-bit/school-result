<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Marks Entry - School Result Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Noto Sans Kannada","Arial",sans-serif;
    background:#eef5fb;
    color:#17324d;
}

.header{
    background:linear-gradient(135deg,#1167a8,#168bc1);
    color:white;
    text-align:center;
    padding:25px 15px;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    margin:7px 0 0;
    font-size:17px;
}

.container{
    width:96%;
    max-width:1500px;
    margin:25px auto;
}

.card{
    background:white;
    border-radius:16px;
    padding:22px;
    margin-bottom:22px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.filters{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

select,input{
    width:100%;
    padding:12px;
    border:1px solid #cbd8e5;
    border-radius:8px;
    font-size:15px;
    background:white;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin:5px;
}

.btn-load{background:#1175b5;color:white}
.btn-save{background:#159447;color:white}
.btn-excel{background:#198754;color:white}
.btn-template{background:#6f42c1;color:white}
.btn-print{background:#343a40;color:white}
.btn-clear{background:#6c757d;color:white}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
    font-weight:bold;
}

.success{
    display:block;
    background:#dff6e7;
    color:#146c2e;
}

.error{
    display:block;
    background:#ffe1e1;
    color:#a40000;
}

.info{
    display:block;
    background:#e2f0ff;
    color:#07558c;
}

.top-actions{
    margin-top:18px;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
}

th{
    background:#146da7;
    color:white;
    padding:12px 8px;
    border:1px solid #0d5b8d;
    text-align:center;
    white-space:nowrap;
}

td{
    border:1px solid #d8e1e8;
    padding:8px;
    text-align:center;
    background:#fff;
}

.student-name{
    text-align:left;
    font-weight:bold;
    min-width:210px;
}

.roll{
    width:80px;
    font-weight:bold;
}

.mark-input{
    width:75px;
    text-align:center;
    padding:8px;
}

.grade-box{
    display:inline-block;
    min-width:45px;
    padding:7px 5px;
    border-radius:6px;
    font-weight:bold;
    background:#f1f3f5;
}

.subject-head{
    min-width:150px;
}

.subject-code{
    display:block;
    font-size:12px;
    opacity:.9;
}

.max-mark{
    display:block;
    font-size:11px;
    color:#e8f5ff;
}

.student-count{
    display:inline-block;
    background:#eaf5ff;
    padding:10px 16px;
    border-radius:8px;
    font-weight:bold;
    margin-bottom:15px;
}

.loading{
    text-align:center;
    padding:35px;
    font-size:18px;
    color:#777;
}

@media(max-width:800px){
    .filters{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:23px;
    }
}

@media print{

    body{
        background:white;
    }

    .header{
        background:white !important;
        color:black !important;
        padding:10px;
    }

    .card{
        box-shadow:none;
        border:0;
        padding:5px;
    }

    .filters,
    .top-actions,
    .message,
    .no-print{
        display:none !important;
    }

    .container{
        width:100%;
        margin:0;
    }

    table{
        min-width:0;
        font-size:10px;
    }

    th,td{
        padding:5px 3px;
    }

    .mark-input{
        border:0;
        width:45px;
        padding:2px;
    }

    .grade-box{
        padding:2px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>📝 ಅಂಕಗಳ ನಮೂದು</h1>
    <p>Marks Entry / ಶಾಲಾ ಫಲಿತಾಂಶ ನಿರ್ವಹಣಾ ವ್ಯವಸ್ಥೆ</p>
</div>

<div class="container">

<div class="card">

    <div class="filters">

        <div>
            <label>ತರಗತಿ / Class</label>
            <select id="classSelect">
                <option value="">ತರಗತಿ ಆಯ್ಕೆಮಾಡಿ</option>
                <option value="8">8ನೇ ತರಗತಿ</option>
                <option value="9">9ನೇ ತರಗತಿ</option>
                <option value="10">10ನೇ ತರಗತಿ</option>
            </select>
        </div>

        <div>
            <label>ವಿಭಾಗ / Division</label>
            <select id="divisionSelect">
                <option value="">ವಿಭಾಗ ಆಯ್ಕೆಮಾಡಿ</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
            </select>
        </div>

        <div>
            <label>ಪರೀಕ್ಷೆ / Exam</label>
            <select id="examSelect">
                <option value="">ಪರೀಕ್ಷೆ ಆಯ್ಕೆಮಾಡಿ</option>
                <option value="half_yearly">ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ</option>
                <option value="annual">ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ</option>
            </select>
        </div>

    </div>

    <div class="top-actions no-print">

        <button class="btn-load" onclick="loadStudentsAndSubjects()">
            🔄 ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು Load ಮಾಡಿ
        </button>

        <button class="btn-excel" onclick="document.getElementById('excelFile').click()">
            📥 Excel Upload
        </button>

        <input
            type="file"
            id="excelFile"
            accept=".xlsx,.xls,.csv"
            style="display:none"
            onchange="importExcel(event)"
        >

        <button class="btn-template" onclick="downloadTemplate()">
            📄 Excel Template
        </button>

        <button class="btn-print" onclick="window.print()">
            🖨️ Print
        </button>

        <button class="btn-clear" onclick="clearMarks()">
            ✖ Clear
        </button>

    </div>

    <div id="message" class="message"></div>

</div>


<div class="card">

    <div id="studentInfo"></div>

    <div id="tableArea">
        <div class="loading">
            ತರಗತಿ, ವಿಭಾಗ ಮತ್ತು ಪರೀಕ್ಷೆಯನ್ನು ಆಯ್ಕೆ ಮಾಡಿ<br>
            ನಂತರ "ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು Load ಮಾಡಿ" ಒತ್ತಿ.
        </div>
    </div>

    <div class="top-actions no-print">

        <button class="btn-save" onclick="saveAllMarks()">
            💾 Save All Marks
        </button>

        <button class="btn-excel" onclick="downloadExcel()">
            📊 Excel Download
        </button>

        <button class="btn-print" onclick="window.print()">
            🖨️ Print Marks Sheet
        </button>

    </div>

</div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   SUBJECT MASTER
   ========================================================= */

const SUBJECTS = [

    {
        code:"01K",
        name:"ಕನ್ನಡ",
        short:"ಕನ್ನಡ"
    },

    {
        code:"31E",
        name:"ಇಂಗ್ಲಿಷ್",
        short:"English"
    },

    {
        code:"61H",
        name:"ಹಿಂದಿ",
        short:"Hindi"
    },

    {
        code:"81K",
        name:"ಗಣಿತ",
        short:"ಗಣಿತ"
    },

    {
        code:"83K",
        name:"ವಿಜ್ಞಾನ",
        short:"ವಿಜ್ಞಾನ"
    },

    {
        code:"85K",
        name:"ಸಮಾಜ ವಿಜ್ಞಾನ",
        short:"ಸಮಾಜ ವಿಜ್ಞಾನ"
    }

];


/* =========================================================
   GLOBAL DATA
   ========================================================= */

let students = [];
let currentSubjects = [];
let marksData = {};


/* =========================================================
   MAX MARKS
   ========================================================= */

function getMaxMarks(className, exam, subjectCode){

    const cls = String(className);

    /* 8th */

    if(cls === "8"){

        if(exam === "half_yearly"){
            return 50;
        }

        if(exam === "annual"){
            return 100;
        }

    }


    /* 9th and 10th */

    if(cls === "9" || cls === "10"){

        if(exam === "half_yearly"){

            if(subjectCode === "01K"){
                return 100;
            }

            return 80;
        }

        if(exam === "annual"){

            if(subjectCode === "01K"){
                return 125;
            }

            return 100;
        }

    }

    return 100;
}


/* =========================================================
   GRADE
   ========================================================= */

function getGrade(mark, max){

    if(mark === "" || mark === null || mark === undefined){
        return "";
    }

    mark = Number(mark);

    if(isNaN(mark)){
        return "";
    }

    if(mark < 0){
        return "C";
    }

    const percentage = (mark / max) * 100;

    if(percentage >= 90) return "A+";
    if(percentage >= 75) return "A";
    if(percentage >= 60) return "B+";
    if(percentage >= 50) return "B";
    if(percentage >= 35) return "C";

    return "F";
}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text,type="info"){

    const box = document.getElementById("message");

    box.className = "message " + type;
    box.textContent = text;
}


/* =========================================================
   LOAD STUDENTS + SUBJECTS
   ========================================================= */

async function loadStudentsAndSubjects(){

    const className = document.getElementById("classSelect").value;
    const division = document.getElementById("divisionSelect").value;
    const exam = document.getElementById("examSelect").value;

    if(!className || !division || !exam){

        showMessage(
            "ದಯವಿಟ್ಟು ತರಗತಿ, ವಿಭಾಗ ಮತ್ತು ಪರೀಕ್ಷೆಯನ್ನು ಆಯ್ಕೆ ಮಾಡಿ.",
            "error"
        );

        return;
    }


    showMessage(
        "ವಿದ್ಯಾರ್ಥಿಗಳ ಮಾಹಿತಿಯನ್ನು Load ಮಾಡಲಾಗುತ್ತಿದೆ...",
        "info"
    );


    try{

        /*
          IMPORTANT:
          students table columns:
          id
          roll_no
          student_name
          class_name
          division
        */

        const {data,error} = await supabaseClient
            .from("students")
            .select("*")
            .eq("class_name",className)
            .eq("division",division)
            .order("roll_no",{ascending:true});


        if(error){
            throw error;
        }


        students = data || [];


        if(students.length === 0){

            document.getElementById("tableArea").innerHTML = `
                <div class="loading">
                    ಈ ತರಗತಿ ಮತ್ತು ವಿಭಾಗದಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಗಳು ಕಂಡುಬಂದಿಲ್ಲ.
                </div>
            `;

            document.getElementById("studentInfo").innerHTML = "";

            showMessage(
                "ವಿದ್ಯಾರ್ಥಿಗಳು ಕಂಡುಬಂದಿಲ್ಲ.",
                "error"
            );

            return;
        }


        currentSubjects = SUBJECTS.map(s => ({
            ...s,
            max:getMaxMarks(className,exam,s.code)
        }));


        await loadExistingMarks();

        renderMarksTable();

        showMessage(
            `${students.length} ವಿದ್ಯಾರ್ಥಿಗಳ ಮಾಹಿತಿ Load ಆಗಿದೆ.`,
            "success"
        );

    }
    catch(error){

        console.error(error);

        showMessage(
            "Students Load ಸಮಸ್ಯೆ: " + error.message,
            "error"
        );
    }
}


/* =========================================================
   LOAD EXISTING MARKS
   ========================================================= */

async function loadExistingMarks(){

    marksData = {};

    if(students.length === 0){
        return;
    }


    const studentIds = students.map(s => s.id);

    const exam = document.getElementById("examSelect").value;


    /*
      result_marks schema is expected to contain:
      student_id
      subject_id OR subject_code
      exam_id OR exam_name
      marks

      To make this code flexible, we first try subject_code/exam_name.
    */

    let result = await supabaseClient
        .from("result_marks")
        .select("*")
        .in("student_id",studentIds);


    if(result.error){

        console.warn(
            "Existing marks load skipped:",
            result.error
        );

        return;
    }


    const rows = result.data || [];


    rows.forEach(row => {

        let studentId = row.student_id;

        let subjectCode =
            row.subject_code ||
            row.subject_code_id ||
            row.subject;

        let examName =
            row.exam_name ||
            row.exam ||
            row.exam_id;


        if(!studentId || !subjectCode){
            return;
        }


        if(examName && examName !== exam){
            return;
        }


        if(!marksData[studentId]){
            marksData[studentId] = {};
        }


        marksData[studentId][subjectCode] =
            row.marks ?? "";

    });

}


/* =========================================================
   RENDER TABLE
   ========================================================= */

function renderMarksTable(){

    let html = "";


    html += `
        <div class="student-count">
            👨‍🎓 ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: ${students.length}
        </div>
    `;


    html += `<div class="table-wrap">`;

    html += `<table id="marksTable">`;

    html += `<thead>`;

    html += `<tr>`;

    html += `<th>ಕ್ರಮ</th>`;
    html += `<th>Roll No</th>`;
    html += `<th>ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು</th>`;


    currentSubjects.forEach(subject => {

        html += `
            <th class="subject-head">
                ${subject.name}
                <span class="subject-code">${subject.code}</span>
                <span class="max-mark">
                    ಗರಿಷ್ಠ: ${subject.max}
                </span>
            </th>
        `;

    });


    html += `</tr>`;

    html += `</thead>`;


    html += `<tbody>`;


    students.forEach((student,index) => {

        html += `<tr>`;

        html += `<td>${index + 1}</td>`;

        html += `
            <td class="roll">
                ${student.roll_no || ""}
            </td>
        `;

        html += `
            <td class="student-name">
                ${escapeHtml(student.student_name || "")}
            </td>
        `;


        currentSubjects.forEach(subject => {

            const existing =
                marksData[student.id] &&
                marksData[student.id][subject.code] !== undefined
                ?
                marksData[student.id][subject.code]
                :
                "";


            const grade =
                getGrade(existing,subject.max);


            html += `
                <td>

                    <input
                        type="number"
                        class="mark-input"
                        min="0"
                        max="${subject.max}"
                        value="${existing}"
                        data-student="${student.id}"
                        data-subject="${subject.code}"
                        data-max="${subject.max}"
                        oninput="markChanged(this)"
                    >

                    <div
                        class="grade-box"
                        id="grade-${student.id}-${subject.code}"
                    >
                        ${grade}
                    </div>

                </td>
            `;

        });


        html += `</tr>`;

    });


    html += `</tbody>`;

    html += `</table>`;

    html += `</div>`;


    document.getElementById("tableArea").innerHTML = html;


    document.getElementById("studentInfo").innerHTML = `
        <div class="student-count">
            ತರಗತಿ: ${document.getElementById("classSelect").value}ನೇ ತರಗತಿ
            &nbsp; | &nbsp;
            ವಿಭಾಗ: ${document.getElementById("divisionSelect").value}
            &nbsp; | &nbsp;
            ಪರೀಕ್ಷೆ: ${getExamText()}
        </div>
    `;
}


/* =========================================================
   MARK CHANGED
   ========================================================= */

function markChanged(input){

    const studentId = input.dataset.student;
    const subjectCode = input.dataset.subject;
    const max = Number(input.dataset.max);

    let value = input.value;


    if(value !== ""){

        let number = Number(value);


        if(number < 0){
            number = 0;
            input.value = 0;
        }


        if(number > max){

            number = max;
            input.value = max;

            showMessage(
                `${subjectCode} ಗರಿಷ್ಠ ${max} ಅಂಕಗಳು ಮಾತ್ರ.`,
                "error"
            );
        }
    }


    const grade =
        getGrade(
            input.value,
            max
        );


    const gradeBox =
        document.getElementById(
            `grade-${studentId}-${subjectCode}`
        );


    if(gradeBox){
        gradeBox.textContent = grade;
    }


    if(!marksData[studentId]){
        marksData[studentId] = {};
    }


    marksData[studentId][subjectCode] =
        input.value;
}


/* =========================================================
   SAVE ALL MARKS
   ========================================================= */

async function saveAllMarks(){

    if(students.length === 0){

        showMessage(
            "ಮೊದಲು ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು Load ಮಾಡಿ.",
            "error"
        );

        return;
    }


    const className =
        document.getElementById("classSelect").value;

    const division =
        document.getElementById("divisionSelect").value;

    const exam =
        document.getElementById("examSelect").value;


    if(!className || !division || !exam){

        showMessage(
            "ತರಗತಿ, ವಿಭಾಗ ಮತ್ತು ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ.",
            "error"
        );

        return;
    }


    showMessage(
        "ಅಂಕಗಳನ್ನು Save ಮಾಡಲಾಗುತ್ತಿದೆ...",
        "info"
    );


    try{

        const inputs =
            document.querySelectorAll(".mark-input");


        for(const input of inputs){

            const studentId =
                input.dataset.student;

            const subjectCode =
                input.dataset.subject;

            const marks =
                input.value === ""
                ? null
                : Number(input.value);


            /*
              Empty marks are ignored.
            */

            if(marks === null){
                continue;
            }


            const existing =
                await supabaseClient
                .from("result_marks")
                .select("*")
                .eq("student_id",studentId)
                .eq("subject_code",subjectCode)
                .eq("exam_name",exam)
                .maybeSingle();


            if(existing.error){
                throw existing.error;
            }


            if(existing.data){

                const {error} =
                    await supabaseClient
                    .from("result_marks")
                    .update({
                        marks:marks
                    })
                    .eq("id",existing.data.id);


                if(error){
                    throw error;
                }

            }
            else{

                const {error} =
                    await supabaseClient
                    .from("result_marks")
                    .insert({

                        student_id:studentId,

                        subject_code:subjectCode,

                        exam_name:exam,

                        marks:marks

                    });


                if(error){
                    throw error;
                }

            }

        }


        showMessage(
            "✅ ಎಲ್ಲಾ ಅಂಕಗಳು ಯಶಸ್ವಿಯಾಗಿ Save ಆಗಿವೆ.",
            "success"
        );

    }
    catch(error){

        console.error(error);

        showMessage(
            "Save ಮಾಡುವಾಗ ಸಮಸ್ಯೆ: " +
            error.message,
            "error"
        );
    }
}


/* =========================================================
   EXCEL TEMPLATE
   ========================================================= */

function downloadTemplate(){

    if(students.length === 0){

        showMessage(
            "ಮೊದಲು ತರಗತಿ ಮತ್ತು ವಿಭಾಗ ಆಯ್ಕೆ ಮಾಡಿ ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು Load ಮಾಡಿ.",
            "error"
        );

        return;
    }


    const rows = [];


    students.forEach(student => {

        const row = {

            "Roll No":
                student.roll_no || "",

            "Student Name":
                student.student_name || ""

        };


        currentSubjects.forEach(subject => {

            row[
                `${subject.name} (${subject.code})`
            ] = "";

        });


        rows.push(row);

    });


    const worksheet =
        XLSX.utils.json_to_sheet(rows);


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Marks Entry"
    );


    XLSX.writeFile(
        workbook,
        "Marks_Entry_Template.xlsx"
    );


    showMessage(
        "Excel Template Download ಆಗಿದೆ.",
        "success"
    );
}


/* =========================================================
   EXCEL DOWNLOAD
   ========================================================= */

function downloadExcel(){

    if(students.length === 0){

        showMessage(
            "ಮೊದಲು ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು Load ಮಾಡಿ.",
            "error"
        );

        return;
    }


    const rows = [];


    students.forEach(student => {

        const row = {

            "Roll No":
                student.roll_no || "",

            "Student Name":
                student.student_name || ""

        };


        currentSubjects.forEach(subject => {

            const value =
                marksData[student.id] &&
                marksData[student.id][subject.code]
                !== undefined
                ?
                marksData[student.id][subject.code]
                :
                "";


            const grade =
                getGrade(
                    value,
                    subject.max
                );


            row[
                `${subject.name} ${subject.code} / ${subject.max}`
            ] =
                value === ""
                ? ""
                : `${value} (${grade})`;

        });


        rows.push(row);

    });


    const worksheet =
        XLSX.utils.json_to_sheet(rows);


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Marks"
    );


    XLSX.writeFile(
        workbook,
        `Marks_${document.getElementById("classSelect").value}_${document.getElementById("divisionSelect").value}.xlsx`
    );


    showMessage(
        "Excel Download ಆಗಿದೆ.",
        "success"
    );
}


/* =========================================================
   IMPORT EXCEL
   ========================================================= */

function importExcel(event){

    const file =
        event.target.files[0];


    if(!file){
        return;
    }


    const reader =
        new FileReader();


    reader.onload = function(e){

        try{

            const data =
                new Uint8Array(e.target.result);


            const workbook =
                XLSX.read(
                    data,
                    {type:"array"}
                );


            const sheet =
                workbook.Sheets[
                    workbook.SheetNames[0]
                ];


            const rows =
                XLSX.utils.sheet_to_json(
                    sheet,
                    {defval:""}
                );


            if(rows.length === 0){

                showMessage(
                    "Excel file ಖಾಲಿಯಾಗಿದೆ.",
                    "error"
                );

                return;
            }


            let imported = 0;


            rows.forEach(row => {

                const roll =
                    String(
                        row["Roll No"] || ""
                    ).trim();


                const student =
                    students.find(
                        s =>
                            String(s.roll_no).trim()
                            === roll
                    );


                if(!student){
                    return;
                }


                if(!marksData[student.id]){
                    marksData[student.id] = {};
                }


                currentSubjects.forEach(subject => {

                    const possibleKeys = [

                        `${subject.name} (${subject.code})`,

                        `${subject.name} ${subject.code}`,

                        subject.code,

                        subject.name

                    ];


                    let value = "";


                    for(const key of possibleKeys){

                        if(
                            row[key] !== undefined &&
                            row[key] !== ""
                        ){

                            value =
                                String(
                                    row[key]
                                )
                                .split("(")[0]
                                .trim();

                            break;
                        }

                    }


                    if(value !== ""){

                        const num =
                            Number(value);


                        if(
                            !isNaN(num) &&
                            num >= 0 &&
                            num <= subject.max
                        ){

                            marksData[
                                student.id
                            ][subject.code] = num;

                            imported++;

                        }

                    }

                });

            });


            renderMarksTable();


            showMessage(
                `Excel‌ನಿಂದ ${imported} ಅಂಕಗಳು Load ಆಗಿವೆ. ಈಗ Save All Marks ಒತ್ತಿ.`,
                "success"
            );

        }
        catch(error){

            console.error(error);

            showMessage(
                "Excel Upload ಸಮಸ್ಯೆ: " +
                error.message,
                "error"
            );
        }

    };


    reader.readAsArrayBuffer(file);

}


/* =========================================================
   CLEAR
   ========================================================= */

function clearMarks(){

    marksData = {};

    if(students.length > 0){

        renderMarksTable();

        showMessage(
            "Marks Entry clear ಮಾಡಲಾಗಿದೆ.",
            "info"
        );

    }
}


/* =========================================================
   EXAM TEXT
   ========================================================= */

function getExamText(){

    const exam =
        document.getElementById("examSelect").value;


    if(exam === "half_yearly"){
        return "ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ";
    }


    if(exam === "annual"){
        return "ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ";
    }


    return "";
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
