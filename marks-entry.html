/* =====================================================
   NORMALIZE CLASS
===================================================== */

function normalizeClass(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    let v =
        String(value)
        .trim()
        .toLowerCase();


    /*
       Kannada digits
       ೮ = 8
       ೯ = 9
       ೧೦ = 10
    */

    v = v
        .replace(/೮/g,"8")
        .replace(/೯/g,"9")
        .replace(/೧೦/g,"10");


    /*
       Remove common words
    */

    v = v
        .replace(/ನೇ/g,"")
        .replace(/ತರಗತಿ/g,"")
        .replace(/th/g,"")
        .replace(/class/g,"")
        .replace(/\s/g,"");


    /*
       If value contains 8/9/10
    */

    if(
        v === "8" ||
        v.includes("8")
    ){
        return "8";
    }

    if(
        v === "9" ||
        v.includes("9")
    ){
        return "9";
    }

    if(
        v === "10" ||
        v.includes("10")
    ){
        return "10";
    }

    return v;
}


/* =====================================================
   NORMALIZE DIVISION
===================================================== */

function normalizeDivision(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)
        .trim()
        .toUpperCase();
}


/* =====================================================
   MAX MARKS
===================================================== */

function getMaxMarks(subject){

    const cls =
        document.getElementById(
            "classSelect"
        ).value;


    const exam =
        document.getElementById(
            "examSelect"
        ).value;


    /* 8TH */

    if(cls === "8"){

        if(
            exam ===
            "ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ"
        ){
            return 50;
        }

        if(
            exam ===
            "ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ"
        ){
            return 100;
        }

    }


    /* 9TH / 10TH */

    if(
        cls === "9" ||
        cls === "10"
    ){

        if(
            exam ===
            "ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ"
        ){

            if(
                subject.code === "01K"
            ){
                return 100;
            }

            return 80;

        }


        if(
            exam ===
            "ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ"
        ){

            if(
                subject.code === "01K"
            ){
                return 125;
            }

            return 100;

        }

    }


    return 100;
}


/* =====================================================
   GRADE
===================================================== */

function calculateGrade(
    mark,
    max
){

    if(
        mark === "" ||
        mark === null ||
        mark === undefined
    ){
        return "";
    }


    const n =
        Number(mark);


    if(
        isNaN(n)
    ){
        return "";
    }


    const percentage =
        (n / max) * 100;


    if(
        percentage >= 90
    ){
        return "A+";
    }


    if(
        percentage >= 70
    ){
        return "A";
    }


    if(
        percentage >= 50
    ){
        return "B+";
    }


    if(
        percentage >= 30
    ){
        return "B";
    }


    return "C";
}


/* =====================================================
   LOAD STUDENTS
===================================================== */

async function loadStudents(){

    const selectedClass =
        document.getElementById(
            "classSelect"
        ).value;


    const division =
        document.getElementById(
            "divisionSelect"
        ).value;


    const exam =
        document.getElementById(
            "examSelect"
        ).value;


    if(!selectedClass){

        showMessage(
            "ದಯವಿಟ್ಟು ತರಗತಿ ಆಯ್ಕೆಮಾಡಿ.",
            "error"
        );

        return;
    }


    if(!exam){

        showMessage(
            "ದಯವಿಟ್ಟು ಪರೀಕ್ಷೆ ಆಯ್ಕೆಮಾಡಿ.",
            "error"
        );

        return;
    }


    showMessage(
        "Students databaseನಿಂದ Load ಆಗುತ್ತಿದೆ...",
        "info"
    );


    try{

        /*
           IMPORTANT:
           ಇಲ್ಲಿ class/division filter
           Supabase queryನಲ್ಲಿ ಹಾಕಿಲ್ಲ.

           ಮೊದಲು ಎಲ್ಲಾ students ತೆಗೆದುಕೊಳ್ಳುತ್ತೇವೆ.
           ನಂತರ JavaScriptನಲ್ಲಿ actual
           class_name / division value normalize
           ಮಾಡಿ filter ಮಾಡುತ್ತೇವೆ.

           ಇದರಿಂದ:
           8
           8th
           8ನೇ
           8ನೇ ತರಗತಿ

           ಇತ್ಯಾದಿ values ಕೆಲಸ ಮಾಡುತ್ತವೆ.
        */

        const {
            data,
            error
        } =
        await supabaseClient
        .from("students")
        .select("*")
        .order(
            "roll_no",
            {
                ascending:true
            }
        );


        if(error){

            console.error(
                "SUPABASE ERROR:",
                error
            );

            throw error;
        }


        if(
            !data ||
            data.length === 0
        ){

            document.getElementById(
                "studentCount"
            ).innerText =
                "Students ಸಿಗಲಿಲ್ಲ.";


            document.getElementById(
                "marksArea"
            ).innerHTML = `

                <div style="
                    padding:30px;
                    text-align:center;
                    color:#c00;
                ">

                    ❌ students tableನಲ್ಲಿ
                    ಯಾವುದೇ ವಿದ್ಯಾರ್ಥಿ data ಇಲ್ಲ.

                </div>

            `;


            showMessage(
                "students tableನಲ್ಲಿ ಯಾವುದೇ data ಸಿಗಲಿಲ್ಲ.",
                "error"
            );

            return;
        }


        /*
           Console Debug
        */

        console.log(
            "ALL STUDENTS:",
            data
        );


        console.log(
            "CLASS VALUES:",
            [
                ...new Set(
                    data.map(
                        s =>
                        s.class_name
                    )
                )
            ]
        );


        console.log(
            "DIVISION VALUES:",
            [
                ...new Set(
                    data.map(
                        s =>
                        s.division
                    )
                )
            ]
        );


        /*
           Filter
        */

        students =
            data.filter(
                student => {

                    const dbClass =
                        normalizeClass(
                            student.class_name
                        );


                    const dbDivision =
                        normalizeDivision(
                            student.division
                        );


                    const classMatch =
                        dbClass ===
                        selectedClass;


                    const divisionMatch =
                        dbDivision ===
                        "A";


                    return (
                        classMatch &&
                        divisionMatch
                    );

                }
            );


        console.log(
            "FILTERED STUDENTS:",
            students
        );


        /*
           No students
        */

        if(
            students.length === 0
        ){

            const classValues =
                [
                    ...new Set(
                        data.map(
                            s =>
                            s.class_name
                        )
                    )
                ];


            const divisionValues =
                [
                    ...new Set(
                        data.map(
                            s =>
                            s.division
                        )
                    )
                ];


            document.getElementById(
                "studentCount"
            ).innerText =
                "ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ.";


            document.getElementById(
                "marksArea"
            ).innerHTML = `

                <div class="db-info">

                    <h3>
                        ⚠️ Students ಸಿಗಲಿಲ್ಲ
                    </h3>

                    <b>
                        Database Class Values:
                    </b>

                    <br>

                    ${
                        classValues.map(
                            value => `
                                <span
                                    class="value-box">
                                    ${
                                        escapeHtml(
                                            value
                                        )
                                    }
                                </span>
                            `
                        ).join("")
                    }

                    <br><br>

                    <b>
                        Database Division Values:
                    </b>

                    <br>

                    ${
                        divisionValues.map(
                            value => `
                                <span
                                    class="value-box">
                                    ${
                                        escapeHtml(
                                            value
                                        )
                                    }
                                </span>
                            `
                        ).join("")
                    }

                    <br><br>

                    ಆಯ್ಕೆ:

                    <b>
                        ${selectedClass} - A
                    </b>

                </div>

            `;


            showMessage(
                "ಆಯ್ಕೆ ಮಾಡಿದ ತರಗತಿ - A ವಿಭಾಗದಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ.",
                "error"
            );

            return;
        }


        /*
           Create marks table
        */

        createMarksTable();


        document.getElementById(
            "studentCount"
        ).innerText =
            `ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: ${students.length}`;


        showMessage(
            `✅ ${students.length} ವಿದ್ಯಾರ್ಥಿಗಳು Load ಆಗಿದ್ದಾರೆ.`,
            "success"
        );

    }
    catch(error){

        console.error(
            "Students Load:",
            error
        );


        document.getElementById(
            "marksArea"
        ).innerHTML = `

            <div style="
                padding:30px;
                text-align:center;
                color:#c00;
            ">

                ❌ Students Load Error

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;


        showMessage(
            "Students Load: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   CREATE MARKS TABLE
===================================================== */

function createMarksTable(){

    let html = `

        <div class="table-wrap">

        <table>

        <thead>

        <tr>

            <th rowspan="2">
                Roll No
            </th>

            <th rowspan="2">
                ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು
            </th>

            <th rowspan="2">
                SATS No
            </th>

    `;


    SUBJECTS.forEach(
        subject => {

            const max =
                getMaxMarks(
                    subject
                );


            html += `

                <th colspan="2">

                    ${subject.name}

                    <div class="subject-code">
                        ${subject.code}
                    </div>

                    <div class="max-mark">
                        ಗರಿಷ್ಠ: ${max}
                    </div>

                </th>

            `;

        }
    );


    html += `

        </tr>

        <tr>
    `;


    SUBJECTS.forEach(
        () => {

            html += `

                <th>
                    Marks
                </th>

                <th>
                    Grade
                </th>

            `;

        }
    );


    html += `

        </tr>

        </thead>

        <tbody>

    `;


    students.forEach(
        (student,index) => {

            html += `

                <tr>

                    <td>
                        ${
                            escapeHtml(
                                student.roll_no
                                || ""
                            )
                        }
                    </td>

                    <td class="name">
                        ${
                            escapeHtml(
                                student.student_name
                                || ""
                            )
                        }
                    </td>

                    <td class="sats">
                        ${
                            escapeHtml(
                                student.sats_no
                                || ""
                            )
                        }
                    </td>

            `;


            SUBJECTS.forEach(
                (subject,sIndex) => {

                    const max =
                        getMaxMarks(
                            subject
                        );


                    html += `

                        <td>

                            <input

                                type="number"

                                class="mark"

                                id="
                                    mark_${index}_${sIndex}
                                "

                                min="0"

                                max="${max}"

                                step="0.01"

                                oninput="
                                    updateGrade(
                                        ${index},
                                        ${sIndex}
                                    )
                                "

                            >

                        </td>


                        <td>

                            <span
                                class="grade"
                                id="
                                    grade_${index}_${sIndex}
                                "
                            >
                            </span>

                        </td>

                    `;

                }
            );


            html += `

                </tr>

            `;

        }
    );


    html += `

        </tbody>

        </table>

        </div>

    `;


    document.getElementById(
        "marksArea"
    ).innerHTML =
        html;

}


/* =====================================================
   UPDATE GRADE
===================================================== */

function updateGrade(
    studentIndex,
    subjectIndex
){

    const input =
        document.getElementById(
            `mark_${studentIndex}_${subjectIndex}`
        );


    const grade =
        document.getElementById(
            `grade_${studentIndex}_${subjectIndex}`
        );


    const subject =
        SUBJECTS[
            subjectIndex
        ];


    const max =
        getMaxMarks(
            subject
        );


    let value =
        input.value;


    if(
        value !== "" &&
        Number(value) > max
    ){

        input.value =
            max;

        value =
            max;

    }


    if(
        value !== "" &&
        Number(value) < 0
    ){

        input.value =
            0;

        value =
            0;

    }


    grade.innerText =
        calculateGrade(
            value,
            max
        );

}


/* =====================================================
   EXCEL DOWNLOAD
===================================================== */

function downloadExcel(){

    if(
        students.length === 0
    ){

        showMessage(
            "ಮೊದಲು Students Load ಮಾಡಿ.",
            "error"
        );

        return;
    }


    const cls =
        document.getElementById(
            "classSelect"
        ).value;


    const exam =
        document.getElementById(
            "examSelect"
        ).value;


    const headers = [

        "Roll No",
        "Student Name",
        "Father Name",
        "Mother Name",
        "SATS No",
        "Class",
        "Division",
        "Exam"

    ];


    SUBJECTS.forEach(
        subject => {

            headers.push(
                subject.name
            );

        }
    );


    const rows = [];


    students.forEach(
        student => {

            const row = [

                student.roll_no
                || "",

                student.student_name
                || "",

                student.father_name
                || "",

                student.mother_name
                || "",

                student.sats_no
                || "",

                cls,

                "A",

                exam

            ];


            SUBJECTS.forEach(
                () => {

                    row.push("");

                }
            );


            rows.push(
                row
            );

        }
    );


    const worksheet =
        XLSX.utils.aoa_to_sheet(
            [
                headers,
                ...rows
            ]
        );


    worksheet["!cols"] = [

        {wch:12},
        {wch:25},
        {wch:22},
        {wch:22},
        {wch:15},
        {wch:15},
        {wch:10},
        {wch:25},
        {wch:15},
        {wch:15},
        {wch:15},
        {wch:15},
        {wch:15},
        {wch:18}

    ];


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Marks Entry"
    );


    XLSX.writeFile(
        workbook,
        `Marks_${cls}_A.xlsx`
    );


    showMessage(
        "✅ Excel Form Download ಆಗಿದೆ.",
        "success"
    );

}


/* =====================================================
   EXCEL UPLOAD
===================================================== */

async function uploadExcel(event){

    const file =
        event.target.files[0];


    if(!file){
        return;
    }


    if(
        students.length === 0
    ){

        showMessage(
            "ಮೊದಲು Students Load ಮಾಡಿ.",
            "error"
        );

        event.target.value =
            "";

        return;
    }


    try{

        const buffer =
            await file.arrayBuffer();


        const workbook =
            XLSX.read(
                buffer,
                {
                    type:"array"
                }
            );


        const sheet =
            workbook.Sheets[
                workbook.SheetNames[0]
            ];


        const rows =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    defval:""
                }
            );


        let count =
            0;


        rows.forEach(
            row => {

                const roll =
                    String(
                        row["Roll No"]
                        || ""
                    ).trim();


                if(!roll){
                    return;
                }


                const student =
                    students.find(
                        s =>
                        String(
                            s.roll_no
                            || ""
                        ).trim()
                        === roll
                    );


                if(!student){
                    return;
                }


                const index =
                    students.indexOf(
                        student
                    );


                SUBJECTS.forEach(
                    (
                        subject,
                        sIndex
                    ) => {

                        const value =
                            row[
                                subject.name
                            ];


                        if(
                            value === ""
                            ||
                            value === undefined
                        ){
                            return;
                        }


                        const number =
                            Number(value);


                        const max =
                            getMaxMarks(
                                subject
                            );


                        if(
                            isNaN(number)
                            ||
                            number < 0
                            ||
                            number > max
                        ){
                            return;
                        }


                        const input =
                            document.getElementById(
                                `mark_${index}_${sIndex}`
                            );


                        if(input){

                            input.value =
                                number;


                            updateGrade(
                                index,
                                sIndex
                            );

                        }

                    }
                );


                count++;

            }
        );


        showMessage(
            `✅ ${count} ವಿದ್ಯಾರ್ಥಿಗಳ marks Excelನಿಂದ ಬಂದಿದೆ. ಈಗ Save Marks ಒತ್ತಿ.`,
            "success"
        );

    }
    catch(error){

        console.error(
            "Excel Upload Error:",
            error
        );


        showMessage(
            "Excel Upload Error: " +
            error.message,
            "error"
        );

    }


    event.target.value =
        "";

}


/* =====================================================
   SAVE MARKS
===================================================== */

async function saveMarks(){

    /*
       ಈ ಹಂತದಲ್ಲಿ databaseನ
       marks table structure ಖಚಿತವಾಗಿಲ್ಲ.

       ಆದ್ದರಿಂದ ತಪ್ಪು table/columnಗೆ
       data ಹೋಗದಂತೆ ತಾತ್ಕಾಲಿಕವಾಗಿ
       screen validation ಮಾತ್ರ.
    */


    if(
        students.length === 0
    ){

        showMessage(
            "ಮೊದಲು Students Load ಮಾಡಿ.",
            "error"
        );

        return;
    }


    let totalMarks =
        0;


    let invalid =
        false;


    students.forEach(
        (student,index) => {

            SUBJECTS.forEach(
                (
                    subject,
                    sIndex
                ) => {

                    const input =
                        document.getElementById(
                            `mark_${index}_${sIndex}`
                        );


                    if(!input){
                        return;
                    }


                    if(
                        input.value === ""
                    ){
                        return;
                    }


                    const mark =
                        Number(
                            input.value
                        );


                    const max =
                        getMaxMarks(
                            subject
                        );


                    if(
                        isNaN(mark)
                        ||
                        mark < 0
                        ||
                        mark > max
                    ){

                        invalid =
                            true;

                        return;

                    }


                    totalMarks++;

                }
            );

        }
    );


    if(invalid){

        showMessage(
            "❌ ಕೆಲವು marks ಗರಿಷ್ಠ ಮಿತಿಯನ್ನು ಮೀರಿವೆ.",
            "error"
        );

        return;
    }


    /*
       ಈಗ marks screenನಲ್ಲಿ
       ಸರಿಯಾಗಿ validate ಆಗಿವೆ.

       Database Save ಮಾಡಲು
       ನಿಮ್ಮ marks table structure
       ಬೇಕಾಗಿದೆ.
    */

    showMessage(
        `✅ ${totalMarks} marks entry ಸಿದ್ಧವಾಗಿದೆ. Database Saveಗಾಗಿ marks table columns ಹೊಂದಿಸಬೇಕು.`,
        "success"
    );

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
