<style>
*{

body{

label{

}

select,

button{

.btn-blue{background:#087db5;}
.btn-green{background:#168a52;}
.btn-orange{background:#d98508;}
.btn-purple{background:#7045b8;}
.btn-dark{background:#555;}
.btn-red{background:#d93645;}

.message{
    display:none;
    margin-top:12px;
    padding:10px;
    border-radius:6px;
    font-weight:bold;
}

.message.show{
    display:block;
}

.success{
    background:#d9f4df;
    color:#12652d;
}

.error{
    background:#ffe0e0;

}

.info{
    background:#dceeff;
    color:#07527c;
}

.table-wrap{
    width:100%;
    overflow:auto;
}

table{
    border-collapse:collapse;
    width:100%;

}

th,
td{
    border:1px solid #c9d4db;

    text-align:center;

th{

.student-name{

.mark-input{

}

.grade{
    font-weight:bold;
    min-width:45px;
}

.pass{
    color:green;
    font-weight:bold;
}

.fail{
    color:red;
    font-weight:bold;
}

.pending{
    color:#c77700;
    font-weight:bold;
}

.summary-table{
    min-width:700px;
}

.small{
    font-size:13px;
}

@media(max-width:800px){
    .grid{
        grid-template-columns:1fr;
    }
}

/* PRINT */
#printArea{
    display:none;
}

@media print{

    @page{
        size:A4 landscape;
        margin:6mm;
    }

        background:white !important;
        color:black !important;
    }

    header{

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sozlvjvqrgpaabnvjvxe.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let students = [];
let subjects = [];

let currentClass = "";
let currentDivision = "";
let currentExam = "";


/* =====================================================
   HELPERS
===================================================== */

function getValue(obj, keys){

    for(const key of keys){

        if(
            obj &&
            obj[key] !== undefined &&
            obj[key] !== null &&
            obj[key] !== ""
        ){
            return obj[key];
        }
    }

    return "";
}


function classNumber(value){

    const match =
        String(value || "").match(/10|9|8/);

    return match ? match[0] : "";
}


function studentName(student){

    return getValue(
        student,
        [
            "student_name",
            "name",
            "studentName"
        ]
    ) || "Student";
}


function rollNumber(student,index){

    return getValue(
        student,
        [
            "roll_no",
            "roll_number",
            "reg_no",
            "registration_no",
            "registration_number"
        ]
    ) || (index + 1);
}


function subjectName(subject){

    return getValue(
        subject,
        [
            "subject_name",
            "name",
            "subject",
            "subjectName",
            "title"
        ]
    ) || "Subject";
}


function subjectCode(subject){

    return getValue(
        subject,
        [
            "subject_code",
            "code",
            "subjectCode"
        ]
    );
}


function isKannada(subject){

    const name =
        String(subjectName(subject))
        .toLowerCase();

    const code =
        String(subjectCode(subject))
        .toLowerCase();

    return(
        name.includes("kannada") ||
        name.includes("ಕನ್ನಡ") ||
        code === "1" ||
        code === "01"
    );
}


/* =====================================================
   MAX MARKS
===================================================== */

function maximumMarks(subject){

    /* 8ನೇ ತರಗತಿ */

    if(currentClass === "8"){

        if(currentExam === "HALF_YEARLY"){
            return 50;
        }

        if(currentExam === "ANNUAL"){
            return 100;
        }
    }


    /* 9 ಮತ್ತು 10 */

    if(
        currentClass === "9" ||
        currentClass === "10"
    ){

        if(currentExam === "HALF_YEARLY"){

            if(isKannada(subject)){
                return 100;
            }

            return 80;
        }


        if(currentExam === "ANNUAL"){

            if(isKannada(subject)){
                return 125;
            }

            return 100;
        }
    }

    return 50;
}


/* =====================================================
   8TH GRADE
===================================================== */

function grade8(mark,max){

    const m = Number(mark);

    if(!Number.isFinite(m)){
        return "";
    }


    /* 50 marks */

    if(max === 50){

        if(m >= 45) return "A+";
        if(m >= 35) return "A";
        if(m >= 25) return "B+";
        if(m >= 15) return "B";

        return "C";
    }


    /* 100 marks */

    if(m >= 90) return "A+";
    if(m >= 70) return "A";
    if(m >= 50) return "B+";
    if(m >= 30) return "B";

    return "C";
}


/* =====================================================
   9TH / 10TH GRADE
===================================================== */

function grade910(mark,subject){

    const m = Number(mark);

    if(!Number.isFinite(m)){
        return "";
    }


    const kannada =
        isKannada(subject);


    /* ---------------------------------------------
       HALF YEARLY
    --------------------------------------------- */

    if(currentExam === "HALF_YEARLY"){

        /* Kannada - 100 */

        if(kannada){

            if(m >= 90) return "A+";
            if(m >= 80) return "A";
            if(m >= 70) return "B+";
            if(m >= 60) return "B";
            if(m >= 50) return "C+";
            if(m >= 35) return "C";

            return "NC";
        }


        /* Other five subjects - 80 */

        if(m >= 72) return "A+";
        if(m >= 64) return "A";
        if(m >= 56) return "B+";
        if(m >= 48) return "B";
        if(m >= 40) return "C+";
        if(m >= 28) return "C";

        return "NC";
    }


    /* ---------------------------------------------
       ANNUAL
    --------------------------------------------- */

    if(currentExam === "ANNUAL"){

        /* Kannada */

        if(kannada){

            if(m >= 112 && m <= 120) return "A+";
            if(m >= 100) return "A";
            if(m >= 87) return "B+";
            if(m >= 75) return "B";
            if(m >= 63) return "C+";
            if(m >= 44) return "C";

            return "NC";
        }


        /* Other five subjects */

        if(m >= 90) return "A+";
        if(m >= 80) return "A";
        if(m >= 70) return "B+";
        if(m >= 60) return "B";
        if(m >= 50) return "C+";
        if(m >= 35) return "C";

        return "NC";
    }


    return "";
}


/* =====================================================
   OVERALL GRADE
===================================================== */

function overallGrade(percentage){

    const p = Number(percentage);


    if(currentClass === "8"){

        if(p >= 90) return "A+";
        if(p >= 70) return "A";
        if(p >= 50) return "B+";
        if(p >= 30) return "B";

        return "C";
    }


    if(p >= 90) return "A+";
    if(p >= 80) return "A";
    if(p >= 70) return "B+";
    if(p >= 60) return "B";
    if(p >= 50) return "C+";
    if(p >= 35) return "C";

    return "NC";
}


function subjectGrade(mark,max,subject){

    if(currentClass === "8"){
        return grade8(mark,max);
    }

    if(
        currentClass === "9" ||
        currentClass === "10"
    ){
        return grade910(mark,subject);
    }

    return "";
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message show " + type;
}


/* =====================================================
   LOAD STUDENTS
===================================================== */

async function loadStudents(){

    try{

        currentClass =
            classNumber(
                document.getElementById(
                    "classSelect"
                ).value
            );

        currentDivision =
            document.getElementById(
                "divisionSelect"
            ).value
            .trim()
            .toUpperCase();

        currentExam =
            document.getElementById(
                "examSelect"
            ).value;


        showMessage(
            "Students ಮತ್ತು Subjects loading...",
            "info"
        );


        /* STUDENTS */

        const studentResponse =
            await supabaseClient
                .from("students")
                .select("*");


        if(studentResponse.error){
            throw studentResponse.error;
        }


        students =
            (studentResponse.data || [])
            .filter(student => {

                const cls =
                    classNumber(
                        getValue(
                            student,
                            [
                                "class_name",
                                "class",
                                "standard",
                                "className"
                            ]
                        )
                    );

                const div =
                    String(
                        getValue(
                            student,
                            [
                                "division",
                                "section",
                                "division_name",
                                "section_name"
                            ]
                        )
                    )
                    .trim()
                    .toUpperCase();


                return(
                    cls === currentClass &&
                    div === currentDivision
                );
            });


        if(!students.length){

            document.getElementById(
                "marksTableContainer"
            ).innerHTML =
                "<p style='color:red;font-weight:bold'>" +
                "❌ " +
                currentClass +
                "ನೇ ತರಗತಿ - " +
                currentDivision +
                " ವಿಭಾಗದಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ." +
                "</p>";

            document.getElementById(
                "studentCount"
            ).textContent =
                "ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: 0";

            showMessage(
                "ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ.",
                "error"
            );

            return;
        }


        /* SUBJECTS */

        const subjectResponse =
            await supabaseClient
                .from("subjects")
                .select("*");


        if(subjectResponse.error){
            throw subjectResponse.error;
        }


        subjects =
            (subjectResponse.data || [])
            .filter(subject => {

                const cls =
                    getValue(
                        subject,
                        [
                            "class_name",
                            "class",
                            "standard",
                            "className"
                        ]
                    );

                return(
                    cls === "" ||
                    classNumber(cls) === currentClass
                );
            });


        /*
          Duplicate subject rows ಇದ್ದರೂ
          Subject Name ಆಧಾರದಲ್ಲಿ ಒಂದೇ ಬಾರಿ.
        */

        const seen = new Set();

        subjects =
            subjects.filter(subject => {

                const key =
                    subjectName(subject)
                    .trim()
                    .toLowerCase()
                    .replace(/\s+/g," ");

                if(seen.has(key)){
                    return false;
                }

                seen.add(key);

                return true;
            });


        if(!subjects.length){

            throw new Error(
                "Subjects tableನಲ್ಲಿ subjects ಸಿಗಲಿಲ್ಲ."
            );
        }


        await loadSavedMarks();

        renderMarksTable();

        updateSummary();


        document.getElementById(
            "studentCount"
        ).textContent =
            "ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: " +
            students.length;


        showMessage(
            "✅ Students ಮತ್ತು Subjects Load ಆಗಿವೆ.",
            "success"
        );

    }
    catch(error){

        console.error(error);

        showMessage(
            "❌ Students Load Error: " +
            error.message,
            "error"
        );
    }
}


/* =====================================================
   LOAD SAVED MARKS
===================================================== */

async function loadSavedMarks(){

    for(const student of students){

        student.resultId = null;
        student.marks = {};


        const studentId =
            getValue(
                student,
                [
                    "id",
                    "student_id"
                ]
            );


        if(!studentId){
            continue;
        }


        const resultResponse =
            await supabaseClient
                .from("exam_results")
                .select("id")
                .eq(
                    "student_id",
                    studentId
                )
                .eq(
                    "exam_type",
                    currentExam
                )
                .order(
                    "id",
                    {ascending:false}
                )
                .limit(1)
                .maybeSingle();


        if(
            resultResponse.error ||
            !resultResponse.data
        ){
            continue;
        }


        student.resultId =
            resultResponse.data.id;


        const marksResponse =
            await supabaseClient
                .from("result_marks")
                .select(
                    "subject_id,marks"
                )
                .eq(
                    "exam_result_id",
                    student.resultId
                );


        if(!marksResponse.error){

            for(
                const mark of
                (marksResponse.data || [])
            ){

                student.marks[
                    mark.subject_id
                ] =
                    mark.marks;
            }
        }
    }
}


/* =====================================================
   INPUT ID
===================================================== */

function getInput(studentId,subjectId){

    return document.querySelector(
        ".mark-input[data-student='" +
        CSS.escape(String(studentId)) +
        "'][data-subject='" +
        CSS.escape(String(subjectId)) +
        "']"
    );
}


/* =====================================================
   RENDER TABLE
===================================================== */

function renderMarksTable(){

    let html = "";

    html += "<table>";

    html += "<thead>";

    html += "<tr>";

    html += "<th>Roll</th>";
    html += "<th>ವಿದ್ಯಾರ್ಥಿ</th>";
    html += "<th>SATS No</th>";


    subjects.forEach(subject => {

        html +=
            "<th colspan='2'>" +
            escapeHtml(
                subjectName(subject)
            ) +
            "<br>Max: " +
            maximumMarks(subject) +
            "</th>";
    });


    html +=
        "<th>Total</th>" +
        "<th>Maximum</th>" +
        "<th>%</th>" +
        "<th>Grade</th>" +
        "<th>Result</th>";


    html += "</tr>";


    html += "<tr>";

    html += "<th></th>";
    html += "<th></th>";
    html += "<th></th>";


    subjects.forEach(() => {

        html += "<th>Marks</th>";
        html += "<th>Grade</th>";

    });


    html +=
        "<th></th>" +
        "<th></th>" +
        "<th></th>" +
        "<th></th>" +
        "<th></th>";


    html += "</tr>";

    html += "</thead>";

    html += "<tbody>";


    students.forEach((student,index) => {

        const studentId =
            getValue(
                student,
                ["id","student_id"]
            );


        html += "<tr>";


        html +=
            "<td>" +
            escapeHtml(
                rollNumber(student,index)
            ) +
            "</td>";


        html +=
            "<td class='student-name'>" +
            escapeHtml(
                studentName(student)
            ) +
            "</td>";


        html +=
            "<td>" +
            escapeHtml(
                getValue(
                    student,
                    [
                        "sats_no",
                        "sats_number",
                        "sats"
                    ]
                )
            ) +
            "</td>";


        subjects.forEach(subject => {

            const max =
                maximumMarks(subject);

            const oldMark =
                student.marks[subject.id] ??
                "";


            html +=
                "<td>" +

                "<input " +
                "class='mark-input' " +
                "type='number' " +
                "min='0' " +
                "max='" + max + "' " +
                "step='0.01' " +
                "value='" +
                escapeHtml(oldMark) +
                "' " +

                "data-student='" +
                escapeHtml(studentId) +
                "' " +

                "data-subject='" +
                escapeHtml(subject.id) +
                "' " +

                "data-max='" +
                max +
                "' " +

                "oninput='markChanged(this)' " +

                ">" +

                "</td>";


            html +=
                "<td " +
                "class='grade' " +
                "id='grade-" +
                studentId +
                "-" +
                subject.id +
                "'>" +

                (
                    oldMark !== ""
                    ?
                    subjectGrade(
                        Number(oldMark),
                        max,
                        subject
                    )
                    :
                    ""
                ) +

                "</td>";
        });


        html +=
            "<td id='total-" +
            studentId +
            "'>0</td>";


        html +=
            "<td id='max-" +
            studentId +
            "'>0</td>";


        html +=
            "<td id='percentage-" +
            studentId +
            "'>0%</td>";


        html +=
            "<td id='overall-" +
            studentId +
            "'>-</td>";


        html +=
            "<td id='result-" +
            studentId +
            "' class='pending'>PENDING</td>";


        html += "</tr>";
    });


    html += "</tbody>";

    html += "</table>";


    document.getElementById(
        "marksTableContainer"
    ).innerHTML = html;


    students.forEach(student => {

        calculateStudent(
            getValue(
                student,
                ["id","student_id"]
            )
        );

    });
}


/* =====================================================
   MARK CHANGED
===================================================== */

function markChanged(input){

    const value =
        input.value === ""
        ?
        ""
        :
        Number(input.value);

    const max =
        Number(input.dataset.max);


    if(
        value !== "" &&
        (
            value < 0 ||
            value > max
        )
    ){

        alert(
            "ಗರಿಷ್ಠ " +
            max +
            " marks ಮಾತ್ರ."
        );

        input.value = "";

        return;
    }


    const subject =
        subjects.find(
            s =>
            String(s.id) ===
            String(input.dataset.subject)
        );


    const gradeElement =
        document.getElementById(
            "grade-" +
            input.dataset.student +
            "-" +
            input.dataset.subject
        );


    if(value === ""){

        gradeElement.textContent = "";

    }
    else{

        gradeElement.textContent =
            subjectGrade(
                value,
                max,
                subject
            );
    }


    calculateStudent(
        input.dataset.student
    );

    updateSummary();
}


/* =====================================================
   CALCULATE STUDENT
===================================================== */

function calculateStudent(studentId){

    let total = 0;
    let maximum = 0;
    let entered = 0;


    subjects.forEach(subject => {

        const max =
            maximumMarks(subject);

        maximum += max;


        const input =
            getInput(
                studentId,
                subject.id
            );


        if(
            input &&
            input.value !== ""
        ){

            total +=
                Number(input.value);

            entered++;
        }
    });


    const percentage =
        maximum > 0
        ?
        (total / maximum) * 100
        :
        0;


    document.getElementById(
        "total-" + studentId
    ).textContent =
        total.toFixed(2);


    document.getElementById(
        "max-" + studentId
    ).textContent =
        maximum.toFixed(2);


    document.getElementById(
        "percentage-" + studentId
    ).textContent =
        percentage.toFixed(2) + "%";


    const overall =
        document.getElementById(
            "overall-" + studentId
        );


    const result =
        document.getElementById(
            "result-" + studentId
        );


    if(
        entered === subjects.length &&
        subjects.length > 0
    ){

        overall.textContent =
            overallGrade(percentage);


        const pass =
            currentClass === "8"
            ?
            percentage >= 30
            :
            percentage >= 35;


        result.textContent =
            pass
            ?
            "PASS"
            :
            "FAIL";


        result.className =
            pass
            ?
            "pass"
            :
            "fail";

    }
    else{

        overall.textContent = "-";

        result.textContent =
            "PENDING";

        result.className =
            "pending";
    }
}


/* =====================================================
   SAVE MARKS
===================================================== */

async function saveMarks(){

    if(!students.length){

        alert(
            "ಮೊದಲು Students Load ಮಾಡಿ."
        );

        return;
    }


    try{

        showMessage(
            "Marks save ಆಗುತ್ತಿದೆ...",
            "info"
        );


        for(const student of students){

            const studentId =
                getValue(
                    student,
                    ["id","student_id"]
                );


            if(!studentId){
                continue;
            }


            let resultId =
                student.resultId;


            /* Existing result ಹುಡುಕು */

            if(!resultId){

                const existing =
                    await supabaseClient
                        .from("exam_results")
                        .select("id")
                        .eq(
                            "student_id",
                            studentId
                        )
                        .eq(
                            "exam_type",
                            currentExam
                        )
                        .order(
                            "id",
                            {ascending:false}
                        )
                        .limit(1)
                        .maybeSingle();


                if(existing.error){
                    throw existing.error;
                }


                if(existing.data){

                    resultId =
                        existing.data.id;

                }
            }


            /* New exam result */

            if(!resultId){

                const inserted =
                    await supabaseClient
                        .from("exam_results")
                        .insert({
                            student_id:studentId,
                            exam_type:currentExam,
                            published:false
                        })
                        .select("id")
                        .single();


                if(inserted.error){
                    throw inserted.error;
                }


                resultId =
                    inserted.data.id;
            }


            /* Save every subject */

            for(const subject of subjects){

                const input =
                    getInput(
                        studentId,
                        subject.id
                    );


                if(!input){
                    continue;
                }


                const marks =
                    input.value === ""
                    ?
                    null
                    :
                    Number(input.value);


                const max =
                    maximumMarks(subject);


                if(
                    marks !== null &&
                    (
                        marks < 0 ||
                        marks > max
                    )
                ){

                    throw new Error(
                        studentName(student) +
                        " → " +
                        subjectName(subject) +
                        " : Maximum " +
                        max
                    );
                }


                const existingMark =
                    await supabaseClient
                        .from("result_marks")
                        .select("id")
                        .eq(
                            "exam_result_id",
                            resultId
                        )
                        .eq(
                            "subject_id",
                            subject.id
                        )
                        .order(
                            "id",
                            {ascending:false}
                        )
                        .limit(1)
                        .maybeSingle();


                if(existingMark.error){
                    throw existingMark.error;
                }


                if(existingMark.data){

                    const updated =
                        await supabaseClient
                            .from("result_marks")
                            .update({
                                marks:marks
                            })
                            .eq(
                                "id",
                                existingMark.data.id
                            );


                    if(updated.error){
                        throw updated.error;
                    }

                }
                else{

                    const inserted =
                        await supabaseClient
                            .from("result_marks")
                            .insert({
                                exam_result_id:
                                    resultId,

                                subject_id:
                                    subject.id,

                                marks:marks
                            });


                    if(inserted.error){
                        throw inserted.error;
                    }
                }
            }


            student.resultId =
                resultId;
        }


        await loadSavedMarks();

        renderMarksTable();

        updateSummary();


        showMessage(
            "✅ Marks successfully saved.",
            "success"
        );

    }
    catch(error){

        console.error(error);

        showMessage(
            "❌ Marks Save Error: " +
            error.message,
            "error"
        );
    }
}

/* =====================================================
   EXCEL / CSV DOWNLOAD
===================================================== */

function csvCell(value){

    const text =
        String(
            value === undefined ||
            value === null
            ?
            ""
            :
            value
        );

    return(
        '"' +
        text.replaceAll('"','""') +
        '"'
    );
}


function downloadExcel(){

    if(!students.length){

        alert(
            "ಮೊದಲು Students Load ಮಾಡಿ."
        );

        return;
    }


    const headers = [
        "Roll No",
        "Student Name",
        "SATS No"
    ];


    subjects.forEach(subject => {

        headers.push(
            subjectName(subject) +
            " Marks"
        );

        headers.push(
            subjectName(subject) +
            " Grade"
        );
    });


    headers.push(
        "Total",
        "Maximum",
        "Percentage",
        "Grade",
        "Result"
    );


    const rows = [];


    rows.push(
        headers.map(csvCell).join(",")
    );


    students.forEach((student,index) => {

        const row = [];


        row.push(
            rollNumber(
                student,
                index
            )
        );


        row.push(
            studentName(student)
        );


        row.push(
            getValue(
                student,
                [
                    "sats_no",
                    "sats_number",
                    "sats"
                ]
            )
        );


        let total = 0;
        let maximum = 0;


        subjects.forEach(subject => {

            const input =
                getInput(
                    getValue(
                        student,
                        ["id","student_id"]
                    ),
                    subject.id
                );


            const value =
                input &&
                input.value !== ""
                ?
                Number(input.value)
                :
                "";


            const max =
                maximumMarks(subject);


            row.push(value);


            row.push(
                value === ""
                ?
                ""
                :
                subjectGrade(
                    value,
                    max,
                    subject
                )
            );


            if(value !== ""){
                total += value;
            }


            maximum += max;
        });


        const percentage =
            maximum
            ?
            total / maximum * 100
            :
            0;


        row.push(
            Number(
                total.toFixed(2)
            )
        );


        row.push(
            Number(
                maximum.toFixed(2)
            )
        );


        row.push(
            Number(
                percentage.toFixed(2)
            ) + "%"
        );


        row.push(
            overallGrade(
                percentage
            )
        );


        row.push(
            (
                currentClass === "8"
                ?
                percentage >= 30
                :
                percentage >= 35
            )
            ?
            "PASS"
            :
            "FAIL"
        );


        rows.push(
            row.map(csvCell).join(",")
        );
    });


    const csv =
        "\uFEFF" +
        rows.join("\r\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    const examName =
        currentExam === "HALF_YEARLY"
        ?
        "Half-Yearly"
        :
        "Annual";


    link.href = url;


    link.download =
        "Marks-" +
        currentClass +
        "-" +
        currentDivision +
        "-" +
        examName +
        ".csv";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);


    setTimeout(
        () => URL.revokeObjectURL(url),
        1000
    );


    showMessage(
        "✅ Excel-compatible CSV Download ಆಗಿದೆ. ಅದನ್ನು Microsoft Excelನಲ್ಲಿ ತೆರೆಯಬಹುದು.",
        "success"
    );
}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
