</head>

<body>

<div class="header">
    <h1>📝 Marks Entry</h1>

<div class="container">

    <!-- FILTER CARD -->
    <div class="card no-print">

        <div class="controls">

            <div class="control">
                <label>ತರಗತಿ</label>

                    <option value="9ನೇ ತರಗತಿ">9ನೇ ತರಗತಿ</option>

            <div class="control">
                <label>ವಿಭಾಗ</label>

                <select id="divisionSelect">

                    <option value="A">A</option>
                    <option value="B">B</option>

            </div>

            <div class="control">

                        ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ
                    </option>

                    <option value="ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ">

                </select>

        <div class="buttons">

            <button class="btn-blue" onclick="loadStudents()">
                🔄 ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು Load ಮಾಡಿ
            </button>

            </button>

    <!-- MARKS CARD -->

    <div class="card">

            ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು Load ಮಾಡಿ
        </div>

        <div id="marksContainer">

            <div class="loading">
                ತರಗತಿ, ವಿಭಾಗ ಮತ್ತು ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ
            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
"https://sozlvjvqrgpaabnvjvxe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let students = [];
let subjects = [];
let existingMarks = {};


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text,type="info"){

    const box =
        document.getElementById("message");

    box.className =
        "message " + type;

    box.innerText = text;

    box.style.display = "block";
}


/* =========================================================
   GET MAX MARKS
========================================================= */

function getMaxMarks(subject){

    const name =
        String(
            subject.subject_name ||
            subject.name ||
            subject.subject ||
            ""
        ).trim();

    const className =
        document.getElementById("classSelect").value;

    /*
       9 ಮತ್ತು 10ನೇ ತರಗತಿ ಕನ್ನಡ = 125
    */

    if(
        (className === "9ನೇ ತರಗತಿ" ||
         className === "10ನೇ ತರಗತಿ") &&
        name.includes("ಕನ್ನಡ")
    ){
        return 125;
    }

    return 100;
}


/* =========================================================
   GRADE
========================================================= */

function getGrade(mark,max){

    if(
        mark === "" ||
        mark === null ||
        mark === undefined
    ){
        return "";
    }

    const n = Number(mark);

    if(isNaN(n)){
        return "";
    }

    const percentage =
        (n / max) * 100;

    if(percentage >= 90) return "A+";
    if(percentage >= 70) return "A";
    if(percentage >= 50) return "B+";
    if(percentage >= 30) return "B";

    return "C";
}


/* =========================================================
   LOAD STUDENTS
========================================================= */

async function loadStudents(){

    const className =
        document.getElementById("classSelect").value;

    const division =
        document.getElementById("divisionSelect").value;

    const exam =
        document.getElementById("examSelect").value;


    if(!className){
        showMessage(
            "ದಯವಿಟ್ಟು ತರಗತಿ ಆಯ್ಕೆಮಾಡಿ.",
            "error"
        );
        return;
    }

    if(!division){
        showMessage(
            "ದಯವಿಟ್ಟು ವಿಭಾಗ ಆಯ್ಕೆಮಾಡಿ.",
            "error"
        );
        return;
    }

    if(!exam){
        showMessage(
            "ದಯವಿಟ್ಟು ಪರೀಕ್ಷೆ ಆಯ್ಕೆಮಾಡಿ.",
            "error"
        );
        return;
    }


    showMessage(
        "Students ಮತ್ತು Subjects Load ಆಗುತ್ತಿದೆ...",
        "info"
    );


    try{

        /* -----------------------------------------
           STUDENTS
        ----------------------------------------- */

        const {
            data: studentData,
            error: studentError
        } =
        await supabaseClient
        .from("students")
        .select("*")
        .eq("class_name",className)
        .eq("division",division)
        .eq("is_active",true)
        .order("roll_no",{ascending:true});


        if(studentError){
            throw new Error(
                "Students Load: " +
                studentError.message
            );
        }


        students =
            studentData || [];


        /* -----------------------------------------
           SUBJECTS
        ----------------------------------------- */

        const {
            data: subjectData,
            error: subjectError
        } =
        await supabaseClient
        .from("subjects")
        .select("*")
        .order("id",{ascending:true});


        if(subjectError){
            throw new Error(
                "Subjects Load: " +
                subjectError.message
            );
        }


        subjects =
            subjectData || [];


        if(students.length === 0){

            document.getElementById(
                "studentCount"
            ).innerText =
                "ವಿದ್ಯಾರ್ಥಿಗಳು ದೊರೆಯಲಿಲ್ಲ.";

            document.getElementById(
                "marksContainer"
            ).innerHTML =
                `<div class="loading">
                    ಈ ತರಗತಿ ಮತ್ತು ವಿಭಾಗಕ್ಕೆ
                    ವಿದ್ಯಾರ್ಥಿಗಳು ಇಲ್ಲ.
                </div>`;

            showMessage(
                "Students ಸಿಗಲಿಲ್ಲ.",
                "error"
            );

            return;
        }


        if(subjects.length === 0){

            throw new Error(
                "Subjects table ನಲ್ಲಿ subjects ಸಿಗಲಿಲ್ಲ."
            );
        }


        /* -----------------------------------------
           EXISTING MARKS LOAD
        ----------------------------------------- */

        await loadExistingMarks(exam);


        /* -----------------------------------------
           DISPLAY
        ----------------------------------------- */

        renderMarksTable();


        showMessage(
            `${students.length} ವಿದ್ಯಾರ್ಥಿಗಳು ಮತ್ತು ${subjects.length} ವಿಷಯಗಳು Load ಆಗಿವೆ.`,
            "success"
        );

    }
    catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Students Load Failed",
            "error"
        );

        document.getElementById(
            "marksContainer"
        ).innerHTML =
        `<div class="loading" style="color:#c00">
            ❌ ${escapeHtml(
                error.message ||
                "Students Load Failed"
            )}
        </div>`;
    }
}


/* =========================================================
   LOAD EXISTING MARKS
========================================================= */

async function loadExistingMarks(exam){

    existingMarks = {};


    for(const student of students){

        const {
            data: examData,
            error: examError
        } =
        await supabaseClient
        .from("exam_results")
        .select("id")
        .eq("student_id",student.id)
        .eq("exam_type",exam)
        .limit(1);


        if(examError){

            /*
              Existing record ಇಲ್ಲದಿದ್ದರೂ
              marks entry ಮುಂದುವರಿಯಲು
              ಅವಕಾಶ.
            */

            console.warn(
                "Exam result:",
                examError.message
            );

            continue;
        }


        if(
            examData &&
            examData.length > 0
        ){

            const examResultId =
                examData[0].id;


            const {
                data: markData,
                error: markError
            } =
            await supabaseClient
            .from("result_marks")
            .select(
                "subject_id,marks"
            )
            .eq(
                "exam_result_id",
                examResultId
            );


            if(!markError){

                existingMarks[student.id] = {
                    examResultId:
                        examResultId,
                    marks:
                        markData || []
                };

            }

        }

    }

}


/* =========================================================
   GET SUBJECT ID
========================================================= */

function getSubjectId(subject){

    return subject.id;
}


/* =========================================================
   GET SUBJECT NAME
========================================================= */

function getSubjectName(subject){

    return (
        subject.subject_name ||
        subject.name ||
        subject.subject ||
        subject.title ||
        "ವಿಷಯ"
    );
}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderMarksTable(){

    const container =
        document.getElementById(
            "marksContainer"
        );


    document.getElementById(
        "studentCount"
    ).innerText =
        `ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: ${students.length}`;


    let html = `

    <div class="table-wrapper">

    <table>

        <thead>

            <tr>

                <th rowspan="2">
                    Roll No
                </th>

                <th rowspan="2">
                    ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು
                </th>

                <th rowspan="2">
                    SATS No
                </th>
    `;


    subjects.forEach(subject => {

        html += `
            <th class="subject-header"
                colspan="2">

                ${escapeHtml(
                    getSubjectName(subject)
                )}

                <br>

                <span class="small"
                      style="color:white">

                    Max:
                    ${getMaxMarks(subject)}

                </span>

            </th>
        `;

    });


    html += `
            </tr>

            <tr>
    `;


    subjects.forEach(() => {

        html += `
            <th>
                Marks
            </th>

            <th>
                Grade
            </th>
        `;

    });


    html += `
            </tr>
        </thead>

        <tbody>
    `;


    students.forEach(
        (student,index) => {

            html += `

            <tr>

                <td>
                    ${escapeHtml(
                        student.roll_no || ""
                    )}
                </td>

                <td class="student-name">

                    ${escapeHtml(
                        student.student_name || ""
                    )}

                    <br>

                    <span class="small">
                        ತಂದೆ:
                        ${escapeHtml(
                            student.father_name || ""
                        )}
                    </span>

                </td>

                <td>
                    ${escapeHtml(
                        student.sats_no || ""
                    )}
                </td>

            `;


            subjects.forEach(
                (subject,subjectIndex) => {

                    const old =
                        getExistingMark(
                            student.id,
                            subject.id
                        );

                    const max =
                        getMaxMarks(subject);

                    const grade =
                        getGrade(old,max);

                    const gradeClass =
                        getGradeClass(grade);


                    html += `

                    <td>

                        <input

                            class="marks-input"

                            type="number"

                            min="0"

                            max="${max}"

                            step="0.01"

                            id="mark_${index}_${subjectIndex}"

                            data-student="${student.id}"

                            data-subject="${subject.id}"

                            data-max="${max}"

                            value="${
                                old !== null &&
                                old !== undefined
                                ? old
                                : ""
                            }"

                            oninput="
                                updateGrade(
                                    ${index},
                                    ${subjectIndex}
                                )
                            "

                        >

                    </td>

                    <td>

                        <span

                            class="grade ${gradeClass}"

                            id="grade_${index}_${subjectIndex}"

                        >
                            ${grade}
                        </span>

                    </td>

                    `;

                }
            );


            html += `
            </tr>
            `;

        }
    );


    html += `

        </tbody>

    </table>

    </div>

    `;


    container.innerHTML =
        html;
}


/* =========================================================
   EXISTING MARK
========================================================= */

function getExistingMark(
    studentId,
    subjectId
){

    if(
        !existingMarks[studentId]
    ){
        return "";
    }


    const record =
        existingMarks[studentId]
        .marks
        .find(
            x =>
                String(x.subject_id) ===
                String(subjectId)
        );


    if(!record){
        return "";
    }


    return record.marks;
}


/* =========================================================
   UPDATE GRADE
========================================================= */

function updateGrade(
    studentIndex,
    subjectIndex
){

    const input =
        document.getElementById(
            `mark_${studentIndex}_${subjectIndex}`
        );

    const grade =
        document.getElementById(
            `grade_${studentIndex}_${subjectIndex}`
        );


    const max =
        Number(
            input.dataset.max
        );


    let value =
        input.value;


    if(
        value !== "" &&
        Number(value) > max
    ){

        input.value = max;

        value = max;
    }


    if(
        value !== "" &&
        Number(value) < 0
    ){

        input.value = 0;

        value = 0;
    }


    const g =
        getGrade(value,max);


    grade.innerText = g;

    grade.className =
        "grade " +
        getGradeClass(g);
}


/* =========================================================
   GRADE CLASS
========================================================= */

function getGradeClass(g){

    if(g === "A+")
        return "grade-Aplus";

    if(g === "A")
        return "grade-A";

    if(g === "B+")
        return "grade-Bplus";

    if(g === "B")
        return "grade-B";

    if(g === "C")
        return "grade-C";

    return "";
}


/* =========================================================
   SAVE ALL MARKS
========================================================= */

async function saveAllMarks(){

    if(students.length === 0){

        showMessage(
            "ಮೊದಲು Students Load ಮಾಡಿ.",
            "error"
        );

        return;
    }


    const exam =
        document.getElementById(
            "examSelect"
        ).value;


    if(!exam){

        showMessage(
            "ಪರೀಕ್ಷೆ ಆಯ್ಕೆಮಾಡಿ.",
            "error"
        );

        return;
    }


    showMessage(
        "Marks Save ಆಗುತ್ತಿದೆ...",
        "info"
    );


    try{

        let savedCount = 0;


        for(
            let studentIndex = 0;
            studentIndex < students.length;
            studentIndex++
        ){

            const student =
                students[studentIndex];


            /* ----------------------------------
               EXAM RESULT
            ---------------------------------- */

            let examResultId =
                existingMarks[
                    student.id
                ]?.examResultId;


            if(!examResultId){

                const {
                    data,
                    error
                } =
                await supabaseClient
                .from("exam_results")
                .insert({

                    student_id:
                        student.id,

                    exam_type:
                        exam,

                    published:
                        false

                })
                .select("id")
                .single();


                if(error){

                    throw new Error(
                        "Exam Result Save: " +
                        error.message
                    );
                }


                examResultId =
                    data.id;

            }


            /* ----------------------------------
               EACH SUBJECT
            ---------------------------------- */

            for(
                let subjectIndex = 0;
                subjectIndex < subjects.length;
                subjectIndex++
            ){

                const subject =
                    subjects[subjectIndex];


                const input =
                    document.getElementById(
                        `mark_${studentIndex}_${subjectIndex}`
                    );


                if(!input){
                    continue;
                }


                const value =
                    input.value;


                /*
                   Empty mark skip
                */

                if(
                    value === "" ||
                    value === null
                ){
                    continue;
                }


                const marks =
                    Number(value);


                const max =
                    getMaxMarks(subject);


                if(
                    isNaN(marks) ||
                    marks < 0 ||
                    marks > max
                ){

                    throw new Error(
                        `${student.student_name} - ` +
                        `${getSubjectName(subject)} ` +
                        `Marks ${max} ಒಳಗೆ ಇರಬೇಕು.`
                    );

                }


                /* --------------------------------
                   CHECK EXISTING MARK
                -------------------------------- */

                const {
                    data: oldMark,
                    error: findError
                } =
                await supabaseClient
                .from("result_marks")
                .select("id")
                .eq(
                    "exam_result_id",
                    examResultId
                )
                .eq(
                    "subject_id",
                    subject.id
                )
                .limit(1);


                if(findError){

                    throw new Error(
                        "Mark Search: " +
                        findError.message
                    );
                }


                if(
                    oldMark &&
                    oldMark.length > 0
                ){

                    const {
                        error
                    } =
                    await supabaseClient
                    .from("result_marks")
                    .update({
                        marks:marks
                    })
                    .eq(
                        "id",
                        oldMark[0].id
                    );


                    if(error){

                        throw new Error(
                            "Mark Update: " +
                            error.message
                        );
                    }

                }
                else{

                    const {
                        error
                    } =
                    await supabaseClient
                    .from("result_marks")
                    .insert({

                        exam_result_id:
                            examResultId,

                        subject_id:
                            subject.id,

                        marks:marks

                    });


                    if(error){

                        throw new Error(
                            "Mark Insert: " +
                            error.message
                        );
                    }

                }

            }


            savedCount++;

        }


        showMessage(
            `✅ ${savedCount} ವಿದ್ಯಾರ್ಥಿಗಳ Marks ಯಶಸ್ವಿಯಾಗಿ Save ಆಗಿವೆ.`,
            "success"
        );


        /*
           Save ಆದ ನಂತರ ಮತ್ತೆ Load
        */

        await loadExistingMarks(exam);

        renderMarksTable();

    }
    catch(error){

        console.error(error);

        showMessage(
            "❌ Marks Save Error: " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   EXCEL DOWNLOAD
========================================================= */

function downloadExcel(){

    if(students.length === 0){

        showMessage(
            "ಮೊದಲು ತರಗತಿ + ವಿಭಾಗ + ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ Students Load ಮಾಡಿ.",
            "error"
        );

        return;
    }


    if(subjects.length === 0){

        showMessage(
            "Subjects Load ಆಗಿಲ್ಲ.",
            "error"
        );

        return;
    }


    const exam =
        document.getElementById(
            "examSelect"
        ).value;


    const className =
        document.getElementById(
            "classSelect"
        ).value;


    const division =
        document.getElementById(
            "divisionSelect"
        ).value;


    /*
       HEADER
    */

    const headers = [

        "Roll No",
        "Student Name",
        "Father Name",
        "Mother Name",
        "SATS No",
        "DOB",
        "Class",
        "Division",
        "Exam"

    ];


    subjects.forEach(subject => {

        headers.push(
            getSubjectName(subject)
        );

    });


    const rows = [];


    students.forEach(student => {

        const row = [

            student.roll_no || "",

            student.student_name || "",

            student.father_name || "",

            student.mother_name || "",

            student.sats_no || "",

            student.dob || "",

            className,

            division,

            exam

        ];


        subjects.forEach(
            subject => {

                row.push(
                    getExistingMark(
                        student.id,
                        subject.id
                    ) || ""
                );

            }
        );


        rows.push(row);

    });


    const worksheet =
        XLSX.utils.aoa_to_sheet([
            headers,
            ...rows
        ]);


    /*
       Column width
    */

    worksheet["!cols"] = [
        {wch:10},
        {wch:25},
        {wch:22},
        {wch:22},
        {wch:15},
        {wch:14},
        {wch:15},
        {wch:12},
        {wch:22}
    ];


    subjects.forEach(() => {

        worksheet["!cols"].push({
            wch:14
        });

    });


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Marks Entry"
    );


    const fileName =
        `Marks_${className}_${division}_${exam}.xlsx`;


    XLSX.writeFile(
        workbook,
        fileName
    );


    showMessage(
        "✅ Excel Form Download ಆಯಿತು.",
        "success"
    );
}

/* =========================================================
   HANDLE EXCEL UPLOAD
========================================================= */

async function handleExcelUpload(event){

    const file =
        event.target.files[0];


    if(!file){
        return;
    }


    try{

        showMessage(
            "Excel ಓದಲಾಗುತ್ತಿದೆ...",
            "info"
        );


        const buffer =
            await file.arrayBuffer();


        const workbook =
            XLSX.read(
                buffer,
                {type:"array"}
            );


        const sheetName =
            workbook.SheetNames[0];


        const sheet =
            workbook.Sheets[sheetName];


        const rows =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    defval:""
                }
            );


        if(rows.length === 0){

            throw new Error(
                "Excel ನಲ್ಲಿ data ಇಲ್ಲ."
            );
        }


        let updated = 0;


        for(const row of rows){

            const rollNo =
                String(
                    row["Roll No"] || ""
                ).trim();


            if(!rollNo){
                continue;
            }


            const student =
                students.find(
                    s =>
                        String(
                            s.roll_no
                        ).trim() === rollNo
                );


            if(!student){

                console.warn(
                    "Student not found:",
                    rollNo
                );

                continue;
            }


            /*
               ಪ್ರತಿ subject
            */

            for(
                const subject of subjects
            ){

                const subjectName =
                    getSubjectName(subject);


                if(
                    !Object.prototype.hasOwnProperty.call(
                        row,
                        subjectName
                    )
                ){
                    continue;
                }


                const raw =
                    row[subjectName];


                if(
                    raw === "" ||
                    raw === null ||
                    raw === undefined
                ){
                    continue;
                }


                const marks =
                    Number(raw);


                const max =
                    getMaxMarks(subject);


                if(
                    isNaN(marks) ||
                    marks < 0 ||
                    marks > max
                ){

                    throw new Error(
                        `${rollNo} - ` +
                        `${subjectName}: ` +
                        `0 ರಿಂದ ${max} ಒಳಗೆ Marks ಇರಬೇಕು.`
                    );

                }


                /*
                   Exam result find/create
                */

                const exam =
                    document.getElementById(
                        "examSelect"
                    ).value;


                let examResultId =
                    existingMarks[
                        student.id
                    ]?.examResultId;


                if(!examResultId){

                    const {
                        data,
                        error
                    } =
                    await supabaseClient
                    .from("exam_results")
                    .insert({

                        student_id:
                            student.id,

                        exam_type:
                            exam,

                        published:
                            false

                    })
                    .select("id")
                    .single();


                    if(error){

                        throw new Error(
                            "Exam Result: " +
                            error.message
                        );
                    }


                    examResultId =
                        data.id;

                    existingMarks[
                        student.id
                    ] = {

                        examResultId:
                            examResultId,

                        marks:[]

                    };

                }


                /*
                   Existing mark?
                */

                const {
                    data: old,
                    error: oldError
                } =
                await supabaseClient
                .from("result_marks")
                .select("id")
                .eq(
                    "exam_result_id",
                    examResultId
                )
                .eq(
                    "subject_id",
                    subject.id
                )
                .limit(1);


                if(oldError){

                    throw new Error(
                        oldError.message
                    );
                }


                if(
                    old &&
                    old.length > 0
                ){

                    const {
                        error
                    } =
                    await supabaseClient
                    .from("result_marks")
                    .update({
                        marks:marks
                    })
                    .eq(
                        "id",
                        old[0].id
                    );


                    if(error){

                        throw new Error(
                            error.message
                        );
                    }

                }
                else{

                    const {
                        error
                    } =
                    await supabaseClient
                    .from("result_marks")
                    .insert({

                        exam_result_id:
                            examResultId,

                        subject_id:
                            subject.id,

                        marks:marks

                    });


                    if(error){

                        throw new Error(
                            error.message
                        );
                    }

                }

            }


            updated++;

        }


        showMessage(
            `✅ Excel Upload ಪೂರ್ಣಗೊಂಡಿದೆ. ${updated} ವಿದ್ಯಾರ್ಥಿಗಳ Marks update ಆಗಿವೆ.`,
            "success"
        );


        /*
           Reload
        */

        await loadStudents();

    }
    catch(error){

        console.error(error);

        showMessage(
            "❌ Excel Upload Error: " +
            error.message,
            "error"
        );

    }


    /*
       Same file ಮತ್ತೆ upload ಮಾಡಲು
       input reset
    */

    event.target.value = "";

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
