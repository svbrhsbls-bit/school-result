<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marks Entry - ಶಾಲಾ ಫಲಿತಾಂಶ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Kannada",sans-serif;
    background:#eef6fb;
    color:#17324d;
}

.header{
    background:linear-gradient(135deg,#087db5,#1765a8);
    color:white;
    padding:28px 20px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:32px;
}

.header p{
    margin:8px 0 0;
    font-size:20px;
}

.container{
    width:96%;
    max-width:1600px;
    margin:22px auto;
}

.card{
    background:white;
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 5px 18px rgba(0,0,0,.10);
}

.filters{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
}

label{
    display:block;
    font-weight:bold;
    font-size:18px;
    margin-bottom:8px;
}

select,
input{
    width:100%;
    padding:11px 12px;
    border:1px solid #c8d5df;
    border-radius:8px;
    font-size:16px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

button{
    border:none;
    border-radius:8px;
    padding:12px 18px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    color:white;
}

.btn-blue{background:#087db5;}
.btn-green{background:#168a52;}
.btn-orange{background:#ed9410;}
.btn-purple{background:#7045b8;}
.btn-gray{background:#687582;}
.btn-red{background:#d93645;}

.message{
    margin-top:18px;
    padding:13px 16px;
    border-radius:8px;
    font-weight:bold;
    display:none;
}

.message.success{
    display:block;
    background:#d9f4df;
    color:#146b35;
}

.message.error{
    display:block;
    background:#ffe0e0;
    color:#a00000;
}

.message.info{
    display:block;
    background:#dceeff;
    color:#07558c;
}

/* TABLE */

.table-wrapper{
    width:100%;
    overflow-x:auto;
    border:1px solid #d7e0e8;
    border-radius:8px;
}

table{
    border-collapse:collapse;
    width:100%;
    min-width:max-content;
}

th,
td{
    border:1px solid #d5dfe7;
    padding:8px;
    text-align:center;
    white-space:nowrap;
}

thead th{
    background:#087db5;
    color:white;
    font-weight:bold;
}

.subject-head{
    min-width:150px;
}

.subject-code{
    font-size:13px;
    opacity:.95;
}

.subject-max{
    font-size:13px;
}

.student-name{
    text-align:left;
    font-weight:bold;
    min-width:180px;
}

.roll{
    min-width:70px;
}

.sats{
    min-width:130px;
}

.mark-input{
    width:80px;
    text-align:center;
    font-weight:bold;
}

.grade-cell{
    min-width:70px;
    font-weight:bold;
}

.total-cell{
    font-weight:bold;
    background:#eef8ff;
}

.percent-cell{
    font-weight:bold;
    background:#eef8ff;
}

.result-cell{
    font-weight:bold;
    min-width:100px;
}

.pass{
    color:#11863f;
}

.fail{
    color:#d00000;
}

.absent{
    color:#8b4b00;
}

.pending{
    color:#d88700;
}

/* SUMMARY */

.summary-title{
    color:#174d7a;
    margin:0 0 15px;
    font-size:24px;
}

.summary-table th{
    background:#1765a8;
    color:white;
}

.summary-table td{
    font-weight:bold;
}

/* LOADING */

.loading{
    text-align:center;
    padding:30px;
    font-size:18px;
    color:#1765a8;
}

/* PRINT */

@media print{

    @page{
        size:A4 landscape;
        margin:8mm;
    }

    body{
        background:white;
        color:#000;
    }

    .header{
        background:white !important;
        color:#000 !important;
        border-bottom:2px solid #000;
        padding:8px;
    }

    .header h1{
        font-size:20px;
    }

    .header p{
        font-size:14px;
    }

    .filters,
    .buttons,
    #message,
    .no-print{
        display:none !important;
    }

    .container{
        width:100%;
        max-width:none;
        margin:0;
    }

    .card{
        box-shadow:none;
        border:none;
        padding:5px;
        margin:0 0 8px;
    }

    .table-wrapper{
        overflow:visible !important;
        border:none;
    }

    table{
        width:100% !important;
        min-width:0 !important;
        font-size:8px;
    }

    th,
    td{
        padding:3px;
        white-space:normal;
    }

    .mark-input{
        border:none;
        padding:0;
        width:35px;
        font-size:8px;
        background:transparent;
    }

    .student-name{
        min-width:80px;
    }

    .sats{
        min-width:55px;
    }

    .subject-head{
        min-width:60px;
    }

    .grade-cell{
        min-width:30px;
    }

    .summary-title{
        font-size:15px;
    }

    .summary-table{
        font-size:8px;
    }

    .print-title{
        display:block !important;
        text-align:center;
        margin:5px 0;
    }

    input{
        border:none;
    }

    tr{
        page-break-inside:avoid;
    }
}

.print-title{
    display:none;
}

/* MOBILE */

@media(max-width:800px){

    .filters{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:24px;
    }

    .header p{
        font-size:16px;
    }

    .buttons button{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>📝 Marks Entry</h1>
    <p>ಶ್ರೀ ವೀರಬಲ್ಲಾಳ ಗ್ರಾಮಾಂತರ ಪ್ರೌಢಶಾಲೆ</p>
</div>

<div class="container">

    <!-- FILTER CARD -->
    <div class="card no-print">

        <div class="filters">

            <div>
                <label>ತರಗತಿ</label>
                <select id="classSelect">
                    <option value="8">8ನೇ ತರಗತಿ</option>
                    <option value="9">9ನೇ ತರಗತಿ</option>
                    <option value="10">10ನೇ ತರಗತಿ</option>
                </select>
            </div>

            <div>
                <label>ವಿಭಾಗ</label>
                <select id="divisionSelect">
                    <option value="A">A</option>
                </select>
            </div>

            <div>
                <label>ಪರೀಕ್ಷೆ</label>
                <select id="examSelect">
                    <option value="HALF_YEARLY">ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ</option>
                    <option value="ANNUAL">ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ</option>
                </select>
            </div>

        </div>

        <div class="buttons">

            <button class="btn-blue" onclick="loadStudents()">
                🔄 Students Load
            </button>

            <button class="btn-green" onclick="saveAllMarks()">
                💾 Save Marks
            </button>

            <button class="btn-orange" onclick="downloadExcel()">
                📥 Excel Download
            </button>

            <button class="btn-purple" onclick="document.getElementById('excelFile').click()">
                📤 Excel Upload
            </button>

            <button class="btn-gray" onclick="printReport()">
                🖨️ Print
            </button>

            <button class="btn-red" onclick="clearPage()">
                ❌ Clear
            </button>

            <input
                type="file"
                id="excelFile"
                accept=".xlsx,.xls"
                style="display:none"
                onchange="uploadExcel(event)"
            >

        </div>

        <div id="message" class="message"></div>

    </div>


    <!-- MARKS TABLE -->

    <div class="card">

        <div class="print-title">
            <h2>ಶ್ರೀ ವೀರಬಲ್ಲಾಳ ಗ್ರಾಮಾಂತರ ಪ್ರೌಢಶಾಲೆ</h2>
            <div id="printExamTitle"></div>
        </div>

        <h2 id="studentCountTitle">
            ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: 0
        </h2>

        <div id="marksContainer">
            <div class="loading">
                Students Load button ಒತ್ತಿ
            </div>
        </div>

    </div>


    <!-- SUMMARY -->

    <div class="card">

        <h2 class="summary-title">
            📊 ವಿದ್ಯಾರ್ಥಿಗಳ ಫಲಿತಾಂಶ ಸಾರಾಂಶ
        </h2>

        <div class="table-wrapper">

            <table class="summary-table">

                <thead>
                    <tr>
                        <th>Roll No</th>
                        <th>ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು</th>
                        <th>ಒಟ್ಟು ಅಂಕ</th>
                        <th>ಗರಿಷ್ಠ ಅಂಕ</th>
                        <th>ಶೇಕಡಾವಾರು</th>
                        <th>ಗ್ರೇಡ್</th>
                        <th>ಫಲಿತಾಂಶ</th>
                    </tr>
                </thead>

                <tbody id="summaryBody">
                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

/*
   ⚠️ ಇಲ್ಲಿ ನಿಮ್ಮ ಈಗಾಗಲೇ ಕೆಲಸ ಮಾಡುತ್ತಿರುವ
   ಹಳೆಯ marks-entry.html ನ Supabase URL ಮತ್ತು ANON KEY
   ಹಾಕಿ.
*/

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let students = [];
let subjects = [];

let currentClass = "";
let currentDivision = "";
let currentExam = "";


/* =========================================================
   PAGE LOAD
   ========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    document
        .getElementById("classSelect")
        .addEventListener("change", () => {

            students = [];
            subjects = [];

            document.getElementById("marksContainer").innerHTML =
                '<div class="loading">Students Load button ಒತ್ತಿ</div>';

            document.getElementById("summaryBody").innerHTML = "";

            document.getElementById("studentCountTitle").textContent =
                "ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: 0";
        });

});


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text, type="success"){

    const box = document.getElementById("message");

    box.textContent = text;

    box.className = "message " + type;

}


/* =========================================================
   NORMALIZE CLASS
   ========================================================= */

function normalizeClass(value){

    if(value === null || value === undefined){
        return "";
    }

    let v = String(value).trim();

    v = v
        .replace("ನೇ ತರಗತಿ","")
        .replace("ತರಗತಿ","")
        .trim();

    if(v === "8" || v === "08"){
        return "8";
    }

    if(v === "9" || v === "09"){
        return "9";
    }

    if(v === "10"){
        return "10";
    }

    return v;
}


/* =========================================================
   NORMALIZE DIVISION
   ========================================================= */

function normalizeDivision(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .trim()
        .toUpperCase();
}


/* =========================================================
   FIND FIELD
   ========================================================= */

function getField(obj, names){

    for(const name of names){

        if(
            obj &&
            Object.prototype.hasOwnProperty.call(obj,name) &&
            obj[name] !== null &&
            obj[name] !== undefined
        ){

            return obj[name];

        }

    }

    return "";
}


/* =========================================================
   LOAD STUDENTS
   ========================================================= */

async function loadStudents(){

    try{

        currentClass =
            normalizeClass(
                document.getElementById("classSelect").value
            );

        currentDivision =
            normalizeDivision(
                document.getElementById("divisionSelect").value
            );

        currentExam =
            document.getElementById("examSelect").value;


        showMessage(
            "ವಿದ್ಯಾರ್ಥಿಗಳು ಮತ್ತು subjects load ಆಗುತ್ತಿದೆ...",
            "info"
        );


        /* ---------------------------------------------
           STUDENTS
        --------------------------------------------- */

        const { data: studentData, error: studentError } =
            await supabaseClient
                .from("students")
                .select("*")
                .order("roll_no", { ascending:true });


        if(studentError){

            throw new Error(
                "Students load failed: " +
                studentError.message
            );

        }


        students = (studentData || []).filter(student => {

            const cls =
                normalizeClass(
                    getField(student,[
                        "class_name",
                        "class",
                        "className",
                        "standard"
                    ])
                );

            const div =
                normalizeDivision(
                    getField(student,[
                        "division",
                        "section",
                        "division_name"
                    ])
                );

            return cls === currentClass &&
                   div === currentDivision;

        });


        if(students.length === 0){

            document.getElementById("marksContainer").innerHTML =
                `
                <div class="loading" style="color:#c00000">
                    ❌ ${currentClass}ನೇ ತರಗತಿ - ${currentDivision}
                    ವಿಭಾಗದಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ.
                    <br><br>
                    Supabase students tableನಲ್ಲಿ
                    <b>class_name</b> ಮತ್ತು <b>division</b>
                    value ಪರಿಶೀಲಿಸಿ.
                </div>
                `;

            document.getElementById("studentCountTitle").textContent =
                "ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: 0";

            document.getElementById("summaryBody").innerHTML = "";

            showMessage(
                "ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ.",
                "error"
            );

            return;

        }


        /* ---------------------------------------------
           SUBJECTS
        --------------------------------------------- */

        const { data: subjectData, error: subjectError } =
            await supabaseClient
                .from("subjects")
                .select("*")
                .order("id",{ascending:true});


        if(subjectError){

            throw new Error(
                "Subjects load failed: " +
                subjectError.message
            );

        }


        subjects = (subjectData || []).filter(subject => {

            const clsValue =
                getField(subject,[
                    "class_name",
                    "class",
                    "standard",
                    "className"
                ]);

            if(!clsValue){
                return true;
            }

            return normalizeClass(clsValue) === currentClass;

        });


        if(subjects.length === 0){

            throw new Error(
                currentClass +
                "ನೇ ತರಗತಿಗೆ subjects ಸಿಗಲಿಲ್ಲ."
            );

        }


        await loadExistingMarks();

        renderMarksTable();

        renderSummary();


        document.getElementById("studentCountTitle").textContent =
            "ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: " + students.length;


        const examText =
            currentExam === "HALF_YEARLY"
            ? "ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ"
            : "ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ";


        document.getElementById("printExamTitle").textContent =
            currentClass +
            "ನೇ ತರಗತಿ - " +
            currentDivision +
            " ವಿಭಾಗ - " +
            examText;


        showMessage(
            students.length +
            " ವಿದ್ಯಾರ್ಥಿಗಳು Load ಆಗಿದ್ದಾರೆ.",
            "success"
        );


    }catch(error){

        console.error(error);

        showMessage(
            "❌ " + error.message,
            "error"
        );

    }

}


/* =========================================================
   LOAD EXISTING MARKS
   ========================================================= */

async function loadExistingMarks(){

    for(const student of students){

        student.examResultId = null;
        student.marksData = {};

        const studentId =
            getField(student,[
                "id",
                "student_id"
            ]);


        const {
            data: examResult,
            error: examError
        } =
            await supabaseClient
                .from("exam_results")
                .select("id,student_id,exam_type")
                .eq("student_id",studentId)
                .eq("exam_type",currentExam)
                .maybeSingle();


        if(examError){

            console.warn(
                "Exam result load error:",
                examError.message
            );

            continue;

        }


        if(!examResult){

            continue;

        }


        student.examResultId =
            examResult.id;


        const {
            data: markRows,
            error: marksError
        } =
            await supabaseClient
                .from("result_marks")
                .select("id,exam_result_id,subject_id,marks")
                .eq(
                    "exam_result_id",
                    examResult.id
                );


        if(marksError){

            console.warn(
                "Marks load error:",
                marksError.message
            );

            continue;

        }


        (markRows || []).forEach(row => {

            student.marksData[
                String(row.subject_id)
            ] = {

                id:row.id,

                marks:
                    row.marks === null
                    ? ""
                    : row.marks

            };

        });

    }

}


/* =========================================================
   SUBJECT NAME
   ========================================================= */

function subjectName(subject){

    return getField(subject,[
        "subject_name",
        "name",
        "subject",
        "subjectName",
        "title"
    ]) || "Subject";

}


/* =========================================================
   SUBJECT CODE
   ========================================================= */

function subjectCode(subject){

    return getField(subject,[
        "subject_code",
        "code",
        "subjectCode"
    ]) || "";

}


/* =========================================================
   MAX MARKS
   ========================================================= */

function subjectMax(subject){

    const value =
        getField(subject,[
            "max_marks",
            "maximum_marks",
            "maxMarks",
            "marks",
            "full_marks"
        ]);

    const n = Number(value);

    if(!isNaN(n) && n > 0){
        return n;
    }

    return 50;

}


/* =========================================================
   ROLL NUMBER
   ========================================================= */

function getRoll(student,index){

    const roll =
        getField(student,[
            "roll_no",
            "roll_number",
            "reg_no",
            "registration_no",
            "registration_number"
        ]);

    if(roll !== ""){
        return String(roll).padStart(2,"0");
    }

    return String(index + 1).padStart(2,"0");

}


/* =========================================================
   STUDENT NAME
   ========================================================= */

function studentName(student){

    return getField(student,[
        "student_name",
        "name",
        "studentName"
    ]) || "Student";

}


/* =========================================================
   FATHER NAME
   ========================================================= */

function fatherName(student){

    return getField(student,[
        "father_name",
        "fatherName",
        "father"
    ]) || "";

}


/* =========================================================
   SATS
   ========================================================= */

function satsNumber(student){

    return getField(student,[
        "sats_no",
        "sats_number",
        "sats",
        "SATS_NO"
    ]) || "";

}


/* =========================================================
   GRADE
   ========================================================= */

function calculateGrade(percent){

    if(percent === null || isNaN(percent)){
        return "";
    }

    percent = Number(percent);


    /*
       8ನೇ ತರಗತಿ Annualಗೆ user ನೀಡಿದ
       grade bands:
       A+ = 90-100
       A  = 70-89
       B+ = 50-69
       B  = 30-49
       C  = 0-29
    */

    if(currentClass === "8" &&
       currentExam === "ANNUAL"){

        if(percent >= 90) return "A+";
        if(percent >= 70) return "A";
        if(percent >= 50) return "B+";
        if(percent >= 30) return "B";
        return "C";

    }


    /*
       Half-yearly ಮತ್ತು 9/10
       percentage based grading
    */

    if(percent >= 90) return "A+";
    if(percent >= 75) return "A";
    if(percent >= 60) return "B+";
    if(percent >= 50) return "B";
    if(percent >= 35) return "C";

    return "F";

}


/* =========================================================
   RESULT
   ========================================================= */

function calculateResult(total,maxTotal){

    if(maxTotal <= 0){
        return "PENDING";
    }

    const percent =
        (Number(total) / Number(maxTotal)) * 100;


    if(percent >= 35){
        return "PASS";
    }

    return "FAIL";

}


/* =========================================================
   MARK VALIDATION
   ========================================================= */

function validateMark(value,max){

    if(value === ""){
        return true;
    }

    const n = Number(value);

    if(isNaN(n)){
        return false;
    }

    if(n < 0 || n > max){
        return false;
    }

    return true;

}


/* =========================================================
   RENDER MARKS TABLE
   ========================================================= */

function renderMarksTable(){

    let html = "";

    html += `
    <div class="table-wrapper">

    <table id="marksTable">

        <thead>

            <tr>

                <th rowspan="2">Roll No</th>

                <th rowspan="2">ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು</th>

                <th rowspan="2">SATS No</th>
    `;


    subjects.forEach(subject => {

        html += `
            <th colspan="2" class="subject-head">

                ${subjectName(subject)}

                <div class="subject-code">
                    ${subjectCode(subject)}
                </div>

                <div class="subject-max">
                    ಗರಿಷ್ಠ: ${subjectMax(subject)}
                </div>

            </th>
        `;

    });


    html += `
                <th rowspan="2">ಒಟ್ಟು</th>
                <th rowspan="2">ಗರಿಷ್ಠ</th>
                <th rowspan="2">ಶೇಕಡಾ</th>
                <th rowspan="2">ಗ್ರೇಡ್</th>
                <th rowspan="2">ಫಲಿತಾಂಶ</th>

            </tr>

            <tr>
    `;


    subjects.forEach(() => {

        html += `
            <th>Marks</th>
            <th>Grade</th>
        `;

    });


    html += `
            </tr>

        </thead>

        <tbody>
    `;


    students.forEach((student,index) => {

        html += `
        <tr data-student-id="${student.id}">

            <td class="roll">
                ${getRoll(student,index)}
            </td>

            <td class="student-name">
                ${escapeHtml(studentName(student))}
            </td>

            <td class="sats">
                ${escapeHtml(String(satsNumber(student)))}
            </td>
        `;


        subjects.forEach(subject => {

            const subjectId =
                String(subject.id);


            const existing =
                student.marksData[subjectId];


            const mark =
                existing
                ? existing.marks
                : "";


            html += `
                <td>

                    <input
                        type="number"
                        class="mark-input"
                        min="0"
                        max="${subjectMax(subject)}"
                        step="0.01"
                        value="${mark}"
                        data-student-id="${student.id}"
                        data-subject-id="${subject.id}"
                        data-max="${subjectMax(subject)}"
                        oninput="markChanged(this)"
                    >

                </td>

                <td
                    class="grade-cell"
                    id="grade-${student.id}-${subject.id}"
                >
                    ${mark !== "" ? subjectGrade(mark,subjectMax(subject)) : ""}
                </td>
            `;

        });


        html += `

            <td
                class="total-cell"
                id="total-${student.id}"
            >
                0.00
            </td>

            <td
                class="total-cell"
                id="max-${student.id}"
            >
                0
            </td>

            <td
                class="percent-cell"
                id="percent-${student.id}"
            >
                0.00%
            </td>

            <td
                class="grade-cell"
                id="overall-grade-${student.id}"
            >
                -
            </td>

            <td
                class="result-cell pending"
                id="result-${student.id}"
            >
                PENDING
            </td>

        </tr>
        `;

    });


    html += `
        </tbody>

    </table>

    </div>
    `;


    document.getElementById("marksContainer").innerHTML =
        html;


    students.forEach(student => {

        calculateStudentTotal(student.id);

    });

}


/* =========================================================
   SUBJECT GRADE
   ========================================================= */

function subjectGrade(mark,max){

    if(mark === "" || max <= 0){
        return "";
    }

    const percent =
        (Number(mark) / Number(max)) * 100;

    return calculateGrade(percent);

}


/* =========================================================
   MARK CHANGED
   ========================================================= */

function markChanged(input){

    const studentId =
        input.dataset.studentId;

    const subjectId =
        input.dataset.subjectId;

    const max =
        Number(input.dataset.max);


    let value =
        input.value.trim();


    if(value !== ""){

        const numberValue =
            Number(value);


        if(
            isNaN(numberValue) ||
            numberValue < 0 ||
            numberValue > max
        ){

            alert(
                "ಈ subjectಗೆ ಗರಿಷ್ಠ ಅಂಕ " +
                max +
                " ಮಾತ್ರ."
            );

            input.value = "";
            value = "";

        }

    }


    const gradeCell =
        document.getElementById(
            `grade-${studentId}-${subjectId}`
        );


    gradeCell.textContent =
        value === ""
        ? ""
        : subjectGrade(value,max);


    calculateStudentTotal(studentId);

    renderSummary();

}


/* =========================================================
   CALCULATE STUDENT TOTAL
   ========================================================= */

function calculateStudentTotal(studentId){

    let total = 0;
    let maxTotal = 0;
    let enteredCount = 0;
    let absent = false;


    subjects.forEach(subject => {

        const input =
            document.querySelector(
                `.mark-input[data-student-id="${studentId}"][data-subject-id="${subject.id}"]`
            );


        const max =
            Number(subjectMax(subject));


        maxTotal += max;


        if(input){

            const value =
                input.value.trim();


            if(value !== ""){

                const n = Number(value);

                if(!isNaN(n)){

                    total += n;

                    enteredCount++;

                }

            }

        }

    });


    const percent =
        maxTotal > 0
        ? (total / maxTotal) * 100
        : 0;


    let overallGrade = "-";

    if(enteredCount > 0){

        overallGrade =
            calculateGrade(percent);

    }


    let result = "PENDING";


    if(enteredCount === subjects.length){

        result =
            calculateResult(
                total,
                maxTotal
            );

    }


    document.getElementById(
        `total-${studentId}`
    ).textContent =
        total.toFixed(2);


    document.getElementById(
        `max-${studentId}`
    ).textContent =
        maxTotal.toFixed(2);


    document.getElementById(
        `percent-${studentId}`
    ).textContent =
        percent.toFixed(2) + "%";


    document.getElementById(
        `overall-grade-${studentId}`
    ).textContent =
        overallGrade;


    const resultCell =
        document.getElementById(
            `result-${studentId}`
        );


    resultCell.textContent =
        result;


    resultCell.className =
        "result-cell " +
        (
            result === "PASS"
            ? "pass"
            :
            result === "FAIL"
            ? "fail"
            :
            "pending"
        );

}


/* =========================================================
   SAVE ALL MARKS
   ========================================================= */

async function saveAllMarks(){

    if(students.length === 0){

        alert(
            "ಮೊದಲು Students Load ಮಾಡಿ."
        );

        return;

    }


    try{

        currentExam =
            document.getElementById("examSelect").value;


        /*
           IMPORTANT:
           Database accepts only:
           HALF_YEARLY
           ANNUAL
        */

        if(
            currentExam !== "HALF_YEARLY" &&
            currentExam !== "ANNUAL"
        ){

            throw new Error(
                "Invalid exam type."
            );

        }


        showMessage(
            "Marks save ಆಗುತ್ತಿದೆ...",
            "info"
        );


        let savedStudents = 0;


        for(const student of students){

            const studentId =
                getField(student,[
                    "id",
                    "student_id"
                ]);


            if(!studentId){
                continue;
            }


            /* -----------------------------------------
               FIND EXISTING EXAM RESULT
            ----------------------------------------- */

            let examResult = null;


            const {
                data: existingExam,
                error: findExamError
            } =
                await supabaseClient
                    .from("exam_results")
                    .select("id")
                    .eq("student_id",studentId)
                    .eq("exam_type",currentExam)
                    .maybeSingle();


            if(findExamError){

                throw findExamError;

            }


            if(existingExam){

                examResult =
                    existingExam;

            }else{

                /* -------------------------------------
                   INSERT EXAM RESULT
                ------------------------------------- */

                const {
                    data:newExam,
                    error:newExamError
                } =
                    await supabaseClient
                        .from("exam_results")
                        .insert({

                            student_id:studentId,

                            /*
                              EXACT DATABASE VALUE
                            */
                            exam_type:currentExam,

                            published:false

                        })
                        .select("id")
                        .single();


                if(newExamError){

                    throw new Error(
                        "Exam result save failed for " +
                        studentName(student) +
                        ": " +
                        newExamError.message
                    );

                }


                examResult =
                    newExam;

            }


            student.examResultId =
                examResult.id;


            /* -----------------------------------------
               SAVE SUBJECT MARKS
            ----------------------------------------- */

            for(const subject of subjects){

                const input =
                    document.querySelector(
                        `.mark-input[data-student-id="${studentId}"][data-subject-id="${subject.id}"]`
                    );


                if(!input){
                    continue;
                }


                const value =
                    input.value.trim();


                const marks =
                    value === ""
                    ? null
                    : Number(value);


                if(
                    marks !== null &&
                    (
                        isNaN(marks) ||
                        marks < 0 ||
                        marks > Number(subjectMax(subject))
                    )
                ){

                    throw new Error(
                        studentName(student) +
                        " - " +
                        subjectName(subject) +
                        " marks invalid."
                    );

                }


                /* -------------------------------------
                   FIND EXISTING RESULT MARK
                ------------------------------------- */

                const {
                    data:existingMark,
                    error:findMarkError
                } =
                    await supabaseClient
                        .from("result_marks")
                        .select("id")
                        .eq(
                            "exam_result_id",
                            examResult.id
                        )
                        .eq(
                            "subject_id",
                            subject.id
                        )
                        .maybeSingle();


                if(findMarkError){

                    throw findMarkError;

                }


                if(existingMark){

                    /* UPDATE */

                    const {
                        error:updateError
                    } =
                        await supabaseClient
                            .from("result_marks")
                            .update({
                                marks:marks
                            })
                            .eq(
                                "id",
                                existingMark.id
                            );


                    if(updateError){

                        throw new Error(
                            studentName(student) +
                            " - " +
                            subjectName(subject) +
                            " update failed: " +
                            updateError.message
                        );

                    }

                }else{

                    /* INSERT */

                    const {
                        error:insertError
                    } =
                        await supabaseClient
                            .from("result_marks")
                            .insert({

                                exam_result_id:
                                    examResult.id,

                                subject_id:
                                    subject.id,

                                marks:marks

                            });


                    if(insertError){

                        throw new Error(
                            studentName(student) +
                            " - " +
                            subjectName(subject) +
                            " save failed: " +
                            insertError.message
                        );

                    }

                }

            }


            savedStudents++;

        }


        /*
           RELOAD FROM DATABASE
           so that we confirm saved marks
        */

        await loadExistingMarks();

        renderMarksTable();

        renderSummary();


        showMessage(
            "✅ " +
            savedStudents +
            " ವಿದ್ಯಾರ್ಥಿಗಳ Marks ಯಶಸ್ವಿಯಾಗಿ Save ಆಗಿದೆ.",
            "success"
        );


    }catch(error){

        console.error(error);

        showMessage(
            "❌ Marks Save Error: " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   SUMMARY
   ========================================================= */

function renderSummary(){

    const body =
        document.getElementById("summaryBody");


    if(!body){
        return;
    }


    let html = "";


    students.forEach((student,index) => {

        let total = 0;
        let maxTotal = 0;
        let entered = 0;


        subjects.forEach(subject => {

            const input =
                document.querySelector(
                    `.mark-input[data-student-id="${student.id}"][data-subject-id="${subject.id}"]`
                );


            const max =
                Number(subjectMax(subject));


            maxTotal += max;


            if(input){

                const value =
                    input.value.trim();


                if(value !== ""){

                    const n = Number(value);

                    if(!isNaN(n)){

                        total += n;
                        entered++;

                    }

                }

            }

        });


        const percent =
            maxTotal > 0
            ? total / maxTotal * 100
            : 0;


        const grade =
            entered > 0
            ? calculateGrade(percent)
            : "-";


        const result =
            entered === subjects.length
            ? calculateResult(total,maxTotal)
            : "PENDING";


        html += `

        <tr>

            <td>
                ${getRoll(student,index)}
            </td>

            <td style="text-align:left">
                ${escapeHtml(studentName(student))}
            </td>

            <td>
                ${total.toFixed(2)}
            </td>

            <td>
                ${maxTotal.toFixed(2)}
            </td>

            <td>
                ${percent.toFixed(2)}%
            </td>

            <td>
                ${grade}
            </td>

            <td class="${
                result === "PASS"
                ? "pass"
                :
                result === "FAIL"
                ? "fail"
                : "pending"
            }">

                ${result}

            </td>

        </tr>

        `;

    });


    body.innerHTML =
        html;

}


/* =========================================================
   EXCEL DOWNLOAD
   ========================================================= */

function downloadExcel(){

    if(students.length === 0){

        alert(
            "ಮೊದಲು Students Load ಮಾಡಿ."
        );

        return;

    }


    const rows = [];


    students.forEach((student,index) => {

        const row = {

            "Roll No":
                getRoll(student,index),

            "Student Name":
                studentName(student),

            "SATS No":
                satsNumber(student)

        };


        let total = 0;
        let maxTotal = 0;


        subjects.forEach(subject => {

            const input =
                document.querySelector(
                    `.mark-input[data-student-id="${student.id}"][data-subject-id="${subject.id}"]`
                );


            const marks =
                input && input.value !== ""
                ? Number(input.value)
                : "";


            row[
                subjectName(subject) +
                " Marks"
            ] = marks;


            row[
                subjectName(subject) +
                " Grade"
            ] =
                marks === ""
                ? ""
                : subjectGrade(
                    marks,
                    subjectMax(subject)
                );


            if(marks !== ""){
                total += marks;
            }


            maxTotal +=
                Number(subjectMax(subject));

        });


        const percent =
            maxTotal > 0
            ? total / maxTotal * 100
            : 0;


        row["Total"] =
            total;


        row["Maximum"] =
            maxTotal;


        row["Percentage"] =
            Number(percent.toFixed(2));


        row["Grade"] =
            calculateGrade(percent);


        row["Result"] =
            calculateResult(
                total,
                maxTotal
            );


        rows.push(row);

    });


    const worksheet =
        XLSX.utils.json_to_sheet(rows);


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Marks"
    );


    const examName =
        currentExam === "HALF_YEARLY"
        ? "Half-Yearly"
        : "Annual";


    XLSX.writeFile(
        workbook,
        `Class-${currentClass}-${examName}-Marks.xlsx`
    );

}


/* =========================================================
   EXCEL UPLOAD
   ========================================================= */

async function uploadExcel(event){

    const file =
        event.target.files[0];


    if(!file){
        return;
    }


    try{

        if(students.length === 0){

            alert(
                "ಮೊದಲು Students Load ಮಾಡಿ."
            );

            return;

        }


        const data =
            await file.arrayBuffer();


        const workbook =
            XLSX.read(
                data,
                {type:"array"}
            );


        const sheet =
            workbook.Sheets[
                workbook.SheetNames[0]
            ];


        const rows =
            XLSX.utils.sheet_to_json(sheet);


        let count = 0;


        rows.forEach(row => {

            const roll =
                String(
                    row["Roll No"] ||
                    row["Roll Number"] ||
                    ""
                ).trim();


            const student =
                students.find(
                    (s,index) =>
                        getRoll(s,index) ===
                        roll
                );


            if(!student){
                return;
            }


            subjects.forEach(subject => {

                const key =
                    subjectName(subject) +
                    " Marks";


                if(
                    Object.prototype.hasOwnProperty.call(
                        row,
                        key
                    )
                ){

                    const value =
                        row[key];


                    const input =
                        document.querySelector(
                            `.mark-input[data-student-id="${student.id}"][data-subject-id="${subject.id}"]`
                        );


                    if(input){

                        if(
                            value === "" ||
                            value === null ||
                            value === undefined
                        ){

                            input.value = "";

                        }else{

                            input.value =
                                Number(value);

                        }


                        markChanged(input);

                    }

                }

            });


            count++;

        });


        renderSummary();


        showMessage(
            "✅ " +
            count +
            " ವಿದ್ಯಾರ್ಥಿಗಳ Excel Marks Load ಆಗಿದೆ. Save Marks ಒತ್ತಿ.",
            "success"
        );


    }catch(error){

        console.error(error);

        showMessage(
            "❌ Excel Upload Error: " +
            error.message,
            "error"
        );

    }


    event.target.value = "";

}

/* =========================================================
   CLEAR
   ========================================================= */

function clearPage(){

    if(
        !confirm(
            "ಈ pageನ marks clear ಮಾಡಬೇಕೇ?"
        )
    ){
        return;
    }


    document.querySelectorAll(
        ".mark-input"
    ).forEach(input => {

        input.value = "";

    });


    students.forEach(student => {

        subjects.forEach(subject => {

            const grade =
                document.getElementById(
                    `grade-${student.id}-${subject.id}`
                );

            if(grade){
                grade.textContent = "";
            }

        });


        calculateStudentTotal(
            student.id
        );

    });


    renderSummary();


    showMessage(
        "Marks screen clear ಆಗಿದೆ. Database marks ಅಳಿಸಲಾಗಿಲ್ಲ.",
        "info"
    );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}
