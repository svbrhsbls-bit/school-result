<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marks Entry</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,"Noto Sans Kannada",sans-serif;
    background:#eef5fb;
    color:#173b63;
}

.header{
    background:linear-gradient(135deg,#0878b9,#145da0);
    color:white;
    text-align:center;
    padding:22px;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    margin:7px 0 0;
}

.container{
    width:96%;
    max-width:1500px;
    margin:20px auto;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.10);
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    font-size:17px;
}

select,input{
    width:100%;
    padding:11px;
    border:1px solid #bbb;
    border-radius:7px;
    font-size:16px;
}

button{
    padding:11px 17px;
    margin:5px;
    border:0;
    border-radius:7px;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.btn-blue{background:#0878b9}
.btn-green{background:#198754}
.btn-orange{background:#f39c12}
.btn-purple{background:#673ab7}
.btn-gray{background:#6c757d}
.btn-red{background:#dc3545}

.buttons{
    margin-top:18px;
    display:flex;
    flex-wrap:wrap;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:7px;
    font-weight:bold;
}

.success{
    display:block;
    background:#d4edda;
    color:#155724;
}

.error{
    display:block;
    background:#f8d7da;
    color:#721c24;
}

.info{
    display:block;
    background:#d9edf7;
    color:#31708f;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
}

th{
    background:#0878b9;
    color:white;
    padding:10px;
    border:1px solid white;
    text-align:center;
}

td{
    border:1px solid #ddd;
    padding:7px;
    text-align:center;
}

.name{
    text-align:left;
    font-weight:bold;
}

.mark{
    width:80px;
    text-align:center;
}

.grade{
    font-weight:bold;
    font-size:17px;
}

.count{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.subject-code{
    font-size:12px;
    opacity:.9;
}

@media(max-width:800px){
    .controls{
        grid-template-columns:1fr;
    }
}

@media print{
    .no-print{
        display:none!important;
    }

    body{
        background:white;
    }

    .card{
        box-shadow:none;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>📝 Marks Entry</h1>
    <p>ಶಾಲಾ ಫಲಿತಾಂಶ ನಿರ್ವಹಣಾ ವ್ಯವಸ್ಥೆ</p>
</div>

<div class="container">

<div class="card no-print">

    <div class="controls">

        <!-- CLASS -->
        <div>
            <label>ತರಗತಿ</label>

            <select id="classSelect">
                <option value="">ತರಗತಿ ಆಯ್ಕೆಮಾಡಿ</option>
                <option value="8ನೇ ತರಗತಿ">8ನೇ ತರಗತಿ</option>
                <option value="9ನೇ ತರಗತಿ">9ನೇ ತರಗತಿ</option>
                <option value="10ನೇ ತರಗತಿ">10ನೇ ತರಗತಿ</option>
            </select>
        </div>

        <!-- DIVISION ONLY A -->
        <div>
            <label>ವಿಭಾಗ</label>

            <select id="divisionSelect">
                <option value="A">A</option>
            </select>
        </div>

        <!-- EXAM -->
        <div>
            <label>ಪರೀಕ್ಷೆ</label>

            <select id="examSelect">
                <option value="">ಪರೀಕ್ಷೆ ಆಯ್ಕೆಮಾಡಿ</option>

                <option value="ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ">
                    ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ
                </option>

                <option value="ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ">
                    ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ
                </option>
            </select>
        </div>

    </div>

    <div class="buttons">

        <button class="btn-blue" onclick="loadStudents()">
            🔄 Students Load
        </button>

        <button class="btn-green" onclick="saveMarks()">
            💾 Save Marks
        </button>

        <button class="btn-orange" onclick="downloadExcel()">
            📥 Excel Download
        </button>

        <button class="btn-purple" onclick="document.getElementById('excelFile').click()">
            📤 Excel Upload
        </button>

        <button class="btn-gray" onclick="window.print()">
            🖨️ Print
        </button>

        <button class="btn-red" onclick="clearPage()">
            ✖ Clear
        </button>

        <input
            type="file"
            id="excelFile"
            accept=".xlsx,.xls"
            style="display:none"
            onchange="uploadExcel(event)"
        >

    </div>

    <div id="message" class="message"></div>

</div>


<div class="card">

    <div id="studentCount" class="count">
        ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು Load ಮಾಡಿ
    </div>

    <div id="marksArea">
        <div style="text-align:center;padding:30px">
            ತರಗತಿ ಮತ್ತು ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ
        </div>
    </div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sozlvjvqrgpaabnvjvxe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   SUBJECT MASTER
===================================================== */

const SUBJECTS = [

    {
        code:"01K",
        name:"ಕನ್ನಡ"
    },

    {
        code:"31E",
        name:"English"
    },

    {
        code:"61H",
        name:"Hindi"
    },

    {
        code:"81K",
        name:"ಗಣಿತ"
    },

    {
        code:"83K",
        name:"ವಿಜ್ಞಾನ"
    },

    {
        code:"85K",
        name:"ಸಮಾಜ ವಿಜ್ಞಾನ"
    }

];


/* =====================================================
   DATA
===================================================== */

let students = [];

let loadedMarks = {};


/* =====================================================
   MESSAGE
===================================================== */

function message(text,type){

    const box =
        document.getElementById("message");

    box.className =
        "message " + type;

    box.innerText = text;

    box.style.display = "block";
}


/* =====================================================
   MAX MARKS
===================================================== */

function maxMarks(subject){

    const cls =
        document.getElementById("classSelect").value;

    const exam =
        document.getElementById("examSelect").value;


    /* 8TH */

    if(cls === "8ನೇ ತರಗತಿ"){

        if(exam === "ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ"){
            return 50;
        }

        if(exam === "ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ"){
            return 100;
        }

    }


    /* 9TH / 10TH */

    if(
        cls === "9ನೇ ತರಗತಿ" ||
        cls === "10ನೇ ತರಗತಿ"
    ){

        if(exam === "ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ"){

            if(subject.code === "01K"){
                return 100;
            }

            return 80;
        }


        if(exam === "ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ"){

            if(subject.code === "01K"){
                return 125;
            }

            return 100;
        }

    }


    return 100;
}


/* =====================================================
   GRADE
===================================================== */

function calculateGrade(mark,max){

    if(
        mark === "" ||
        mark === null ||
        mark === undefined
    ){
        return "";
    }

    const n = Number(mark);

    if(isNaN(n)){
        return "";
    }

    const percentage =
        (n / max) * 100;


    if(percentage >= 90){
        return "A+";
    }

    if(percentage >= 70){
        return "A";
    }

    if(percentage >= 50){
        return "B+";
    }

    if(percentage >= 30){
        return "B";
    }

    return "C";
}


/* =====================================================
   LOAD STUDENTS
===================================================== */

async function loadStudents(){

    const cls =
        document.getElementById("classSelect").value;

    const exam =
        document.getElementById("examSelect").value;

    const division = "A";


    if(!cls){

        message(
            "ದಯವಿಟ್ಟು ತರಗತಿ ಆಯ್ಕೆಮಾಡಿ.",
            "error"
        );

        return;
    }


    if(!exam){

        message(
            "ದಯವಿಟ್ಟು ಪರೀಕ್ಷೆ ಆಯ್ಕೆಮಾಡಿ.",
            "error"
        );

        return;
    }


    message(
        "Students Load ಆಗುತ್ತಿದೆ...",
        "info"
    );


    try{

        /*
           ಮುಖ್ಯ:
           division A ಮಾತ್ರ
        */

        const result =
            await supabaseClient
            .from("students")
            .select(`
                id,
                roll_no,
                student_name,
                father_name,
                mother_name,
                sats_no,
                class_name,
                division,
                is_active
            `)
            .eq("class_name",cls)
            .eq("division",division)
            .eq("is_active",true)
            .order("roll_no",{ascending:true});


        if(result.error){

            throw new Error(
                result.error.message
            );
        }


        students =
            result.data || [];


        if(students.length === 0){

            /*
              Debugಗಾಗಿ alternative check:
              is_active filter ಇಲ್ಲದೆ
            */

            const check =
                await supabaseClient
                .from("students")
                .select(`
                    id,
                    roll_no,
                    student_name,
                    class_name,
                    division,
                    is_active
                `)
                .eq("class_name",cls)
                .eq("division",division)
                .order("roll_no",{ascending:true});


            if(
                !check.error &&
                check.data &&
                check.data.length > 0
            ){

                students =
                    check.data;

            }

        }


        if(students.length === 0){

            document.getElementById(
                "studentCount"
            ).innerText =
                "ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ";


            document.getElementById(
                "marksArea"
            ).innerHTML = `

                <div style="
                    text-align:center;
                    padding:30px;
                    color:#c00;
                    font-size:18px;
                ">

                    ❌ ${cls} - A ವಿಭಾಗದಲ್ಲಿ
                    ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ.

                    <br><br>

                    Supabase students tableನಲ್ಲಿ
                    class_name ಮತ್ತು division value ಪರಿಶೀಲಿಸಿ.

                </div>

            `;


            message(
                "Students ಸಿಗಲಿಲ್ಲ.",
                "error"
            );

            return;
        }


        await loadExistingMarks();

        createMarksTable();


        message(
            `✅ ${students.length} ವಿದ್ಯಾರ್ಥಿಗಳು Load ಆಗಿದ್ದಾರೆ.`,
            "success"
        );

    }
    catch(error){

        console.error(
            "Students Load Error:",
            error
        );


        document.getElementById(
            "marksArea"
        ).innerHTML = `

            <div style="
                padding:25px;
                text-align:center;
                color:#c00;
            ">

                ❌ Students Load Error

                <br><br>

                ${escapeHtml(error.message)}

            </div>
        `;


        message(
            "Students Load: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   LOAD EXISTING MARKS
===================================================== */

async function loadExistingMarks(){

    loadedMarks = {};


    /*
       exam_results table
    */

    const exam =
        document.getElementById(
            "examSelect"
        ).value;


    for(const student of students){

        try{

            const result =
                await supabaseClient
                .from("exam_results")
                .select("id")
                .eq(
                    "student_id",
                    student.id
                )
                .eq(
                    "exam_type",
                    exam
                )
                .limit(1);


            if(
                result.error ||
                !result.data ||
                result.data.length === 0
            ){
                continue;
            }


            const examResultId =
                result.data[0].id;


            const marks =
                await supabaseClient
                .from("result_marks")
                .select(
                    "subject_id,marks"
                )
                .eq(
                    "exam_result_id",
                    examResultId
                );


            if(!marks.error){

                loadedMarks[
                    student.id
                ] = {

                    examResultId:
                        examResultId,

                    marks:
                        marks.data || []

                };

            }

        }
        catch(e){

            console.warn(
                "Existing marks:",
                e
            );

        }

    }

}


/* =====================================================
   GET OLD MARK
===================================================== */

function getOldMark(
    studentId,
    subjectCode
){

    if(
        !loadedMarks[studentId]
    ){
        return "";
    }


    const item =
        loadedMarks[
            studentId
        ].marks.find(
            x =>
                String(
                    x.subject_id
                ) ===
                String(
                    subjectCode
                )
        );


    return item ?
        item.marks :
        "";

}


/* =====================================================
   CREATE TABLE
===================================================== */

function createMarksTable(){

    let html = `

        <div class="table-wrap">

        <table>

        <thead>

        <tr>

            <th rowspan="2">
                Roll No
            </th>

            <th rowspan="2">
                ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು
            </th>

            <th rowspan="2">
                SATS No
            </th>
    `;


    SUBJECTS.forEach(subject => {

        html += `

            <th colspan="2">

                ${subject.name}

                <div class="subject-code">
                    ${subject.code}
                </div>

                <div>
                    Max: ${maxMarks(subject)}
                </div>

            </th>

        `;

    });


    html += `

        </tr>

        <tr>
    `;


    SUBJECTS.forEach(() => {

        html += `
            <th>Marks</th>
            <th>Grade</th>
        `;

    });


    html += `
        </tr>

        </thead>

        <tbody>
    `;


    students.forEach(
        (student,index) => {

            html += `

                <tr>

                    <td>
                        ${escapeHtml(
                            student.roll_no || ""
                        )}
                    </td>

                    <td class="name">

                        ${escapeHtml(
                            student.student_name || ""
                        )}

                    </td>

                    <td>
                        ${escapeHtml(
                            student.sats_no || ""
                        )}
                    </td>

            `;


            SUBJECTS.forEach(
                (subject,sIndex) => {

                    const old =
                        getOldMark(
                            student.id,
                            subject.code
                        );


                    const max =
                        maxMarks(subject);


                    const grade =
                        calculateGrade(
                            old,
                            max
                        );


                    html += `

                        <td>

                            <input

                                type="number"

                                class="mark"

                                id="mark_${index}_${sIndex}"

                                min="0"

                                max="${max}"

                                step="0.01"

                                value="${
                                    old === ""
                                    ? ""
                                    : old
                                }"

                                oninput="
                                    updateGrade(
                                        ${index},
                                        ${sIndex}
                                    )
                                "

                            >

                        </td>

                        <td>

                            <span
                                class="grade"
                                id="grade_${index}_${sIndex}"
                            >
                                ${grade}
                            </span>

                        </td>

                    `;

                }
            );


            html += `
                </tr>
            `;

        }
    );


    html += `

        </tbody>

        </table>

        </div>
    `;


    document.getElementById(
        "marksArea"
    ).innerHTML =
        html;


    document.getElementById(
        "studentCount"
    ).innerText =
        `ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: ${students.length}`;
}


/* =====================================================
   UPDATE GRADE
===================================================== */

function updateGrade(
    studentIndex,
    subjectIndex
){

    const input =
        document.getElementById(
            `mark_${studentIndex}_${subjectIndex}`
        );


    const grade =
        document.getElementById(
            `grade_${studentIndex}_${subjectIndex}`
        );


    const subject =
        SUBJECTS[subjectIndex];


    const max =
        maxMarks(subject);


    let value =
        input.value;


    if(
        value !== "" &&
        Number(value) > max
    ){

        input.value = max;

        value = max;
    }


    if(
        value !== "" &&
        Number(value) < 0
    ){

        input.value = 0;

        value = 0;
    }


    grade.innerText =
        calculateGrade(
            value,
            max
        );

}


/* =====================================================
   SAVE MARKS
===================================================== */

async function saveMarks(){

    if(students.length === 0){

        message(
            "ಮೊದಲು Students Load ಮಾಡಿ.",
            "error"
        );

        return;
    }


    const exam =
        document.getElementById(
            "examSelect"
        ).value;


    if(!exam){

        message(
            "ಪರೀಕ್ಷೆ ಆಯ್ಕೆಮಾಡಿ.",
            "error"
        );

        return;
    }


    message(
        "Marks Save ಆಗುತ್ತಿದೆ...",
        "info"
    );


    try{

        let savedStudents = 0;


        for(
            let i=0;
            i<students.length;
            i++
        ){

            const student =
                students[i];


            /*
               Find existing exam result
            */

            let examResultId =
                loadedMarks[
                    student.id
                ]?.examResultId;


            /*
               Create if not found
            */

            if(!examResultId){

                const insertResult =
                    await supabaseClient
                    .from("exam_results")
                    .insert({

                        student_id:
                            student.id,

                        exam_type:
                            exam,

                        published:
                            false

                    })
                    .select("id")
                    .single();


                if(insertResult.error){

                    throw new Error(
                        "exam_results: " +
                        insertResult.error.message
                    );
                }


                examResultId =
                    insertResult.data.id;

            }


            /*
               Subjects
            */

            for(
                let s=0;
                s<SUBJECTS.length;
                s++
            ){

                const subject =
                    SUBJECTS[s];


                const input =
                    document.getElementById(
                        `mark_${i}_${s}`
                    );


                if(!input){
                    continue;
                }


                if(input.value === ""){
                    continue;
                }


                const marks =
                    Number(
                        input.value
                    );


                const max =
                    maxMarks(subject);


                if(
                    isNaN(marks) ||
                    marks < 0 ||
                    marks > max
                ){

                    throw new Error(
                        `${student.student_name} - ${subject.name}: 0 ರಿಂದ ${max} ಒಳಗೆ marks ಇರಬೇಕು.`
                    );

                }


                /*
                   IMPORTANT:
                   ಇಲ್ಲಿ subject code ಅನ್ನು
                   subject_id ಆಗಿ ಬಳಸಲಾಗುತ್ತಿದೆ.

                   ನಿಮ್ಮ result_marks tableನಲ್ಲಿ
                   subject_id UUID ಆಗಿದ್ದರೆ,
                   ಈ ಭಾಗವನ್ನು ನಿಮ್ಮ table structureಗೆ
                   ಅನುಗುಣವಾಗಿ ಬದಲಿಸಬೇಕು.
                */

                const old =
                    await supabaseClient
                    .from("result_marks")
                    .select("id")
                    .eq(
                        "exam_result_id",
                        examResultId
                    )
                    .eq(
                        "subject_id",
                        subject.code
                    )
                    .limit(1);


                if(old.error){

                    throw new Error(
                        "result_marks search: " +
                        old.error.message
                    );

                }


                if(
                    old.data &&
                    old.data.length > 0
                ){

                    const update =
                        await supabaseClient
                        .from("result_marks")
                        .update({
                            marks:marks
                        })
                        .eq(
                            "id",
                            old.data[0].id
                        );


                    if(update.error){

                        throw new Error(
                            "Marks Update: " +
                            update.error.message
                        );

                    }

                }
                else{

                    const insert =
                        await supabaseClient
                        .from("result_marks")
                        .insert({

                            exam_result_id:
                                examResultId,

                            subject_id:
                                subject.code,

                            marks:
                                marks

                        });


                    if(insert.error){

                        throw new Error(
                            "Marks Insert: " +
                            insert.error.message
                        );

                    }

                }

            }


            savedStudents++;

        }


        message(
            `✅ ${savedStudents} ವಿದ್ಯಾರ್ಥಿಗಳ marks save ಆಗಿವೆ.`,
            "success"
        );


        await loadStudents();

    }
    catch(error){

        console.error(
            "Save Error:",
            error
        );


        message(
            "❌ Save Error: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   EXCEL DOWNLOAD
===================================================== */

function downloadExcel(){

    if(students.length === 0){

        message(
            "ಮೊದಲು Students Load ಮಾಡಿ.",
            "error"
        );

        return;
    }


    const cls =
        document.getElementById(
            "classSelect"
        ).value;


    const exam =
        document.getElementById(
            "examSelect"
        ).value;


    const headers = [

        "Roll No",
        "Student Name",
        "Father Name",
        "Mother Name",
        "SATS No",
        "Class",
        "Division",
        "Exam"

    ];


    SUBJECTS.forEach(
        subject => {

            headers.push(
                subject.name
            );

        }
    );


    const rows = [];


    students.forEach(
        student => {

            const row = [

                student.roll_no || "",

                student.student_name || "",

                student.father_name || "",

                student.mother_name || "",

                student.sats_no || "",

                cls,

                "A",

                exam

            ];


            SUBJECTS.forEach(
                subject => {

                    row.push("");

                }
            );


            rows.push(row);

        }
    );


    const sheet =
        XLSX.utils.aoa_to_sheet([
            headers,
            ...rows
        ]);


    sheet["!cols"] = [
        {wch:10},
        {wch:25},
        {wch:22},
        {wch:22},
        {wch:15},
        {wch:15},
        {wch:10},
        {wch:25},
        {wch:15},
        {wch:15},
        {wch:15},
        {wch:15},
        {wch:15},
        {wch:18}
    ];


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        sheet,
        "Marks Entry"
    );


    XLSX.writeFile(
        workbook,
        `Marks_${cls}_A_${exam}.xlsx`
    );


    message(
        "✅ Excel Form Download ಆಗಿದೆ.",
        "success"
    );

}


/* =====================================================
   EXCEL UPLOAD
===================================================== */

async function uploadExcel(event){

    const file =
        event.target.files[0];


    if(!file){
        return;
    }


    if(students.length === 0){

        message(
            "ಮೊದಲು Students Load ಮಾಡಿ.",
            "error"
        );

        event.target.value = "";

        return;
    }


    try{

        message(
            "Excel ಓದಲಾಗುತ್ತಿದೆ...",
            "info"
        );


        const buffer =
            await file.arrayBuffer();


        const workbook =
            XLSX.read(
                buffer,
                {type:"array"}
            );


        const sheet =
            workbook.Sheets[
                workbook.SheetNames[0]
            ];


        const rows =
            XLSX.utils.sheet_to_json(
                sheet,
                {defval:""}
            );


        let updated = 0;


        for(
            const row of rows
        ){

            const roll =
                String(
                    row["Roll No"] || ""
                ).trim();


            if(!roll){
                continue;
            }


            const student =
                students.find(
                    s =>
                        String(
                            s.roll_no
                        ).trim() === roll
                );


            if(!student){
                continue;
            }


            /*
               Put marks into screen
            */

            SUBJECTS.forEach(
                (subject,sIndex) => {

                    const value =
                        row[
                            subject.name
                        ];


                    const input =
                        document.getElementById(
                            `mark_${students.indexOf(student)}_${sIndex}`
                        );


                    if(
                        input &&
                        value !== "" &&
                        value !== undefined
                    ){

                        const max =
                            maxMarks(subject);


                        const n =
                            Number(value);


                        if(
                            !isNaN(n) &&
                            n >= 0 &&
                            n <= max
                        ){

                            input.value =
                                n;


                            updateGrade(
                                students.indexOf(student),
                                sIndex
                            );

                        }

                    }

                }
            );


            updated++;

        }


        message(
            `✅ ${updated} ವಿದ್ಯಾರ್ಥಿಗಳ Excel marks screenಗೆ ಬಂದಿದೆ. ಈಗ Save Marks ಒತ್ತಿ.`,
            "success"
        );


    }
    catch(error){

        console.error(
            "Excel Error:",
            error
        );


        message(
            "❌ Excel Upload: " +
            error.message,
            "error"
        );

    }


    event.target.value = "";

}

/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
