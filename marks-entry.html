<!DOCTYPE html>

<style>

*{

body{

.header{

.form-group label{

button{

.load-btn{

.save-btn{

.clear-btn{
    background:#64748b;

}

button:disabled{

}

.info{

}

.message{

.success{

}

.error{

    color:#b42318;

}

.table-wrapper{

}

table{

}

th,td{
    border:1px solid #d7dee8;

th{

.student-name{

.roll{

.mark-input{

.grade{

.total{

.total-grade{

</head>

<body>

<div class="container">

    <div class="title">

</div>


<script>

/* =========================================================
   SUPABASE CONNECTION
   ========================================================= */

const SUPABASE_URL =
"https://ezmudfrpcvjsngjibvoq.supabase.co";

const SUPABASE_KEY =
"sb_publishable__FYyH6NQaqgARaq2dvuovQ_rKmus0js";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let students = [];
let subjects = [];
let exams = [];
let existingMarks = {};

let selectedClass = "";
let selectedExam = "";
let selectedExamId = "";


/* =========================================================
   GET MAX MARKS
   ========================================================= */

function getMaxMarks(className, subjectCode, examCode){

    className = String(className);
    subjectCode = String(subjectCode);

    /* 8ನೇ ತರಗತಿ */

    if(className === "8"){

        if(examCode === "TERM-1"){
            return 50;
        }

        if(examCode === "ANNUAL"){
            return 100;
        }

    }


    /* 9 ಮತ್ತು 10 */

    if(className === "9" || className === "10"){

        if(examCode === "TERM-1"){

            if(subjectCode === "KAN"){
                return 100;
            }

            return 80;
        }


        if(examCode === "ANNUAL"){

            if(subjectCode === "KAN"){
                return 125;
            }

            return 100;
        }

    }


    return 100;
}


/* =========================================================
   8ನೇ ತರಗತಿ SUBJECT GRADE
   ========================================================= */

function getGrade(className, marks, maxMarks){

    if(
        className !== "8" ||
        marks === "" ||
        marks === null ||
        marks === undefined
    ){
        return "";
    }

    marks = Number(marks);
    maxMarks = Number(maxMarks);

    if(Number.isNaN(marks)){
        return "";
    }

    /* 50ಕ್ಕೆ */

    if(maxMarks === 50){

        if(marks >= 45) return "A+";
        if(marks >= 35) return "A";
        if(marks >= 25) return "B+";
        if(marks >= 15) return "B";

        return "C";
    }


    /* 100ಕ್ಕೆ */

    if(maxMarks === 100){

        if(marks >= 90) return "A+";
        if(marks >= 70) return "A";
        if(marks >= 50) return "B+";
        if(marks >= 30) return "B";

        return "C";
    }

    return "";
}


/* =========================================================
   8ನೇ ತರಗತಿ TOTAL GRADE
   ಒಟ್ಟು ಅಂಕಗಳನ್ನು Percentage ಆಧಾರದಲ್ಲಿ Grade ಮಾಡುತ್ತದೆ
   ========================================================= */

function getOverallGrade(className, totalMarks, maximumMarks){

    if(
        className !== "8" ||
        maximumMarks <= 0
    ){
        return "";
    }

    totalMarks = Number(totalMarks);
    maximumMarks = Number(maximumMarks);

    if(Number.isNaN(totalMarks)){
        return "";
    }

    const percentage =
        (totalMarks / maximumMarks) * 100;


    if(percentage >= 90) return "A+";
    if(percentage >= 70) return "A";
    if(percentage >= 50) return "B+";
    if(percentage >= 30) return "B";

    return "C";
}
