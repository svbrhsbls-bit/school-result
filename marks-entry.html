window.supabase.createClient(

/* =====================================================

let students = [];
let subjects = [];

let currentDivision = "";

/* =====================================================
   HELPERS
===================================================== */

function getValue(obj, keys){

    for(const key of keys){

        if(
            obj &&
            obj[key] !== undefined &&
            obj[key] !== null &&
            obj[key] !== ""
        ){
            return obj[key];
        }
    }

    return "";
}


function classNumber(value){

    const match =
        String(value || "").match(/10|9|8/);

    return match ? match[0] : "";
}


function studentName(student){

    return getValue(
        student,
        [
            "student_name",
            "name",
            "studentName"
        ]
    ) || "Student";
}


function rollNumber(student,index){

    return getValue(
        student,
        [
            "roll_no",
            "roll_number",
            "reg_no",
            "registration_no",
            "registration_number"
        ]
    ) || (index + 1);
}


function subjectName(subject){

    const code = String(subjectCode(subject) || "").trim().toUpperCase();

    const KANNADA_SUBJECT_NAMES = {
        "01K":"ಕನ್ನಡ",
        "31E":"ಇಂಗ್ಲೀಷ್",
        "61H":"ಹಿಂದಿ",
        "81K":"ಗಣಿತ",
        "83K":"ವಿಜ್ಞಾನ",
        "85K":"ಸಮಾಜ ವಿಜ್ಞಾನ"
    };

    if(KANNADA_SUBJECT_NAMES[code]){
        return KANNADA_SUBJECT_NAMES[code];
    }

    return getValue(
        subject,
        [
            "subject_name",
            "name",
            "subject",
            "subjectName",
            "title"
        ]
    ) || "Subject";
}

function subjectCode(subject){

    return getValue(
        subject,
        [
            "subject_code",
            "code",
            "subjectCode"
        ]
    );
}


function isKannada(subject){

    const name =
        String(subjectName(subject))
        .toLowerCase();

    const code =
        String(subjectCode(subject))
        .toLowerCase();

    return(
        name.includes("kannada") ||
        name.includes("ಕನ್ನಡ") ||
        code === "1" ||
        code === "01"
    );
}


/* =====================================================
   MAX MARKS
===================================================== */

function maximumMarks(subject){
    /* Subject Master is the single source of truth for Maximum Marks. */
    const dbMax = Number(subject && subject.max_marks);
    if(Number.isFinite(dbMax) && dbMax > 0){
        return dbMax;
    }

    /* Backward compatibility for old Subject Master exam-specific marks. */
    const cls=currentClass;
    const exam=currentExam;
    const code=String(subjectCode(subject)||"");
    const keys=[];
    if(currentAcademicYear){
        keys.push("subject_marks_" + currentAcademicYear + "_" + (
            cls === "8" ? "8ನೇ ತರಗತಿ" : cls + "ನೇ ತರಗತಿ"
        ) + "_" + exam + "_" + code);
    }
    keys.push("subject_marks_" + (
        cls === "8" ? "8ನೇ ತರಗತಿ" : cls + "ನೇ ತರಗತಿ"
    ) + "_" + exam + "_" + code);

    for(const key of keys){
        const saved=localStorage.getItem(key);
        if(saved !== null && saved !== "" && Number.isFinite(Number(saved))){
            return Number(saved);
        }
    }

    return 100;
}

/* =====================================================
   PERCENTAGE BASED GRADING
===================================================== */
function percentageOf(mark,max){
    const m=Number(mark), mx=Number(max);
    if(!Number.isFinite(m) || !Number.isFinite(mx) || mx<=0) return null;
    return (m/mx)*100;
}

function gradeByPercentage(mark,max, bands){
    const p=percentageOf(mark,max);
    if(p===null) return "";
    for(const band of bands){
        if(p >= band.min) return band.grade;
    }
    return bands[bands.length-1]?.grade || "";
}

const GRADE_8_ANNUAL = [
    {min:90, grade:"A+"},
    {min:70, grade:"A"},
    {min:50, grade:"B+"},
    {min:30, grade:"B"},
    {min:0,  grade:"C"}
];

const GRADE_8_FA = [
    {min:9, grade:"A+"},
    {min:7, grade:"A"},
    {min:5, grade:"B+"},
    {min:3, grade:"B"},
    {min:0, grade:"C"}
];

const GRADE_8_SA = [
    {min:27, grade:"A+"},
    {min:22, grade:"A"},
    {min:16, grade:"B+"},
    {min:10, grade:"B"},
    {min:0, grade:"C"}
];

const GRADE_910 = [
    {min:90, grade:"A+"},
    {min:80, grade:"A"},
    {min:70, grade:"B+"},
    {min:60, grade:"B"},
    {min:50, grade:"C+"},
    {min:35, grade:"C"},
    {min:0,  grade:"NC"}
];

function gradeByPercentage(mark,max,bands){
    const m=Number(mark);
    const mx=Number(max);

    if(!Number.isFinite(m) || !Number.isFinite(mx) || mx<=0){
        return "";
    }

    const p=(m/mx)*100;

    for(const band of bands){
        if(p>=band.min) return band.grade;
    }

    return "";
}

function gradeByRawMark(mark,bands){
    const m=Number(mark);

    if(!Number.isFinite(m)) return "";

    for(const band of bands){
        if(m>=band.min) return band.grade;
    }

    return "";
}

/* =====================================================
   8th CLASS — EXACT GRADING RULES

   FA  / 10 : A+ 9-10, A 7-8, B+ 5-6, B 3-4, C 0-2
   SA  / 30 : A+ 27-30, A 22-26, B+ 16-21, B 10-15, C 0-9
   ANNUAL / 100 : A+ 90-100, A 70-89, B+ 50-69,
                  B 30-49, C 0-29

   For a 50-mark term, the annual bands are proportionally
   applied: A+ 45-50, A 35-44, B+ 25-34, B 15-24, C 0-14.
===================================================== */
function grade8(mark,max){

    const m=Number(mark);
    const mx=Number(max);

    if(!Number.isFinite(m) || !Number.isFinite(mx) || mx<=0){
        return "";
    }

    /* FA */
    if(mx===10){
        return gradeByRawMark(m,GRADE_8_FA);
    }

    /* SA */
    if(mx===30){
        return gradeByRawMark(m,GRADE_8_SA);
    }

    /* Annual */
    if(mx===100){
        return gradeByRawMark(m,GRADE_8_ANNUAL);
    }

    /* 50-mark TERM: same grading bands scaled to 50 */
    if(mx===50){
        if(m>=45) return "A+";
        if(m>=35) return "A";
        if(m>=25) return "B+";
        if(m>=15) return "B";
        return "C";
    }

    /* Any other maximum entered in Subject Master:
       apply the same 8th-class percentage scale. */
    return gradeByPercentage(m,mx,GRADE_8_ANNUAL);
}

function grade910(mark,subject){
    /* 9th/10th grade is calculated from the actual
       Subject Master maximum marks for the selected exam. */
    return gradeByPercentage(
        mark,
        maximumMarks(subject),
        GRADE_910
    );
}

function overallGrade(percentage){
    if(currentClass === "8"){
        return gradeByPercentage(
            percentage,
            100,
            GRADE_8_ANNUAL
        );
    }

    return gradeByPercentage(
        percentage,
        100,
        GRADE_910
    );
}

function subjectGrade(mark,max,subject){
    if(currentClass === "8"){
        return grade8(mark,max);
    }

    if(currentClass === "9" || currentClass === "10"){
        return grade910(mark,subject);
    }

    return "";
}

/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent = text;

/* =====================================================
   LOAD STUDENTS
===================================================== */

/* =====================================================
   SETTINGS — LIVE FROM SETTINGS TABLE
===================================================== */
let appSettings = { school_name:"", school_address:"", exam_name:"", academic_year:"", head_teacher_name:"", class_teacher_8:"", class_teacher_9:"", class_teacher_10:"" };

async function loadAppSettings(){
    try{
        const {data,error}=await supabaseClient
            .from("settings")
            .select("*")
            .order("id",{ascending:true})
            .limit(1)
            .maybeSingle();
        if(error) throw error;

        appSettings={
            school_name:String(data?.school_name??"").trim(),
            school_address:String(data?.school_address??"").trim(),
            exam_name:String(data?.exam_name??"").trim(),
            academic_year:String(data?.academic_year??data?.school_year??"").trim(),
            head_teacher_name:String(data?.head_teacher_name??"").trim(),
            class_teacher_8:String(data?.class_teacher_8??"").trim(),
            class_teacher_9:String(data?.class_teacher_9??"").trim(),
            class_teacher_10:String(data?.class_teacher_10??"").trim()
        };

        currentAcademicYear = appSettings.academic_year;

        const school=document.getElementById("schoolNameHeader");
        const exam=document.getElementById("examNameHeader");
        const year=document.getElementById("academicYearHeader");
        if(school) school.textContent=appSettings.school_name||"Marks Entry";
        if(exam) exam.textContent=appSettings.exam_name||"Marks Entry";
        if(year) year.textContent=currentAcademicYear ? "ಶೈಕ್ಷಣಿಕ ವರ್ಷ - "+currentAcademicYear : "";

        await loadAcademicYears();
    }catch(error){
        console.warn("Settings Load Error:",error.message||error);
    }
}

async function loadAcademicYears(){
    const select=document.getElementById("academicYearSelect");
    if(!select) return;

    const years=new Set();
    if(currentAcademicYear) years.add(currentAcademicYear);

    try{
        const [studentsRes, subjectsRes] = await Promise.all([
            supabaseClient.from("students").select("academic_year"),
            supabaseClient.from("subjects").select("academic_year")
        ]);
        (studentsRes.data||[]).forEach(r=>{ if(r.academic_year) years.add(String(r.academic_year).trim()); });
        (subjectsRes.data||[]).forEach(r=>{ if(r.academic_year) years.add(String(r.academic_year).trim()); });
    }catch(e){ console.warn("Academic years load:",e.message||e); }

    const list=Array.from(years).filter(Boolean).sort((a,b)=>
        parseInt(b.match(/\d{4}/)?.[0]||0)-parseInt(a.match(/\d{4}/)?.[0]||0)
    );
    select.innerHTML=list.length
        ? list.map(y=>`<option value="${escapeHtml(y)}">${escapeHtml(y)}</option>`).join("")
        : `<option value="">${escapeHtml(currentAcademicYear||"Year not found")}</option>`;

    const saved=localStorage.getItem("marks_entry_academic_year");
    currentAcademicYear=(saved && list.includes(saved)) ? saved : (list.includes(currentAcademicYear) ? currentAcademicYear : (list[0]||currentAcademicYear));
    select.value=currentAcademicYear;

    if(!select.dataset.bound){
        select.addEventListener("change",()=>{
            currentAcademicYear=select.value;
            localStorage.setItem("marks_entry_academic_year",currentAcademicYear);
            document.getElementById("academicYearHeader").textContent=currentAcademicYear ? "ಶೈಕ್ಷಣಿಕ ವರ್ಷ - "+currentAcademicYear : "";
            students=[]; subjects=[];
            document.getElementById("marksTableContainer").innerHTML="<p>Academic Year ಆಯ್ಕೆ ಮಾಡಿದ ನಂತರ Students Load ಒತ್ತಿ.</p>";
            document.getElementById("summaryBody").innerHTML="";
            document.getElementById("studentCount").textContent="ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: 0";
        });
        select.dataset.bound="true";
    }
}

/* =====================================================
   SUBJECT MASTER — CURRENT SUBJECTS ONLY
   Old bilingual/English duplicate rows are collapsed.
===================================================== */
function normalizeSubjectKey(name){
    const n=String(name||"").trim().toLowerCase().replace(/\s+/g," ");
    const map={
        "ಕನ್ನಡ":"kannada","kannada":"kannada",
        "ಇಂಗ್ಲಿಷ್":"english","ಇಂಗ್ಲೀಷ್":"english","english":"english",
        "ಹಿಂದಿ":"hindi","hindi":"hindi",
        "ಗಣಿತ":"mathematics","maths":"mathematics","math":"mathematics","mathematics":"mathematics",
        "ವಿಜ್ಞಾನ":"science","science":"science",
        "ಸಮಾಜ ವಿಜ್ಞಾನ":"social science","ಸಾಮಾಜಿಕ ವಿಜ್ಞಾನ":"social science","social science":"social science","socialscience":"social science"
    };
    return map[n]||n;
}
function chooseLatestSubject(group){
    return [...group].sort((a,b)=>{
        const aid=Number(a.id),bid=Number(b.id);
        if(Number.isFinite(aid)&&Number.isFinite(bid)&&aid!==bid)return bid-aid;
        const at=new Date(a.updated_at||a.created_at||0).getTime();
        const bt=new Date(b.updated_at||b.created_at||0).getTime();
        if(Number.isFinite(at)&&Number.isFinite(bt)&&at!==bt)return bt-at;
        return Number(a.display_order||999)-Number(b.display_order||999);
    })[0];
}
function uniqueCurrentSubjects(rows){
    const groups=new Map();
    (rows||[]).filter(r=>r.is_active!==false).forEach(row=>{
        const key=normalizeSubjectKey(subjectName(row));
        if(!key)return;
        if(!groups.has(key))groups.set(key,[]);
        groups.get(key).push(row);
    });
    return Array.from(groups.values()).map(chooseLatestSubject).sort((a,b)=>{
        const ao=Number(a.display_order||999),bo=Number(b.display_order||999);
        if(ao!==bo)return ao-bo;
        return Number(a.id||999999)-Number(b.id||999999);
    });
}

async function loadStudents(){

    try{

        await loadAppSettings();

        currentClass =
            classNumber(
                document.getElementById(
                    "classSelect"
                ).value
            );

        currentDivision =
            document.getElementById(
                "divisionSelect"
            ).value
            .trim()
            .toUpperCase();

        currentExam =
            document.getElementById(
                "examSelect"
            ).value;


        showMessage(
            "Students ಮತ್ತು Subjects loading...",
            "info"
        );


        /* STUDENTS */

        const studentResponse =
            await supabaseClient
                .from("students")
                .select("*")
                .eq("academic_year", currentAcademicYear);


        if(studentResponse.error){
            throw studentResponse.error;
        }


        students =
            (studentResponse.data || [])
            // Students Database uses soft-delete (is_active = false).
            // Marks Entry must show only active students.
            .filter(student => student.is_active !== false)
            .filter(student => {

                const cls =
                    classNumber(
                        getValue(
                            student,
                            [
                                "class_name",
                                "class",
                                "standard",
                                "className"
                            ]
                        )
                    );

                const div =
                    String(
                        getValue(
                            student,
                            [
                                "division",
                                "section",
                                "division_name",
                                "section_name"
                            ]
                        )
                    )
                    .trim()
                    .toUpperCase();


                return(
                    cls === currentClass &&
                    div === currentDivision
                );
            });


        if(!students.length){

            document.getElementById(
                "marksTableContainer"
            ).innerHTML =
                "<p style='color:red;font-weight:bold'>" +
                "❌ " +
                currentClass +
                "ನೇ ತರಗತಿ - " +
                currentDivision +
                " ವಿಭಾಗದಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ." +
                "</p>";

            document.getElementById(
                "studentCount"
            ).textContent =
                "ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: 0";

            showMessage(
                "ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ.",
                "error"
            );

            return;
        }


        /* SUBJECTS — active Subject Master rows, class filtered, duplicates removed */
        const subjectResponse = await supabaseClient
            .from("subjects")
            .select("*")
            .eq("is_active",true)
            .eq("academic_year", currentAcademicYear);

        if(subjectResponse.error) throw subjectResponse.error;

        const classSubjectRows=(subjectResponse.data||[]).filter(subject=>{
            const cls=classNumber(getValue(subject,["class_name","class","standard","className"]));
            return cls===currentClass;
        });

        subjects=uniqueCurrentSubjects(classSubjectRows);

        if(!subjects.length){
            throw new Error("Subject Masterನಲ್ಲಿ ಈ ತರಗತಿಗೆ active subjects ಸಿಗಲಿಲ್ಲ.");
        }

        await loadSavedMarks();

        renderMarksTable();

        updateSummary();


        document.getElementById(
            "studentCount"
        ).textContent =

            students.length;

        );

    }
    catch(error){

        showMessage(

            error.message,

        );
    }
}


/* =====================================================
   LOAD SAVED MARKS
===================================================== */

async function loadSavedMarks(){

    students.forEach(student => {
        student.resultId = null;
        student.marks = {};
    });

    const studentIds = students
        .map(s => getValue(s,["id","student_id"]))
        .filter(Boolean);

    if(!studentIds.length) return;

    /* Load ALL exam results in one request */
    const resultResponse =
        await supabaseClient
            .from("exam_results")
            .select("id,student_id")
            .in("student_id",studentIds)
            .eq("exam_type",currentExam);

    if(resultResponse.error){
        throw resultResponse.error;
    }

    const resultByStudent = new Map();

    (resultResponse.data || []).forEach(row => {
        const key = String(row.student_id);

        if(!resultByStudent.has(key)){
            resultByStudent.set(key,row.id);
        }
    });

    students.forEach(student => {
        const studentId =
            getValue(student,["id","student_id"]);

        student.resultId =
            resultByStudent.get(String(studentId)) || null;
    });

    const resultIds =
        [...resultByStudent.values()];

    if(!resultIds.length) return;

    /* Load ALL marks in one request */
    const marksResponse =
        await supabaseClient
            .from("result_marks")
            .select("exam_result_id,subject_id,marks")
            .in("exam_result_id",resultIds);

    if(marksResponse.error){
        throw marksResponse.error;
    }

    const studentByResult = new Map();

    students.forEach(student => {
        if(student.resultId){
            studentByResult.set(
                String(student.resultId),
                student
            );
        }
    });

    (marksResponse.data || []).forEach(mark => {
        const student =
            studentByResult.get(
                String(mark.exam_result_id)
            );

        if(!student) return;

        student.marks[mark.subject_id] =
            String(mark.marks).toUpperCase() === "AB"
            ? "AB"
            : mark.marks;
    });
}

/* =====================================================
   MARK CHANGED
===================================================== */

function markChanged(input){

    const raw = String(input.value || "").trim();
    const upper = raw.toUpperCase();

    // Allow AB / Absent. "A" is allowed temporarily while typing AB.
    if(upper === "AB" || upper === "ABSENT"){
        input.value = "AB";

        const gradeElement =
            document.getElementById(
                "grade-" +
                input.dataset.student +
                "-" +
                input.dataset.subject
            );

        if(gradeElement){
            gradeElement.textContent = "AB";
        }

        return;
    }

    if(upper === "A"){
        return;
    }


    const value =
        input.value === ""
        ?
        ""
        :
        Number(input.value);

    const max =
        Number(input.dataset.max);


    if(
        value !== "" &&
        (
            value < 0 ||
            value > max
        )
    ){

        alert(
            "ಗರಿಷ್ಠ " +
            max +
            " marks ಮಾತ್ರ."
        );

        input.value = "";

        return;
    }


    const subject =
        subjects.find(
            s =>
            String(s.id) ===
            String(input.dataset.subject)
        );


    const gradeElement =
        document.getElementById(
            "grade-" +
            input.dataset.student +
            "-" +
            input.dataset.subject
        );


    if(value === ""){

        gradeElement.textContent = "";

    }
    else{

        gradeElement.textContent =
            subjectGrade(
                value,
                max,
                subject
            );
    }


    calculateStudent(
        input.dataset.student
    );

    updateSummary();
}


/* =====================================================
   CALCULATE STUDENT
===================================================== */

function calculateStudent(studentId){

    let total = 0;
    let maximum = 0;
    let entered = 0;


    subjects.forEach(subject => {

        const max =
            maximumMarks(subject);

        maximum += max;


        const input =
            getInput(
                studentId,
                subject.id
            );


        if(
            input &&
            input.value !== ""
        ){

            const inputValue = String(input.value).trim().toUpperCase();

            if(inputValue !== "AB"){
                total += Number(input.value);
            }

            entered++;
        }
    });


    const percentage =
        maximum > 0
        ?
        (total / maximum) * 100
        :
        0;


    document.getElementById(
        "total-" + studentId
    ).textContent =
        total.toFixed(2);


    document.getElementById(
        "max-" + studentId
    ).textContent =
        maximum.toFixed(2);


    document.getElementById(
        "percentage-" + studentId
    ).textContent =
        percentage.toFixed(2) + "%";


    const overall =
        document.getElementById(
            "overall-" + studentId
        );


    const result =
        document.getElementById(
            "result-" + studentId
        );


    if(
        entered === subjects.length &&
        subjects.length > 0
    ){

        overall.textContent =
            overallGrade(percentage);


        const pass =
            currentClass === "8"
            ?
            percentage >= 30
            :
            percentage >= 35;


        result.textContent =
            pass
            ?
            "PASS"
            :
            "FAIL";


        result.className =
            pass
            ?
            "pass"
            :
            "fail";

    }
    else{

        overall.textContent = "-";

        result.textContent =
            "PENDING";

        result.className =
            "pending";
    }
}


/* =====================================================
   SAVE MARKS
===================================================== */

async function saveMarks(){

    if(!students.length){
        alert("ಮೊದಲು Students Load ಮಾಡಿ.");
        return;
    }

    try{

        showMessage("💾 Marks save ಆಗುತ್ತಿದೆ...", "info");

        /*
         * FAST SAVE
         * Old version did one Supabase request for every
         * student + subject. That becomes very slow.
         *
         * New version:
         * 1. Fetch existing exam_results in ONE request.
         * 2. Create missing exam_results in parallel.
         * 3. Fetch all existing result_marks in ONE request.
         * 4. Update/insert marks in parallel batches.
         */

        const studentIds = students
            .map(s => getValue(s,["id","student_id"]))
            .filter(Boolean);

        if(!studentIds.length){
            throw new Error("Students ID ಸಿಗಲಿಲ್ಲ.");
        }

        /* ---------------------------------------------
           1. Existing exam results — ONE request
        --------------------------------------------- */

        const existingResultsResponse =
            await supabaseClient
                .from("exam_results")
                .select("id,student_id")
                .in("student_id", studentIds)
                .eq("exam_type", currentExam);

        if(existingResultsResponse.error){
            throw existingResultsResponse.error;
        }

        const resultByStudent = new Map();

        (existingResultsResponse.data || []).forEach(row => {
            const key = String(row.student_id);

            if(!resultByStudent.has(key)){
                resultByStudent.set(key, row.id);
            }
        });

        /* ---------------------------------------------
           2. Create missing exam results in parallel
        --------------------------------------------- */

        const missingStudents = students.filter(student => {
            const id = getValue(student,["id","student_id"]);
            return id && !resultByStudent.has(String(id));
        });

        if(missingStudents.length){

            const newResultRows =
                missingStudents.map(student => ({
                    student_id:
                        getValue(student,["id","student_id"]),
                    exam_type: currentExam,
                    published: false
                }));

            const inserted =
                await supabaseClient
                    .from("exam_results")
                    .insert(newResultRows)
                    .select("id,student_id");

            if(inserted.error){
                throw inserted.error;
            }

            (inserted.data || []).forEach(row => {
                resultByStudent.set(
                    String(row.student_id),
                    row.id
                );
            });
        }

        /* ---------------------------------------------
           3. Prepare all marks and validate first
        --------------------------------------------- */

        const markRows = [];

        for(const student of students){

            const studentId =
                getValue(student,["id","student_id"]);

            const resultId =
                resultByStudent.get(String(studentId));

            if(!resultId){
                continue;
            }

            student.resultId = resultId;

            for(const subject of subjects){

                const input =
                    getInput(studentId,subject.id);

                if(!input){
                    continue;
                }

                const rawMarks =
                    String(input.value || "").trim();

                const isAB =
                    rawMarks.toUpperCase() === "AB" ||
                    rawMarks.toUpperCase() === "ABSENT";

                const marks =
                    rawMarks === ""
                    ? null
                    : (isAB ? "AB" : Number(rawMarks));

                const max =
                    maximumMarks(subject);

                if(
                    marks !== null &&
                    marks !== "AB" &&
                    (
                        !Number.isFinite(marks) ||
                        marks < 0 ||
                        marks > max
                    )
                ){
                    throw new Error(
                        studentName(student) +
                        " → " +
                        subjectName(subject) +
                        " : Maximum " +
                        max
                    );
                }

                markRows.push({
                    studentId,
                    resultId,
                    subjectId: subject.id,
                    marks
                });
            }
        }

        /* ---------------------------------------------
           4. Existing result_marks — ONE request
        --------------------------------------------- */

        const resultIds =
            [...new Set(
                markRows.map(r => r.resultId)
            )];

        const existingMarksResponse =
            resultIds.length
            ?
            await supabaseClient
                .from("result_marks")
                .select("id,exam_result_id,subject_id")
                .in("exam_result_id", resultIds)
            :
            {data:[],error:null};

        if(existingMarksResponse.error){
            throw existingMarksResponse.error;
        }

        const existingMarkMap = new Map();

        (existingMarksResponse.data || []).forEach(row => {

            const key =
                String(row.exam_result_id) +
                "|" +
                String(row.subject_id);

            if(!existingMarkMap.has(key)){
                existingMarkMap.set(key,row.id);
            }

        });

        /* ---------------------------------------------
           5. Update + Insert in parallel batches
        --------------------------------------------- */

        const operations = [];

        for(const row of markRows){

            const key =
                String(row.resultId) +
                "|" +
                String(row.subjectId);

            const existingId =
                existingMarkMap.get(key);

            if(existingId){

                operations.push(
                    () =>
                        supabaseClient
                            .from("result_marks")
                            .update({
                                marks: row.marks
                            })
                            .eq("id", existingId)
                );

            }else{

                operations.push(
                    () =>
                        supabaseClient
                            .from("result_marks")
                            .insert({
                                exam_result_id: row.resultId,
                                subject_id: row.subjectId,
                                marks: row.marks
                            })
                );

            }
        }

        const BATCH_SIZE = 50;

        for(
            let i = 0;
            i < operations.length;
            i += BATCH_SIZE
        ){

            const batch =
                operations.slice(
                    i,
                    i + BATCH_SIZE
                );

            const responses =
                await Promise.all(
                    batch.map(fn => fn())
                );

            const failed =
                responses.find(
                    response => response.error
                );

            if(failed && failed.error){
                throw failed.error;
            }

            showMessage(
                "💾 Marks save ಆಗುತ್ತಿದೆ... " +
                Math.min(
                    i + batch.length,
                    operations.length
                ) +
                " / " +
                operations.length,
                "info"
            );
        }

        /* ---------------------------------------------
           Refresh screen locally
        --------------------------------------------- */

        students.forEach(student => {
            student.marks = student.marks || {};

            subjects.forEach(subject => {
                const input =
                    getInput(
                        getValue(student,["id","student_id"]),
                        subject.id
                    );

                if(input){
                    const value =
                        String(input.value || "").trim();

                    student.marks[subject.id] =
                        value === ""
                        ? ""
                        : (value.toUpperCase() === "AB"
                           ? "AB"
                           : value);
                }
            });
        });

        renderMarksTable();
        updateSummary();

        showMessage(
            "✅ Marks successfully saved.",
            "success"
        );

    }
    catch(error){

        console.error("Fast Save Error:",error);

        showMessage(
            "❌ Marks Save Error: " +
            (error?.message || error),
            "error"
        );

    }
}

}

    if(!students.length){

    ];

        );

        );
    });


    headers.push(
        "Total",
        "Maximum",
        "Percentage",
        "Grade",
        "Result"
    );

    );

            )

            getValue(
                student,
                [
                    "sats_no",
                    "sats_number",
                    "sats"
                ]
            )
        );


        let total = 0;
        let maximum = 0;


        subjects.forEach(subject => {

            const input =
                getInput(
                    getValue(
                        student,
                        ["id","student_id"]
                    ),
                    subject.id
                );


            const value =
                input &&
                input.value !== ""
                ?
                Number(input.value)
                :
                "";


            const max =
                maximumMarks(subject);


            row.push(value);


            row.push(
                value === ""
                ?
                ""
                :
                subjectGrade(
                    value,
                    max,
                    subject
                )
            );


            if(value !== ""){
                total += value;
            }


            maximum += max;
        });


        const percentage =
            maximum
            ?
            total / maximum * 100
            :
            0;

            Number(

            )

            Number(
                maximum.toFixed(2)
            )
        );

        );
    });


    const csv =

        rows.join("\r\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    const examName =

    );


    showMessage(
        "✅ Excel-compatible CSV Download ಆಗಿದೆ. ಅದನ್ನು Microsoft Excelನಲ್ಲಿ ತೆರೆಯಬಹುದು.",
        "success"
    );
}

function printMarks(){

    if(!students.length){

    }

    let html = "";

    /* Only the line below the existing
       "ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು" heading is added.
       School name / Marks Entry / academic year

    const examText =

        : (

        );

            String(

    html += "<table>";
    html += "<thead><tr>";

    html += "<th>Roll</th>";
    html += "<th>ವಿದ್ಯಾರ್ಥಿ</th>";

    subjects.forEach(subject => {

        const name = subjectName(subject);
        const max = maximumMarks(subject);

        html +=
            "<th>" +
            escapeHtml(name) +
            "<br>" +
            "<small>" +
            max +
            "</small>" +
            "</th>";

    });

    html +=
        "<th>Total</th>" +
        "<th>Maximum</th>" +
        "<th>%</th>" +
        "<th>Grade</th>" +
        "<th>Result</th>";

    html += "</tr></thead>";
    html += "<tbody>";

    students.forEach((student,index) => {

        const studentId =
            getValue(
                student,
                ["id","student_id"]
            );

        let total = 0;
        let maximum = 0;
        let entered = 0;

        html += "<tr>";

        html +=
            "<td>" +
            escapeHtml(
                rollNumber(student,index)
            ) +
            "</td>";

        html +=
            "<td style='text-align:left'>" +
            escapeHtml(
                studentName(student)
            ) +
            "</td>";

        subjects.forEach(subject => {

            const input =
                getInput(
                    studentId,
                    subject.id
                );

            const value =
                input && input.value !== ""
                ? Number(input.value)
                : "";

            const max =
                maximumMarks(subject);

            const grade =
                value === ""
                ? ""
                : subjectGrade(
                    value,
                    max,
                    subject
                );

            if(value !== ""){
                total += value;
                entered++;
            }

            maximum += max;

            html +=
                "<td>" +
                (
                    value === ""
                    ? ""
                    : escapeHtml(String(value)) +
                      "<br><b>" +
                      escapeHtml(grade || "-") +
                      "</b>"
                ) +
                "</td>";

        });

        const percentage =
            maximum
            ? total / maximum * 100
            : 0;

        const complete =
            entered === subjects.length;

        const grade =
            complete
            ? overallGrade(percentage)
            : "-";

        const pass =
            currentClass === "8"
            ? percentage >= 30
            : percentage >= 35;

        const result =
            complete
            ? (pass ? "PASS" : "FAIL")
            : "PENDING";

        html += "<td>" + total.toFixed(2) + "</td>";
        html += "<td>" + maximum.toFixed(2) + "</td>";
        html += "<td>" + percentage.toFixed(2) + "%</td>";
        html += "<td><b>" + escapeHtml(grade) + "</b></td>";
        html += "<td>" + result + "</td>";

        html += "</tr>";

    });

    html += "</tbody>";
    html += "</table>";

    document.getElementById("printArea").innerHTML = html;

    window.print();

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* =====================================================
   EXCEL MARKS UPLOAD - ADDED WITHOUT CHANGING EXISTING LOGIC
===================================================== */

function excelUploadNormalize(value){

    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ")
        .replace(/[._-]+/g," ");
}


function excelUploadNumber(value){

    if(value === undefined || value === null || value === ""){
        return null;
    }

    if(typeof value === "number" && Number.isFinite(value)){
        return value;
    }

    const cleaned =
        String(value)
            .trim()
            .replace(/,/g,"")
            .replace(/%$/g,"");

    if(cleaned === "") return null;

    const n = Number(cleaned);

    return Number.isFinite(n) ? n : null;
}


function excelUploadHeaderAliases(){

    return {
        roll:[
            "roll no",
            "roll number",
            "rollno",
            "roll",
            "reg no",
            "reg number",
            "registration no",
            "registration number",
            "registration"
        ],
        name:[
            "student name",
            "studentname",
            "name",
            "ವಿದ್ಯಾರ್ಥಿ ಹೆಸರು",
            "ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು",
            "ವಿದ್ಯಾರ್ಥಿ"
        ],
        sats:[
            "sats no",
            "sats number",
            "satsno",
            "sats",
            "sats no.",
            "sats ಸಂಖ್ಯೆ"
        ],
        subject:[
            "subject",
            "subject name",
            "ವಿಷಯ",
            "ವಿಷಯದ ಹೆಸರು"
        ],
        marks:[
            "marks",
            "mark",
            "ಅಂಕ",
            "ಅಂಕಗಳು",
            "marks obtained",
            "obtained marks"
        ]
    };
}


function excelUploadFindColumn(headers, aliases){

    const normalizedHeaders = headers.map(h =>
        excelUploadNormalize(h)
    );

    const normalizedAliases = aliases.map(a =>
        excelUploadNormalize(a)
    );

    // Exact match first.
    for(const alias of normalizedAliases){

        const index = normalizedHeaders.indexOf(alias);

        if(index >= 0) return headers[index];
    }

    // Then contains match.
    for(let i=0;i<normalizedHeaders.length;i++){

        const h = normalizedHeaders[i];

        if(normalizedAliases.some(alias =>
            h === alias ||
            h.includes(alias) ||
            alias.includes(h)
        )){
            return headers[i];
        }
    }

    return null;
}


function excelUploadFindStudent(row, headers, index){

    const aliases = excelUploadHeaderAliases();

    const rollCol = excelUploadFindColumn(headers, aliases.roll);
    const nameCol = excelUploadFindColumn(headers, aliases.name);
    const satsCol = excelUploadFindColumn(headers, aliases.sats);

    const rowRoll = rollCol ? String(row[rollCol] ?? "").trim() : "";
    const rowName = nameCol ? String(row[nameCol] ?? "").trim() : "";
    const rowSats = satsCol ? String(row[satsCol] ?? "").trim() : "";

    const normRoll = excelUploadNormalize(rowRoll);
    const normName = excelUploadNormalize(rowName);
    const normSats = excelUploadNormalize(rowSats);

    // Best match: SATS No.
    if(normSats){

        const found = students.find((student) =>
            excelUploadNormalize(getValue(student,["sats_no","sats_number","sats"])) === normSats
        );

        if(found) return found;
    }

    // Next: Roll No / Reg No.
    if(normRoll){

        const found = students.find((student,studentIndex) =>
            excelUploadNormalize(String(rollNumber(student,studentIndex))) === normRoll
        );

        if(found) return found;
    }

    // Finally: Student Name.
    if(normName){

        const found = students.find((student) =>
            excelUploadNormalize(studentName(student)) === normName
        );

        if(found) return found;
    }

    return null;
}


function excelUploadFindMarkColumn(headers, subject){

    const name = excelUploadNormalize(subjectName(subject));
    const code = excelUploadNormalize(subjectCode(subject));

    const candidates = [];

    if(name){
        candidates.push(name + " marks");
        candidates.push(name + " mark");
        candidates.push(name);
    }

    if(code){
        candidates.push(code + " marks");
        candidates.push(code + " mark");
        candidates.push(code);
    }

    const normalizedHeaders = headers.map(h =>
        excelUploadNormalize(h)
    );

    for(const candidate of candidates){

        const idx = normalizedHeaders.indexOf(candidate);

        if(idx >= 0) return headers[idx];
    }

    // Accept headers such as "Kannada - Marks", "Kannada Marks", etc.
    for(let i=0;i<normalizedHeaders.length;i++){

        const h = normalizedHeaders[i];

        if(
            (name && h.includes(name)) ||
            (code && h.includes(code))
        ){

            if(
                h.includes("mark") ||
                h.includes("ಅಂಕ") ||
                h === name ||
                h === code
            ){
                return headers[i];
            }
        }
    }

    return null;
}


function excelUploadSetMark(student, subject, value){

    const studentId = getValue(student,["id","student_id"]);

    if(!studentId || !subject || value === null) return false;

    const max = maximumMarks(subject);

    if(value < 0 || value > max){
        return false;
    }

    const input = getInput(studentId,subject.id);

    if(!input) return false;

    input.value = String(value);

    // Keep the uploaded value in the existing student object so
    // renderMarksTable() can rebuild the table without losing it.
    student.marks = student.marks || {};
    student.marks[subject.id] = value;

    // Keep the existing mark-change / grade / summary logic untouched.
    markChanged(input);

    return true;
}


async function handleExcelUpload(event){

    const file = event && event.target && event.target.files
        ? event.target.files[0]
        : null;

    if(!file) return;

    try{
        /* Excel Upload uses the already selected screen state.
           It does NOT change currentClass/currentExam or any
           existing marks-entry logic. */

        if(typeof XLSX === "undefined"){
            throw new Error(
                "Excel library load ಆಗಿಲ್ಲ. Internet connection ಪರಿಶೀಲಿಸಿ."
            );
        }

        if(!students.length || !subjects.length){
            alert(
                "ಮೊದಲು ತರಗತಿ → ವಿಭಾಗ → ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ Students Load ಒತ್ತಿ. ನಂತರ Excel Upload ಮಾಡಿ."
            );
            return;
        }

        showMessage("📥 Excel file ಓದಲಾಗುತ್ತಿದೆ...", "info");

        const buffer = await file.arrayBuffer();

        const workbook = XLSX.read(buffer,{
            type:"array",
            cellDates:false,
            raw:true
        });

        if(!workbook.SheetNames || !workbook.SheetNames.length){
            throw new Error("Excel sheet ಸಿಗಲಿಲ್ಲ.");
        }

        const sheet = workbook.Sheets[workbook.SheetNames[0]];

        const rows = XLSX.utils.sheet_to_json(sheet,{
            defval:"",
            raw:true
        });

        if(!rows.length){
            throw new Error("Excelನಲ್ಲಿ data rows ಸಿಗಲಿಲ್ಲ.");
        }

        const headers = Object.keys(rows[0]);

        if(!headers.length){
            throw new Error("Excel headers ಸಿಗಲಿಲ್ಲ.");
        }

        let marksLoaded = 0;
        let invalidMarks = 0;
        let unmatchedRows = 0;
        let wideRowsWithMarks = 0;

        /* =====================================================
           FORMAT A — Excel Download ಮಾಡಿದ file
           Roll No | Student Name | SATS No | Subject Marks...
        ===================================================== */
        for(let rowIndex=0; rowIndex<rows.length; rowIndex++){

            const row = rows[rowIndex];

            const student = excelUploadFindStudent(
                row,
                headers,
                rowIndex
            );

            if(!student){
                unmatchedRows++;
                continue;
            }

            let rowHadMark = false;

            for(const subject of subjects){

                const markColumn = excelUploadFindMarkColumn(
                    headers,
                    subject
                );

                if(!markColumn) continue;

                const value = excelUploadNumber(row[markColumn]);

                if(value === null) continue;

                const max = maximumMarks(subject);

                if(value < 0 || value > max){
                    invalidMarks++;
                    continue;
                }

                if(excelUploadSetMark(student,subject,value)){
                    marksLoaded++;
                    rowHadMark = true;
                }
            }

            if(rowHadMark){
                wideRowsWithMarks++;
            }
        }

        /* =====================================================
           FORMAT B — Long format
           Roll No | Student Name | Subject | Marks

           Long format is used ONLY if wide format did not
           load any marks, so marks are never loaded twice.
        ===================================================== */
        if(wideRowsWithMarks === 0){

            const aliases = excelUploadHeaderAliases();

            const subjectCol = excelUploadFindColumn(
                headers,
                aliases.subject
            );

            const marksCol = excelUploadFindColumn(
                headers,
                aliases.marks
            );

            if(subjectCol && marksCol){

                for(let rowIndex=0; rowIndex<rows.length; rowIndex++){

                    const row = rows[rowIndex];

                    const student = excelUploadFindStudent(
                        row,
                        headers,
                        rowIndex
                    );

                    if(!student) continue;

                    const uploadedSubject =
                        excelUploadNormalize(row[subjectCol]);

                    const uploadedMarks =
                        excelUploadNumber(row[marksCol]);

                    if(!uploadedSubject || uploadedMarks === null){
                        continue;
                    }

                    const subject = subjects.find(s => {

                        const sName =
                            excelUploadNormalize(subjectName(s));

                        const sCode =
                            excelUploadNormalize(subjectCode(s));

                        return (
                            uploadedSubject === sName ||
                            uploadedSubject === sCode ||
                            (sName && uploadedSubject.includes(sName)) ||
                            (sCode && uploadedSubject.includes(sCode))
                        );
                    });

                    if(!subject) continue;

                    const max = maximumMarks(subject);

                    if(uploadedMarks < 0 || uploadedMarks > max){
                        invalidMarks++;
                        continue;
                    }

                    if(excelUploadSetMark(
                        student,
                        subject,
                        uploadedMarks
                    )){
                        marksLoaded++;
                    }
                }
            }
        }

        /* Existing table/grade/summary logic only. */
        renderMarksTable();
        updateSummary();

        if(marksLoaded === 0){

            showMessage(
                "⚠️ Excel ಓದಲಾಗಿದೆ, ಆದರೆ ಹೊಂದುವ student/subject marks ಸಿಗಲಿಲ್ಲ. Excel headings ಪರಿಶೀಲಿಸಿ.",
                "error"
            );

        }else{

            showMessage(
                "✅ Excel marks load ಆಗಿವೆ. " +
                marksLoaded +
                " marks ತುಂಬಲಾಗಿದೆ. ಈಗ Save Marks ಒತ್ತಿ Supabaseಗೆ save ಮಾಡಿ." +
                (invalidMarks ? " Invalid marks: " + invalidMarks : "") +
                (unmatchedRows ? " Unmatched rows: " + unmatchedRows : ""),
                "success"
            );
        }

    }
    catch(error){

        console.error("Excel Upload Error:",error);

        showMessage(
            "❌ Excel Upload Error: " +
            (error && error.message ? error.message : error),
            "error"
        );

    }
    finally{

        if(event && event.target){
            event.target.value = "";
        }
    }
}
