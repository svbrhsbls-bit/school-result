<script>

/* =====================================================

const SUPABASE_URL =
"https://sozlvjvqrgpaabnvjvxe.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);



/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let students = [];

let subjects = [];

let currentClass = "";

let currentDivision = "";

let currentExam = "";

let currentAcademicYear = "";

let appSettings = {};



/* =====================================================
   HELPERS
===================================================== */

function getValue(obj,keys){

    for(const key of keys){

        if(
            obj &&
            obj[key] !== undefined &&
            obj[key] !== null &&
            obj[key] !== ""
        ){

            return obj[key];

        }

    }

    return "";

}



function classNumber(value){

    const match =
        String(value || "")
        .match(/10|9|8/);

    return match
        ? match[0]
        : "";

}



function studentName(student){

    return getValue(
        student,
        [
            "student_name",
            "name",
            "studentName"
        ]
    ) || "Student";

}



function rollNumber(student,index){

    return getValue(
        student,
        [
            "roll_no",
            "roll_number",
            "reg_no",
            "registration_no",
            "registration_number"
        ]
    ) || (index + 1);

}



function subjectName(subject){

    return getValue(
        subject,
        [
            "subject_name",
            "name",
            "subject",
            "subjectName",
            "title"
        ]
    ) || "Subject";

}



function subjectCode(subject){

    return getValue(
        subject,
        [
            "subject_code",
            "code",
            "subjectCode"
        ]
    );

}



function isKannada(subject){

    const name =
        String(
            subjectName(subject)
        )
        .toLowerCase();

    const code =
        String(
            subjectCode(subject)
        )
        .toLowerCase();

    return(
        name.includes("kannada") ||
        name.includes("ಕನ್ನಡ") ||
        code === "1" ||
        code === "01" ||
        code === "01k"
    );

}



/* =====================================================
   MAXIMUM MARKS
   Subject Master → localStorage exam marks
   Fallback → subjects.max_marks
===================================================== */

function maximumMarks(subject){

    const cls =
        currentClass;

    const exam =
        currentExam;

    const code =
        String(
            subjectCode(subject) || ""
        );


    const classKey =
        cls === "8"
        ? "8ನೇ ತರಗತಿ"
        : cls + "ನೇ ತರಗತಿ";


    const key =
        "subject_marks_" +
        classKey +
        "_" +
        exam +
        "_" +
        code;


    const saved =
        localStorage.getItem(key);


    if(
        saved !== null &&
        saved !== "" &&
        Number.isFinite(Number(saved))
    ){

        return Number(saved);

    }


    /* Use Subject Master max_marks */

    const masterMax =
        Number(
            subject.max_marks
        );


    if(
        Number.isFinite(masterMax) &&
        masterMax > 0
    ){

        return masterMax;

    }


    /* Existing fallback */

    if(cls === "8"){

        return 100;

    }


    if(
        cls === "9" ||
        cls === "10"
    ){

        if(currentExam === "HALF_YEARLY"){

            return isKannada(subject)
                ? 100
                : 80;

        }


        if(currentExam === "ANNUAL"){

            return isKannada(subject)
                ? 125
                : 100;

        }

    }


    return 100;

}



/* =====================================================
   GRADING
===================================================== */

const GRADE_8 = [

    {
        min:90,
        grade:"A+"
    },

    {
        min:70,
        grade:"A"
    },

    {
        min:50,
        grade:"B+"
    },

    {
        min:30,
        grade:"B"
    },

    {
        min:0,
        grade:"C"
    }

];



const GRADE_910 = [

    {
        min:90,
        grade:"A+"
    },

    {
        min:80,
        grade:"A"
    },

    {
        min:70,
        grade:"B+"
    },

    {
        min:60,
        grade:"B"
    },

    {
        min:50,
        grade:"C+"
    },

    {
        min:35,
        grade:"C"
    },

    {
        min:0,
        grade:"NC"
    }

];



function percentageOf(mark,max){

    const m =
        Number(mark);

    const mx =
        Number(max);


    if(
        !Number.isFinite(m) ||
        !Number.isFinite(mx) ||
        mx <= 0
    ){

        return null;

    }


    return(
        m / mx
    ) * 100;

}



function gradeByPercentage(
    mark,
    max,
    bands
){

    const p =
        percentageOf(
            mark,
            max
        );


    if(p === null)
        return "";


    for(const band of bands){

        if(
            p >= band.min
        ){

            return band.grade;

        }

    }


    return "";

}



function grade8(
    mark,
    max
){

    return gradeByPercentage(
        mark,
        max,
        GRADE_8
    );

}



function grade910(
    mark,
    subject
){

    return gradeByPercentage(
        mark,
        maximumMarks(subject),
        GRADE_910
    );

}



function overallGrade(
    percentage
){

    if(
        currentClass === "8"
    ){

        return gradeByPercentage(
            percentage,
            100,
            GRADE_8
        );

    }


    return gradeByPercentage(
        percentage,
        100,
        GRADE_910
    );

}



function subjectGrade(
    mark,
    max,
    subject
){

    if(
        currentClass === "8"
    ){

        return grade8(
            mark,
            max
        );

    }


    if(
        currentClass === "9" ||
        currentClass === "10"
    ){

        return grade910(
            mark,
            subject
        );

    }


    return "";

}

function showMessage(

/* =====================================================
   SETTINGS
===================================================== */

async function loadAppSettings(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("settings")
            .select("*")
            .eq("id",1)
            .maybeSingle();


        if(error)
            throw error;


        if(!data){

            throw new Error(
                "Settings data ಸಿಗಲಿಲ್ಲ."
            );

        }


        appSettings = data;


        currentAcademicYear =
            String(
                data.academic_year ||
                ""
            ).trim();


        document.getElementById(
            "schoolNameHeader"
        ).textContent =
            data.school_name ||
            "Marks Entry";


        document.getElementById(
            "examNameHeader"
        ).textContent =
            data.exam_name ||
            "Marks Entry";


        document.getElementById(
            "academicYearHeader"
        ).textContent =
            currentAcademicYear
            ? "ಶೈಕ್ಷಣಿಕ ವರ್ಷ - " +
              currentAcademicYear
            : "";


        document.getElementById(
            "currentYearInfo"
        ).textContent =
            currentAcademicYear
            ? "📅 Academic Year: " +
              currentAcademicYear
            : "⚠️ Academic Year Settingsನಲ್ಲಿ ನಮೂದಿಸಿಲ್ಲ.";


    }
    catch(error){

        console.error(
            "Settings Load Error:",
            error
        );


        showMessage(
            "❌ Settings Load Error: " +
            error.message,
            "error"
        );

    }

}



/* =====================================================
   LOAD STUDENTS + SUBJECTS
===================================================== */

async function loadStudents(){

    try{

        await loadAppSettings();


        currentClass =
            classNumber(
                document.getElementById(
                    "classSelect"
                ).value
            );


        currentDivision =
            document.getElementById(
                "divisionSelect"
            ).value
            .trim()
            .toUpperCase();


        currentExam =
            document.getElementById(
                "examSelect"
            ).value;


        if(!currentAcademicYear){

            showMessage(
                "❌ Settingsನಲ್ಲಿ Current Academic Year ನಮೂದಿಸಿಲ್ಲ.",
                "error"
            );

            return;

        }


        showMessage(
            "Students ಮತ್ತು Subject Master loading...",
            "info"
        );



        /* =================================================
           STUDENTS
           IMPORTANT:
           Academic Year filter ಇಲ್ಲಿ ಇದೆ.
        ================================================= */

        const studentResponse =
            await supabaseClient
                .from("students")
                .select("*")
                .eq(
                    "academic_year",
                    currentAcademicYear
                );


        if(studentResponse.error){

            throw studentResponse.error;

        }


        students =
            (studentResponse.data || [])
            .filter(
                student =>
                    student.is_active !== false
            )
            .filter(student => {

                const cls =
                    classNumber(
                        getValue(
                            student,
                            [
                                "class_name",
                                "class",
                                "standard",
                                "className"
                            ]
                        )
                    );


                const div =
                    String(
                        getValue(
                            student,
                            [
                                "division",
                                "section",
                                "division_name",
                                "section_name"
                            ]
                        )
                    )
                    .trim()
                    .toUpperCase();


                return(
                    cls === currentClass &&
                    div === currentDivision
                );

            });



        if(!students.length){

            document.getElementById(
                "marksTableContainer"
            ).innerHTML =

                "<p style='color:red;font-weight:bold'>" +

                "❌ " +
                currentAcademicYear +
                " - " +
                currentClass +
                "ನೇ ತರಗತಿ - " +
                currentDivision +
                " ವಿಭಾಗದಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ." +

                "</p>";


            document.getElementById(
                "studentCount"
            ).textContent =
                "ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: 0";


            document.getElementById(
                "summaryBody"
            ).innerHTML = "";


            showMessage(
                "ಈ Academic Yearನಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ.",
                "error"
            );


            return;

        }



        /* =================================================
           SUBJECT MASTER
           
           IMPORTANT:
           ಇಲ್ಲಿ ಯಾವುದೇ hard-coded subject list ಇಲ್ಲ.

           Supabase subjects tableನಿಂದ:
           class_name
           is_active
           display_order
           subject_code
           subject_name

           ನೇರವಾಗಿ ತೆಗೆದುಕೊಳ್ಳಲಾಗುತ್ತದೆ.
        ================================================= */

        const subjectResponse =
            await supabaseClient
                .from("subjects")
                .select("*")
                .eq(
                    "class_name",
                    currentClass
                )
                .eq(
                    "is_active",
                    true
                )
                .order(
                    "display_order",
                    {
                        ascending:true
                    }
                )
                .order(
                    "subject_code",
                    {
                        ascending:true
                    }
                );


        if(subjectResponse.error){

            throw subjectResponse.error;

        }


        /*
          Subject Masterನಲ್ಲಿ ಇರುವ records
          ಅದೇ orderನಲ್ಲಿ ಬಳಸಲಾಗುತ್ತದೆ.
          
          Duplicate remove ಮಾಡುವುದಿಲ್ಲ.
          ಆದ್ದರಿಂದ Subject Masterನಲ್ಲಿ ಹೇಗಿದೆಯೋ
          Marks Entryಯಲ್ಲೂ ಹಾಗೆಯೇ ಬರುತ್ತದೆ.
        */

        subjects =
            subjectResponse.data || [];


        if(!subjects.length){

            throw new Error(
                "Subject Masterನಲ್ಲಿ " +
                currentClass +
                "ನೇ ತರಗತಿಗೆ Active Subjects ಸಿಗಲಿಲ್ಲ."
            );

        }



        await loadSavedMarks();


        renderMarksTable();


        updateSummary();


        document.getElementById(
            "studentCount"
        ).textContent =
            "ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: " +
            students.length;


        showMessage(
            "✅ " +
            currentAcademicYear +
            " → Students ಮತ್ತು Subject Master Subjects Load ಆಗಿವೆ.",
            "success"
        );

    }
    catch(error){

        console.error(
            "Load Error:",
            error
        );


        showMessage(
            "❌ Students / Subjects Load Error: " +
            error.message,
            "error"
        );

    }

}



/* =====================================================
   LOAD SAVED MARKS
===================================================== */

async function loadSavedMarks(){

    for(
        const student of students
    ){

        student.resultId = null;

        student.marks = {};


        const studentId =
            getValue(
                student,
                [
                    "id",
                    "student_id"
                ]
            );


        if(!studentId)
            continue;



        const resultResponse =
            await supabaseClient
                .from("exam_results")
                .select("id")
                .eq(
                    "student_id",
                    studentId
                )
                .eq(
                    "exam_type",
                    currentExam
                )
                .order(
                    "id",
                    {
                        ascending:false
                    }
                )
                .limit(1)
                .maybeSingle();


        if(
            resultResponse.error ||
            !resultResponse.data
        ){

            continue;

        }


        student.resultId =
            resultResponse.data.id;



        const marksResponse =
            await supabaseClient
                .from("result_marks")
                .select(
                    "subject_id,marks"
                )
                .eq(
                    "exam_result_id",
                    student.resultId
                );


        if(
            !marksResponse.error
        ){

            for(
                const mark of
                (
                    marksResponse.data ||
                    []
                )
            ){

                student.marks[
                    mark.subject_id
                ] =
                    mark.marks;

            }

        }

    }

}

function getInput(

/* =====================================================
   MARK CHANGED
===================================================== */

function markChanged(input){

    const value =
        input.value === ""
        ?
        ""
        :
        Number(input.value);


    const max =
        Number(
            input.dataset.max
        );


    if(
        value !== "" &&
        (
            value < 0 ||
            value > max
        )
    ){

        alert(
            "ಗರಿಷ್ಠ " +
            max +
            " marks ಮಾತ್ರ."
        );


        input.value = "";

        return;

    }



    const subject =
        subjects.find(
            s =>
                String(s.id) ===
                String(
                    input.dataset.subject
                )
        );


    const gradeElement =
        document.getElementById(
            "grade-" +
            input.dataset.student +
            "-" +
            input.dataset.subject
        );


    if(value === ""){

        gradeElement.textContent =
            "";

    }
    else{

        gradeElement.textContent =
            subjectGrade(
                value,
                max,
                subject
            );

    }



    const student =
        students.find(
            s =>
                String(
                    getValue(
                        s,
                        [
                            "id",
                            "student_id"
                        ]
                    )
                ) ===
                String(
                    input.dataset.student
                )
        );


    if(student){

        student.marks =
            student.marks || {};


        student.marks[
            input.dataset.subject
        ] =
            value === ""
            ? null
            : value;

    }



    calculateStudent(
        input.dataset.student
    );


    updateSummary();

}



/* =====================================================
   CALCULATE STUDENT
===================================================== */

function calculateStudent(
    studentId
){

    let total = 0;

    let maximum = 0;

    let entered = 0;


    subjects.forEach(
        subject => {

            const max =
                maximumMarks(
                    subject
                );


            maximum += max;


            const input =
                getInput(
                    studentId,
                    subject.id
                );


            if(
                input &&
                input.value !== ""
            ){

                total +=
                    Number(
                        input.value
                    );

                entered++;

            }

        }
    );


    const percentage =
        maximum > 0
        ?
        (
            total /
            maximum
        ) * 100
        :
        0;



    const totalElement =
        document.getElementById(
            "total-" +
            studentId
        );


    const maxElement =
        document.getElementById(
            "max-" +
            studentId
        );


    const percentageElement =
        document.getElementById(
            "percentage-" +
            studentId
        );


    const overall =
        document.getElementById(
            "overall-" +
            studentId
        );


    const result =
        document.getElementById(
            "result-" +
            studentId
        );


    if(totalElement){

        totalElement.textContent =
            total.toFixed(2);

    }


    if(maxElement){

        maxElement.textContent =
            maximum.toFixed(2);

    }


    if(percentageElement){

        percentageElement.textContent =
            percentage.toFixed(2) +
            "%";

    }



    if(
        entered ===
        subjects.length &&
        subjects.length > 0
    ){

        const grade =
            overallGrade(
                percentage
            );


        overall.textContent =
            grade;


        const pass =
            currentClass === "8"
            ?
            percentage >= 30
            :
            percentage >= 35;


        result.textContent =
            pass
            ?
            "PASS"
            :
            "FAIL";


        result.className =
            pass
            ?
            "pass"
            :
            "fail";

    }
    else{

        overall.textContent =
            "-";


        result.textContent =
            "PENDING";


        result.className =
            "pending";

    }

}



/* =====================================================
   SAVE MARKS
===================================================== */

async function saveMarks(){

    if(!students.length){

        alert(
            "ಮೊದಲು Students Load ಮಾಡಿ."
        );

        return;

    }


    if(!currentAcademicYear){

        alert(
            "Current Academic Year ಸಿಗಲಿಲ್ಲ."
        );

        return;

    }


    try{

        showMessage(
            "Marks save ಆಗುತ್ತಿದೆ...",
            "info"
        );


        for(
            const student of students
        ){

            const studentId =
                getValue(
                    student,
                    [
                        "id",
                        "student_id"
                    ]
                );


            if(!studentId)
                continue;


            let resultId =
                student.resultId;



            /* Existing result */

            if(!resultId){

                const existing =
                    await supabaseClient
                        .from("exam_results")
                        .select("id")
                        .eq(
                            "student_id",
                            studentId
                        )
                        .eq(
                            "exam_type",
                            currentExam
                        )
                        .order(
                            "id",
                            {
                                ascending:false
                            }
                        )
                        .limit(1)
                        .maybeSingle();


                if(existing.error){

                    throw existing.error;

                }


                if(existing.data){

                    resultId =
                        existing.data.id;

                }

            }



            /* Create result */

            if(!resultId){

                const inserted =
                    await supabaseClient
                        .from("exam_results")
                        .insert({

                            student_id:
                                studentId,

                            exam_type:
                                currentExam,

                            published:
                                false

                        })
                        .select("id")
                        .single();


                if(inserted.error){

                    throw inserted.error;

                }


                resultId =
                    inserted.data.id;

            }



            /* Save every Subject */

            for(
                const subject of subjects
            ){

                const input =
                    getInput(
                        studentId,
                        subject.id
                    );


                if(!input)
                    continue;


                const marks =
                    input.value === ""
                    ?
                    null
                    :
                    Number(
                        input.value
                    );


                const max =
                    maximumMarks(
                        subject
                    );


                if(
                    marks !== null &&
                    (
                        marks < 0 ||
                        marks > max
                    )
                ){

                    throw new Error(

                        studentName(
                            student
                        ) +

                        " → " +

                        subjectName(
                            subject
                        ) +

                        " : Maximum " +

                        max

                    );

                }



                const existingMark =
                    await supabaseClient
                        .from("result_marks")
                        .select("id")
                        .eq(
                            "exam_result_id",
                            resultId
                        )
                        .eq(
                            "subject_id",
                            subject.id
                        )
                        .order(
                            "id",
                            {
                                ascending:false
                            }
                        )
                        .limit(1)
                        .maybeSingle();


                if(existingMark.error){

                    throw existingMark.error;

                }



                if(existingMark.data){

                    const updated =
                        await supabaseClient
                            .from("result_marks")
                            .update({

                                marks:
                                    marks

                            })
                            .eq(
                                "id",
                                existingMark.data.id
                            );


                    if(updated.error){

                        throw updated.error;

                    }

                }
                else{

                    const inserted =
                        await supabaseClient
                            .from("result_marks")
                            .insert({

                                exam_result_id:
                                    resultId,

                                subject_id:
                                    subject.id,

                                marks:
                                    marks

                            });


                    if(inserted.error){

                        throw inserted.error;

                    }

                }

            }


            student.resultId =
                resultId;

        }



        await loadSavedMarks();


        renderMarksTable();


        updateSummary();


        showMessage(
            "✅ " +
            currentAcademicYear +
            "ರ Marks successfully saved.",
            "success"
        );

    }
    catch(error){

        console.error(
            "Marks Save Error:",
            error
        );


        showMessage(
            "❌ Marks Save Error: " +
            error.message,
            "error"
        );

    }

}

function csvCell(value){

    const text =
        String(
            value === undefined ||
            value === null
            ?
            ""
            :
            value
        );


    return(
        '"' +
        text.replaceAll(
            '"',
            '""'
        ) +
        '"'
    );

}



function downloadExcel(){

    if(!students.length){

        alert(
            "ಮೊದಲು Students Load ಮಾಡಿ."
        );

        return;

    }


    const headers = [

        "Roll No",

        "Student Name",

        "SATS No"

    ];


    subjects.forEach(
        subject => {

            headers.push(
                subjectName(subject) +
                " Marks"
            );


            headers.push(
                subjectName(subject) +
                " Grade"
            );

        }
    );


    headers.push(
        "Total",
        "Maximum",
        "Percentage",
        "Grade",
        "Result"
    );


    const rows = [];


    rows.push(
        headers
        .map(csvCell)
        .join(",")
    );


    students.forEach(
        (student,index) => {

            const row = [];


            const studentId =
                getValue(
                    student,
                    [
                        "id",
                        "student_id"
                    ]
                );


            row.push(
                rollNumber(
                    student,
                    index
                )
            );


            row.push(
                studentName(
                    student
                )
            );


            row.push(
                getValue(
                    student,
                    [
                        "sats_no",
                        "sats_number",
                        "sats"
                    ]
                )
            );


            let total = 0;

            let maximum = 0;


            subjects.forEach(
                subject => {

                    const input =
                        getInput(
                            studentId,
                            subject.id
                        );


                    const value =
                        input &&
                        input.value !== ""
                        ?
                        Number(
                            input.value
                        )
                        :
                        "";


                    const max =
                        maximumMarks(
                            subject
                        );


                    row.push(value);


                    row.push(

                        value === ""
                        ?
                        ""
                        :
                        subjectGrade(
                            value,
                            max,
                            subject
                        )

                    );


                    if(
                        value !== ""
                    ){

                        total += value;

                    }


                    maximum += max;

                }
            );


            const percentage =
                maximum
                ?
                total /
                maximum *
                100
                :
                0;


            row.push(
                Number(
                    total.toFixed(2)
                )
            );


            row.push(
                Number(
                    maximum.toFixed(2)
                )
            );


            row.push(
                percentage.toFixed(2) +
                "%"
            );


            row.push(
                overallGrade(
                    percentage
                )
            );


            row.push(

                currentClass === "8"
                ?
                percentage >= 30
                :
                percentage >= 35

            ?
                "PASS"
                :
                "FAIL"

            );


            rows.push(
                row
                .map(csvCell)
                .join(",")
            );

        }
    );


    const csv =
        "\uFEFF" +
        rows.join("\r\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                "text/csv;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    const examName =
        currentExam ===
        "HALF_YEARLY"
        ?
        "Half-Yearly"
        :
        "Annual";


    link.href =
        url;


    link.download =
        "Marks-" +
        currentAcademicYear +
        "-" +
        currentClass +
        "-" +
        currentDivision +
        "-" +
        examName +
        ".csv";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    setTimeout(
        () =>
            URL.revokeObjectURL(
                url
            ),
        1000
    );


    showMessage(
        "✅ Excel-compatible CSV Download ಆಗಿದೆ.",
        "success"
    );

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}

                    document.getElementById(
                        "marksTableContainer"
                    ).innerHTML =

                        "<p>" +

                        "Students Load button ಒತ್ತಿ." +

                        "</p>";


                    document.getElementById(
                        "summaryBody"
                    ).innerHTML = "";


                    document.getElementById(
                        "studentCount"
                    ).textContent =
                        "ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: 0";

                }
            );

    }
);



/* =====================================================
   EXCEL UPLOAD
===================================================== */

function excelUploadNormalize(value){

    return String(
        value ?? ""
    )
    .trim()
    .toLowerCase()
    .replace(
        /\s+/g,
        " "
    )
    .replace(
        /[._-]+/g,
        " "
    );

}



function excelUploadNumber(value){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return null;

    }


    if(
        typeof value === "number" &&
        Number.isFinite(value)
    ){

        return value;

    }


    const cleaned =
        String(value)
        .trim()
        .replace(
            /,/g,
            ""
        )
        .replace(
            /%$/g,
            ""
        );


    if(cleaned === "")
        return null;


    const n =
        Number(cleaned);


    return Number.isFinite(n)
        ?
        n
        :
        null;

}



function excelUploadHeaderAliases(){

    return {

        roll:[
            "roll no",
            "roll number",
            "rollno",
            "roll",
            "reg no",
            "reg number",
            "registration no",
            "registration number",
            "registration"
        ],


        name:[
            "student name",
            "studentname",
            "name",
            "ವಿದ್ಯಾರ್ಥಿ ಹೆಸರು",
            "ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು",
            "ವಿದ್ಯಾರ್ಥಿ"
        ],


        sats:[
            "sats no",
            "sats number",
            "satsno",
            "sats",
            "sats no.",
            "sats ಸಂಖ್ಯೆ"
        ],


        subject:[
            "subject",
            "subject name",
            "ವಿಷಯ",
            "ವಿಷಯದ ಹೆಸರು"
        ],


        marks:[
            "marks",
            "mark",
            "ಅಂಕ",
            "ಅಂಕಗಳು",
            "marks obtained",
            "obtained marks"
        ]

    };

}



function excelUploadFindColumn(
    headers,
    aliases
){

    const normalizedHeaders =
        headers.map(
            h =>
                excelUploadNormalize(h)
        );


    const normalizedAliases =
        aliases.map(
            a =>
                excelUploadNormalize(a)
        );


    for(
        const alias of
        normalizedAliases
    ){

        const index =
            normalizedHeaders.indexOf(
                alias
            );


        if(index >= 0)
            return headers[index];

    }


    for(
        let i=0;
        i<normalizedHeaders.length;
        i++
    ){

        const h =
            normalizedHeaders[i];


        if(
            normalizedAliases.some(
                alias =>
                    h === alias ||
                    h.includes(alias) ||
                    alias.includes(h)
            )
        ){

            return headers[i];

        }

    }


    return null;

}



function excelUploadFindStudent(
    row,
    headers
){

    const aliases =
        excelUploadHeaderAliases();


    const rollCol =
        excelUploadFindColumn(
            headers,
            aliases.roll
        );


    const nameCol =
        excelUploadFindColumn(
            headers,
            aliases.name
        );


    const satsCol =
        excelUploadFindColumn(
            headers,
            aliases.sats
        );


    const rowRoll =
        rollCol
        ?
        String(
            row[rollCol] ??
            ""
        ).trim()
        :
        "";


    const rowName =
        nameCol
        ?
        String(
            row[nameCol] ??
            ""
        ).trim()
        :
        "";


    const rowSats =
        satsCol
        ?
        String(
            row[satsCol] ??
            ""
        ).trim()
        :
        "";


    const normRoll =
        excelUploadNormalize(
            rowRoll
        );


    const normName =
        excelUploadNormalize(
            rowName
        );


    const normSats =
        excelUploadNormalize(
            rowSats
        );



    if(normSats){

        const found =
            students.find(
                student =>
                    excelUploadNormalize(
                        getValue(
                            student,
                            [
                                "sats_no",
                                "sats_number",
                                "sats"
                            ]
                        )
                    ) ===
                    normSats
            );


        if(found)
            return found;

    }



    if(normRoll){

        const found =
            students.find(
                (student,index) =>

                    excelUploadNormalize(
                        String(
                            rollNumber(
                                student,
                                index
                            )
                        )
                    ) ===
                    normRoll
            );


        if(found)
            return found;

    }



    if(normName){

        const found =
            students.find(
                student =>

                    excelUploadNormalize(
                        studentName(
                            student
                        )
                    ) ===
                    normName
            );


        if(found)
            return found;

    }


    return null;

}



function excelUploadFindMarkColumn(
    headers,
    subject
){

    const name =
        excelUploadNormalize(
            subjectName(subject)
        );


    const code =
        excelUploadNormalize(
            subjectCode(subject)
        );


    const candidates = [];


    if(name){

        candidates.push(
            name + " marks"
        );

        candidates.push(
            name + " mark"
        );

        candidates.push(
            name
        );

    }


    if(code){

        candidates.push(
            code + " marks"
        );

        candidates.push(
            code + " mark"
        );

        candidates.push(
            code
        );

    }


    const normalizedHeaders =
        headers.map(
            h =>
                excelUploadNormalize(h)
        );


    for(
        const candidate of
        candidates
    ){

        const index =
            normalizedHeaders.indexOf(
                candidate
            );


        if(index >= 0)
            return headers[index];

    }


    for(
        let i=0;
        i<normalizedHeaders.length;
        i++
    ){

        const h =
            normalizedHeaders[i];


        if(
            (name && h.includes(name)) ||
            (code && h.includes(code))
        ){

            if(
                h.includes("mark") ||
                h.includes("ಅಂಕ") ||
                h === name ||
                h === code
            ){

                return headers[i];

            }

        }

    }


    return null;

}



function excelUploadSetMark(
    student,
    subject,
    value
){

    const studentId =
        getValue(
            student,
            [
                "id",
                "student_id"
            ]
        );


    if(
        !studentId ||
        !subject ||
        value === null
    ){

        return false;

    }


    const max =
        maximumMarks(
            subject
        );


    if(
        value < 0 ||
        value > max
    ){

        return false;

    }


    const input =
        getInput(
            studentId,
            subject.id
        );


    if(!input)
        return false;


    input.value =
        String(value);


    student.marks =
        student.marks || {};


    student.marks[
        subject.id
    ] =
        value;


    markChanged(
        input
    );


    return true;

}



/* =====================================================
   HANDLE EXCEL UPLOAD
===================================================== */

async function handleExcelUpload(
    event
){

    const file =
        event &&
        event.target &&
        event.target.files
        ?
        event.target.files[0]
        :
        null;


    if(!file)
        return;


    try{

        if(
            typeof XLSX ===
            "undefined"
        ){

            throw new Error(
                "Excel library load ಆಗಿಲ್ಲ."
            );

        }


        if(
            !students.length ||
            !subjects.length
        ){

            alert(
                "ಮೊದಲು Students Load ಒತ್ತಿ. ನಂತರ Excel Upload ಮಾಡಿ."
            );

            return;

        }


        showMessage(
            "📥 Excel file ಓದಲಾಗುತ್ತಿದೆ...",
            "info"
        );


        const buffer =
            await file.arrayBuffer();


        const workbook =
            XLSX.read(
                buffer,
                {
                    type:"array",
                    cellDates:false,
                    raw:true
                }
            );


        if(
            !workbook.SheetNames ||
            !workbook.SheetNames.length
        ){

            throw new Error(
                "Excel sheet ಸಿಗಲಿಲ್ಲ."
            );

        }


        const sheet =
            workbook.Sheets[
                workbook.SheetNames[0]
            ];


        const rows =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    defval:"",
                    raw:true
                }
            );


        if(!rows.length){

            throw new Error(
                "Excelನಲ್ಲಿ data rows ಸಿಗಲಿಲ್ಲ."
            );

        }


        const headers =
            Object.keys(
                rows[0]
            );


        if(!headers.length){

            throw new Error(
                "Excel headers ಸಿಗಲಿಲ್ಲ."
            );

        }


        let marksLoaded = 0;

        let invalidMarks = 0;

        let unmatchedRows = 0;

        let wideRowsWithMarks = 0;



        /* =================================================
           WIDE FORMAT
        ================================================= */

        for(
            let rowIndex=0;
            rowIndex<rows.length;
            rowIndex++
        ){

            const row =
                rows[rowIndex];


            const student =
                excelUploadFindStudent(
                    row,
                    headers
                );


            if(!student){

                unmatchedRows++;

                continue;

            }


            let rowHadMark =
                false;


            for(
                const subject of
                subjects
            ){

                const markColumn =
                    excelUploadFindMarkColumn(
                        headers,
                        subject
                    );


                if(!markColumn)
                    continue;


                const value =
                    excelUploadNumber(
                        row[markColumn]
                    );


                if(value === null)
                    continue;


                const max =
                    maximumMarks(
                        subject
                    );


                if(
                    value < 0 ||
                    value > max
                ){

                    invalidMarks++;

                    continue;

                }


                if(
                    excelUploadSetMark(
                        student,
                        subject,
                        value
                    )
                ){

                    marksLoaded++;

                    rowHadMark =
                        true;

                }

            }


            if(rowHadMark){

                wideRowsWithMarks++;

            }

        }



        /* =================================================
           LONG FORMAT
        ================================================= */

        if(
            wideRowsWithMarks === 0
        ){

            const aliases =
                excelUploadHeaderAliases();


            const subjectCol =
                excelUploadFindColumn(
                    headers,
                    aliases.subject
                );


            const marksCol =
                excelUploadFindColumn(
                    headers,
                    aliases.marks
                );


            if(
                subjectCol &&
                marksCol
            ){

                for(
                    let rowIndex=0;
                    rowIndex<rows.length;
                    rowIndex++
                ){

                    const row =
                        rows[rowIndex];


                    const student =
                        excelUploadFindStudent(
                            row,
                            headers
                        );


                    if(!student)
                        continue;


                    const uploadedSubject =
                        excelUploadNormalize(
                            row[subjectCol]
                        );


                    const uploadedMarks =
                        excelUploadNumber(
                            row[marksCol]
                        );


                    if(
                        !uploadedSubject ||
                        uploadedMarks === null
                    ){

                        continue;

                    }


                    const subject =
                        subjects.find(
                            s => {

                                const sName =
                                    excelUploadNormalize(
                                        subjectName(s)
                                    );


                                const sCode =
                                    excelUploadNormalize(
                                        subjectCode(s)
                                    );


                                return(

                                    uploadedSubject ===
                                    sName ||

                                    uploadedSubject ===
                                    sCode ||

                                    (
                                        sName &&
                                        uploadedSubject.includes(
                                            sName
                                        )
                                    ) ||

                                    (
                                        sCode &&
                                        uploadedSubject.includes(
                                            sCode
                                        )
                                    )

                                );

                            }
                        );


                    if(!subject)
                        continue;


                    const max =
                        maximumMarks(
                            subject
                        );


                    if(
                        uploadedMarks < 0 ||
                        uploadedMarks > max
                    ){

                        invalidMarks++;

                        continue;

                    }


                    if(
                        excelUploadSetMark(
                            student,
                            subject,
                            uploadedMarks
                        )
                    ){

                        marksLoaded++;

                    }

                }

            }

        }



        renderMarksTable();

        updateSummary();



        if(
            marksLoaded === 0
        ){

            showMessage(
                "⚠️ Excel ಓದಲಾಗಿದೆ, ಆದರೆ ಹೊಂದುವ marks ಸಿಗಲಿಲ್ಲ.",
                "error"
            );

        }
        else{

            showMessage(

                "✅ Excel marks load ಆಗಿವೆ. " +

                marksLoaded +

                " marks ತುಂಬಲಾಗಿದೆ. " +

                "ಈಗ Save Marks ಒತ್ತಿ." +

                (
                    invalidMarks
                    ?
                    " Invalid marks: " +
                    invalidMarks
                    :
                    ""
                ) +

                (
                    unmatchedRows
                    ?
                    " Unmatched rows: " +
                    unmatchedRows
                    :
                    ""
                ),

                "success"

            );

        }

    }
    catch(error){

        console.error(
            "Excel Upload Error:",
            error
        );


        showMessage(
            "❌ Excel Upload Error: " +
            error.message,
            "error"
        );

    }
    finally{

        if(
            event &&
            event.target
        ){

            event.target.value =
                "";

        }

    }

}
