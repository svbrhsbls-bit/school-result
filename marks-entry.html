<html lang="kn">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Kannada",sans-serif;
    background:#eef5f9;
    color:#17324d;
}

header{
    background:#087db5;
    color:white;

}

header h1{

}

.container{

}

.card{

    box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

select,
input{
    width:100%;
    padding:9px;
    border:1px solid #bbb;
    border-radius:5px;
}

button{
    border:0;
    padding:10px 16px;
    margin:10px 5px 0 0;
    border-radius:6px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.btn-blue{background:#087db5;}
.btn-green{background:#168a52;}
.btn-orange{background:#d98508;}
.btn-purple{background:#7045b8;}
.btn-dark{background:#555;}
.btn-red{background:#d93645;}

.message{
    display:none;
    margin-top:12px;
    padding:10px;
    border-radius:6px;
    font-weight:bold;
}

.message.show{
    display:block;
}

.success{
    background:#d9f4df;
    color:#12652d;
}

.error{
    background:#ffe0e0;
    color:#a30000;
}

.info{
    background:#dceeff;
    color:#07527c;
}

.table-wrap{
    width:100%;
    overflow:auto;
}

table{
    border-collapse:collapse;
    width:100%;
    min-width:1100px;
}

th,
td{
    border:1px solid #c9d4db;
    padding:6px;
    text-align:center;
}

th{
    background:#087db5;
    color:white;
    white-space:nowrap;
}

.student-name{
    text-align:left;
    min-width:180px;
}

.mark-input{
    width:65px;
    text-align:center;
}

.grade{
    font-weight:bold;
    min-width:45px;
}

.pass{
    color:green;
    font-weight:bold;
}

.fail{
    color:red;
    font-weight:bold;
}

.pending{
    color:#c77700;
    font-weight:bold;
}

.summary-table{
    min-width:700px;
}

.small{
    font-size:13px;
}

@media(max-width:800px){
    .grid{
        grid-template-columns:1fr;
    }
}

/* PRINT */
#printArea{
    display:none;
}

    @page{
        size:A4 landscape;
        margin:6mm;
    }

    body{
        background:white !important;
        color:black !important;
    }

    header{
        background:white !important;
        color:black !important;
        border-bottom:1px solid black;
        padding:5px !important;
    }

    .no-print,
    .card:not(#marksCard){
        display:none !important;
    }

    #marksCard{
        display:block !important;
        box-shadow:none !important;
        margin:0 !important;
        padding:0 !important;
    }

    #marksTableContainer{
        display:none !important;
    }

    #printArea{
        display:block !important;
        width:100%;
    }

    #printArea table{
        display:table !important;
        width:100% !important;
        min-width:0 !important;
        font-size:7px;
        border-collapse:collapse;
    }

    #printArea th,
    #printArea td{
        border:1px solid black !important;
        padding:3px !important;
    }

    #printArea th{

}
</style>
</head>

<header>

    <div>ಶ್ರೀ ವೀರಬಲ್ಲಾಳ ಗ್ರಾಮಾಂತರ ಪ್ರೌಢಶಾಲೆ</div>

<div class="container">

    <div class="grid">

        <div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sozlvjvqrgpaabnvjvxe.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let students = [];
let subjects = [];

let currentClass = "";
let currentDivision = "";
let currentExam = "";


/* =====================================================
   HELPERS
===================================================== */

function getValue(obj, keys){

    for(const key of keys){

        if(
            obj &&
            obj[key] !== undefined &&
            obj[key] !== null &&
            obj[key] !== ""
        ){
            return obj[key];
        }
    }

    return "";
}


function classNumber(value){

    const match =
        String(value || "").match(/10|9|8/);

    return match ? match[0] : "";
}


function studentName(student){

    return getValue(
        student,
        [
            "student_name",
            "name",
            "studentName"
        ]
    ) || "Student";
}


function rollNumber(student,index){

    return getValue(
        student,
        [
            "roll_no",
            "roll_number",
            "reg_no",
            "registration_no",
            "registration_number"
        ]
    ) || (index + 1);
}


function subjectName(subject){

    return getValue(
        subject,
        [
            "subject_name",
            "name",
            "subject",
            "subjectName",
            "title"
        ]
    ) || "Subject";
}


function subjectCode(subject){

    return getValue(
        subject,
        [
            "subject_code",
            "code",
            "subjectCode"
        ]
    );
}


function isKannada(subject){

    const name =
        String(subjectName(subject))
        .toLowerCase();

    const code =
        String(subjectCode(subject))
        .toLowerCase();

    return(
        name.includes("kannada") ||
        name.includes("ಕನ್ನಡ") ||
        code === "1" ||
        code === "01"
    );
}


/* =====================================================
   MAX MARKS
===================================================== */

function maximumMarks(subject){

    /* 8ನೇ ತರಗತಿ */

    if(currentClass === "8"){

        if(currentExam === "HALF_YEARLY"){
            return 50;
        }

        if(currentExam === "ANNUAL"){
            return 100;
        }
    }


    /* 9 ಮತ್ತು 10 */

    if(
        currentClass === "9" ||
        currentClass === "10"
    ){

        if(currentExam === "HALF_YEARLY"){

            if(isKannada(subject)){
                return 100;
            }

            return 80;
        }


        if(currentExam === "ANNUAL"){

            if(isKannada(subject)){
                return 125;
            }

            return 100;
        }
    }

    return 50;
}


/* =====================================================
   8TH GRADE
===================================================== */

function grade8(mark,max){

    const m = Number(mark);

    if(!Number.isFinite(m)){
        return "";
    }

    /*
    ==========================================
    8ನೇ ತರಗತಿ - ಅರ್ಧವಾರ್ಷಿಕ
    50 Marks
    ==========================================
    */

    if(
        currentExam === "HALF_YEARLY" &&
        max === 50
    ){

        if(m >= 45) return "A+";
        if(m >= 35) return "A";
        if(m >= 25) return "B+";
        if(m >= 15) return "B";

        return "C";
    }


    /*
    ==========================================
    8ನೇ ತರಗತಿ - ವಾರ್ಷಿಕ
    100 Marks
    ==========================================
    */

    if(
        currentExam === "ANNUAL" &&
        max === 100
    ){

        if(m >= 90) return "A+";
        if(m >= 70) return "A";
        if(m >= 50) return "B+";
        if(m >= 30) return "B";

        return "C";
    }


    return "";
}


/* =====================================================
   9TH / 10TH GRADE
===================================================== */

function grade910(mark,subject){

    const m = Number(mark);

    if(!Number.isFinite(m)){
        return "";
    }


    const kannada =
        isKannada(subject);


    /* ---------------------------------------------
       HALF YEARLY
    --------------------------------------------- */

    if(currentExam === "HALF_YEARLY"){

        /* Kannada - 100 */

        if(kannada){

            if(m >= 90) return "A+";
            if(m >= 80) return "A";
            if(m >= 70) return "B+";
            if(m >= 60) return "B";
            if(m >= 50) return "C+";
            if(m >= 35) return "C";

            return "NC";
        }


        /* Other five subjects - 80 */

        if(m >= 72) return "A+";
        if(m >= 64) return "A";
        if(m >= 56) return "B+";
        if(m >= 48) return "B";
        if(m >= 40) return "C+";
        if(m >= 28) return "C";

        return "NC";
    }


    /* ---------------------------------------------
       ANNUAL
    --------------------------------------------- */

    if(currentExam === "ANNUAL"){

        /* Kannada */

        if(kannada){

            if(m >= 112 && m <= 120) return "A+";
            if(m >= 100) return "A";
            if(m >= 87) return "B+";
            if(m >= 75) return "B";
            if(m >= 63) return "C+";
            if(m >= 44) return "C";

            return "NC";
        }


        /* Other five subjects */

        if(m >= 90) return "A+";
        if(m >= 80) return "A";
        if(m >= 70) return "B+";
        if(m >= 60) return "B";
        if(m >= 50) return "C+";
        if(m >= 35) return "C";

        return "NC";
    }


    return "";
}


/* =====================================================
   OVERALL GRADE
===================================================== */

function overallGrade(percentage){

    const p = Number(percentage);


    if(currentClass === "8"){

        if(p >= 90) return "A+";
        if(p >= 70) return "A";
        if(p >= 50) return "B+";
        if(p >= 30) return "B";

        return "C";
    }


    if(p >= 90) return "A+";
    if(p >= 80) return "A";
    if(p >= 70) return "B+";
    if(p >= 60) return "B";
    if(p >= 50) return "C+";
    if(p >= 35) return "C";

    return "NC";
}


function subjectGrade(mark,max,subject){

    if(currentClass === "8"){
        return grade8(mark,max);
    }

    if(
        currentClass === "9" ||
        currentClass === "10"
    ){
        return grade910(mark,subject);
    }

    return "";
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message show " + type;
}


/* =====================================================
   LOAD STUDENTS
===================================================== */

async function loadStudents(){

    try{

        currentClass =
            classNumber(
                document.getElementById(
                    "classSelect"
                ).value
            );

        currentDivision =
            document.getElementById(
                "divisionSelect"
            ).value
            .trim()
            .toUpperCase();

        currentExam =
            document.getElementById(
                "examSelect"
            ).value;


        showMessage(
            "Students ಮತ್ತು Subjects loading...",
            "info"
        );


        /* STUDENTS */

        const studentResponse =
            await supabaseClient
                .from("students")
                .select("*");


        if(studentResponse.error){
            throw studentResponse.error;
        }


        students =
            (studentResponse.data || [])
            .filter(student => {

                const cls =
                    classNumber(
                        getValue(
                            student,
                            [
                                "class_name",
                                "class",
                                "standard",
                                "className"
                            ]
                        )
                    );

                const div =
                    String(
                        getValue(
                            student,
                            [
                                "division",
                                "section",
                                "division_name",
                                "section_name"
                            ]
                        )
                    )
                    .trim()
                    .toUpperCase();


                return(
                    cls === currentClass &&
                    div === currentDivision
                );
            });


        if(!students.length){

            document.getElementById(
                "marksTableContainer"
            ).innerHTML =
                "<p style='color:red;font-weight:bold'>" +
                "❌ " +
                currentClass +
                "ನೇ ತರಗತಿ - " +
                currentDivision +
                " ವಿಭಾಗದಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ." +
                "</p>";

            document.getElementById(
                "studentCount"
            ).textContent =
                "ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: 0";

            showMessage(
                "ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ.",
                "error"
            );

            return;
        }


        /* SUBJECTS */

        const subjectResponse =
            await supabaseClient
                .from("subjects")
                .select("*");


        if(subjectResponse.error){
            throw subjectResponse.error;
        }


        subjects =
            (subjectResponse.data || [])
            .filter(subject => {

                const cls =
                    getValue(
                        subject,
                        [
                            "class_name",
                            "class",
                            "standard",
                            "className"
                        ]
                    );

                return(
                    cls === "" ||
                    classNumber(cls) === currentClass
                );
            });


        /*
          Duplicate subject rows ಇದ್ದರೂ
          Subject Name ಆಧಾರದಲ್ಲಿ ಒಂದೇ ಬಾರಿ.
        */

        const seen = new Set();

        subjects =
            subjects.filter(subject => {

                const key =
                    subjectName(subject)
                    .trim()
                    .toLowerCase()
                    .replace(/\s+/g," ");

                if(seen.has(key)){
                    return false;
                }

                seen.add(key);

                return true;
            });


        if(!subjects.length){

            throw new Error(
                "Subjects tableನಲ್ಲಿ subjects ಸಿಗಲಿಲ್ಲ."
            );
        }


        await loadSavedMarks();

        renderMarksTable();

        updateSummary();


        document.getElementById(
            "studentCount"
        ).textContent =
            "ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: " +
            students.length;


        showMessage(
            "✅ Students ಮತ್ತು Subjects Load ಆಗಿವೆ.",
            "success"
        );

    }
    catch(error){

        console.error(error);

        showMessage(
            "❌ Students Load Error: " +
            error.message,
            "error"
        );
    }
}


/* =====================================================
   LOAD SAVED MARKS
===================================================== */

async function loadSavedMarks(){

    for(const student of students){

        student.resultId = null;
        student.marks = {};


        const studentId =
            getValue(
                student,
                [
                    "id",
                    "student_id"
                ]
            );


        if(!studentId){
            continue;
        }


        const resultResponse =
            await supabaseClient
                .from("exam_results")
                .select("id")
                .eq(
                    "student_id",
                    studentId
                )
                .eq(
                    "exam_type",
                    currentExam
                )
                .order(
                    "id",
                    {ascending:false}
                )
                .limit(1)
                .maybeSingle();


        if(
            resultResponse.error ||
            !resultResponse.data
        ){
            continue;
        }


        student.resultId =
            resultResponse.data.id;


        const marksResponse =
            await supabaseClient
                .from("result_marks")
                .select(
                    "subject_id,marks"
                )
                .eq(
                    "exam_result_id",
                    student.resultId
                );


        if(!marksResponse.error){

            for(
                const mark of
                (marksResponse.data || [])
            ){

                student.marks[
                    mark.subject_id
                ] =
                    mark.marks;
            }
        }
    }
}


/* =====================================================
   INPUT ID
===================================================== */

function getInput(studentId,subjectId){

    return document.querySelector(
        ".mark-input[data-student='" +
        CSS.escape(String(studentId)) +
        "'][data-subject='" +
        CSS.escape(String(subjectId)) +
        "']"
    );
}


/* =====================================================
   RENDER TABLE
===================================================== */

function renderMarksTable(){

    let html = "";

    html += "<table>";

    html += "<thead>";

    html += "<tr>";

    html += "<th>Roll</th>";
    html += "<th>ವಿದ್ಯಾರ್ಥಿ</th>";
    html += "<th>SATS No</th>";


    subjects.forEach(subject => {

        html +=
            "<th colspan='2'>" +
            escapeHtml(
                subjectName(subject)
            ) +
            "<br>Max: " +
            maximumMarks(subject) +
            "</th>";
    });


    html +=
        "<th>Total</th>" +
        "<th>Maximum</th>" +
        "<th>%</th>" +
        "<th>Grade</th>" +
        "<th>Result</th>";


    html += "</tr>";


    html += "<tr>";

    html += "<th></th>";
    html += "<th></th>";
    html += "<th></th>";


    subjects.forEach(() => {

        html += "<th>Marks</th>";
        html += "<th>Grade</th>";

    });


    html +=
        "<th></th>" +
        "<th></th>" +
        "<th></th>" +
        "<th></th>" +
        "<th></th>";


    html += "</tr>";

    html += "</thead>";

    html += "<tbody>";


    students.forEach((student,index) => {

        const studentId =
            getValue(
                student,
                ["id","student_id"]
            );


        html += "<tr>";


        html +=
            "<td>" +
            escapeHtml(
                rollNumber(student,index)
            ) +
            "</td>";


        html +=
            "<td class='student-name'>" +
            escapeHtml(
                studentName(student)
            ) +
            "</td>";


        html +=
            "<td>" +
            escapeHtml(
                getValue(
                    student,
                    [
                        "sats_no",
                        "sats_number",
                        "sats"
                    ]
                )
            ) +
            "</td>";


        subjects.forEach(subject => {

            const max =
                maximumMarks(subject);

            const oldMark =
                student.marks[subject.id] ??
                "";


            html +=
                "<td>" +

                "<input " +
                "class='mark-input' " +
                "type='number' " +
                "min='0' " +
                "max='" + max + "' " +
                "step='0.01' " +
                "value='" +
                escapeHtml(oldMark) +
                "' " +

                "data-student='" +
                escapeHtml(studentId) +
                "' " +

                "data-subject='" +
                escapeHtml(subject.id) +
                "' " +

                "data-max='" +
                max +
                "' " +

                "oninput='markChanged(this)' " +

                ">" +

                "</td>";


            html +=
                "<td " +
                "class='grade' " +
                "id='grade-" +
                studentId +
                "-" +
                subject.id +
                "'>" +

                (
                    oldMark !== ""
                    ?
                    subjectGrade(
                        Number(oldMark),
                        max,
                        subject
                    )
                    :
                    ""
                ) +

                "</td>";
        });


        html +=
            "<td id='total-" +
            studentId +
            "'>0</td>";


        html +=
            "<td id='max-" +
            studentId +
            "'>0</td>";


        html +=
            "<td id='percentage-" +
            studentId +
            "'>0%</td>";


        html +=
            "<td id='overall-" +
            studentId +
            "'>-</td>";


        html +=
            "<td id='result-" +
            studentId +
            "' class='pending'>PENDING</td>";

   MARK CHANGED
===================================================== */

function markChanged(input){

    const value =
        input.value === ""
        ?
        ""
        :
        Number(input.value);

    const max =
        Number(input.dataset.max);


    if(
        value !== "" &&
        (
            value < 0 ||
            value > max
        )
    ){

        alert(
            "ಗರಿಷ್ಠ " +
            max +
            " marks ಮಾತ್ರ."
        );

        input.value = "";

        return;
    }


    const subject =
        subjects.find(
            s =>
            String(s.id) ===
            String(input.dataset.subject)
        );


    const gradeElement =
        document.getElementById(
            "grade-" +
            input.dataset.student +
            "-" +
            input.dataset.subject
        );


    if(value === ""){

        gradeElement.textContent = "";

    }
    else{

        gradeElement.textContent =
            subjectGrade(
                value,
                max,
                subject
            );
    }


    calculateStudent(
        input.dataset.student
    );

    updateSummary();
}


/* =====================================================
   CALCULATE STUDENT
===================================================== */

function calculateStudent(studentId){

    let total = 0;
    let maximum = 0;
    let entered = 0;


    subjects.forEach(subject => {

        const max =
            maximumMarks(subject);

        maximum += max;


        const input =
            getInput(
                studentId,
                subject.id
            );


        if(
            input &&
            input.value !== ""
        ){

            total +=
                Number(input.value);

            entered++;
        }
    });


    const percentage =
        maximum > 0
        ?
        (total / maximum) * 100
        :
        0;


    document.getElementById(
        "total-" + studentId
    ).textContent =
        total.toFixed(2);


    document.getElementById(
        "max-" + studentId
    ).textContent =
        maximum.toFixed(2);


    document.getElementById(
        "percentage-" + studentId
    ).textContent =
        percentage.toFixed(2) + "%";


    const overall =
        document.getElementById(
            "overall-" + studentId
        );


    const result =
        document.getElementById(
            "result-" + studentId
        );


    if(
        entered === subjects.length &&
        subjects.length > 0
    ){

        overall.textContent =
            overallGrade(percentage);


        const pass =
            currentClass === "8"
            ?
            percentage >= 30
            :
            percentage >= 35;


        result.textContent =
            pass
            ?
            "PASS"
            :
            "FAIL";


        result.className =
            pass
            ?
            "pass"
            :
            "fail";

    }
    else{

        overall.textContent = "-";

        result.textContent =
            "PENDING";

        result.className =
            "pending";
    }
}


/* =====================================================
   SAVE MARKS
===================================================== */

async function saveMarks(){

    if(!students.length){

        alert(
            "ಮೊದಲು Students Load ಮಾಡಿ."
        );

        return;
    }


    try{

        showMessage(
            "Marks save ಆಗುತ್ತಿದೆ...",
            "info"
        );


        for(const student of students){

            const studentId =
                getValue(
                    student,
                    ["id","student_id"]
                );


            if(!studentId){
                continue;
            }


            let resultId =
                student.resultId;


            /* Existing result ಹುಡುಕು */

            if(!resultId){

                const existing =
                    await supabaseClient
                        .from("exam_results")
                        .select("id")
                        .eq(
                            "student_id",
                            studentId
                        )
                        .eq(
                            "exam_type",
                            currentExam
                        )
                        .order(
                            "id",
                            {ascending:false}
                        )
                        .limit(1)
                        .maybeSingle();


                if(existing.error){
                    throw existing.error;
                }


                if(existing.data){

                    resultId =
                        existing.data.id;

                }
            }


            /* New exam result */

            if(!resultId){

                const inserted =
                    await supabaseClient
                        .from("exam_results")
                        .insert({
                            student_id:studentId,
                            exam_type:currentExam,
                            published:false
                        })
                        .select("id")
                        .single();


                if(inserted.error){
                    throw inserted.error;
                }


                resultId =
                    inserted.data.id;
            }


            /* Save every subject */

            for(const subject of subjects){

                const input =
                    getInput(
                        studentId,
                        subject.id
                    );


                if(!input){
                    continue;
                }


                const marks =
                    input.value === ""
                    ?
                    null
                    :
                    Number(input.value);


                const max =
                    maximumMarks(subject);


                if(
                    marks !== null &&
                    (
                        marks < 0 ||
                        marks > max
                    )
                ){

                    throw new Error(
                        studentName(student) +
                        " → " +
                        subjectName(subject) +
                        " : Maximum " +
                        max
                    );
                }


                const existingMark =
                    await supabaseClient
                        .from("result_marks")
                        .select("id")
                        .eq(
                            "exam_result_id",
                            resultId
                        )
                        .eq(
                            "subject_id",
                            subject.id
                        )
                        .order(
                            "id",
                            {ascending:false}
                        )
                        .limit(1)
                        .maybeSingle();


                if(existingMark.error){
                    throw existingMark.error;
                }


                if(existingMark.data){

                    const updated =
                        await supabaseClient
                            .from("result_marks")
                            .update({
                                marks:marks
                            })
                            .eq(
                                "id",
                                existingMark.data.id
                            );


                    if(updated.error){
                        throw updated.error;
                    }

                }
                else{

                    const inserted =
                        await supabaseClient
                            .from("result_marks")
                            .insert({
                                exam_result_id:
                                    resultId,

                                subject_id:
                                    subject.id,

                                marks:marks
                            });


                    if(inserted.error){
                        throw inserted.error;
                    }
                }
            }


            student.resultId =
                resultId;
        }


        await loadSavedMarks();

        renderMarksTable();

        updateSummary();


        showMessage(
            "✅ Marks successfully saved.",
            "success"
        );

    }
    catch(error){

        console.error(error);

        showMessage(
            "❌ Marks Save Error: " +
            error.message,
            "error"
        );
    }
}

/* =====================================================
   EXCEL MARKS UPLOAD - ADDED WITHOUT CHANGING EXISTING LOGIC
===================================================== */

function excelUploadNormalize(value){

    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ")
        .replace(/[._-]+/g," ");
}


function excelUploadNumber(value){

    if(value === undefined || value === null || value === ""){
        return null;
    }

    if(typeof value === "number" && Number.isFinite(value)){
        return value;
    }

    const cleaned =
        String(value)
            .trim()
            .replace(/,/g,"")
            .replace(/%$/g,"");

    if(cleaned === "") return null;

    const n = Number(cleaned);

    return Number.isFinite(n) ? n : null;
}

function excelUploadFindColumn(headers, aliases){

    const normalizedHeaders = headers.map(h =>
        excelUploadNormalize(h)
    );

    const normalizedAliases = aliases.map(a =>
        excelUploadNormalize(a)
    );

    // Exact match first.
    for(const alias of normalizedAliases){

        const index = normalizedHeaders.indexOf(alias);

        if(index >= 0) return headers[index];
    }

    // Then contains match.
    for(let i=0;i<normalizedHeaders.length;i++){

        const h = normalizedHeaders[i];

        if(normalizedAliases.some(alias =>
            h === alias ||
            h.includes(alias) ||
            alias.includes(h)
        )){
            return headers[i];
        }
    }

    return null;
}


function excelUploadFindStudent(row, headers, index){

    const aliases = excelUploadHeaderAliases();

    const rollCol = excelUploadFindColumn(headers, aliases.roll);
    const nameCol = excelUploadFindColumn(headers, aliases.name);
    const satsCol = excelUploadFindColumn(headers, aliases.sats);

    const rowRoll = rollCol ? String(row[rollCol] ?? "").trim() : "";
    const rowName = nameCol ? String(row[nameCol] ?? "").trim() : "";
    const rowSats = satsCol ? String(row[satsCol] ?? "").trim() : "";

    const normRoll = excelUploadNormalize(rowRoll);
    const normName = excelUploadNormalize(rowName);
    const normSats = excelUploadNormalize(rowSats);

    // Best match: SATS No.
    if(normSats){

        const found = students.find((student) =>
            excelUploadNormalize(getValue(student,["sats_no","sats_number","sats"])) === normSats
        );

        if(found) return found;
    }

    // Next: Roll No / Reg No.
    if(normRoll){

        const found = students.find((student,studentIndex) =>
            excelUploadNormalize(String(rollNumber(student,studentIndex))) === normRoll
        );

        if(found) return found;
    }

    // Finally: Student Name.
    if(normName){

        const found = students.find((student) =>
            excelUploadNormalize(studentName(student)) === normName
        );

        if(found) return found;
    }

    return null;
}


function excelUploadFindMarkColumn(headers, subject){

    const name = excelUploadNormalize(subjectName(subject));
    const code = excelUploadNormalize(subjectCode(subject));

    const candidates = [];

    if(name){
        candidates.push(name + " marks");
        candidates.push(name + " mark");
        candidates.push(name);
    }

    if(code){
        candidates.push(code + " marks");
        candidates.push(code + " mark");
        candidates.push(code);
    }

    const normalizedHeaders = headers.map(h =>
        excelUploadNormalize(h)
    );

    for(const candidate of candidates){

        const idx = normalizedHeaders.indexOf(candidate);

        if(idx >= 0) return headers[idx];
    }

    // Accept headers such as "Kannada - Marks", "Kannada Marks", etc.
    for(let i=0;i<normalizedHeaders.length;i++){

        const h = normalizedHeaders[i];

        if(
            (name && h.includes(name)) ||
            (code && h.includes(code))
        ){

            if(
                h.includes("mark") ||
                h.includes("ಅಂಕ") ||
                h === name ||
                h === code
            ){
                return headers[i];
            }
        }
    }

    return null;
}


function excelUploadSetMark(student, subject, value){

    const studentId = getValue(student,["id","student_id"]);

    if(!studentId || !subject || value === null) return false;

    const max = maximumMarks(subject);

    if(value < 0 || value > max){
        return false;
    }

    const input = getInput(studentId,subject.id);

    if(!input) return false;

    input.value = String(value);

    // Keep the uploaded value in the existing student object so
    // renderMarksTable() can rebuild the table without losing it.
    student.marks = student.marks || {};
    student.marks[subject.id] = value;

    // Keep the existing mark-change / grade / summary logic untouched.
    markChanged(input);

    return true;
}


async function handleExcelUpload(event){

    const file = event && event.target && event.target.files
        ? event.target.files[0]
        : null;

    if(!file) return;

    try{
        /* Excel Upload uses the already selected screen state.
           It does NOT change currentClass/currentExam or any
           existing marks-entry logic. */

        if(typeof XLSX === "undefined"){
            throw new Error(
                "Excel library load ಆಗಿಲ್ಲ. Internet connection ಪರಿಶೀಲಿಸಿ."
            );
        }

        if(!students.length || !subjects.length){
            alert(
                "ಮೊದಲು ತರಗತಿ → ವಿಭಾಗ → ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ Students Load ಒತ್ತಿ. ನಂತರ Excel Upload ಮಾಡಿ."
            );
            return;
        }

        showMessage("📥 Excel file ಓದಲಾಗುತ್ತಿದೆ...", "info");

        const buffer = await file.arrayBuffer();

        const workbook = XLSX.read(buffer,{
            type:"array",
            cellDates:false,
            raw:true
        });

        if(!workbook.SheetNames || !workbook.SheetNames.length){
            throw new Error("Excel sheet ಸಿಗಲಿಲ್ಲ.");
        }

        const sheet = workbook.Sheets[workbook.SheetNames[0]];

        const rows = XLSX.utils.sheet_to_json(sheet,{
            defval:"",
            raw:true
        });

        if(!rows.length){
            throw new Error("Excelನಲ್ಲಿ data rows ಸಿಗಲಿಲ್ಲ.");
        }

        const headers = Object.keys(rows[0]);

        if(!headers.length){
            throw new Error("Excel headers ಸಿಗಲಿಲ್ಲ.");
        }

        let marksLoaded = 0;
        let invalidMarks = 0;
        let unmatchedRows = 0;
        let wideRowsWithMarks = 0;

        /* =====================================================
           FORMAT A — Excel Download ಮಾಡಿದ file
           Roll No | Student Name | SATS No | Subject Marks...
        ===================================================== */
        for(let rowIndex=0; rowIndex<rows.length; rowIndex++){

            const row = rows[rowIndex];

            const student = excelUploadFindStudent(
                row,
                headers,
                rowIndex
            );

            if(!student){
                unmatchedRows++;
                continue;
            }

            let rowHadMark = false;

            for(const subject of subjects){

                const markColumn = excelUploadFindMarkColumn(
                    headers,
                    subject
                );

                if(!markColumn) continue;

                const value = excelUploadNumber(row[markColumn]);

                if(value === null) continue;

                const max = maximumMarks(subject);

                if(value < 0 || value > max){
                    invalidMarks++;
                    continue;
                }

                if(excelUploadSetMark(student,subject,value)){
                    marksLoaded++;
                    rowHadMark = true;
                }
            }

            if(rowHadMark){
                wideRowsWithMarks++;
            }
        }

        /* =====================================================
           FORMAT B — Long format
           Roll No | Student Name | Subject | Marks

           Long format is used ONLY if wide format did not
           load any marks, so marks are never loaded twice.
        ===================================================== */
        if(wideRowsWithMarks === 0){

            const aliases = excelUploadHeaderAliases();

            const subjectCol = excelUploadFindColumn(
                headers,
                aliases.subject
            );

            const marksCol = excelUploadFindColumn(
                headers,
                aliases.marks
            );

            if(subjectCol && marksCol){

                for(let rowIndex=0; rowIndex<rows.length; rowIndex++){

                    const row = rows[rowIndex];

                    const student = excelUploadFindStudent(
                        row,
                        headers,
                        rowIndex
                    );

                    if(!student) continue;

                    const uploadedSubject =
                        excelUploadNormalize(row[subjectCol]);

                    const uploadedMarks =
                        excelUploadNumber(row[marksCol]);

                    if(!uploadedSubject || uploadedMarks === null){
                        continue;
                    }

                    const subject = subjects.find(s => {

                        const sName =
                            excelUploadNormalize(subjectName(s));

                        const sCode =
                            excelUploadNormalize(subjectCode(s));

                        return (
                            uploadedSubject === sName ||
                            uploadedSubject === sCode ||
                            (sName && uploadedSubject.includes(sName)) ||
                            (sCode && uploadedSubject.includes(sCode))
                        );
                    });

                    if(!subject) continue;

                    const max = maximumMarks(subject);

                    if(uploadedMarks < 0 || uploadedMarks > max){
                        invalidMarks++;
                        continue;
                    }

                    if(excelUploadSetMark(
                        student,
                        subject,
                        uploadedMarks
                    )){
                        marksLoaded++;
                    }
                }
            }
        }

        /* Existing table/grade/summary logic only. */
        renderMarksTable();
        updateSummary();

        if(marksLoaded === 0){

            showMessage(
                "⚠️ Excel ಓದಲಾಗಿದೆ, ಆದರೆ ಹೊಂದುವ student/subject marks ಸಿಗಲಿಲ್ಲ. Excel headings ಪರಿಶೀಲಿಸಿ.",
                "error"
            );

        }else{

            showMessage(
                "✅ Excel marks load ಆಗಿವೆ. " +
                marksLoaded +
                " marks ತುಂಬಲಾಗಿದೆ. ಈಗ Save Marks ಒತ್ತಿ Supabaseಗೆ save ಮಾಡಿ." +
                (invalidMarks ? " Invalid marks: " + invalidMarks : "") +
                (unmatchedRows ? " Unmatched rows: " + unmatchedRows : ""),
                "success"
            );
        }

    }
    catch(error){

        console.error("Excel Upload Error:",error);

        showMessage(
            "❌ Excel Upload Error: " +
            (error && error.message ? error.message : error),
            "error"
        );

    }
    finally{

        if(event && event.target){
            event.target.value = "";
        }
    }
}
