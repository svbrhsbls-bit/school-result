<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marks Entry - ಶಾಲಾ ಫಲಿತಾಂಶ ವ್ಯವಸ್ಥೆ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Noto Sans Kannada","Segoe UI",Arial,sans-serif;
    background:#eef6fc;
    color:#183b5b;
}

.header{
    background:linear-gradient(135deg,#0878bd,#0b5c91);
    color:white;
    padding:25px 20px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.header h1{
    margin:0;
    font-size:32px;
}

.header p{
    margin:7px 0 0;
    font-size:17px;
}

.container{
    width:96%;
    max-width:1600px;
    margin:25px auto;
}

.card{
    background:white;
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.filters{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

select,
input{
    width:100%;
    padding:12px;
    border:1px solid #ccd8e2;
    border-radius:9px;
    font-size:15px;
    background:white;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.btn-blue{
    background:#0878bd;
    color:white;
}

.btn-green{
    background:#159447;
    color:white;
}

.btn-orange{
    background:#ed9700;
    color:white;
}

.btn-purple{
    background:#7047b8;
    color:white;
}

.btn-gray{
    background:#68737c;
    color:white;
}

.btn-red{
    background:#d9363e;
    color:white;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
    font-weight:bold;
}

.success{
    background:#d9f5df;
    color:#14752b;
}

.error{
    background:#ffe0e0;
    color:#a30000;
}

.info{
    background:#dceeff;
    color:#07558c;
}

.table-wrap{
    overflow:auto;
    max-height:600px;
    border:1px solid #dce5ec;
    border-radius:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th{
    background:#096da8;
    color:white;
    padding:12px 8px;
    position:sticky;
    top:0;
    z-index:2;
    white-space:nowrap;
}

td{
    border-bottom:1px solid #e4e9ed;
    padding:8px;
    text-align:center;
}

td.name{
    text-align:left;
    font-weight:bold;
    min-width:180px;
}

td.roll{
    font-weight:bold;
}

.mark-input{
    width:80px;
    text-align:center;
    padding:8px;
}

.grade{
    font-weight:bold;
    min-width:60px;
}

.grade-Aplus{
    color:#0a8f35;
}

.grade-A{
    color:#0878bd;
}

.grade-Bplus{
    color:#9b6500;
}

.grade-B{
    color:#b45d00;
}

.grade-C{
    color:#d10000;
}

.subject-head{
    font-size:13px;
}

.max-mark{
    display:block;
    font-size:11px;
    font-weight:normal;
    opacity:.85;
}

.summary{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.badge{
    background:#edf5fa;
    padding:10px 15px;
    border-radius:9px;
    font-weight:bold;
}

.loading{
    text-align:center;
    padding:30px;
    font-size:18px;
}

@media(max-width:800px){
    .filters{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:24px;
    }
}

@media print{
    .no-print,
    .header,
    .filters-card,
    .buttons,
    .message{
        display:none !important;
    }

    body{
        background:white;
    }

    .container{
        width:100%;
        margin:0;
    }

    .card{
        box-shadow:none;
        padding:5px;
    }

    .table-wrap{
        max-height:none;
        overflow:visible;
        border:0;
    }

    table{
        min-width:0;
        font-size:11px;
    }

    th{
        position:static;
    }

    .mark-input{
        border:0;
        width:55px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>📝 Marks Entry</h1>
    <p>ಶಾಲಾ ಫಲಿತಾಂಶ ನಿರ್ವಹಣಾ ವ್ಯವಸ್ಥೆ</p>
</div>

<div class="container">

    <!-- FILTER CARD -->
    <div class="card filters-card no-print">

        <div class="filters">

            <div>

                <select id="classSelect">

            </div>

            <div>
                <label>ವಿಭಾಗ / Division</label>
                <select id="divisionSelect">

                    <option value="A">A</option>

            <div>

                <select id="examSelect">
                    <option value="">-- ಪರೀಕ್ಷೆ ಆಯ್ಕೆ --</option>
                    <option value="FA-1">FA-1</option>
                    <option value="FA-2">FA-2</option>
                    <option value="SA-1">SA-1</option>
                    <option value="FA-3">FA-3</option>
                    <option value="FA-4">FA-4</option>
                    <option value="SA-2">SA-2</option>
                    <option value="ಅರ್ಧ ವಾರ್ಷಿಕ">ಅರ್ಧ ವಾರ್ಷಿಕ</option>
                    <option value="ವಾರ್ಷಿಕ">ವಾರ್ಷಿಕ</option>

            </div>

        </div>

        <div class="buttons">

            <button class="btn-blue" onclick="loadStudents()">
                🔄 Students Load
            </button>

            <button class="btn-green" onclick="downloadTemplate()">
                📥 Excel Template Download
            </button>

            <button class="btn-purple" onclick="document.getElementById('excelFile').click()">
                📤 Excel Upload
            </button>

            <input

            </button>

        </div>

    </div>


    <!-- MARKS TABLE -->
    <div class="card">

        <div class="summary">
            <div class="badge">
                ತರಗತಿ:
                <span id="summaryClass">-</span>
            </div>

            <div class="badge">
                ವಿಭಾಗ:
                <span id="summaryDivision">-</span>
            </div>

            <div class="badge">
                ಪರೀಕ್ಷೆ:
                <span id="summaryExam">-</span>
            </div>

            <div class="badge">
                ವಿದ್ಯಾರ್ಥಿಗಳು:
                <span id="studentCount">0</span>
            </div>
        </div>

        <div id="tableArea">
            <div class="loading">
                ತರಗತಿ, ವಿಭಾಗ ಮತ್ತು ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ Students Load ಒತ್ತಿರಿ.
            </div>
        </div>

        <div class="buttons no-print">
            <button class="btn-green" onclick="saveAllMarks()">
                💾 Save All Marks
            </button>

            <button class="btn-orange" onclick="window.print()">
                🖨️ Print Marks
            </button>
        </div>

    </div>

</div>


<script>

/* ============================================================
   SUPABASE CONNECTION
   ============================================================ */

const SUPABASE_URL =
    "https://sozlvjvqrpaabnvjvxe.supabase.co";

/*
   ಇಲ್ಲಿ ನಿಮ್ಮ Supabase Publishable Key paste ಮಾಡಿ.
   Secret Key ಬಳಸಬೇಡಿ.
*/
const SUPABASE_KEY =
    "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ============================================================
   SUBJECT MASTER
   ============================================================ */

const SUBJECTS = [
    {
        code:"01K",
        name:"ಕನ್ನಡ"
    },
    {
        code:"31E",
        name:"ಇಂಗ್ಲಿಷ್"
    },
    {
        code:"61H",
        name:"ಹಿಂದಿ"
    },
    {
        code:"81K",
        name:"ಗಣಿತ"
    },
    {
        code:"83K",
        name:"ವಿಜ್ಞಾನ"
    },
    {
        code:"85K",
        name:"ಸಮಾಜ ವಿಜ್ಞಾನ"
    }
];


/* ============================================================
   GLOBAL DATA
   ============================================================ */

let students = [];
let currentMarks = {};


/* ============================================================
   MESSAGE
   ============================================================ */

function showMessage(text,type="info"){

    const box = document.getElementById("message");

    box.className = "message " + type;
    box.textContent = text;
    box.style.display = "block";
}


/* ============================================================
   MAX MARKS
   ============================================================ */

function getMaxMarks(className,exam,subjectCode){

    className = String(className);

    /* 8th */
    if(className === "8"){

        if(exam === "ಅರ್ಧ ವಾರ್ಷಿಕ"){
            return 50;
        }

        if(exam === "ವಾರ್ಷಿಕ"){
            return 100;
        }

        if(
            exam === "FA-1" ||
            exam === "FA-2" ||
            exam === "FA-3" ||
            exam === "FA-4"
        ){
            return 10;
        }

        if(exam === "SA-1" || exam === "SA-2"){
            return 30;
        }

    }


    /* 9th / 10th */
    if(className === "9" || className === "10"){

        if(exam === "ಅರ್ಧ ವಾರ್ಷಿಕ"){

            if(subjectCode === "01K"){
                return 100;
            }

            return 80;
        }

        if(exam === "ವಾರ್ಷಿಕ"){

            if(subjectCode === "01K"){
                return 125;
            }

            return 100;
        }

        /* formative / summative */
        if(
            exam === "FA-1" ||
            exam === "FA-2" ||
            exam === "FA-3" ||
            exam === "FA-4"
        ){
            return 10;
        }

        if(exam === "SA-1" || exam === "SA-2"){
            return 30;
        }
    }

    return 100;
}


/* ============================================================
   GRADE
   ============================================================ */

function getGrade(mark,max){

    if(
        mark === null ||
        mark === undefined ||
        mark === "" ||
        isNaN(mark)
    ){
        return "";
    }

    mark = Number(mark);
    max = Number(max);

    if(mark < 0){
        return "";
    }

    if(mark > max){
        return "";
    }


    /* 8th FA */
    if(max === 10){

        if(mark >= 9) return "A+";
        if(mark >= 7) return "A";
        if(mark >= 5) return "B+";
        if(mark >= 3) return "B";

        return "C";
    }


    /* 8th SA */
    if(max === 30){

        if(mark >= 27) return "A+";
        if(mark >= 22) return "A";
        if(mark >= 16) return "B+";
        if(mark >= 10) return "B";

        return "C";
    }


    /* Annual 100 */
    if(max === 100){

        if(mark >= 90) return "A+";
        if(mark >= 70) return "A";
        if(mark >= 50) return "B+";
        if(mark >= 30) return "B";

        return "C";
    }


    /* Kannada Annual 125 */
    if(max === 125){

        const percentage =
            (mark / max) * 100;

        if(percentage >= 90) return "A+";
        if(percentage >= 70) return "A";
        if(percentage >= 50) return "B+";
        if(percentage >= 30) return "B";

        return "C";
    }


    /* Half yearly 50 */
    if(max === 50){

        const percentage =
            (mark / max) * 100;

        if(percentage >= 90) return "A+";
        if(percentage >= 70) return "A";
        if(percentage >= 50) return "B+";
        if(percentage >= 30) return "B";

        return "C";
    }


    /* 80 */
    if(max === 80){

        const percentage =
            (mark / max) * 100;

        if(percentage >= 90) return "A+";
        if(percentage >= 70) return "A";
        if(percentage >= 50) return "B+";
        if(percentage >= 30) return "B";

        return "C";
    }

    return "";
}


/* ============================================================
   GRADE CLASS
   ============================================================ */

function gradeClass(grade){

    if(grade === "A+") return "grade-Aplus";
    if(grade === "A") return "grade-A";
    if(grade === "B+") return "grade-Bplus";
    if(grade === "B") return "grade-B";

    if(grade === "C") return "grade-C";

    return "";
}


/* ============================================================
   LOAD STUDENTS
   ============================================================ */

async function loadStudents(){

    const className =
        document.getElementById("classSelect").value;

    const division =
        document.getElementById("divisionSelect").value;

    const exam =
        document.getElementById("examSelect").value;


    if(!className || !division || !exam){

        showMessage(
            "ತರಗತಿ, ವಿಭಾಗ ಮತ್ತು ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ.",
            "error"
        );

        return;
    }


    showMessage(
        "Students Load ಆಗುತ್ತಿದೆ...",
        "info"
    );


    try{

        const { data,error } =
            await supabaseClient
                .from("students")
                .select("*")
                .eq("class_name",className)
                .eq("division",division)
                .eq("is_active",true)
                .order("roll_no");


        if(error){
            throw error;
        }


        students = data || [];

        currentMarks = {};


        document.getElementById("summaryClass")
            .textContent = className;

        document.getElementById("summaryDivision")
            .textContent = division;

        document.getElementById("summaryExam")
            .textContent = exam;

        document.getElementById("studentCount")
            .textContent = students.length;


        if(students.length === 0){

            document.getElementById("tableArea").innerHTML =
                `<div class="loading">
                    ಈ ತರಗತಿ ಮತ್ತು ವಿಭಾಗದಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಗಳು ಕಂಡುಬಂದಿಲ್ಲ.
                </div>`;

            showMessage(
                "ವಿದ್ಯಾರ್ಥಿಗಳು ಕಂಡುಬಂದಿಲ್ಲ.",
                "error"
            );

            return;
        }


        buildTable();


        await loadExistingMarks();


        showMessage(
            students.length + " ವಿದ್ಯಾರ್ಥಿಗಳು Load ಆಗಿದ್ದಾರೆ.",
            "success"
        );

    }
    catch(error){

        console.error(error);

        showMessage(
            "Students Load ಸಮಸ್ಯೆ: " +
            (error.message || error),
            "error"
        );
    }
}


/* ============================================================
   BUILD TABLE
   ============================================================ */

function buildTable(){

    const exam =
        document.getElementById("examSelect").value;

    const className =
        document.getElementById("classSelect").value;


    let html = `
        <div class="table-wrap">
        <table id="marksTable">

        <thead>
        <tr>
            <th>ಕ್ರಮ</th>
            <th>Roll No</th>
            <th>ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು</th>
    `;


    SUBJECTS.forEach(subject => {

        const max =
            getMaxMarks(
                className,
                exam,
                subject.code
            );

        html += `
            <th class="subject-head">
                ${subject.name}
                <span class="max-mark">
                    ${subject.code} / ${max}
                </span>
            </th>

            <th class="subject-head">
                Grade
            </th>
        `;
    });


    html += `
        </tr>
        </thead>
        <tbody>
    `;


    students.forEach((student,index) => {

        html += `
            <tr
                data-student-id="${student.id}"
                data-roll="${student.roll_no || ""}"
            >

                <td>${index+1}</td>

                <td class="roll">
                    ${student.roll_no || ""}
                </td>

                <td class="name">
                    ${escapeHtml(student.student_name || "")}
                </td>
        `;


        SUBJECTS.forEach(subject => {

            const max =
                getMaxMarks(
                    className,
                    exam,
                    subject.code
                );


            const inputId =
                `mark_${student.id}_${subject.code}`;

            const gradeId =
                `grade_${student.id}_${subject.code}`;


            html += `
                <td>
                    <input
                        type="number"
                        class="mark-input"
                        id="${inputId}"
                        min="0"
                        max="${max}"
                        step="0.01"
                        data-student-id="${student.id}"
                        data-subject-code="${subject.code}"
                        data-max="${max}"
                        oninput="markChanged(this)"
                    >
                </td>

                <td
                    class="grade"
                    id="${gradeId}"
                ></td>
            `;
        });


        html += `</tr>`;
    });


    html += `
        </tbody>
        </table>
        </div>
    `;


    document.getElementById("tableArea")
        .innerHTML = html;
}


/* ============================================================
   MARK CHANGE
   ============================================================ */

function markChanged(input){

    const studentId =
        input.dataset.studentId;

    const subjectCode =
        input.dataset.subjectCode;

    const max =
        Number(input.dataset.max);

    let value =
        input.value;


    if(value !== ""){

        value = Number(value);

        if(value < 0){
            input.value = 0;
            value = 0;
        }

        if(value > max){

            input.value = "";

            showMessage(
                `${subjectCode} ಗರಿಷ್ಠ ಅಂಕ ${max}.`,
                "error"
            );

            updateGrade(
                studentId,
                subjectCode,
                ""
            );

            return;
        }
    }


    updateGrade(
        studentId,
        subjectCode,
        value
    );
}


/* ============================================================
   UPDATE GRADE
   ============================================================ */

function updateGrade(
    studentId,
    subjectCode,
    value
){

    const input =
        document.getElementById(
            `mark_${studentId}_${subjectCode}`
        );

    const gradeElement =
        document.getElementById(
            `grade_${studentId}_${subjectCode}`
        );


    const max =
        Number(input.dataset.max);


    const grade =
        getGrade(value,max);


    gradeElement.textContent =
        grade;

    gradeElement.className =
        "grade " + gradeClass(grade);


    if(!currentMarks[studentId]){
        currentMarks[studentId] = {};
    }

    currentMarks[studentId][subjectCode] =
        value === "" ? null : Number(value);
}


/* ============================================================
   LOAD EXISTING MARKS
   ============================================================ */

async function loadExistingMarks(){

    if(students.length === 0) return;


    /*
      ಇಲ್ಲಿ result_marks table ಬಳಕೆ ಮಾಡಲಾಗಿದೆ.

      ನಿಮ್ಮ result_marks tableನಲ್ಲಿ:
      student_id
      subject_id
      marks

      ಇರಬೇಕು.

      ಪರೀಕ್ಷೆಯ column exam_name ಆಗಿದ್ದರೆ ಈ code ಕೆಲಸ ಮಾಡುತ್ತದೆ.
    */

    const studentIds =
        students.map(s => s.id);


    try{

        const { data,error } =
            await supabaseClient
                .from("result_marks")
                .select("*")
                .in("student_id",studentIds);


        if(error){

            console.warn(
                "Existing marks load:",
                error.message
            );

            return;
        }


        if(!data) return;


        data.forEach(row => {

            let studentId =
                row.student_id;

            let subjectCode =
                row.subject_code;


            if(!subjectCode){

                return;
            }


            let mark =
                row.marks;


            const input =
                document.getElementById(
                    `mark_${studentId}_${subjectCode}`
                );


            if(input){

                input.value =
                    mark ?? "";

                updateGrade(
                    studentId,
                    subjectCode,
                    mark ?? ""
                );
            }

        });

    }
    catch(error){

        console.warn(error);
    }
}


/* ============================================================
   SAVE ALL MARKS
   ============================================================ */

async function saveAllMarks(){

    if(students.length === 0){

        showMessage(
            "ಮೊದಲು Students Load ಮಾಡಿ.",
            "error"
        );

        return;
    }


    const exam =
        document.getElementById("examSelect").value;


    if(!exam){

        showMessage(
            "ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ.",
            "error"
        );

        return;
    }


    showMessage(
        "Marks save ಆಗುತ್ತಿದೆ...",
        "info"
    );


    try{

        const rows = [];


        students.forEach(student => {

            SUBJECTS.forEach(subject => {

                const input =
                    document.getElementById(
                        `mark_${student.id}_${subject.code}`
                    );


                if(!input) return;


                const value =
                    input.value;


                /*
                   ಖಾಲಿ ಇದ್ದರೆ databaseಗೆ row ಕಳುಹಿಸುವುದಿಲ್ಲ.
                */

                if(value === "") return;


                rows.push({

                    student_id: student.id,

                    subject_code: subject.code,

                    exam_name: exam,

                    marks: Number(value)

                });

            });

        });


        if(rows.length === 0){

            showMessage(
                "ಯಾವುದೇ Marks ನಮೂದಿಸಿಲ್ಲ.",
                "error"
            );

            return;
        }


        /*
           ಮೊದಲು delete ಮಾಡಿ,
           ನಂತರ ಹೊಸ marks insert ಮಾಡಲಾಗುತ್ತದೆ.
        */

        const studentIds =
            students.map(s => s.id);


        const { error:deleteError } =
            await supabaseClient
                .from("result_marks")
                .delete()
                .in("student_id",studentIds)
                .eq("exam_name",exam);


        if(deleteError){

            throw deleteError;
        }


        const { error:insertError } =
            await supabaseClient
                .from("result_marks")
                .insert(rows);


        if(insertError){

            throw insertError;
        }


        showMessage(
            "✅ ಎಲ್ಲಾ Marks ಯಶಸ್ವಿಯಾಗಿ Save ಆಗಿವೆ.",
            "success"
        );

    }
    catch(error){

        console.error(error);

        showMessage(
            "Save ಮಾಡುವಾಗ ಸಮಸ್ಯೆ: " +
            (error.message || error),
            "error"
        );
    }
}

/* ============================================================
   EXCEL UPLOAD
   ============================================================ */

function uploadExcel(event){

    const file =
        event.target.files[0];


    if(!file) return;


    if(students.length === 0){

        showMessage(
            "ಮೊದಲು Class + Division + Exam ಆಯ್ಕೆ ಮಾಡಿ Students Load ಮಾಡಿ.",
            "error"
        );

        event.target.value = "";
        return;
    }


    const reader =
        new FileReader();


    reader.onload = function(e){

        try{

            const workbook =
                XLSX.read(
                    e.target.result,
                    {
                        type:"array"
                    }
                );


            const sheet =
                workbook.Sheets[
                    workbook.SheetNames[0]
                ];


            const rows =
                XLSX.utils.sheet_to_json(
                    sheet,
                    {
                        defval:""
                    }
                );


            if(rows.length === 0){

                throw new Error(
                    "Excelನಲ್ಲಿ data ಇಲ್ಲ."
                );
            }


            let updated = 0;


            rows.forEach(row => {

                const roll =
                    String(
                        row["Roll No"] ?? ""
                    ).trim();


                const student =
                    students.find(
                        s =>
                            String(
                                s.roll_no ?? ""
                            ).trim() === roll
                    );


                if(!student) return;


                SUBJECTS.forEach(subject => {

                    const max =
                        getMaxMarks(
                            document.getElementById("classSelect").value,
                            document.getElementById("examSelect").value,
                            subject.code
                        );


                    const possibleKeys = [

                        `${subject.name} (${subject.code}) / ${max}`,

                        `${subject.name} (${subject.code})`,

                        subject.name

                    ];


                    let value = "";


                    for(
                        const key of possibleKeys
                    ){

                        if(
                            row[key] !== undefined &&
                            row[key] !== ""
                        ){

                            value =
                                row[key];

                            break;
                        }
                    }


                    if(
                        value !== "" &&
                        !isNaN(value)
                    ){

                        value =
                            Number(value);


                        if(
                            value >= 0 &&
                            value <= max
                        ){

                            const input =
                                document.getElementById(
                                    `mark_${student.id}_${subject.code}`
                                );


                            if(input){

                                input.value =
                                    value;


                                updateGrade(
                                    student.id,
                                    subject.code,
                                    value
                                );

                                updated++;
                            }
                        }
                    }

                });

            });


            showMessage(
                `✅ Excel Upload ಮುಗಿದಿದೆ. ${updated} marks entries screenಗೆ ಬಂದಿದೆ. ಈಗ Save All Marks ಒತ್ತಿರಿ.`,
                "success"
            );


        }
        catch(error){

            console.error(error);

            showMessage(
                "Excel Upload ಸಮಸ್ಯೆ: " +
                error.message,
                "error"
            );
        }

        event.target.value = "";
    };


    reader.readAsArrayBuffer(file);
}

/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
