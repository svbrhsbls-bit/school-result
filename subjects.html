<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Subject Master</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Noto Sans Kannada","Nirmala UI",Arial,sans-serif;
    background:#eef5fb;
    color:#173b63;
}

.header{
    background:linear-gradient(135deg,#1169a5,#258dcc);
    color:white;
    text-align:center;
    padding:25px 15px;
    box-shadow:0 3px 10px #999;
}

.header h1{
    margin:0;
    font-size:34px;
}

.header p{
    margin:8px 0 0;
    font-size:18px;
}

.container{
    max-width:1250px;
    margin:28px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 4px 18px rgba(0,0,0,.10);
}

.card h2{
    text-align:center;
    margin-top:0;
    color:#174f80;
    font-size:27px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    font-size:17px;
}

input,select{
    width:100%;
    padding:13px;
    border:1px solid #cbd5df;
    border-radius:9px;
    font-size:16px;
    background:white;
}

input:focus,select:focus{
    outline:none;
    border-color:#1976b9;
    box-shadow:0 0 4px rgba(25,118,185,.3);
}

.buttons{
    margin-top:20px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

button{
    border:0;
    padding:12px 22px;
    border-radius:9px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-save{
    background:#159447;
}

.btn-clear{
    background:#68727b;
}

.btn-edit{
    background:#ed9410;
    padding:8px 14px;
}

.btn-delete{
    background:#d93636;
    padding:8px 14px;
}

button:hover{
    opacity:.88;
}

.message{
    display:none;
    margin-top:18px;
    padding:13px;
    border-radius:8px;
    font-weight:bold;
}

.success{
    display:block;
    background:#e4f7e9;
    color:#14732d;
    border:1px solid #9dd5aa;
}

.error{
    display:block;
    background:#fde8e8;
    color:#a51f1f;
    border:1px solid #efaaaa;
}

.search-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:20px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    background:#176da8;
    color:white;
    padding:12px 8px;
    text-align:left;
}

td{
    padding:11px 8px;
    border-bottom:1px solid #e2e2e2;
}

tr:hover{
    background:#f3f8fc;
}

.actions{
    display:flex;
    gap:7px;
}

.loading{
    text-align:center;
    padding:25px;
    font-size:18px;
}

.empty{
    text-align:center;
    padding:25px;
    color:#777;
}

@media(max-width:800px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .search-grid{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:27px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>📚 ವಿಷಯಗಳ ಮಾಸ್ಟರ್</h1>
    <p>Subject Master / ವಿಷಯಗಳ ನಿರ್ವಹಣೆ</p>
</div>

<div class="container">

<div class="card">

<h2>➕ ವಿಷಯ ಸೇರಿಸಿ / Edit Subject</h2>

<input type="hidden" id="editId">

<div class="form-grid">

<div>
<label>ತರಗತಿ / Class</label>
<select id="className">
    <option value="8">8ನೇ ತರಗತಿ</option>
    <option value="9">9ನೇ ತರಗತಿ</option>
    <option value="10">10ನೇ ತರಗತಿ</option>
</select>
</div>

<div>
<label>ವಿಷಯ ಕೋಡ್ / Subject Code</label>
<input type="text" id="subjectCode" placeholder="ಉದಾ: 01K">
</div>

<div>
<label>ವಿಷಯದ ಹೆಸರು / Subject Name</label>
<input type="text" id="subjectName" placeholder="ಉದಾ: ಕನ್ನಡ">
</div>

<div>
<label>ಗರಿಷ್ಠ ಅಂಕ / Max Marks</label>
<input type="number" id="maxMarks" value="100" min="1">
</div>

<div>
<label>ಕ್ರಮ ಸಂಖ್ಯೆ / Display Order</label>
<input type="number" id="displayOrder" value="1" min="1">
</div>

<div>
<label>ಸ್ಥಿತಿ / Status</label>
<select id="isActive">
    <option value="true">Active / ಸಕ್ರಿಯ</option>
    <option value="false">Inactive / ನಿಷ್ಕ್ರಿಯ</option>
</select>
</div>

</div>

<div class="buttons">
    <button class="btn-save" onclick="saveSubject()">💾 Save</button>
    <button class="btn-clear" onclick="clearForm()">✖ Clear</button>
</div>

<div id="message" class="message"></div>

</div>


<div class="card">

<h2>🔎 ವಿಷಯಗಳ ಪಟ್ಟಿ</h2>

<div class="search-grid">

<div>
<label>ತರಗತಿ ಆಯ್ಕೆ</label>
<select id="filterClass" onchange="loadSubjects()">
    <option value="">ಎಲ್ಲಾ ತರಗತಿಗಳು</option>
    <option value="8">8ನೇ ತರಗತಿ</option>
    <option value="9">9ನೇ ತರಗತಿ</option>
    <option value="10">10ನೇ ತರಗತಿ</option>
</select>
</div>

<div>
<label>Search / ಹುಡುಕಿ</label>
<input
    type="text"
    id="search"
    placeholder="ವಿಷಯ / ಕೋಡ್ ಹುಡುಕಿ..."
    oninput="displaySubjects()">
</div>

</div>

<div id="tableArea" class="loading">
    ವಿಷಯಗಳನ್ನು Loading ಮಾಡಲಾಗುತ್ತಿದೆ...
</div>

</div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
"https://sozlvjvqrpaabnvjvxe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";

const sb = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   GLOBAL DATA
   ========================================================= */

let subjects = [];


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text,type){

    const box = document.getElementById("message");

    box.className = "message " + type;
    box.textContent = text;

}


/* =========================================================
   CLEAR FORM
   ========================================================= */

function clearForm(){

    document.getElementById("editId").value = "";
    document.getElementById("className").value = "8";
    document.getElementById("subjectCode").value = "";
    document.getElementById("subjectName").value = "";
    document.getElementById("maxMarks").value = "100";
    document.getElementById("displayOrder").value = "1";
    document.getElementById("isActive").value = "true";

    document.getElementById("message").className = "message";
    document.getElementById("message").textContent = "";

}


/* =========================================================
   SAVE SUBJECT
   ========================================================= */

async function saveSubject(){

    try{

        const editId =
            document.getElementById("editId").value;

        const className =
            document.getElementById("className").value.trim();

        const subjectCode =
            document.getElementById("subjectCode").value.trim();

        const subjectName =
            document.getElementById("subjectName").value.trim();

        const maxMarks =
            Number(document.getElementById("maxMarks").value);

        const displayOrder =
            Number(document.getElementById("displayOrder").value);

        const isActive =
            document.getElementById("isActive").value === "true";


        if(!className){
            showMessage("ತರಗತಿ ಆಯ್ಕೆ ಮಾಡಿ","error");
            return;
        }

        if(!subjectCode){
            showMessage("ವಿಷಯ ಕೋಡ್ ನಮೂದಿಸಿ","error");
            return;
        }

        if(!subjectName){
            showMessage("ವಿಷಯದ ಹೆಸರು ನಮೂದಿಸಿ","error");
            return;
        }

        if(!maxMarks || maxMarks <= 0){
            showMessage("ಸರಿಯಾದ Max Marks ನಮೂದಿಸಿ","error");
            return;
        }


        const data = {

            class_name: className,
            subject_code: subjectCode,
            subject_name: subjectName,
            max_marks: maxMarks,
            display_order: displayOrder || 1,
            is_active: isActive

        };


        let result;


        /* EDIT */

        if(editId){

            result = await sb
                .from("subjects")
                .update(data)
                .eq("id",editId);

        }

        /* INSERT */

        else{

            result = await sb
                .from("subjects")
                .insert([data]);

        }


        if(result.error){

            console.error(result.error);

            showMessage(
                "Save ಮಾಡುವಾಗ ಸಮಸ್ಯೆ: " +
                result.error.message,
                "error"
            );

            return;
        }


        showMessage(
            editId
            ? "ವಿಷಯ ಯಶಸ್ವಿಯಾಗಿ Update ಆಗಿದೆ ✅"
            : "ವಿಷಯ ಯಶಸ್ವಿಯಾಗಿ Save ಆಗಿದೆ ✅",
            "success"
        );


        clearForm();

        await loadSubjects();

    }

    catch(error){

        console.error(error);

        showMessage(
            "Supabase ಸಂಪರ್ಕ ಸಮಸ್ಯೆ: " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   LOAD SUBJECTS
   ========================================================= */

async function loadSubjects(){

    const tableArea =
        document.getElementById("tableArea");

    tableArea.innerHTML =
        '<div class="loading">Loading...</div>';


    try{

        let query =
            sb
            .from("subjects")
            .select("*")
            .order("class_name",{ascending:true})
            .order("display_order",{ascending:true});


        const selectedClass =
            document.getElementById("filterClass").value;


        if(selectedClass){

            query =
                query.eq("class_name",selectedClass);

        }


        const {data,error} = await query;


        if(error){

            console.error(error);

            tableArea.innerHTML =
                '<div class="empty">' +
                "Load Error: " +
                error.message +
                "</div>";

            return;
        }


        subjects = data || [];

        displaySubjects();

    }

    catch(error){

        console.error(error);

        tableArea.innerHTML =
            '<div class="empty">' +
            "Supabase ಸಂಪರ್ಕ ವಿಫಲವಾಗಿದೆ: " +
            error.message +
            "</div>";

    }

}


/* =========================================================
   DISPLAY SUBJECTS
   ========================================================= */

function displaySubjects(){

    const tableArea =
        document.getElementById("tableArea");

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    let filtered =
        subjects.filter(item => {

            if(!search) return true;

            return (

                String(item.subject_name || "")
                    .toLowerCase()
                    .includes(search)

                ||

                String(item.subject_code || "")
                    .toLowerCase()
                    .includes(search)

            );

        });


    if(filtered.length === 0){

        tableArea.innerHTML =
            '<div class="empty">' +
            "ಯಾವುದೇ ವಿಷಯಗಳು ಕಂಡುಬಂದಿಲ್ಲ." +
            "</div>";

        return;
    }


    let html = `

    <div class="table-wrap">

    <table>

    <thead>

    <tr>
        <th>ಕ್ರಮ</th>
        <th>ತರಗತಿ</th>
        <th>ವಿಷಯ ಕೋಡ್</th>
        <th>ವಿಷಯದ ಹೆಸರು</th>
        <th>ಗರಿಷ್ಠ ಅಂಕ</th>
        <th>ಕ್ರಮ ಸಂಖ್ಯೆ</th>
        <th>ಸ್ಥಿತಿ</th>
        <th>Action</th>
    </tr>

    </thead>

    <tbody>
    `;


    filtered.forEach((item,index)=>{

        html += `

        <tr>

            <td>${index+1}</td>

            <td>${item.class_name || ""}</td>

            <td>${item.subject_code || ""}</td>

            <td>${item.subject_name || ""}</td>

            <td>${item.max_marks ?? ""}</td>

            <td>${item.display_order ?? ""}</td>

            <td>
                ${
                    item.is_active
                    ? "Active"
                    : "Inactive"
                }
            </td>

            <td>

                <div class="actions">

                    <button
                        class="btn-edit"
                        onclick="editSubject('${item.id}')">
                        ✏️ Edit
                    </button>

                    <button
                        class="btn-delete"
                        onclick="deleteSubject('${item.id}')">
                        🗑️ Delete
                    </button>

                </div>

            </td>

        </tr>

        `;

    });


    html += `

    </tbody>

    </table>

    </div>

    `;


    tableArea.innerHTML = html;

}


/* =========================================================
   EDIT SUBJECT
   ========================================================= */

function editSubject(id){

    const item =
        subjects.find(x => x.id === id);

    if(!item) return;


    document.getElementById("editId").value =
        item.id;

    document.getElementById("className").value =
        item.class_name || "8";

    document.getElementById("subjectCode").value =
        item.subject_code || "";

    document.getElementById("subjectName").value =
        item.subject_name || "";

    document.getElementById("maxMarks").value =
        item.max_marks || 100;

    document.getElementById("displayOrder").value =
        item.display_order || 1;

    document.getElementById("isActive").value =
        item.is_active ? "true" : "false";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   DELETE SUBJECT
   ========================================================= */

async function deleteSubject(id){

    if(!confirm(
        "ಈ ವಿಷಯವನ್ನು Delete ಮಾಡಬೇಕೇ?"
    )){
        return;
    }


    try{

        const {error} =
            await sb
            .from("subjects")
            .delete()
            .eq("id",id);


        if(error){

            console.error(error);

            showMessage(
                "Delete ಸಮಸ್ಯೆ: " +
                error.message,
                "error"
            );

            return;
        }


        showMessage(
            "ವಿಷಯ Delete ಆಗಿದೆ ✅",
            "success"
        );


        await loadSubjects();

    }

    catch(error){

        showMessage(
            "Delete ಸಮಸ್ಯೆ: " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    async function(){

        await loadSubjects();

    }
);

</script>

</body>
</html>
