<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Publish Student Results</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Kannada","Nirmala UI",Arial,sans-serif;background:#eef6fb;color:#17324d}
header{background:#087db5;color:#fff;text-align:center;padding:22px}
header h1{margin:0;font-size:28px} header p{margin:7px 0 0}
.box{background:#fff;margin:18px auto;padding:18px;width:96%;max-width:1400px;border-radius:12px;box-shadow:0 2px 12px #ccd5da}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
label{font-weight:700;display:block}select{width:100%;padding:10px;margin-top:6px;border:1px solid #b8c8d2;border-radius:7px;font-size:15px}
button{border:0;padding:10px 15px;margin:12px 6px 0 0;border-radius:7px;color:#fff;font-weight:700;cursor:pointer}
.b{background:#087db5}.g{background:#168a52}.r{background:#d93645}.x{background:#687582}
.msg{padding:11px;margin-top:12px;border-radius:7px;display:none}.show{display:block}.ok{background:#dcf5e2;color:#126b38}.err{background:#ffe0e0;color:#9b1c1c}.inf{background:#dceeff;color:#15547a}
.wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:800px}th,td{border:1px solid #ccd8e0;padding:9px;text-align:center}th{background:#087db5;color:#fff}
.name{text-align:left;min-width:220px}.published{font-weight:700;color:#168a52}.unpublished{font-weight:700;color:#c77700}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.count{font-size:18px;font-weight:700}
@media(max-width:750px){.grid{grid-template-columns:1fr}header h1{font-size:22px}}
@media print{.noprint{display:none!important}body{background:#fff}.box{box-shadow:none;width:100%;margin:0}}
</style>
</head>
<body>
<header>
<h1>📢 ಫಲಿತಾಂಶ ಪ್ರಕಟಣೆ</h1>
<p>ಶ್ರೀ ವೀರಬಲ್ಲಾಳ ಗ್ರಾಮಾಂತರ ಪ್ರೌಢಶಾಲೆ</p>
</header>

<div class="box noprint">
<div class="grid">
<div>
<label>ತರಗತಿ</label>
<select id="classSelect">
<option value="8">8ನೇ ತರಗತಿ</option>
<option value="9">9ನೇ ತರಗತಿ</option>
<option value="10">10ನೇ ತರಗತಿ</option>
</select>
</div>
<div>
<label>ವಿಭಾಗ</label>
<select id="divisionSelect">
<option value="A">A</option>
</select>
</div>
<div>
<label>ಪರೀಕ್ಷೆ</label>
<select id="examSelect">
<option value="HALF_YEARLY">ಅರ್ಧವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ</option>
<option value="ANNUAL">ವಾರ್ಷಿಕ ಪರೀಕ್ಷೆ</option>
</select>
</div>
<div>
<label>ಶೈಕ್ಷಣಿಕ ವರ್ಷ</label>
<select id="academicYearSelect">
<option value="">Loading...</option>
</select>
</div>
</div>
<div class="actions">
<button class="b" onclick="loadResults()">🔄 Students Load</button>
<button class="g" onclick="publishSelected()">📢 Publish Selected</button>
<button class="r" onclick="unpublishSelected()">🔒 Unpublish Selected</button>
<button class="x" onclick="clearList()">❌ Clear</button>
</div>
<div id="msg" class="msg"></div>
</div>

<div class="box">
<div class="actions">
<div class="count" id="count">ಒಟ್ಟು: 0</div>
<label style="display:flex;align-items:center;gap:7px;margin-left:auto">
<input id="selectAll" type="checkbox" onchange="toggleAll(this.checked)" style="width:18px;height:18px">
<span>All Select / Unselect</span>
</label>
</div>
<div class="wrap">
<table>
<thead>
<tr>
<th><input id="headCheck" type="checkbox" onchange="toggleAll(this.checked)" style="width:18px;height:18px"></th>
<th>Roll No</th>
<th>ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು</th>
<th>SATS No</th>
<th>Result Record</th>
<th>Publish Status</th>
</tr>
</thead>
<tbody id="tbody">
<tr><td colspan="6">Students Load button ಒತ್ತಿ.</td></tr>
</tbody>
</table>
</div>
</div>

<div class="box" id="teacherFooter" style="display:none;">
  <div style="display:flex;justify-content:space-between;gap:30px;text-align:center;font-weight:700;">
    <div style="flex:1;">
      <div>Class Teacher</div>
      <div id="classTeacherName" style="margin-top:8px;"></div>
    </div>
    <div style="flex:1;">
      <div>Head Teacher</div>
      <div id="headTeacherName" style="margin-top:8px;"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL="https://sozlvjvqrgpaabnvjvxe.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_Pr7CaX_U_a4wcVnhXol_gQ_BTZWDRbx";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let rows=[];
let currentClass="8", currentDivision="A", currentExam="HALF_YEARLY";

const $=id=>document.getElementById(id);

async function loadTeacherNames(){
  try{
    const {data,error}=await db.from("settings")
      .select("head_teacher_name,class_teacher_8,class_teacher_9,class_teacher_10,class_teacher_name")
      .eq("id",1)
      .maybeSingle();
    if(error) throw error;

    const cls=classNo($("classSelect").value);
    const classTeacher =
      data?.[`class_teacher_${cls}`] ||
      data?.class_teacher_name ||
      "";

    $("classTeacherName").textContent=classTeacher;
    $("headTeacherName").textContent=data?.head_teacher_name || "";
    $("teacherFooter").style.display="block";
  }catch(e){
    console.error("Teacher names load error:",e);
    $("teacherFooter").style.display="none";
  }
}

async function loadAcademicYear(){
  const el=$("academicYearSelect");
  if(!el) return "";

  /*
    Students Database stores the academic year in:
    students.academic_year

    Therefore the dropdown value must also be the year text
    (for example 2026-27), not an academic_years.id.
  */
  const yr=await db.from("academic_years")
    .select("academic_year")
    .order("academic_year",{ascending:false});

  if(yr.error) throw yr.error;

  const settings=await db.from("settings")
    .select("academic_year")
    .eq("id",1)
    .maybeSingle();

  if(settings.error) throw settings.error;

  const years=[...new Set((yr.data||[])
    .map(x=>String(x.academic_year||"").trim())
    .filter(Boolean))];

  const current=String(settings.data?.academic_year||"").trim();

  if(current && !years.includes(current)){
    years.unshift(current);
  }

  el.innerHTML=years.length
    ? years.map(y=>`<option value="${esc(y)}">${esc(y)}</option>`).join("")
    : `<option value="">No Academic Year</option>`;

  if(current){
    el.value=current;
  }
}

const val=(o,a)=>{for(const k of a)if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=="")return o[k];return""};
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");

function classNo(v){
  const m=String(v??"").match(/10|9|8/);
  return m?m[0]:"";
}
function studentName(s){
  return val(s,["student_name","name","studentName"])||"Student";
}
function rollNo(s,i){
  return val(s,["roll_no","roll_number","reg_no","registration_no","registration_number"])||String(i+1);
}
function division(s){
  return String(val(s,["division","section","division_name","section_name"])).trim().toUpperCase();
}
function showMsg(t,c){
  $("msg").textContent=t;
  $("msg").className="msg show "+c;
}
function hideMsg(){
  $("msg").textContent="";
  $("msg").className="msg";
}

async function loadResults(){
  hideMsg();
  currentClass=classNo($("classSelect").value);
  currentDivision=$("divisionSelect").value.trim().toUpperCase();
  currentExam=$("examSelect").value;
  $("tbody").innerHTML="<tr><td colspan='6'>⏳ Loading...</td></tr>";

  try{
    const academicYear=$("academicYearSelect").value.trim();
    if(!academicYear) throw new Error("Academic Year ಆಯ್ಕೆ ಆಗಿಲ್ಲ.");

    // Load ONLY students belonging to the selected Academic Year.
    // Students Database stores the year in students.academic_year.
    // A student remains in the list even when no marks are entered.
    const sr=await db.from("students").select("*")
      .eq("academic_year",academicYear)
      .eq("is_active",true);
    if(sr.error) throw sr.error;

    const students=(sr.data||[]).filter(s=>
      classNo(val(s,["class_name","class","standard","className"]))===currentClass &&
      division(s)===currentDivision &&
      (
        s.active === undefined ||
        s.active === null ||
        s.active === true ||
        s.is_active === true
      )
    );

    if(!students.length){
      rows=[];
      $("tbody").innerHTML="<tr><td colspan='6'>ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ.</td></tr>";
      $("count").textContent="ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: 0";
      showMsg("ಆಯ್ಕೆ ಮಾಡಿದ ತರಗತಿ ಮತ್ತು ವಿಭಾಗದಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಗಳು ಸಿಗಲಿಲ್ಲ.","err");
      return;
    }

    // Load result records for all students in one query.
    const ids=students.map(s=>s.id);
    const rr=await db.from("exam_results")
      .select("id,student_id,exam_type,published")
      .in("student_id",ids)
      .eq("exam_type",currentExam);
    if(rr.error) throw rr.error;

    const results=rr.data||[];
    const resultIds=results.map(r=>r.id);

    // A result record alone is not enough. "Records ಇದೆ" means
    // at least one actual mark exists in result_marks.
    let markRows=[];
    if(resultIds.length){
      const mr=await db.from("result_marks")
        .select("exam_result_id,subject_id,marks")
        .in("exam_result_id",resultIds);
      if(mr.error) throw mr.error;
      markRows=mr.data||[];
    }

    const marksByResult={};
    markRows.forEach(m=>{
      if(
        m.marks!==null &&
        m.marks!==undefined &&
        String(m.marks).trim()!==""
      ){
        const rid=String(m.exam_result_id);
        marksByResult[rid]=(marksByResult[rid]||0)+1;
      }
    });

    rows=students.map((s,i)=>{
      const result=results.find(r=>String(r.student_id)===String(s.id))||null;
      /*
      PUBLISH RULE:
      Exactly 6 subject marks are required.
      If even one of the 6 subjects has no mark,
      the student cannot be published.
    */
    const enteredMarks = result
      ? Number(marksByResult[String(result.id)] || 0)
      : 0;

    const hasMarks = enteredMarks === 6;
      return {
        student:s,
        index:i,
        result:result,
        hasMarks:hasMarks
      };
    });

    render();
    await loadTeacherNames();
    showMsg("ಆಯ್ಕೆ ಮಾಡಿದ ಶೈಕ್ಷಣಿಕ ವರ್ಷದ Students ಮತ್ತು Result records Load ಆಗಿವೆ.","ok");
  }catch(e){
    console.error(e);
    rows=[];
    $("tbody").innerHTML="<tr><td colspan='6'>Error</td></tr>";
    showMsg("Load Error: "+(e.message||String(e)),"err");
  }
}

function render(){
  $("count").textContent="ಒಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು: "+rows.length;
  $("selectAll").checked=false;
  $("headCheck").checked=false;

  $("tbody").innerHTML=rows.map((r,i)=>{
    const s=r.student;
    const res=r.result;
    const hasMarks=!!r.hasMarks;
    const recordText=hasMarks
      ? "<span class='published'>✅ Result record ಇದೆ</span>"
      : "<span class='unpublished'>❌ Result record ಇಲ್ಲ</span>";

    const status=!hasMarks
      ? "<span class='unpublished'>⏳ NOT PUBLISHED</span>"
      : res.published
        ? "<span class='published'>✅ PUBLISHED</span>"
        : "<span class='unpublished'>⏳ NOT PUBLISHED</span>";

    return `<tr>
      <td><input class="rowCheck" type="checkbox" data-index="${i}" style="width:18px;height:18px"></td>
      <td>${esc(rollNo(s,i))}</td>
      <td class="name">${esc(studentName(s))}</td>
      <td>${esc(val(s,["sats_no","sats_number","sats"]))}</td>
      <td>${recordText}</td>
      <td>${status}</td>
    </tr>`;
  }).join("");
}

function toggleAll(checked){
  document.querySelectorAll(".rowCheck").forEach(x=>x.checked=checked);
  $("selectAll").checked=checked;
  $("headCheck").checked=checked;
}

function selectedRows(){
  return [...document.querySelectorAll(".rowCheck:checked")]
    .map(x=>rows[Number(x.dataset.index)])
    .filter(Boolean);
}

async function publishSelected(){
  await changePublish(true);
}
async function unpublishSelected(){
  await changePublish(false);
}

async function changePublish(value){
  hideMsg();
  const selected=selectedRows();

  if(!selected.length){
    showMsg("ಮೊದಲು ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು Tick ಮಾಡಿ.","err");
    return;
  }

  try{
    let changed=0, skipped=0;

    for(const r of selected){
      if(!r.result || !r.hasMarks){
        skipped++;
        continue;
      }

      const q=await db.from("exam_results")
        .update({published:value})
        .eq("id",r.result.id);

      if(q.error) throw q.error;
      r.result.published=value;
      changed++;
    }

    render();

    const action=value?"Publish":"Unpublish";
    showMsg(
      `✅ ${changed} ವಿದ್ಯಾರ್ಥಿಗಳ ಫಲಿತಾಂಶ ${action} ಆಯಿತು.`+
      (skipped?` ${skipped} ವಿದ್ಯಾರ್ಥಿಗಳಿಗೆ Result record ಇಲ್ಲ.`:""),
      "ok"
    );
  }catch(e){
    console.error(e);
    showMsg(
      "Update Error: "+(e.message||String(e))+
      " — Supabase RLS policy ಪರಿಶೀಲಿಸಿ.",
      "err"
    );
  }
}

function clearList(){
  rows=[];
  $("tbody").innerHTML="<tr><td colspan='6'>Students Load button ಒತ್ತಿ.</td></tr>";
  $("count").textContent="ಒಟ್ಟು: 0";
  $("selectAll").checked=false;
  $("headCheck").checked=false;
  $("teacherFooter").style.display="none";
  $("classTeacherName").textContent="";
  $("headTeacherName").textContent="";
  hideMsg();
}

(async function(){
  try{
    await loadAcademicYear();
  }catch(e){
    console.error(e);
    showMsg("Academic Year Load Error: "+(e.message||String(e)),"err");
  }
})();

</script>
</body>
</html>
